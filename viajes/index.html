const dbGet=k=>LSMODE?Promise.resolve(lsGet(k)):new Promise((res,rej)=>{const q=DB.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});

const dbClear=()=>LSMODE?(()=>{try{Object.values(LSK).forEach(k=>localStorage.removeItem(k))}catch(e){}return Promise.resolve()})():new Promise((res,rej)=>{const tx=DB.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error||new Error('abortada'))});

  /* Migración única desde la versión anterior (localStorage -> IndexedDB) */
  let raw=null,rb=null,o=null,b=null;try{raw=localStorage.getItem(KEY);rb=localStorage.getItem('viajes_bk')}catch(e){}
  try{o=raw?JSON.parse(raw):null}catch(e){}try{b=rb?JSON.parse(rb):null}catch(e){}

    await dbSet('state',o);if(Array.isArray(b))await dbSet('bk',b);
    const c1=await dbGet('state'),c2=Array.isArray(b)?await dbGet('bk'):null;
    const ok=JSON.stringify(c1)===JSON.stringify(o)&&(!Array.isArray(b)||JSON.stringify(c2)===JSON.stringify(b));
    st=o;if(Array.isArray(b))b0=b;
    if(ok){try{localStorage.removeItem(KEY);localStorage.removeItem('viajes_bk')}catch(e){}MIGMSG='Datos pasados a IndexedDB y liberados de localStorage.'}

 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

}

/* ---------- Borrado de datos (solo de esta app) ---------- */
