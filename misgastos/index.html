const DBN='mis_servicios',MAXSNAP=3,SNAP_DIAS=14,KS=[['asociados','Asociados'],['contratos','Contratos'],['recibos','Facturas'],['repostajes','Repostajes'],['gastos','Gastos sueltos'],['planes','Planes']];

function save(nc){if(BOOT_ERR)return false;if(SEG?.enc&&!DEK)return false;if(!nc)S.cambios=(S.cambios||0)+1;

 WQ=WQ.then(async()=>{let rec;try{if(segEnc()!==E){LOCKED=true;LKWHY='enc';banner();return}rec=E?await encD(K,json,'estado'):{json}}catch(e){SAVE_ERR=String(e&&e.message||e);DIRTY=true;banner();return}

bak:()=>`${back}<h1>Copia de seguridad</h1><div class="card"><p><b>Última copia:</b> ${S.lastBackup?fd(S.lastBackup)+' (hace '+pl(bakDias())+')':'ninguna todavía'}<br><b>Cambios desde entonces:</b> ${S.cambios||0}</p><p class="m">Al entrar te propondré hacer copia si hay más de ${S.ajustes.bakN} cambios sin guardar o han pasado ${S.ajustes.bak} días o más. Ambos valores se cambian en Ajustes.</p><div class="row"><button class="p" onclick="exp('enc')">Descargar copia cifrada (.gdc)</button>${pteOn()?'<button class="p" onclick="drvUp()">Subir a Drive (cifrada)</button>':''}</div><p class="m">La copia cifrada solo se abre con tu contraseña maestra (en cualquier navegador). ${S.lastOpen?'Última copia en abierto: '+fd(S.lastOpen.slice(0,10))+'.':''}</p><div class="row"><button onclick="expOpen()">Copia en abierto (.json, sin cifrar)…</button></div><p><button onclick="go('mas','imp')">Importar / restaurar…</button> <button onclick="go('mas','drv')">Copia en Drive…</button> <button onclick="go('mas','ajustes')">Ajustes…</button></p></div>`,
imp:()=>{const u=undoInfo();return`${back}<h1>Importar / restaurar copia</h1>${u?`<div class="card"><b>↩️ Deshacer la última importación</b><div class="m">${u.modo==='fusion'?'Fusionar':'Reemplazar'} · ${new Date(u.t).toLocaleString('es-ES')} · se puede deshacer hasta el ${fd(ISO(new Date(u.t+UNDO_DIAS*864e5)))}</div><button class="d" onclick="undoImp()">Deshacer importación</button></div>`:''}<div class="card"><p class="m">Elige una copia de «Mis servicios»: cifrada (.gdc, te pedirá su contraseña) o en abierto (.json). Antes de importar verás un resumen y se revisará que el archivo esté sano; además se guarda una copia interna de tus datos actuales.</p><label style="color:var(--t)"><input type="radio" name="impm" value="fusion" checked> <b>Fusionar</b>: añade solo lo que no tengas. No borra ni modifica nada de lo actual.</label><label style="color:var(--t)"><input type="radio" name="impm" value="reemplazar"> <b>Reemplazar</b>: sustituye todos los datos actuales por los del archivo.</label><button class="p" onclick="$('#impf').click()">Elegir archivo (.gdc o .json)…</button><input type="file" id="impf" accept=".gdc,.json,application/json,application/octet-stream" style="display:none" onchange="importJ(this.files[0]);this.value=''"></div><p class="m">«Fusionar» reconoce lo repetido por su identificador interno, así que funciona bien con copias de esta misma app (por ejemplo, la de otro dispositivo).</p>`},

 return`${back}<h1>Ideas de mejora</h1><div class="row"><button class="p" onclick="ideaEd()">+ Idea</button><button onclick="copyPend()">Copiar pendientes</button></div>
<div class="tabs">${[['todas','Todas'],['pend','Pendientes'],['impl','Implementadas']].map(([k,v])=>`<button class="${ui.idf===k?'on':''}" onclick="ui.idf='${k}';go('mas','ideas')">${v}</button>`).join('')}</div>

calc:()=>{const a=S.ajustes;return`${back}<h1>Cómo se calcula</h1><div class="card"><p>Estimación del importe de un recibo eléctrico con tarifa 2.0TD (energía en 3 franjas: P1 punta, P2 llano, P3 valle; potencia en 2: P1 punta, P2 valle). Se usa la tarifa del contrato vigente en la fecha «hasta» del recibo.</p><ol>
<li><b>días</b> = (hasta − desde) + 1</li><li><b>potencia</b> = (P1 · precio P1 + P2 · precio P2) · días</li><li><b>energía</b> = (kWh1 · e1 + kWh2 · e2 + kWh3 · e3) · (1 − descuento / 100)</li><li><b>contador</b> = alquiler mensual · 12 / 365 · días</li>
<li><b>impuesto eléctrico</b> = ${NUM.format(a.impElec)} % · (potencia + energía)</li><li><b>IVA</b> = ${NUM.format(a.iva)} % · (potencia + energía + impuesto + contador + otros)</li><li><b>total</b> = potencia + energía + impuesto + contador + otros + IVA</li></ol>
<p class="m">«Otros» es el importe mensual antes de impuestos que se suma a cada recibo. Los porcentajes se cambian en Más → Ajustes. El umbral de desviación (${NUM.format(a.umbral)} %) marca en naranja los recibos cuyo importe real difiere del teórico.</p>
<p class="warn card">⚠️ Es una estimación orientativa: no incluye bono social, exceso de potencia ni servicios extra. Los recibos sin desglose de franjas o marcados como pendientes de consumo quedan fuera del cálculo teórico y de la comparativa.</p></div>
<h2>Agua y gas</h2><div class="card"><p>Cada factura cubre un periodo (desde–hasta). Por factura: <b>consumo/mes</b> = consumo ÷ días · 30,4375 y <b>€/mes</b> = importe ÷ días · 30,4375. Para el intervalo elegido, cada factura se <b>prorratea por días</b> (si solo una parte del periodo cae dentro del intervalo, cuenta esa parte) y las medias mensuales se calculan solo sobre los días cubiertos por facturas. Si hay varios contratos (por ejemplo dos casas), se suman sus medias mensuales.</p><p class="m">Las facturas sin periodo o sin consumo no entran en las medias (se avisa y se pueden editar desde la tabla).</p></div>
<h2>Calefacción y ACS comunitarias</h2><div class="card"><p>Cada recibo del administrador se apunta como una factura del contrato «Calefacción y ACS»: <b>importe</b> = gas fijo + gas variable + agua consumida + cuota fija de agua. El <b>consumo</b> de cada contador es lectura actual − lectura anterior; si escribes otro valor se marca en rojo con la diferencia (sirve para reclamar).</p><ol><li><b>Litros/persona/día</b>: agua fría (facturas de agua) y agua caliente (m³ de ACS) por separado, prorrateadas por días de su periodo; el conjunto es solo su suma. Referencia en Ajustes (${NUM.format(a.refLitros||130)} L/persona/día).</li><li><b>Precio del m³ de ACS</b> = Σ agua consumida ÷ Σ m³ (con cuota fija: + Σ cuota).</li><li><b>€/m³ recirculado</b> = Σ gas variable ÷ Σ m³ de calefacción.</li><li><b>Coste por hora</b> = €/m³ recirculado × caudal (m³/h). Estimación por arriba.</li><li><b>Bomba de calor</b> = kW × precio del kWh (último contrato y tarifa de la casa elegida, con descuento, impuesto eléctrico e IVA).</li></ol><p class="m">Se compara por hora encendida, no por calor entregado. El bloque de gas incluye el gas del agua caliente, cuyo coste marginal para ti es 0.</p></div>`},
alm:()=>{setTimeout(almFill,0);const md=MIGDONE,SN={import:'antes de importar',migrate:'antes de migrar',cambios:'antes de un cambio grande'};
 return`${back}<h1>Almacenamiento y versión</h1><div class="card"><p><b>App:</b> v${APP_VERSION} · esquema de datos ${S.version}<br><b>Datos en:</b> ${MODE==='idb'?'IndexedDB (base «mis_servicios»)'+(SEG?.enc?' · 🔒 cifrados':' · sin cifrar'):'⚠️ localStorage (modo de emergencia: '+esc(LSWHY)+')'}<br><b>Almacenamiento persistente:</b> ${PERSIST===null?'sin comprobar':PERSIST?'concedido':'no concedido (instalar la app ayuda)'}<br><b>Uso:</b> <span id="qt">…</span><br><b>Funcionando como:</b> ${matchMedia('(display-mode: standalone)').matches?'app instalada':'página del navegador'}<br><b>Copias internas (${SNAP_DIAS} días el deshacer de importar):</b> ${SNAPS.length?SNAPS.map(s=>(SN[s.kind]||s.kind)+' · '+new Date(s.t).toLocaleDateString('es-ES')).join('; '):'ninguna'}</p><button onclick="swCheck()">Buscar actualización</button></div>
${md?`<div class="card"><b>Migración desde la versión anterior</b> <span class="m">(${new Date(md.t).toLocaleString('es-ES')})</span><table><tr><th></th><th class="n">Antes</th><th class="n">Ahora</th></tr>${KS.map(([k,n])=>`<tr><td>${n}</td><td class="n">${md.c0[k]??'—'}</td><td class="n">${(S[k]||[]).length}</td></tr>`).join('')}</table><p class="m">«Ahora» es mayor si has añadido datos después.</p></div>`:''}
${MODE==='idb'&&md&&oldLS()?`<div class="card warn"><b>Copia antigua en el navegador</b><p class="m">Los datos de la versión anterior siguen en localStorage, <b>sin cifrar</b>. Bórralos solo cuando hayas comprobado que todo está en la app y tengas una copia JSON reciente.</p><button class="d" onclick="dropOld()">Borrar copia antigua del navegador</button></div>`:''}`},
acerca:()=>`${back}<h1>Acerca de</h1><div class="card">Mis servicios · v${APP_VERSION} · esquema de datos ${S.version}<br><span class="m">Datos solo en este dispositivo (IndexedDB)${SEG?.enc?', cifrados con tu contraseña maestra':''}. Copias cifradas en tu Drive si lo conectas.</span></div>`};
const asoF=()=>[{k:'nombre',l:'Nombre',r:1},{k:'tipo',l:'Tipo',t:'select',o:['casa','trastero','garaje','vehiculo','persona','general']},{k:'perteneceA',l:'Pertenece a (casa; para trastero/garaje)',t:'select',o:[['','—'],...aOpts(null,'casa')]},{k:'personas',l:'Personas que viven (opcional; para litros por persona y día)',t:'number',vis:c=>c.tipo==='casa'}];
function addAso(){modal('Nuevo asociado',asoF(),{},o=>{S.asociados.push({id:uid(),...o,archivado:false});save();go('mas','aso')})}
function renAso(id){const a=A(id);modal('Editar asociado',asoF(),a,o=>{Object.assign(a,o);save();go('mas','aso')})}
function arcAso(id){const a=A(id);a.archivado=!a.archivado;save();go('mas','aso')}
const catUse=c=>[...S.contratos,...S.gastos].filter(x=>x.categoria===c).length;
const catOk=(n,ex)=>{n=(n||'').trim();if(!n)return null;if(S.categorias.some(c=>c!==ex&&c.toLowerCase()===n.toLowerCase())){alert('Ya existe una categoría con ese nombre.');return null}return n};
function addCat(){const n=catOk(prompt('Nueva categoría'));if(n){S.categorias.push(n);save();go('mas','cat')}}
function renCat(i){const o=S.categorias[i],n=catOk(prompt('Nuevo nombre',o),o);if(n){S.categorias[i]=n;[...S.contratos,...S.gastos].forEach(x=>{if(x.categoria===o)x.categoria=n});if(S.ajustes.catGas===o)S.ajustes.catGas=n;save();go('mas','cat')}}
function delCat(i){const o=S.categorias[i],n=catUse(o),otras=S.categorias.filter(c=>c!==o);if(!otras.length){alert('Debe quedar al menos una categoría.');return}
 if(!n&&S.ajustes.catGas!==o){if(ask('¿Eliminar "'+o+'"?')){S.categorias.splice(i,1);save();go('mas','cat')}return}
 modal('Eliminar "'+o+'" ('+n+' registros)',[{k:'dest',l:'Pasar sus registros a',t:'select',o:otras,r:1}],{},v=>{[...S.contratos,...S.gastos].forEach(x=>{if(x.categoria===o)x.categoria=v.dest});if(S.ajustes.catGas===o)S.ajustes.catGas=v.dest;S.categorias.splice(S.categorias.indexOf(o),1);save();go('mas','cat')})}
const concUse=n=>S.gastos.filter(g=>g.concepto===n).length;
function concScreen(){const l=S.conceptos.slice().sort((a,b)=>a.n.localeCompare(b.n,'es'));
 return`${back}<h1>Conceptos</h1><p class="m">Los conceptos agrupan los gastos sueltos (IBI, comunidad, IRPF…). Cada uno puede proponer una categoría al elegirlo.</p><button class="p" onclick="addConc()">+ Añadir</button>${l.map(c=>`<div class="card row sp"><span>${esc(c.n)} <span class="m">(${concUse(c.n)} usos${c.cat?' · '+esc(c.cat):''})</span></span><span><button class="s" onclick="edConc('${c.id}')">Editar</button><button class="s d" onclick="delConc('${c.id}')">Eliminar</button></span></div>`).join('')||'<div class="card m">Sin conceptos.</div>'}`}
const concF=()=>[{k:'n',l:'Nombre',r:1},{k:'cat',l:'Categoría que propone (opcional)',t:'select',o:[['','— ninguna —'],...S.categorias]}];
const concOk=(n,ex)=>{n=(n||'').trim();if(!n)return null;if(S.conceptos.some(c=>c.id!==ex&&c.n.toLowerCase()===n.toLowerCase())){alert('Ya existe un concepto con ese nombre.');return null}return n};
function addConc(){modal('Nuevo concepto',concF(),{},o=>{const n=concOk(o.n);if(!n)return false;S.conceptos.push({id:uid(),n,cat:o.cat||''});save();go('mas','conc')})}
function edConc(id){const c=S.conceptos.find(x=>x.id===id),old=c.n;modal('Editar concepto',concF(),c,o=>{const n=concOk(o.n,id);if(!n)return false;c.n=n;c.cat=o.cat||'';S.gastos.forEach(g=>{if(g.concepto===old)g.concepto=n});save();go('mas','conc')})}
function delConc(id){const c=S.conceptos.find(x=>x.id===id),n=concUse(c.n),otros=S.conceptos.filter(x=>x.id!==id);
 if(!n){if(ask('¿Eliminar «'+c.n+'»?')){S.conceptos=otros;save();go('mas','conc')}return}
 if(!otros.length){alert('Hay gastos con este concepto y no queda otro al que pasarlos.');return}
 modal('Eliminar «'+c.n+'» ('+n+' gastos)',[{k:'dest',l:'Pasar sus gastos a',t:'select',o:otros.map(x=>x.n).sort((a,b)=>a.localeCompare(b,'es')),r:1}],{},v=>{S.gastos.forEach(g=>{if(g.concepto===c.n)g.concepto=v.dest});S.conceptos=S.conceptos.filter(x=>x.id!==id);save();go('mas','conc')})}
function ayudaScreen(){const T=[['Electricidad, agua, gas','Sí (variable, con su tipo)','Factura de cada recibo, con periodo y consumos'],['Internet, TV, fijo','Sí','Factura (el importe se propone solo si es fijo)'],['Móvil de cada persona','Sí, uno por línea','Asociado la persona (o General); tipo Móvil'],['Netflix, Spotify, iCloud, Prime','Sí, asociado General','Factura mensual o anual'],['Gimnasio, clubes, ONG, academia','Sí, asociado la persona','Una factura por cuota'],['Seguros (casa, coche, vida, salud, decesos)','Sí; es donde más rinde (vencimiento y preaviso)','Una factura por recibo'],['Cuenta o tarjeta con comisiones','Sí, uno por producto','Factura por cada comisión cobrada; si es suelta, gasto suelto «Comisión bancaria»'],['Hipoteca o alquiler','Sí','Factura por cuota'],['Mantenimiento con proveedor (caldera, ascensor, alarma)','Sí','Factura'],['Renting, leasing, parking mensual','Sí, asociado el coche','Factura'],['Comunidad y derramas','No','Gasto suelto: concepto «Comunidad» o «Derrama», asociado casa, garaje o trastero, descripción «Garaje 14»'],['IBI, basuras, plusvalía, vado','No','Gasto suelto con concepto'],['IRPF y otros impuestos','No','Gasto suelto, asociado persona o General'],['Reparaciones, obras, electrodomésticos','No','Gasto suelto con concepto'],['Calefacción y agua caliente comunitarias (recibo del administrador)','Sí, uno por casa, tipo «Calefacción y ACS comunitarias»','Una factura por recibo: periodos, lecturas e importes de gas y de agua'],['Gasolina','No','Repostaje (litros y km)'],['ITV, impuesto de circulación, multas, peajes, taller, neumáticos','No','Gasto suelto con concepto, asociado el coche']];

/* CÁLCULO TEÓRICO (única función calcTeo, reutilizada por recibo y por plan):
   días = (hasta − desde) + 1
   potencia = (P1·precioP1 + P2·precioP2) · días
   energía = (kWh1·e1 + kWh2·e2 + kWh3·e3) · (1 − descuento/100)
   contador = alquilerMes · 12 / 365 · días
   impuesto eléctrico = % · (potencia + energía)
   IVA = % · (potencia + energía + impuesto + contador + otros)
   total = potencia + energía + impuesto + contador + otros + IVA
   Es una estimación: no incluye bono social, exceso de potencia ni servicios extra. */

/* ===== 6d. CALEFACCIÓN Y ACS COMUNITARIAS (v2.6) ===== */
/* Contrato «ficticio» por casa (tipoSuministro 'calefaccion'). Cada recibo del administrador = una factura (recibos) con importe = suma de los 4 importes.
   Campos de la factura: desde/hasta (periodo común a gas y agua), lcAnt/lcAct/consCal/gasFijo/gasVar, laAnt/laAct/consAcs/aguaCons/aguaFija,
   cambioContadorCal/cambioContadorAcs, difCal/difAcs (consumo escrito − lecturas).
   Campos del contrato: coefCal, coefAgua, caudal (opcional), kwBomba (opcional), casaElec, kwhManual (opcional).
   No toca tarifaFor, calcTeo ni recData. */
const rnd2=v=>Math.round(v*100)/100,rnd3=v=>Math.round(v*1000)/1000,pn=v=>{const x=parseFloat(v);return isFinite(x)?x:null};
const esCal=(t,a)=>t==='calefaccion'&&A(a)?.tipo==='casa';
const isCalC=c=>!!c&&esCal(c.tipoSuministro,c.asociado);
const calCasas=()=>[...new Set(S.contratos.filter(isCalC).map(c=>c.asociado))].map(A).filter(Boolean);
const calCon=casa=>S.contratos.filter(c=>isCalC(c)&&c.asociado===casa).sort((a,b)=>(a.estado==='cancelado')-(b.estado==='cancelado'))[0]||null;
const CALK=['lcAnt','lcAct','consCal','cambioContadorCal','gasFijo','gasVar','laAnt','laAct','consAcs','cambioContadorAcs','aguaCons','aguaFija','difCal','difAcs'];
const calCalc=(a,b)=>{a=pn(a);b=pn(b);return a!=null&&b!=null?rnd3(b-a):null};
const calRecs=(casa,d1,d2)=>S.recibos.map(r=>({r,c:gc(r.contrato)})).filter(x=>isCalC(x.c)&&(!casa||x.c.asociado===casa)&&x.r.fecha>=d1&&x.r.fecha<=d2).sort((a,b)=>String(a.r.fecha).localeCompare(String(b.r.fecha)));
/* --- Formulario del recibo: ayudas en vivo (pista de última lectura, diferencia en rojo, total) --- */
function calPrev(c,key){const k=c.contrato;if(!k)return null;const f=c.fecha||today();let b=null;
 S.recibos.forEach(r=>{if(r.contrato!==k||r.id===TMP.recId||!r.fecha||r.fecha>=f||!num(r[key]))return;if(!b||r.fecha>b.fecha)b=r});
 return b?{fecha:b.fecha,v:b[key]}:null}
function calBlkHtml(id,c){
 if(id==='calHintC'||id==='calHintA'){const cal=id==='calHintC',p=calPrev(c,cal?'lcAct':'laAct');
  return p?`Última lectura registrada (por fecha, ${fd(p.fecha).slice(0,5)}): <b>${N6.format(p.v)}</b> <button type="button" class="s" onclick="calUse('${cal?'lcAnt':'laAnt'}',${p.v})">usarla</button>`:'Aún no hay lecturas anteriores en este contrato.'}
 if(id==='calDifC'||id==='calDifA'){const cal=id==='calDifC',esp=calCalc(c[cal?'lcAnt':'laAnt'],c[cal?'lcAct':'laAct']),v=pn(c[cal?'consCal':'consAcs']);let h='';
  if(c[cal?'cambioContadorCal':'cambioContadorAcs'])return'';
  if(esp!=null&&v!=null&&Math.abs(v-esp)>0.0005)h=`<span style="color:var(--r)">debería ser ${N6.format(esp)} (dif. ${v-esp>0?'+':'−'}${N6.format(Math.abs(rnd3(v-esp)))} m³)</span>`;
  if(esp!=null&&esp<0)h+=(h?'<br>':'')+'<span style="color:var(--o)">⚠️ La lectura actual es menor que la anterior. Si has cambiado el contador, marca la casilla.</span>';
  return h}
 if(id==='calTot'){const t=['gasFijo','gasVar','aguaCons','aguaFija'].reduce((s,k)=>s+(pn(c[k])||0),0);return`<b>Total del recibo (suma de los cuatro importes): ${eur(rnd2(t))}</b>`}
 return''}

 const esp=calCalc(c[a],c[b]),v=pn(c[k]),bad=!c[f]&&esp!=null&&v!=null&&Math.abs(v-esp)>0.0005;e.style.borderColor=bad?'var(--r)':'';e.style.color=bad?'var(--r)':''})}
function calRefresh(c){['calHintC','calHintA','calDifC','calDifA','calTot'].forEach(id=>{const e=$('#'+id);if(e)e.innerHTML=calBlkHtml(id,c)});calMark(c)}
function calChg(c,set){if(!isCalC(gc(c.contrato)))return;c={...c};
 [['lcAnt','lcAct','consCal','pc1'],['laAnt','laAct','consAcs','pc2']].forEach(([a,b,k,pk])=>{const esp=calCalc(c[a],c[b]);
  if(esp!=null&&(pn(c[k])==null||pn(c[k])===TMP[pk])){set(k,esp);c[k]=esp}TMP[pk]=esp});

/* --- Cálculos del informe --- */
/* Agua fría de una casa: litros/día = suma, por contrato, de consumo/días cubiertos (prorrateo por días, como Agua y gas) */
function aguaCasa(casa,d1,d2){const G={};
 consRows('agua',casa,d1,d2).filter(x=>x.has&&x.cons!=null&&x.unit==='m³').forEach(x=>{const g=G[x.c.id]||(G[x.c.id]={cons:0,imp:0,dias:0});g.cons+=x.cons*x.frac;g.imp+=x.r.importe*x.frac;g.dias+=x.ov});
 const gs=Object.values(G).filter(g=>g.dias>0);if(!gs.length)return null;
 const cons=gs.reduce((s,g)=>s+g.cons,0),imp=gs.reduce((s,g)=>s+g.imp,0);
 return{cons,imp,litDia:gs.reduce((s,g)=>s+g.cons/g.dias*1000,0),precio:cons>0?imp/cons:null}}
/* Agua caliente (ACS): igual, con el periodo del recibo (desde/hasta, común a gas y agua) */
function acsCasa(casa,d1,d2){const G={};
 S.recibos.forEach(r=>{const c=gc(r.contrato);if(!isCalC(c)||c.asociado!==casa||!num(r.consAcs)||!r.desde||!r.hasta||r.hasta<r.desde)return;
  const dias=diff(r.hasta,r.desde)+1,a=r.desde>d1?r.desde:d1,b=r.hasta<d2?r.hasta:d2,ov=diff(b,a)+1;if(ov<=0)return;
  const g=G[c.id]||(G[c.id]={cons:0,dias:0});g.cons+=r.consAcs*ov/dias;g.dias+=ov});
 const gs=Object.values(G);if(!gs.length)return null;
 return{cons:gs.reduce((s,g)=>s+g.cons,0),litDia:gs.reduce((s,g)=>s+g.cons/g.dias*1000,0)}}
/* Precio del kWh para la bomba de calor: último contrato y última tarifa de la casa elegida (o precio manual), con descuento, impuesto eléctrico e IVA de Ajustes */
function calPrecioElec(con){const aj=S.ajustes,f=(1+(+aj.impElec||0)/100)*(1+(+aj.iva||0)/100),cE=con.casaElec||con.asociado;
 if(num(con.kwhManual)&&con.kwhManual>0)return{p:[1,1,1].map(()=>con.kwhManual*f),txt:'precio manual '+N6.format(con.kwhManual)+' €/kWh (sin impuestos)'};
 let best=null;S.contratos.filter(c=>isElecC(c)&&c.asociado===cE).forEach(c=>{(c.tarifas||[]).forEach(t=>{if(!best||t.desde>best.t.desde)best={c,t}})});
 if(!best)return null;const d=1-(+best.t.dto||0)/100;
 return{p:[best.t.e1,best.t.e2,best.t.e3].map(e=>(+e||0)*d*f),txt:esc(an(cE))+' · '+esc(best.c.nombre)+' · tarifa desde '+fd(best.t.desde)}}
/* --- Informes → Calefacción y ACS --- */
function infCal(){const casas=calCasas();
 if(!casas.length)return`<div class="card m">Aún no hay contratos de calefacción y ACS comunitarias. En Contratos crea uno con «Tipo de servicio = Calefacción y ACS comunitarias» en una casa, anota sus coeficientes y, por cada recibo del administrador, apunta una factura de ese contrato.</div>`;
 if(!casas.some(a=>a.id===ui.cc))ui.cc=casas[0].id;
 const casa=ui.cc,con=calCon(casa),d1=ui.d1,d2=ui.d2,view=ui.cv==='rec'?'rec':'res';
 return`<div class="card np"><div class="row"><label style="margin:0">Casa<select onchange="ui.cc=this.value;go()">${casas.map(a=>`<option value="${a.id}"${casa===a.id?' selected':''}>${esc(a.nombre)}</option>`).join('')}</select></label></div>${perSel()}
<div class="tabs">${[['res','Resumen'],['rec','Posibles reclamaciones']].map(([k,l])=>`<button class="${view===k?'on':''}" onclick="ui.cv='${k}';go()">${l}</button>`).join('')}</div>
<div class="row"><button onclick="go('mas','calc')">Cómo se calcula</button><button onclick="print()">Imprimir / PDF</button></div></div>
<h2>${esc(an(casa))} · ${fd(d1)} – ${fd(d2)}</h2>${view==='rec'?calRec(casa,d1,d2):calRes(casa,con,d1,d2)}`}
function calRes(casa,con,d1,d2){
 const kp=(l,v,x)=>`<div class="card" style="margin:0"><div class="m">${l}</div><b>${v}</b>${x?`<div class="m">${x}</div>`:''}</div>`,
  ref=num(S.ajustes.refLitros)&&S.ajustes.refLitros>0?S.ajustes.refLitros:130;let h='';
 /* 1. Agua (fría y caliente por separado; el conjunto solo es su suma) */
 const tab=S.asociados.filter(a=>a.tipo==='casa'&&!a.archivado).map(a=>({a,f:aguaCasa(a.id,d1,d2),w:acsCasa(a.id,d1,d2),pe:num(a.personas)&&a.personas>0?a.personas:null})).filter(x=>x.f||x.w),
  me=tab.find(x=>x.a.id===casa),
  pp=(v,pe)=>v==null?'—':pe?NUM.format(v/pe)+' <span class="m">L/pers·día</span>':NUM.format(v)+' <span class="m">L/día</span>';
 h+='<h2>Consumo de agua (litros por persona y día)</h2>';
 if(!me)h+='<div class="card m">Sin datos de agua en este periodo: hacen falta facturas de agua de la casa con periodo y consumo (m³) y/o recibos de calefacción con periodo y m³ de ACS.</div>';

async function drvCall(c,a,pr,d){if(!PUV.test(c.u))throw'url';const ts=Date.now(),n=hex(rnd(16)),ps=JSON.stringify(pr||{}),dh=d?await sha(d):'',s=await hmac(c.k,['1',a,DAPP,ts,n,ps,dh].join('|'));let r,j;
 try{r=await fetch(c.u,{method:'POST',body:JSON.stringify({v:1,a,app:DAPP,ts,n,ps,d:d||'',s}),redirect:'follow',credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'})}catch{throw'net'}
 try{j=await r.json()}catch{throw'resp'}if(!j||!j.ok){DM=(j&&j.m)||'';throw(j&&j.e)||'int'}return j}
async function drvTry(c,a,pr,d){for(let t=0;;t++){try{return await drvCall(c,a,pr,d)}catch(e){if((e=='net'||e=='resp'||e=='busy')&&t<2){await sleep(1500*(t+1));continue}throw e}}}
const drvErr=e=>typeof e!='string'?'Error: '+((e&&e.message)||e):({url:'La dirección del puente no es válida (debe ser https://script.google.com/…/exec).',net:'Sin conexión, o la dirección del puente no responde.',resp:'El puente no devolvió una respuesta válida. Revisa que la dirección termina en /exec y que la implementación es para «Cualquier usuario».',auth:'La clave del puente no coincide con la propiedad SECRET de Apps Script.',ts:'La hora del móvil no coincide con la de Google: activa la fecha y hora automáticas.',rep:'Petición repetida: inténtalo otra vez.',nosecret:'Al puente le falta la propiedad SECRET (o tiene menos de 16 caracteres).',busy:'El puente está ocupado: inténtalo en un minuto.',big:'Trozo demasiado grande para el puente.',app:'Nombre de carpeta no válido.',nf:'No se encontró esa copia en Drive.',sz:'Un trozo llegó incompleto: inténtalo otra vez.',miss:'La copia en Drive está incompleta: inténtalo otra vez.',bad:'Petición no válida para el puente.'}[e]||'Error del puente ('+e+(DM?': '+DM:'')+')');
/* subir: la copia ya cifrada se corta en trozos de 3 MB; el puente la da por buena solo al recibir todos.
   El id de la copia solo admite [0-9A-Za-z_-]: por eso la versión va con guiones (3-0-0) */
async function drvPutBlob(c,bl,name,now,keep){const t=new Date(now),z=n=>String(n).padStart(2,'0'),id=`${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())}_${z(t.getHours())}-${z(t.getMinutes())}-${z(t.getSeconds())}_v${APP_VERSION.replace(/\./g,'-')}_completa`,tot=Math.max(1,Math.ceil(bl.size/PART));
 for(let i=0;i<tot;i++){LA=Date.now();toast(`Subiendo a Drive… ${i+1} de ${tot}`,6e4);const pt=bl.slice(i*PART,(i+1)*PART);await drvTry(c,'put',{id,i:i+1,sz:pt.size},b64(new Uint8Array(await pt.arrayBuffer())))}
 await drvTry(c,'fin',{id,total:tot,size:bl.size,name,keep:keep||PTE?.keep||10});return id}
async function drvGetBlob(c,it){const ps=[];for(let i=1;i<=it.t;i++){LA=Date.now();toast(`Descargando de Drive… ${i} de ${it.t}`,6e4);ps.push(ub64((await drvTry(c,'get',{id:it.id,i})).d))}const bl=new Blob(ps);if(bl.size!==it.s)throw'miss';return bl}
async function drvUp(){if(!pteOn())return drvConn();if(DUP)return toast('Ya hay una operación en curso');const x=await drvCtx();if(!x)return;DUP=1;let wl=null;try{wl=await navigator.wakeLock?.request('screen')}catch{}
 try{const{bl,now,name}=await mkBk('enc',x.p,0);await drvPutBlob(x.c,bl,name,now);S.lastBackup=today();S.cambios=0;save(true);dropSnaps(s=>s.kind==='migrate');pteSave({last:now});render();toast('Copia subida a Drive ✓',3000)}
 catch(e){toast('');alert('No se pudo subir la copia. Tus datos no han cambiado.\n'+drvErr(e))}finally{DUP=0;try{wl&&wl.release()}catch{}}}

const drvLast=()=>PTE?.last?new Date(PTE.last).toLocaleString('es-ES'):'nunca';
function drvScreen(){return`${back}<h1>☁️ Copia en Drive (cifrada)</h1><div class="card">${pteOn()?`<p class="m">Conectado. Carpeta: Apps/Backups/${DAPP} · última subida desde este dispositivo: ${drvLast()}</p><div class="row"><button class="p" onclick="drvUp()">Subir copia completa</button><button onclick="drvList()">Ver copias y restaurar</button></div><label>Conservar en Drive las últimas (copias)<input type="number" min="2" max="50" inputmode="numeric" value="${PTE.keep||10}" onchange="drvKeep(this.value)"></label><div class="row"><button onclick="drvTest()">Probar conexión</button><button onclick="drvConn()">Cambiar datos</button><button class="d" onclick="drvOff()">Desconectar</button></div>`:`<p class="m">Sube copias completas cifradas a tu Drive (Apps/Backups/${DAPP}) y restáuralas desde ahí. Se cifran en este dispositivo con tu contraseña maestra antes de salir: Drive solo ve datos ilegibles.</p><div class="row"><button class="p" onclick="drvConn()">Conectar con Drive</button><button onclick="drvList()">Restaurar desde Drive (móvil nuevo)</button></div>`}<div class="row" style="margin-top:8px"><button onclick="drvHelp()">Cómo crear el puente</button></div></div>`}
async function drvConn(){if(!SEG?.vf&&!await segPw())return;const p=await getPw();if(!p)return;const c=await pteGet(p)||{u:'',k:''};
 show(`<h2>Conectar con Drive</h2><p class="m">Crea el puente una sola vez (botón «Cómo crear el puente») y pega aquí su dirección y su clave. Si ya tienes el puente de otra app, usa la misma dirección y la misma clave.</p><label>Dirección del puente (termina en /exec)<input id="dr_u" inputmode="url" autocomplete="off" value="${esc(c.u)}" placeholder="https://script.google.com/macros/s/…/exec"></label><label>Clave del puente<input id="dr_k" type="password" autocomplete="off" value="${esc(c.k)}"></label><div class="row"><button onclick="drvGen()">Generar una clave nueva</button></div><p class="m">La clave nunca se envía: solo firma las peticiones. Aquí se guarda cifrada con tu contraseña maestra.</p><div class="row sp"><button onclick="closeSh()">Cancelar</button><button class="p" onclick="drvSave()">Probar y guardar</button></div>`)}
function drvGen(){if(!ask('¿Generar una clave nueva? Si ya tienes el puente creado (también de otra app), tendrás que cambiar su propiedad SECRET en Apps Script y en las otras apps.'))return;const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',k=[...rnd(32)].map(x=>A[x&31]).join(''),e=$('#dr_k');e.type='text';e.value=k;copy(k);alert('Clave generada y copiada al portapapeles.\n\nPégala en Apps Script: Configuración del proyecto › Propiedades de la secuencia de comandos › propiedad SECRET.\n\nTambién queda en la casilla para guardarla aquí.')}
async function drvSave(){const u=$('#dr_u').value.trim(),k=$('#dr_k').value.trim();if(!PUV.test(u))return alert('La dirección debe ser la de la aplicación web: https://script.google.com/macros/s/…/exec');if(k.length<16)return alert('La clave debe tener al menos 16 caracteres (usa «Generar una clave nueva»).');
 const p=await getPw();if(!p)return;toast('Probando conexión…',6e4);try{const j=await drvTry({u,k},'ping');await pteSet({u,k},p);pteSave({keep:PTE?.keep||10});closeSh();render();toast('Conectado · '+j.folder,3000)}catch(e){toast('');alert(drvErr(e))}}
async function drvTest(){const x=await drvCtx();if(!x)return;toast('Probando conexión…',6e4);try{const j=await drvTry(x.c,'ping');toast('');alert('Conexión correcta ✓\nCarpeta en Drive: '+j.folder+'\nVersión del puente: '+j.v)}catch(e){toast('');alert(drvErr(e))}}
const drvKeep=v=>{pteSave({keep:Math.max(2,Math.min(50,Math.floor(+v)||10))});toast('Guardado')};
function drvOff(){if(!ask('¿Desconectar Drive de este dispositivo? Las copias que ya están en Drive no se borran.'))return;localStorage.removeItem(PTEK);PTE=null;render()}
const BRIDGE="/**\n * PUENTE DRIVE PARA COPIAS CIFRADAS · versión 1\n *\n * Qué hace: recibe trozos de archivos YA CIFRADOS por la app y los guarda en\n *   Mi unidad / Apps / Backups / <carpeta de la app> / <copia> / 0001.part, 0002.part…\n * Seguridad:\n *   - Todo va por HTTPS (script.google.com no admite HTTP).\n *   - La clave del puente (SECRET) NO viaja nunca, ni en la URL ni en el cuerpo:\n *     cada petición lleva una firma HMAC-SHA256 que se calcula con ella.\n *   - Hora y número de un solo uso (nonce): una petición capturada no se puede repetir.\n *   - El contenido ya llega cifrado de extremo a extremo (AES-GCM con tu contraseña maestra):\n *     ni el puente ni Google pueden leerlo.\n * Clave SECRET: Configuración del proyecto (engranaje) > Propiedades de la secuencia de\n *   comandos > Añadir propiedad: nombre SECRET, valor = la clave que genera la app (mín. 16).\n * Implementación: Implementar > Nueva implementación > Aplicación web >\n *   Ejecutar como: Yo · Quién tiene acceso: Cualquier usuario.\n */\nconst VERSION = 1;\nconst ROOT = ['Apps', 'Backups'];\nconst SKEW = 600000;       // margen de hora: 10 min\nconst MAXD = 6000000;      // máx. caracteres base64 por petición (~4,5 MB)\nconst SUB = '_subiendo_';  // prefijo de copias a medio subir\nconst ID = /^[0-9A-Za-z_-]{6,80}$/;\n\nfunction doGet() { return out_({ ok: 0, e: 'post' }); }\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction hex_(b) {\n  return b.map(function (x) { return ('0' + (x & 255).toString(16)).slice(-2); }).join('');\n}\nfunction sha_(s) {\n  return hex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, s, Utilities.Charset.UTF_8));\n}\nfunction same_(a, b) {\n  if (a.length !== b.length) return false;\n  var r = 0;\n  for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);\n  return r === 0;\n}\nfunction nm_(i) { return ('0000' + i).slice(-4) + '.part'; }\nfunction int_(x, a, b) { return typeof x === 'number' && (x | 0) === x && x >= a && x <= b; }\n\nfunction rootF_() {\n  var f = DriveApp.getRootFolder();\n  ROOT.forEach(function (n) {\n    var it = f.getFoldersByName(n);\n    f = it.hasNext() ? it.next() : f.createFolder(n);\n  });\n  return f;\n}\nfunction appF_(app) {\n  var r = rootF_(), it = r.getFoldersByName(app);\n  return it.hasNext() ? it.next() : r.createFolder(app);\n}\nfunction sub_(af, name, create) {\n  var it = af.getFoldersByName(name);\n  if (it.hasNext()) return it.next();\n  return create ? af.createFolder(name) : null;\n}\nfunction desc_(f) {\n  try { var d = JSON.parse(f.getDescription() || ''); return d && d.t ? d : null; } catch (x) { return null; }\n}\n\nfunction doPost(e) {\n  try {\n    var q;\n    try { q = JSON.parse(e.postData.contents); } catch (x) { return out_({ ok: 0, e: 'bad' }); }\n    if (!q || q.v !== 1 || typeof q.a !== 'string' || typeof q.app !== 'string' || typeof q.ts !== 'number' ||\n        typeof q.n !== 'string' || typeof q.ps !== 'string' || typeof q.s !== 'string') return out_({ ok: 0, e: 'bad' });\n    var sec = PropertiesService.getScriptProperties().getProperty('SECRET');\n    if (!sec || sec.length < 16) return out_({ ok: 0, e: 'nosecret' });\n    var d = typeof q.d === 'string' ? q.d : '';\n    if (d.length > MAXD) return out_({ ok: 0, e: 'big' });\n    // 1) firma (todo lo firmado es ASCII)\n    var msg = ['1', q.a, q.app, q.ts, q.n, q.ps, d ? sha_(d) : ''].join('|');\n    var sig = hex_(Utilities.computeHmacSha256Signature(msg, sec));\n    if (!same_(sig, q.s)) { Utilities.sleep(1500); return out_({ ok: 0, e: 'auth' }); }\n    // 2) hora y repetición\n    if (Math.abs(Date.now() - q.ts) > SKEW) return out_({ ok: 0, e: 'ts' });\n    var cache = CacheService.getScriptCache();\n    if (!/^[0-9a-f]{32}$/.test(q.n) || cache.get('n' + q.n)) return out_({ ok: 0, e: 'rep' });\n    cache.put('n' + q.n, '1', 1500);\n    if (!/^[a-z0-9_-]{2,40}$/.test(q.app)) return out_({ ok: 0, e: 'app' });\n    var p;\n    try { p = JSON.parse(q.ps); } catch (x) { return out_({ ok: 0, e: 'bad' }); }\n    if (!p || typeof p !== 'object') p = {};\n    // 3) acción (de una en una)\n    var lock = LockService.getScriptLock();\n    if (!lock.tryLock(25000)) return out_({ ok: 0, e: 'busy' });\n    try { return act_(q.a, q.app, p, d); } finally { try { lock.releaseLock(); } catch (x) { } }\n  } catch (err) {\n    return out_({ ok: 0, e: 'int', m: String(err && err.message || err).slice(0, 120) });\n  }\n}\n\nfunction act_(a, app, p, d) {\n  var af, sf, it, f, i;\n  switch (a) {\n    case 'ping':\n      appF_(app);\n      return out_({ ok: 1, v: VERSION, folder: ROOT.join('/') + '/' + app });\n\n    case 'put':\n      if (!ID.test(p.id || '') || !int_(p.i, 1, 9999) || !d) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, SUB + p.id, true);\n      it = sf.getFilesByName(nm_(p.i));\n      while (it.hasNext()) it.next().setTrashed(true);\n      f = sf.createFile(Utilities.newBlob(Utilities.base64Decode(d), 'application/octet-stream', nm_(p.i)));\n      if (typeof p.sz === 'number' && f.getSize() !== p.sz) { f.setTrashed(true); return out_({ ok: 0, e: 'sz' }); }\n      return out_({ ok: 1, i: p.i });\n\n    case 'fin': {\n      if (!ID.test(p.id || '') || !int_(p.total, 1, 9999) || typeof p.size !== 'number') return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, SUB + p.id, false);\n      if (!sf) { // ¿ya estaba terminada? (respuesta perdida en un reintento)\n        var fin = sub_(af, p.id, false), ds = fin && desc_(fin);\n        return ds && ds.t === p.total && ds.s === p.size ? out_({ ok: 1, again: 1 }) : out_({ ok: 0, e: 'nf' });\n      }\n      var n = 0, sum = 0, seen = {};\n      it = sf.getFiles();\n      while (it.hasNext()) {\n        f = it.next();\n        var nm = f.getName();\n        if (/^\\d{4}\\.part$/.test(nm)) { seen[nm] = 1; n++; sum += f.getSize(); }\n      }\n      for (i = 1; i <= p.total; i++) if (!seen[nm_(i)]) return out_({ ok: 0, e: 'miss', m: 'falta ' + nm_(i) });\n      if (n !== p.total || sum !== p.size) return out_({ ok: 0, e: 'miss', m: n + '/' + p.total + ' trozos · ' + sum + '/' + p.size + ' bytes' });\n      sf.setDescription(JSON.stringify({ t: p.total, s: p.size, n: String(p.name || '').slice(0, 120), d: new Date().toISOString() }));\n      it = af.getFoldersByName(p.id);\n      while (it.hasNext()) { var old = it.next(); if (desc_(old)) old.setTrashed(true); }\n      sf.setName(p.id);\n      var tr = retain_(af, int_(p.keep, 2, 50) ? p.keep : 10);\n      clean_(af);\n      return out_({ ok: 1, trashed: tr });\n    }\n\n    case 'list': {\n      af = appF_(app);\n      var r = [];\n      it = af.getFolders();\n      while (it.hasNext()) {\n        f = it.next();\n        if (f.getName().indexOf(SUB) === 0) continue;\n        var dd = desc_(f);\n        if (dd) r.push({ id: f.getName(), t: dd.t, s: dd.s, n: dd.n, d: f.getDateCreated().toISOString() });\n      }\n      r.sort(function (x, y) { return x.d < y.d ? 1 : -1; });\n      return out_({ ok: 1, l: r });\n    }\n\n    case 'get':\n      if (!ID.test(p.id || '') || !int_(p.i, 1, 9999)) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, p.id, false);\n      if (!sf || !desc_(sf)) return out_({ ok: 0, e: 'nf' });\n      it = sf.getFilesByName(nm_(p.i));\n      if (!it.hasNext()) return out_({ ok: 0, e: 'nf' });\n      return out_({ ok: 1, i: p.i, d: Utilities.base64Encode(it.next().getBlob().getBytes()) });\n\n    case 'del':\n      if (!ID.test(p.id || '')) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, p.id, false);\n      if (!sf || !desc_(sf)) return out_({ ok: 0, e: 'nf' });\n      sf.setTrashed(true);\n      return out_({ ok: 1 });\n  }\n  return out_({ ok: 0, e: 'bad' });\n}\n\n// Solo toca copias creadas por este puente (las que llevan descripción propia).\nfunction retain_(af, keep) {\n  var a = [], it = af.getFolders(), f;\n  while (it.hasNext()) { f = it.next(); if (f.getName().indexOf(SUB) !== 0 && desc_(f)) a.push(f); }\n  a.sort(function (x, y) { return y.getDateCreated() - x.getDateCreated(); });\n  var k = 0;\n  for (var i = keep; i < a.length; i++) { a[i].setTrashed(true); k++; }\n  return k;\n}\n// Copias a medio subir de hace más de un día: a la papelera.\nfunction clean_(af) {\n  var it = af.getFolders(), f;\n  while (it.hasNext()) {\n    f = it.next();\n    if (f.getName().indexOf(SUB) === 0 && Date.now() - f.getDateCreated().getTime() > 864e5) f.setTrashed(true);\n  }\n}\n";
function drvHelp(){show(`<h2>Cómo crear el puente (una sola vez)</h2><p class="m">Si ya lo creaste para otra app, no hace falta otro: usa la misma dirección y la misma clave.</p><ol style="padding-left:18px;font-size:14px"><li>Entra en <b>script.google.com</b> con la cuenta de Google que usarás solo para las copias.</li><li><b>Nuevo proyecto</b>. Borra lo que haya y pega el código (botón de abajo).</li><li>Engranaje <b>Configuración del proyecto</b> › <b>Propiedades de la secuencia de comandos</b> › añade <b>SECRET</b> con la clave (en esta app: Conectar con Drive › Generar una clave nueva).</li><li><b>Implementar › Nueva implementación › Aplicación web</b>: ejecutar como <b>Yo</b>, acceso <b>Cualquier usuario</b>. Autoriza los permisos.</li><li>Copia la dirección que termina en <b>/exec</b> y pégala en Conectar con Drive.</li></ol><p class="m">Las copias quedan en Mi unidad / Apps / Backups / ${DAPP}. Si cambias el código más adelante: Implementar › Gestionar implementaciones › Editar › Nueva versión (la dirección no cambia).</p><div class="row sp"><button onclick="closeSh()">Cerrar</button><button class="p" onclick="copy(BRIDGE)">Copiar código del puente</button></div>`)}
/* ver copias y restaurar (también en un móvil nuevo, sin conexión guardada) */
const drvAsk=()=>new Promise(r=>{const d=document.createElement('div');d.className='pwov';d.style.cssText='position:fixed;inset:0;background:#000a;z-index:75;display:flex;align-items:center;padding:16px';d.innerHTML=`<div class="card" style="width:100%;max-width:440px;margin:0 auto"><b>Datos del puente de Drive</b><input id="a_u" inputmode="url" autocomplete="off" placeholder="Dirección del puente (termina en /exec)" style="display:block;width:100%;margin:10px 0"><input id="a_k" type="password" autocomplete="off" placeholder="Clave del puente" style="display:block;width:100%;margin:0 0 10px"><div class="row sp"><button id="no">Cancelar</button><button class="p" id="ok">Continuar</button></div></div>`;document.body.appendChild(d);const x=v=>{d.remove();r(v)};d.querySelector('#no').onclick=()=>x(null);d.querySelector('#ok').onclick=()=>{const u=d.querySelector('#a_u').value.trim(),k=d.querySelector('#a_k').value.trim();if(!PUV.test(u))return alert('La dirección debe empezar por https://script.google.com/ y terminar en /exec.');if(k.length<16)return alert('La clave del puente tiene al menos 16 caracteres.');x({u,k})}});
async function drvList(){let x;if(pteOn()){x=await drvCtx();if(!x)return}else{const c=await drvAsk();if(!c)return;x={c,p:null}}
 toast('Buscando copias…',6e4);try{const j=await drvTry(x.c,'list');DL=j.l||[];DX=x;toast('');drvShow()}catch(e){toast('');alert(drvErr(e))}}
function drvShow(){const z=DL.map((it,i)=>`<div class="card row sp"><div><b>${new Date(it.d).toLocaleString('es-ES')}</b><div class="m">${mb(it.s)} · ${it.t} trozo${it.t>1?'s':''}</div></div><span><button class="s p" onclick="drvPick(${i})">Restaurar</button> <button class="s d" onclick="drvDel(${i})">🗑</button></span></div>`).join('');
 show(`<h2>Copias en Drive</h2><p class="m">Apps/Backups/${DAPP} · las más recientes primero. Al restaurar verás antes un resumen y se guarda una copia interna de lo actual.</p>${z||'<p class="m">No hay copias en Drive.</p>'}<div class="row"><button onclick="DX=null;closeSh()">Cerrar</button></div>`)}
async function drvPick(i){const it=DL[i],x=DX;if(!it||!x||DUP)return;DUP=1;closeSh();
 try{const bl=await drvGetBlob(x.c,it);toast('Copia descargada: descifrando…',6e4);DUP=0;await importJ(bl,'reemplazar',x.p,x.c);toast('')}
 catch(e){toast('');alert('No se pudo descargar la copia. No se ha tocado nada.\n'+drvErr(e))}finally{DUP=0;DX=null}}
async function drvDel(i){const it=DL[i],x=DX;if(!it||!x||!ask('¿Borrar esta copia de Drive? Va a la papelera de Drive (se puede recuperar unos 30 días).'))return;try{await drvTry(x.c,'del',{id:it.id});DL.splice(i,1);drvShow()}catch(e){alert(drvErr(e))}}
/* fin seguridad */
boot();
