<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis servicios</title>
<style>
:root{--bg:#f4f5f7;--c:#fff;--t:#1d2430;--m:#6b7280;--p:#2563eb;--b:#e5e7eb;--r:#dc2626;--o:#ea580c;--g:#16a34a;--k1:#ef4444;--k2:#f59e0b;--k3:#10b981;--teo:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--c:#1c212b;--t:#e8ebf0;--m:#9aa3b2;--p:#6ea0ff;--b:#2c3340;--k1:#f87171;--k2:#fbbf24;--k3:#34d399;--teo:#a78bfa}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
main{max-width:760px;margin:0 auto;padding:12px}h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:14px 0 6px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.m{color:var(--m);font-size:13px}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px}
button{cursor:pointer}button.p{background:var(--p);color:#fff;border-color:var(--p)}button.d{color:var(--r)}button.s{padding:4px 8px;font-size:13px}
label{display:block;margin:8px 0;font-size:13px;color:var(--m)}label input,label select,label textarea{display:block;width:100%;margin-top:2px}label input[type=checkbox]{display:inline-block;width:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:14px 2px;background:none;font-size:13px}nav button.on{color:var(--p);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.R{background:var(--r)}.O{background:var(--o)}.G{background:var(--g)}
.ov{position:fixed;inset:0;background:#0008;z-index:9;overflow:auto;padding:12px}.ov .card{max-width:520px;margin:20px auto}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;border-bottom:1px solid var(--b);text-align:left}td.n,th.n{text-align:right}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button.on{background:var(--p);color:#fff}.warn{border-color:var(--o);color:var(--o)}
#mod2 .ov{z-index:10}.tc{border:1px solid var(--b);border-radius:10px;padding:8px;margin:6px 0}.rq{color:var(--r)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 0}.lg{margin-right:10px;font-size:12px;color:var(--m)}
tr.wr td{color:var(--o);font-weight:600}tr.best td{background:rgba(22,163,74,.18);font-weight:700}tr.ref td{font-style:italic;border-top:1px dashed var(--m);border-bottom:1px dashed var(--m)}.print-only{display:none}
@media print{.print-only{display:block}nav,button,.np{display:none!important}body{background:#fff;color:#000;padding:0}.card{break-inside:avoid}}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="mod"></div><div id="mod2"></div>
<script>
/* ===== 1. UTILIDADES ===== */
const APP_VERSION='2.1',SCHEMA=3,KEY='mis_servicios_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const EUR=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}),NUM=new Intl.NumberFormat('es-ES',{maximumFractionDigits:2});
const eur=n=>EUR.format(n||0),pad=n=>String(n).padStart(2,'0');
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const ISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const today=()=>ISO(new Date());
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ISO(d)};
const addM=(s,n)=>{const d=P(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return ISO(d)};
const diff=(a,b)=>Math.round((P(a)-P(b))/864e5);
const MESES={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12};
/* ===== 2. DATOS Y ALMACENAMIENTO ===== */
function def(){return{version:SCHEMA,asociados:[['Casa 1','casa'],['Casa 2','casa'],['Coche 1','vehiculo'],['Coche 2','vehiculo'],['General','general']].map(([n,t])=>({id:uid(),nombre:n,tipo:t,archivado:false})),
categorias:['Suministros','Telecomunicaciones','Seguros','Suscripciones','Impuestos y tasas','Vehículo','Mantenimiento hogar','Otros','Gimnasio','Comunidad de vecinos'],
contratos:[],recibos:[],repostajes:[],gastos:[],planes:[],ideas:[],ajustes:defAj(),lastBackup:null}}
const IDEAS_21=['Previsión de pagos de los próximos 12 meses','Exportar informes a CSV','Optimizar la potencia contratada','Tarifas PVPC con datos horarios','Comparativas de gas y agua','Excedentes solares y bono social'];
const defAj=()=>({rojo:15,naranja:60,rec:[30,7],bak:30,catGas:'Vehículo',impElec:5.11269632,iva:21,umbral:5});
/* Migración automática. Antes de migrar se guarda (si no existe) una copia del JSON original en mis_servicios_prev_v<esquema anterior>. */
function migrate(d){const v0=d.version=d.version||1;
 if(v0<SCHEMA){try{const k='mis_servicios_prev_v'+v0;if(!localStorage.getItem(k))localStorage.setItem(k,JSON.stringify(d))}catch(e){}}
 d.ajustes=Object.assign(defAj(),d.ajustes);
 if(v0<3){d.ideas=Array.isArray(d.ideas)?d.ideas:[];const ya=new Set(d.ideas.map(i=>String(i&&i.texto||'').trim().toLowerCase()));
  IDEAS_21.forEach(t=>{if(!ya.has(t.toLowerCase())){d.ideas.push({id:uid(),texto:t,creada:today(),estado:'pendiente'});ya.add(t.toLowerCase())}})}
 d.version=SCHEMA;return Object.assign(def(),d)}
function load(){try{const r=localStorage.getItem(KEY);return r?migrate(JSON.parse(r)):def()}catch(e){return def()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){alert('⚠️ No se pudo guardar: el almacenamiento está lleno o bloqueado. Exporta una copia de seguridad y libera espacio.');return false}}
const A=id=>S.asociados.find(a=>a.id===id),an=id=>A(id)?.nombre||'—';
const aOpts=(cur,tipo)=>S.asociados.filter(a=>(!a.archivado||a.id===cur)&&(!tipo||a.tipo===tipo)).map(a=>[a.id,a.nombre]);
/* ===== 3. LÓGICA DE CONTRATOS ===== */
const eq=c=>c.tipoImporte==='variable'?0:(c.importe||0)/(MESES[c.periodicidad]||1);
function vence(c){if(!c.vence)return null;let v=c.vence;if(c.renovAuto)while(v<today())v=addM(v,c.renMeses||12);return v}
function info(c){const v=vence(c);if(!v)return null;const lim=addD(v,-(c.preaviso||0)),d=diff(lim,today()),a=S.ajustes;return{v,lim,d,sem:d<a.rojo?'R':d<a.naranja?'O':'G'}}
/* ===== 4. FORMULARIOS GENÉRICOS ===== */
function modal(title,fields,vals,ok,host){
 /* Campos opcionales: vis(valoresActuales)->bool para mostrar/ocultar; r puede ser función; t:'html' con h() para bloques propios. host '#mod2' = capa superior. */
 const H=host||'#mod',pre=host?'g_':'f_';
 const h=fields.map(f=>{const v=vals[f.k]??f.d??'';let i;
  if(f.t==='html')return`<div id="L_${pre}${f.k}">${f.h()}</div>`;
  if(f.t==='select')i=`<select id="${pre}${f.k}">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else if(f.t==='check')i=`<input type="checkbox" id="${pre}${f.k}"${v?' checked':''}>`;
  else if(f.t==='area')i=`<textarea id="${pre}${f.k}" rows="4">${esc(v)}</textarea>`;
  else i=`<input id="${pre}${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="any"':''} value="${esc(v)}">`;
  return`<label id="L_${pre}${f.k}">${f.l}<span class="rq"></span>${i}</label>`}).join('');
 $(H).innerHTML=`<div class="ov"><div class="card"><h2>${title}</h2>${h}<div class="row sp"><button onclick="$('${H}').innerHTML=''">Cancelar</button><button class="p" id="${pre}ok">Guardar</button></div></div></div>`;
 const rd=()=>{const o={};for(const f of fields){if(f.t==='html')continue;const e=$('#'+pre+f.k);o[f.k]=f.t==='check'?e.checked:e.value}return o};
 const reqOf=(f,c)=>typeof f.r==='function'?f.r(c):f.r;
 const ref=()=>{const c=rd();for(const f of fields){const w=$('#L_'+pre+f.k),vis=!f.vis||f.vis(c);w.style.display=vis?'':'none';const q=w.querySelector('.rq');if(q)q.textContent=vis&&reqOf(f,c)?' *':''}};
 $(H).oninput=ref;$(H).onchange=ref;
 $('#'+pre+'ok').onclick=()=>{const c=rd(),o={};for(const f of fields){if(f.t==='html')continue;if(f.vis&&!f.vis(c))continue;
  const e=$('#'+pre+f.k);let v=f.t==='check'?e.checked:e.value.trim();
  if(f.t==='number')v=v===''?null:parseFloat(v);
  if(reqOf(f,c)&&(v===''||v===null)){alert('Falta: '+f.l);return}o[f.k]=v}
  if(ok(o)!==false)$(H).innerHTML=''};
 ref()}
const closeM=()=>{$('#mod').innerHTML=''};
const ask=m=>confirm(m);
/* ===== 5. CRUD GENÉRICO ===== */
const meses=['mensual','bimestral','trimestral','semestral','anual'];
const FIELDS={
contratos:()=>[{k:'nombre',l:'Nombre',r:1},{k:'proveedor',l:'Proveedor'},{k:'categoria',l:'Categoría',t:'select',o:S.categorias},{k:'asociado',l:'Asociado',t:'select',o:aOpts()},
{k:'importe',l:'Importe (€)',t:'number'},{k:'periodicidad',l:'Periodicidad',t:'select',o:meses,d:'mensual'},{k:'tipoImporte',l:'Tipo de importe',t:'select',o:['fijo','variable']},
{k:'tipoSuministro',l:'Tipo de servicio',t:'select',o:[['ninguno','ninguno'],['electricidad','electricidad'],['agua','agua'],['gas','gas'],['internet','internet'],['movil','móvil'],['otro','otro']]},{k:'tar',t:'html',h:tarBlock,vis:c=>esElec(c.tipoSuministro,c.asociado)},{k:'proxCobro',l:'Próximo cobro',t:'date'},{k:'inicio',l:'Fecha de inicio',t:'date'},
{k:'vence',l:'Vencimiento / renovación',t:'date'},{k:'renovAuto',l:'Renovación automática',t:'check'},{k:'renMeses',l:'Periodo de renovación (meses)',t:'number',d:12},
{k:'preaviso',l:'Preaviso (días)',t:'number',d:30},{k:'finPerm',l:'Fin de permanencia',t:'date'},{k:'pago',l:'Forma de pago'},{k:'nContrato',l:'Nº contrato / póliza'},
{k:'telefono',l:'Teléfono de atención'},{k:'linea',l:'Móvil: nº de línea'},{k:'usuaria',l:'Móvil: persona usuaria'},{k:'documento',l:'Dónde está el documento'},{k:'notas',l:'Notas',t:'area'},
{k:'estado',l:'Estado',t:'select',o:['activo','en revisión','cancelado']}],
recibos:()=>{const E=c=>isElecC(gc(c.contrato)),EC=c=>E(c)&&c.conDatos,NE=c=>!E(c);return[{k:'contrato',l:'Contrato',t:'select',o:S.contratos.filter(c=>c.tipoImporte==='variable').map(c=>[c.id,c.nombre]),r:1},
{k:'conDatos',l:'Voy a introducir los datos de consumo eléctrico (si lo desmarcas, el recibo se guarda igual pero no cuenta en los cálculos de consumo)',t:'check',d:true,vis:E},
{k:'desde',l:'Periodo desde',t:'date',r:EC},{k:'hasta',l:'Periodo hasta',t:'date',r:EC},
{k:'fecha',l:'Fecha',t:'date',r:1,d:today()},{k:'importe',l:'Importe (€)',t:'number',r:1},
{k:'kwh1',l:'Consumo punta P1 (kWh)',t:'number',r:EC,vis:EC},{k:'kwh2',l:'Consumo llano P2 (kWh)',t:'number',r:EC,vis:EC},{k:'kwh3',l:'Consumo valle P3 (kWh)',t:'number',r:EC,vis:EC},
{k:'consumo',l:'Consumo',t:'number',vis:NE},{k:'unidad',l:'Unidad',t:'select',o:['kWh','m³','litros'],vis:NE},{k:'notas',l:'Notas',t:'area'}]},
repostajes:()=>[{k:'coche',l:'Coche',t:'select',o:aOpts(null,'vehiculo'),r:1},{k:'fecha',l:'Fecha',t:'date',r:1,d:today()},{k:'litros',l:'Litros',t:'number',r:1},{k:'importe',l:'Importe (€)',t:'number',r:1},
{k:'ppl',l:'€/litro (vacío = calculado)',t:'number'},{k:'km',l:'Kilómetros (cuentakilómetros)',t:'number'},{k:'lleno',l:'Depósito lleno',t:'check',d:true},{k:'notas',l:'Notas',t:'area'}],
gastos:()=>[{k:'fecha',l:'Fecha',t:'date',r:1,d:today()},{k:'desc',l:'Descripción',r:1},{k:'importe',l:'Importe (€)',t:'number',r:1},{k:'categoria',l:'Categoría',t:'select',o:S.categorias},{k:'asociado',l:'Asociado',t:'select',o:aOpts()},{k:'notas',l:'Notas',t:'area'}]};
function edit(kind,id,dup){
 const list=S[kind],cur=id?list.find(x=>x.id===id):null,vals=cur?{...cur}:{};
 if(!FIELDS[kind]().find(f=>f.t==='select'&&!f.o.length)===false&&kind!=='contratos'){alert('Primero crea un contrato variable / un coche (asociado de tipo vehículo).');return}
 if(kind==='contratos')TMP.tar=JSON.parse(JSON.stringify(cur?.tarifas||[]));
 modal((cur&&!dup?'Editar':'Nuevo')+' registro',FIELDS[kind](),vals,o=>{
  if(kind==='repostajes'&&!o.ppl&&o.litros)o.ppl=o.importe/o.litros;
  if(kind==='contratos'&&esElec(o.tipoSuministro,o.asociado)){o.tarifas=TMP.tar.slice().sort((a,b)=>a.desde.localeCompare(b.desde));
   if(!o.tarifas.length)setTimeout(()=>alert('Aviso: este contrato eléctrico no tiene tarifas. Añade al menos una para poder calcular el importe teórico.'),50)}
  if(kind==='recibos'){const c=gc(o.contrato);
   if(isElecC(c)){if(o.conDatos){if(o.hasta<o.desde){alert('El periodo «hasta» no puede ser anterior a «desde».');return false}
     o.consumo=o.kwh1+o.kwh2+o.kwh3;o.unidad='kWh'}
    else{o.kwh1=o.kwh2=o.kwh3=null;o.consumo=null;o.unidad='kWh'}}
   else if(cur){['kwh1','kwh2','kwh3','conDatos'].forEach(k=>delete cur[k])}}
  if(cur&&!dup)Object.assign(cur,o);else list.push({id:uid(),...o,aviso:false});
  if(save())go();else return false})}
function del(kind,id){if(ask('¿Borrar este registro? No se puede deshacer.')){S[kind]=S[kind].filter(x=>x.id!==id);save();go()}}
/* ===== 6. PANTALLAS ===== */
const ui={tab:'inicio',sub:'',q:'',fa:'',fe:'activo',gv:'recibos',idf:'todas',idq:'',per:'ano',gf:{a:'',c:'',d1:'',d2:'',q:''},d1:ISO(new Date(new Date().getFullYear(),0,1)),d2:today(),comb:false,pf:{fix:1,var:1,gas:1,sue:1},iv:'res',ec:'',cf:'',cmpPot:{}};
const TABS=[['inicio','Inicio'],['contratos','Contratos'],['gastos','Gastos'],['informes','Informes'],['mas','Más']];
function go(t,s){if(t){ui.tab=t;ui.sub=s||''}
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#app').innerHTML=({inicio,contratos,gastos,informes,mas})[ui.tab]();scrollTo(0,0)}
function watchRow(c,i){return`<div class="card"><div class="row sp"><b><span class="dot ${i.sem}"></span>${esc(c.nombre)}</b><span class="m">${esc(an(c.asociado))}</span></div>
<div class="m">Límite de aviso: <b>${fd(i.lim)}</b> (${i.d<0?'vencido hace '+(-i.d):'en '+i.d} días) · Vence: ${fd(i.v)}${c.renovAuto?' · renov. automática':''}</div></div>`}
function inicio(){const act=S.contratos.filter(c=>c.estado==='activo'),m=act.reduce((s,c)=>s+eq(c),0);
 const w=act.filter(c=>!c.aviso).map(c=>[c,info(c)]).filter(x=>x[1]).sort((a,b)=>a[1].d-b[1].d);
 const old=!S.lastBackup||diff(today(),S.lastBackup)>S.ajustes.bak;
 return`<h1>Mis servicios</h1>${old&&(S.contratos.length||S.gastos.length)?'<div class="card warn">⚠️ La copia de seguridad es antigua o no existe. Ve a Más → Copia de seguridad.</div>':''}
<div class="card"><div class="m">Contratos fijos activos</div><b style="font-size:22px">${eur(m)}/mes</b> <span class="m">· ${eur(m*12)}/año</span></div>
<div class="row"><button onclick="edit('recibos')">+ Recibo</button><button onclick="edit('repostajes')">+ Repostaje</button><button onclick="edit('gastos')">+ Gasto suelto</button></div>
<h2>Qué vigilar</h2>${w.length?w.map(([c,i])=>watchRow(c,i)).join(''):'<div class="card m">Nada que vigilar. Añade contratos con fecha de vencimiento.</div>'}`}
function contratos(){const q=ui.q.toLowerCase();
 const l=S.contratos.filter(c=>(!q||(c.nombre+c.proveedor).toLowerCase().includes(q))&&(!ui.fa||c.asociado===ui.fa)&&(!ui.fe||c.estado===ui.fe));
 return`<h1>Contratos</h1><div class="row"><input placeholder="Buscar…" value="${esc(ui.q)}" oninput="ui.q=this.value;go();$('#app input').focus()">
<select onchange="ui.fa=this.value;go()"><option value="">Todos</option>${S.asociados.map(a=>`<option value="${a.id}"${ui.fa===a.id?' selected':''}>${esc(a.nombre)}</option>`).join('')}</select>
<select onchange="ui.fe=this.value;go()">${['','activo','en revisión','cancelado'].map(e=>`<option value="${e}"${ui.fe===e?' selected':''}>${e||'Cualquier estado'}</option>`).join('')}</select>
<button class="p" onclick="edit('contratos')">+ Nuevo</button></div>
${l.length?l.map(c=>{const i=c.estado==='activo'?info(c):null;return`<div class="card"><div class="row sp"><b>${i?`<span class="dot ${i.sem}"></span>`:''}${esc(c.nombre)}</b><span>${c.tipoImporte==='variable'?'variable':eur(c.importe)+' / '+c.periodicidad}</span></div>
<div class="m">${esc(c.proveedor)} · ${esc(c.categoria)} · ${esc(an(c.asociado))} · ${c.estado}${i?` · vence ${fd(i.v)} · límite ${fd(i.lim)}`:''}${c.aviso?' · aviso gestionado':''}</div>
${c.documento?`<div class="m">📄 ${esc(c.documento)}</div>`:''}
${isElecC(c)?`<div class="m">⚡ ${(c.tarifas||[]).length} tarifa(s)</div>`:''}
<div class="row" style="margin-top:6px"><button class="s" onclick="edit('contratos','${c.id}')">Editar</button><button class="s" onclick="edit('contratos','${c.id}',1)">Duplicar</button>
<button class="s" onclick="renew('${c.id}')">Renovado</button><button class="s" onclick="gest('${c.id}')">${c.aviso?'Quitar aviso':'Aviso gestionado'}</button>
<button class="s" onclick="cancel('${c.id}')">Cancelar</button><button class="s" onclick="icsOne('${c.id}')">📅</button><button class="s d" onclick="del('contratos','${c.id}')">Borrar</button></div></div>`}).join(''):'<div class="card m">No hay contratos con estos filtros.</div>'}`}
const gc=id=>S.contratos.find(c=>c.id===id);
function renew(id){const c=gc(id);if(!c.vence){alert('Indica primero la fecha de vencimiento.');return}c.vence=addM(vence(c)||c.vence,c.renMeses||12);c.aviso=false;save();go()}
function gest(id){const c=gc(id);c.aviso=!c.aviso;save();go()}
function cancel(id){if(ask('¿Cancelar el contrato? Se conserva el histórico.')){const c=gc(id);c.estado='cancelado';c.fechaCancel=today();save();go()}}
/* --- Gastos --- */
function gastos(){const g=ui.gv,tb=[['recibos','Recibos'],['repostajes','Gasolina'],['gastos','Sueltos']];
 const l=S[g].filter(r=>gfl(g,r)).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
 const txt={recibos:recTxt,repostajes:r=>`${esc(an(r.coche))} · ${NUM.format(r.litros)} L · ${NUM.format(r.ppl||0)} €/L${r.km?' · '+NUM.format(r.km)+' km':''}`,gastos:r=>`${esc(r.desc)} · ${esc(r.categoria)} · ${esc(an(r.asociado))}`};
 return`<h1>Gastos</h1><div class="tabs">${tb.map(([k,v])=>`<button class="${g===k?'on':''}" onclick="ui.gv='${k}';go()">${v}</button>`).join('')}</div>

/* ===== 6b. ELECTRICIDAD Y COMPARATIVA (v2.1) ===== */
/* CÁLCULO TEÓRICO (única función calcTeo, reutilizada por recibo y por plan):
   días = (hasta − desde) + 1
   potencia = (P1·precioP1 + P2·precioP2) · días
   energía = (kWh1·e1 + kWh2·e2 + kWh3·e3) · (1 − descuento/100)
   contador = alquilerMes · 12 / 365 · días
   impuesto eléctrico = % · (potencia + energía)
   IVA = % · (potencia + energía + impuesto + contador + otros)
   total = potencia + energía + impuesto + contador + otros + IVA
   Es una estimación: no incluye bono social, exceso de potencia ni servicios extra. */
const num=v=>typeof v==='number'&&isFinite(v);
const esElec=(t,a)=>t==='electricidad'&&A(a)?.tipo==='casa';
const isElecC=c=>!!c&&esElec(c.tipoSuministro,c.asociado);
const eleCasas=()=>[...new Set(S.contratos.filter(isElecC).map(c=>c.asociado))].map(A).filter(Boolean);
const sg=n=>(n>0?'+':'')+eur(n),sgp=n=>(n>0?'+':'')+NUM.format(n)+' %';
const N3=new Intl.NumberFormat('es-ES',{minimumFractionDigits:3,maximumFractionDigits:3}),N6=new Intl.NumberFormat('es-ES',{maximumFractionDigits:6});
function tarifaFor(c,hasta){const t=(c?.tarifas||[]).slice().sort((a,b)=>a.desde.localeCompare(b.desde));if(!t.length)return null;let r=t[0];for(const x of t)if(x.desde<=hasta)r=x;return r}
function calcTeo(t,k,dias,aj){const n=x=>+x||0,
 potencia=(n(t.pot1)*n(t.pp1)+n(t.pot2)*n(t.pp2))*dias,
 energia=(n(k[0])*n(t.e1)+n(k[1])*n(t.e2)+n(k[2])*n(t.e3))*(1-n(t.dto)/100),
 contador=n(t.alq)*12/365*dias,otros=n(t.otros),
 imp=n(aj.impElec)/100*(potencia+energia),
 iva=n(aj.iva)/100*(potencia+energia+imp+contador+otros),
 total=potencia+energia+imp+contador+otros+iva;
 return{dias,potencia,energia,contador,otros,imp,iva,total}}
/* estado: ok | pend (sin datos de consumo a propósito) | sin (sin desglose de franjas) | notar (sin tarifa) */
function recData(r){const c=gc(r.contrato);if(!isElecC(c))return null;
 if(r.conDatos===false)return{r,c,estado:'pend'};
 if(!(num(r.kwh1)&&num(r.kwh2)&&num(r.kwh3)&&r.desde&&r.hasta))return{r,c,estado:'sin'};
 const t=tarifaFor(c,r.hasta);if(!t)return{r,c,estado:'notar'};

  if(cur&&!dup)Object.assign(cur,o);else S.planes.push({id:uid(),...o});if(save())go();else return false})}

function planTog(id,v){const p=S.planes.find(x=>x.id===id);if(p){p.inc=!!v;save();go()}}
function planAll(v){S.planes.filter(p=>!ui.cf||p.compania===ui.cf).forEach(p=>p.inc=!!v);save();go()}
function planCard(p){const dd=diff(today(),p.fecha),old=dd>90,n=/^https?:\/\//.test(p.nota||'');
 return`<div class="card np"><div class="row sp"><label style="margin:0;color:var(--t)"><input type="checkbox" ${p.inc?'checked':''} onchange="planTog('${p.id}',this.checked)"> <b>${esc(p.compania)} · ${esc(p.plan)}</b></label><span class="m">${p.tipo==='indexado'?'indexado (precio medio estimado)':'fijo'}</span></div>
<div class="m">Energía ${N6.format(p.e1)} / ${N6.format(p.e2)} / ${N6.format(p.e3)} €/kWh · Potencia ${N6.format(p.pp1)} / ${N6.format(p.pp2)} €/kW·día · Contador ${N6.format(p.alq||0)} €/mes · Dto ${N6.format(p.dto||0)} % · Otros ${N6.format(p.otros||0)} €/mes</div>
<div class="m">${p.perm?'Permanencia: '+esc(p.perm)+' · ':''}Precios del ${fd(p.fecha)}${old?` <span style="color:var(--o)">⚠️ hace ${dd} días (más de 90)</span>`:''}</div>${p.nota?`<div class="m" style="white-space:pre-wrap">${n?`<a href="${esc(p.nota)}" target="_blank" rel="noopener">${esc(p.nota)}</a>`:esc(p.nota)}</div>`:''}
<div class="row" style="margin-top:6px"><button class="s" onclick="planEd('${p.id}')">Editar</button><button class="s" onclick="planEd('${p.id}',1)">Duplicar</button><button class="s d" onclick="planDel('${p.id}')">Borrar</button></div></div>`}
function planesHtml(){const cs=[...new Set(S.planes.map(p=>p.compania))].sort((a,b)=>String(a).localeCompare(String(b),'es'));if(ui.cf&&!cs.includes(ui.cf))ui.cf='';
 const l=S.planes.filter(p=>!ui.cf||p.compania===ui.cf);
 return`<h2 class="np">Planes de compañías</h2><div class="card np"><div class="row"><button class="p" onclick="planEd()">+ Plan</button><button onclick="planAll(1)">Marcar todas</button><button onclick="planAll(0)">Marcar ninguna</button><select onchange="ui.cf=this.value;go()"><option value="">Todas las compañías</option>${cs.map(c=>`<option value="${esc(c)}"${ui.cf===c?' selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="m">${S.planes.filter(p=>p.inc).length} de ${S.planes.length} planes incluidos en el informe.</div></div>${l.map(planCard).join('')||'<div class="card m np">Sin planes. Añade los precios publicados por cada compañía.</div>'}`}
/* ===== 7. COPIA DE SEGURIDAD ===== */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function exportJ(){S.lastBackup=today();save();dl(`mis_servicios_${today()}.json`,JSON.stringify({app:'mis_servicios',...S,exportado:new Date().toISOString()},null,1),'application/json');go('mas','bak')}
function importJ(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
 if(d&&d.app==='mis_servicios'&&typeof d.version==='number'&&d.version>SCHEMA){alert('Esta copia es de una versión más reciente de la app (esquema '+d.version+'). Actualiza la app para importarla.');return}
 if(d.app!=='mis_servicios'||typeof d.version!=='number'||d.version>SCHEMA||!['asociados','categorias','contratos','recibos','repostajes','gastos'].every(k=>Array.isArray(d[k]))||(d.version>=3&&!Array.isArray(d.planes)))throw 0;
 if(!ask('Importar SUSTITUYE todos los datos actuales. ¿Continuar?'))return;
 if(ask('¿Descargar antes una copia de los datos actuales?'))dl(`mis_servicios_antes_${today()}.json`,JSON.stringify({app:'mis_servicios',...S}),'application/json');
 delete d.app;S=migrate(d);if(save())go('mas','bak')}catch(e){alert('Archivo no válido: no es una copia de Mis servicios.')}};r.readAsText(f)}
/* ===== 8. CALENDARIO (.ics) ===== */
function icsBuild(cs){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mis servicios//ES','CALSCALE:GREGORIAN'],st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',t=s=>s.replace(/-/g,''),x=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 cs.forEach(c=>{const i=info(c);if(!i)return;[['Límite de aviso',i.lim],['Vencimiento',i.v]].forEach(([n,f])=>{L.push('BEGIN:VEVENT',`UID:${uid()}@mis-servicios`,`DTSTAMP:${st}`,`DTSTART;VALUE=DATE:${t(f)}`,`DTEND;VALUE=DATE:${t(addD(f,1))}`,`SUMMARY:${x(n+': '+c.nombre)}`);
 S.ajustes.rec.forEach(d=>L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${x(n+' '+c.nombre)}`,`TRIGGER:-P${d}D`,'END:VALARM'));L.push('END:VEVENT')})});
 L.push('END:VCALENDAR');return L.join('\r\n')+'\r\n'}
function icsAll(){const a=S.contratos.filter(c=>c.estado==='activo'&&c.vence);if(!a.length)return alert('No hay contratos activos con vencimiento.');dl('mis_servicios.ics',icsBuild(a),'text/calendar')}
function icsOne(id){const c=gc(id);if(!c.vence)return alert('El contrato no tiene fecha de vencimiento.');dl('contrato.ics',icsBuild([c]),'text/calendar')}
go();
</script></body></html>
