<style>

</style></head><body><main id="app"></main><nav id="nav"></nav><div id="mod"></div><div id="mod2"></div>
<script>
/* ===== 1. UTILIDADES ===== */
const APP_VERSION='2.4',SCHEMA=5,KEY='mis_servicios_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const EUR=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}),NUM=new Intl.NumberFormat('es-ES',{maximumFractionDigits:2});
const eur=n=>EUR.format(n||0),pad=n=>String(n).padStart(2,'0');
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const ISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const today=()=>ISO(new Date());
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ISO(d)};
const addM=(s,n)=>{const d=P(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return ISO(d)};
const diff=(a,b)=>Math.round((P(a)-P(b))/864e5);
const MESES={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12};
/* ===== 2. DATOS Y ALMACENAMIENTO ===== */
const CONC_SEED=[['IBI','Impuestos y tasas'],['Tasa de basuras','Impuestos y tasas'],['Plusvalía','Impuestos y tasas'],['Vado','Impuestos y tasas'],['Comunidad','Comunidad de vecinos'],['Derrama','Comunidad de vecinos'],['IRPF','Impuestos y tasas'],['Impuesto de circulación','Impuestos y tasas'],['ITV','Vehículo'],['Multa','Vehículo'],['Peaje/Parking','Vehículo'],['Taller','Vehículo'],['Reparación hogar','Mantenimiento hogar'],['Comisión bancaria','Banca y comisiones']];
function buildConc(d){const L=[],seen=new Set(),add=(n,cat)=>{n=String(n||'').trim();const k=n.toLowerCase();if(!n||seen.has(k))return;seen.add(k);L.push({id:uid(),n,cat:cat||''})};
 CONC_SEED.forEach(([n,c])=>add(n,c));const cnt={};
 (d.gastos||[]).forEach(g=>{const n=String(g.concepto||'').trim();if(!n)return;const o=cnt[n.toLowerCase()]=cnt[n.toLowerCase()]||{n,c:{}};o.c[g.categoria]=(o.c[g.categoria]||0)+1});
 Object.values(cnt).forEach(o=>{const b=Object.entries(o.c).sort((a,b)=>b[1]-a[1])[0];add(o.n,b?b[0]:'')});
 (d.gastos||[]).forEach(g=>{const n=String(g.concepto||'').trim();if(n){const c=L.find(x=>x.n.toLowerCase()===n.toLowerCase());if(c)g.concepto=c.n}});return L}
function def(){return{conceptos:CONC_SEED.map(([n,cat])=>({id:uid(),n,cat})),cambios:0,version:SCHEMA,asociados:[['Casa 1','casa'],['Casa 2','casa'],['Coche 1','vehiculo'],['Coche 2','vehiculo'],['General','general']].map(([n,t])=>({id:uid(),nombre:n,tipo:t,archivado:false})),
categorias:['Suministros','Telecomunicaciones','Seguros','Suscripciones','Impuestos y tasas','Vehículo','Mantenimiento hogar','Otros','Gimnasio','Comunidad de vecinos','Banca y comisiones'],
contratos:[],recibos:[],repostajes:[],gastos:[],planes:[],ideas:[],ajustes:defAj(),lastBackup:null}}
const IDEAS_21=['Previsión de pagos de los próximos 12 meses','Exportar informes a CSV','Optimizar la potencia contratada','Tarifas PVPC con datos horarios','Comparativas de gas y agua','Excedentes solares y bono social'];
const IDEAS_22=['Aviso de consumo de agua anómalo (posibles fugas) frente a la media','Consumo de agua por mes natural estimado (reparto diario de cada factura)','Comparar el consumo de agua con el mismo periodo del año anterior','Facturas de agua con cuota fija y tramos para detectar subidas de tarifa'];
const IDEAS_23=['Pagos periódicos sin contrato (IBI, IRPF, ITV): repetir cada año y avisar en Inicio','Filtro por contrato y por concepto también en Informes → Resumen','Gráfico de evolución anual por concepto (IBI de cada inmueble, comunidad…)'];
const IDEAS_24=['Avisar de contratos periódicos sin factura apuntada en su último periodo (pendientes de apuntar)','Mostrar el fin de permanencia en «Qué vigilar»'];
const defAj=()=>({rojo:15,naranja:60,rec:[30,7],bak:14,bakN:15,catGas:'Vehículo',impElec:5.11269632,iva:21,umbral:5});
/* Migración automática. Antes de migrar se guarda (si no existe) una copia del JSON original en mis_servicios_prev_v<esquema anterior>. */
function migrate(d){const v0=d.version=d.version||1;
 if(v0<SCHEMA){try{const k='mis_servicios_prev_v'+v0;if(!localStorage.getItem(k))localStorage.setItem(k,JSON.stringify(d))}catch(e){}}
 d.ajustes=Object.assign(defAj(),d.ajustes);
 if(v0<3){d.ideas=Array.isArray(d.ideas)?d.ideas:[];const ya=new Set(d.ideas.map(i=>String(i&&i.texto||'').trim().toLowerCase()));
  IDEAS_21.forEach(t=>{if(!ya.has(t.toLowerCase())){d.ideas.push({id:uid(),texto:t,creada:today(),estado:'pendiente'});ya.add(t.toLowerCase())}})}
 if(!d.seed22){d.ideas=Array.isArray(d.ideas)?d.ideas:[];const ya=new Set(d.ideas.map(i=>String(i&&i.texto||'').trim().toLowerCase()));
  IDEAS_22.forEach(t=>{if(!ya.has(t.toLowerCase())){d.ideas.push({id:uid(),texto:t,creada:today(),estado:'pendiente'});ya.add(t.toLowerCase())}});d.seed22=1}
 if(!d.seed23){d.ideas=Array.isArray(d.ideas)?d.ideas:[];const ya=new Set(d.ideas.map(i=>String(i.texto||'').toLowerCase()));IDEAS_23.forEach(t=>{if(!ya.has(t.toLowerCase())){d.ideas.push({id:uid(),texto:t,creada:today(),estado:'pendiente'});ya.add(t.toLowerCase())}});d.seed23=1}
 if(!d.seed24){d.ideas=Array.isArray(d.ideas)?d.ideas:[];const ya=new Set(d.ideas.map(i=>String(i&&i.texto||'').toLowerCase()));IDEAS_24.forEach(t=>{if(!ya.has(t.toLowerCase()))d.ideas.push({id:uid(),texto:t,creada:today(),estado:'pendiente'})});d.seed24=1}
 if(v0<5){if(d.ajustes.bak===30)d.ajustes.bak=14;(d.contratos||[]).forEach(c=>{delete c.contarPor;if(c.tipoSuministro==='internet'||c.tipoSuministro==='otro')c.tipoSuministro='ninguno'});
  if(Array.isArray(d.categorias)&&!d.categorias.some(c=>String(c).toLowerCase()==='banca y comisiones'))d.categorias.push('Banca y comisiones')}
 if(!Array.isArray(d.conceptos)||!d.conceptos.length)d.conceptos=buildConc(d);
 d.version=SCHEMA;return Object.assign(def(),d)}
function load(){try{const r=localStorage.getItem(KEY);return r?migrate(JSON.parse(r)):def()}catch(e){return def()}}
let S=load();
function save(nc){if(!nc)S.cambios=(S.cambios||0)+1;try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){alert('⚠️ No se pudo guardar: el almacenamiento está lleno o bloqueado. Exporta una copia de seguridad y libera espacio.');return false}}
const A=id=>S.asociados.find(a=>a.id===id),an=id=>A(id)?.nombre||'—';
const aOpts=(cur,tipo)=>S.asociados.filter(a=>(!a.archivado||a.id===cur)&&(!tipo||a.tipo===tipo)).map(a=>[a.id,a.nombre]);
/* ===== 3. LÓGICA DE CONTRATOS ===== */
const eq=c=>c.tipoImporte==='variable'?0:(c.importe||0)/(MESES[c.periodicidad]||1);
function vence(c){if(!c.vence)return null;let v=c.vence;if(c.renovAuto)while(v<today())v=addM(v,c.renMeses||12);return v}
function info(c){const v=vence(c);if(!v)return null;const lim=addD(v,-(c.preaviso||0)),d=diff(lim,today()),a=S.ajustes;return{v,lim,d,sem:d<a.rojo?'R':d<a.naranja?'O':'G'}}
/* ===== 4. FORMULARIOS GENÉRICOS ===== */
function modal(title,fields,vals,ok,host){
 /* Campos opcionales: vis(valoresActuales)->bool para mostrar/ocultar; r puede ser función; t:'html' con h() para bloques propios. host '#mod2' = capa superior. */
 const H=host||'#mod',pre=host?'g_':'f_',dk={},prev={},oh=(L,v)=>L.map(o=>{if(o&&o.g)return`<optgroup label="${esc(o.g)}">${oh(o.o,v)}</optgroup>`;const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`}).join('');
 let cs=null;fields.forEach(f=>{if(f.t==='sec'){cs=pre+f.k;COL[cs]=f.open===false}else f.sc=cs});
 const h=fields.map(f=>{const v=vals[f.k]??f.d??'';let i;if(f.t==='sec')return`<div class="sec" id="L_${pre}${f.k}" onclick="secT('${pre}${f.k}','${H}')"></div>`;
  if(f.t==='html')return`<div id="L_${pre}${f.k}">${f.h()}</div>`;
  if(f.t==='select'){const L=f.oo?f.oo(vals):f.o;dk[f.k]=JSON.stringify(L);i=`<select id="${pre}${f.k}">${oh(L,v)}</select>`}
  else if(f.t==='check')i=`<input type="checkbox" id="${pre}${f.k}"${v?' checked':''}>`;
  else if(f.t==='area')i=`<textarea id="${pre}${f.k}" rows="4">${esc(v)}</textarea>`;
  else i=`<input id="${pre}${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="any"':''} ${f.dl?`list="dl_${pre}${f.k}" autocomplete="off"`:''} value="${esc(v)}">${f.dl?`<datalist id="dl_${pre}${f.k}">${f.dl().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
  return`<label id="L_${pre}${f.k}">${f.l}<span class="rq"></span>${i}</label>`}).join('');
 $(H).innerHTML=`<div class="ov"><div class="card"><h2>${title}</h2>${h}<div class="row sp"><button onclick="$('${H}').innerHTML=''">Cancelar</button><button class="p" id="${pre}ok">Guardar</button></div></div></div>`;
 const rd=()=>{const o={};for(const f of fields){if(f.t==='html'||f.t==='sec')continue;const e=$('#'+pre+f.k);o[f.k]=f.t==='check'?e.checked:e.value}return o};
 const reqOf=(f,c)=>typeof f.r==='function'?f.r(c):f.r;
 const ref=()=>{let c=rd();
  for(const f of fields){if(!f.oo)continue;const el=$('#'+pre+f.k),L=f.oo(c),k=JSON.stringify(L);if(dk[f.k]!==k){dk[f.k]=k;el.innerHTML=oh(L,el.value)}}
  c=rd();
  for(const f of fields){if(!f.chg)continue;const v=c[f.k];if(prev[f.k]!==undefined&&prev[f.k]!==v)f.chg(c,(k2,x)=>{const e=$('#'+pre+k2);if(e)e.value=x});prev[f.k]=v}
  c=rd();for(const f of fields){const w=$('#L_'+pre+f.k);if(f.t==='sec'){w.textContent=(COL[pre+f.k]?'▸ ':'▾ ')+f.l;continue}const vis=(!f.vis||f.vis(c))&&!(f.sc&&COL[f.sc]);w.style.display=vis?'':'none';const q=w.querySelector('.rq');if(q)q.textContent=vis&&reqOf(f,c)?' *':''}};
 $(H).oninput=ref;$(H).onchange=ref;
 $('#'+pre+'ok').onclick=()=>{const c=rd(),o={};for(const f of fields){if(f.t==='html'||f.t==='sec')continue;if(f.vis&&!f.vis(c))continue;
  const e=$('#'+pre+f.k);let v=f.t==='check'?e.checked:e.value.trim();

const COL={};function secT(id,H){COL[id]=!COL[id];$(H).dispatchEvent(new Event('change'))}
const closeM=()=>{$('#mod').innerHTML=''};
const ask=m=>confirm(m);
/* ===== 5. CRUD GENÉRICO ===== */
const meses=['mensual','bimestral','trimestral','semestral','anual'];
const SERV=[['ninguno','Ninguno'],['electricidad','Electricidad'],['agua','Agua'],['gas','Gas'],['movil','Móvil']];
const perU=p=>({mensual:'mes',bimestral:'bimestre',trimestral:'trimestre',semestral:'semestre',anual:'año'})[p]||'mes';
const unitFor=c=>({electricidad:'kWh',agua:'m³',gas:'kWh'})[c?.tipoSuministro]||null;
const contrList=c=>S.contratos.filter(x=>(!c.fa||x.asociado===c.fa)&&(!c.fs||(x.tipoSuministro||'ninguno')===c.fs)).sort((a,b)=>(a.estado==='cancelado')-(b.estado==='cancelado')||String(a.nombre).localeCompare(String(b.nombre),'es'));
const FIELDS={
contratos:()=>[{k:'s1',t:'sec',l:'Datos básicos'},{k:'nombre',l:'Nombre',r:1},{k:'proveedor',l:'Proveedor'},{k:'asociado',l:'Asociado',t:'select',o:aOpts()},{k:'categoria',l:'Categoría',t:'select',o:S.categorias},
{k:'tipoSuministro',l:'Tipo de servicio (solo si necesita funciones propias: consumo de luz, agua o gas, o línea móvil; si no, Ninguno)',t:'select',o:SERV,chg:(c,set)=>{const m={electricidad:'Suministros',agua:'Suministros',gas:'Suministros',movil:'Telecomunicaciones'}[c.tipoSuministro];if(m&&S.categorias.includes(m))set('categoria',m)}},
{k:'avElec',t:'html',h:()=>`<div class="card warn m">⚠️ Para usar tarifas y consumos de electricidad, el asociado debe ser de tipo casa.</div>`,vis:c=>c.tipoSuministro==='electricidad'&&!esElec(c.tipoSuministro,c.asociado)},
{k:'linea',l:'Móvil: nº de línea',vis:c=>c.tipoSuministro==='movil'},{k:'usuaria',l:'Móvil: persona usuaria',vis:c=>c.tipoSuministro==='movil'},
{k:'tar',t:'html',h:tarBlock,vis:c=>esElec(c.tipoSuministro,c.asociado)},
{k:'tipoImporte',l:'Importe: fijo (suele ser siempre el mismo; se propone al apuntar) o variable',t:'select',o:['fijo','variable']},{k:'importe',l:'Importe / precio actual (€) · para registrar una subida usa el botón «Precios»',t:'number'},{k:'periodicidad',l:'Periodicidad',t:'select',o:meses,d:'mensual'},{k:'estado',l:'Estado',t:'select',o:['activo','en revisión','cancelado']},
{k:'s2',t:'sec',l:'Vigencia y avisos'},{k:'inicio',l:'Fecha de inicio',t:'date'},{k:'vence',l:'Vencimiento / renovación',t:'date'},{k:'renovAuto',l:'Renovación automática',t:'check'},{k:'renMeses',l:'Periodo de renovación (meses)',t:'number',d:12},{k:'preaviso',l:'Preaviso (días)',t:'number',d:30},{k:'finPerm',l:'Fin de permanencia',t:'date'},
{k:'s3',t:'sec',l:'Otros datos',open:false},{k:'pago',l:'Forma de pago'},{k:'nContrato',l:'Nº contrato / póliza'},{k:'telefono',l:'Teléfono de atención'},{k:'documento',l:'Dónde está el documento'},{k:'notas',l:'Notas',t:'area'}],
recibos:()=>{const E=c=>isElecC(gc(c.contrato)),EC=c=>E(c)&&c.conDatos,NE=c=>!E(c),TS=c=>gc(c.contrato)?.tipoSuministro,PER=c=>EC(c)||TS(c)==='agua'||TS(c)==='gas',CON=c=>TS(c)==='agua',CS=c=>NE(c)&&(TS(c)==='agua'||TS(c)==='gas');return[
{k:'contrato',l:'Contrato',t:'select',oo:c=>{const l=contrList(c);if(!l.length)return[['','— Aún no hay contratos —']];const g={};l.forEach(x=>(g[an(x.asociado)]=g[an(x.asociado)]||[]).push([x.id,x.nombre+(x.estado==='cancelado'?' (cancelado)':'')]));return Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0],'es')).map(([k,v])=>({g:k,o:v}))},chg:(c,set)=>{const k=gc(c.contrato),u=unitFor(k);if(u)set('unidad',u);const np=k&&k.tipoImporte!=='variable'&&num(k.importe)?k.importe:null;if(c.importe===''||String(c.importe)===String(TMP.pref))set('importe',np==null?'':np);TMP.pref=np;const e=$('#rinfo');if(e)e.innerHTML=recInfo(c.contrato)},r:1},{k:'rinfo',t:'html',h:()=>`<div class="m" id="rinfo" style="margin:-2px 0 8px">${recInfo(TMP.rc)}</div>`},

calc:()=>{const a=S.ajustes;return`${back}<h1>Cómo se calcula</h1><div class="card"><p>Estimación del importe de un recibo eléctrico con tarifa 2.0TD (energía en 3 franjas: P1 punta, P2 llano, P3 valle; potencia en 2: P1 punta, P2 valle). Se usa la tarifa del contrato vigente en la fecha «hasta» del recibo.</p><ol>
<li><b>días</b> = (hasta − desde) + 1</li><li><b>potencia</b> = (P1 · precio P1 + P2 · precio P2) · días</li><li><b>energía</b> = (kWh1 · e1 + kWh2 · e2 + kWh3 · e3) · (1 − descuento / 100)</li><li><b>contador</b> = alquiler mensual · 12 / 365 · días</li>
<li><b>impuesto eléctrico</b> = ${NUM.format(a.impElec)} % · (potencia + energía)</li><li><b>IVA</b> = ${NUM.format(a.iva)} % · (potencia + energía + impuesto + contador + otros)</li><li><b>total</b> = potencia + energía + impuesto + contador + otros + IVA</li></ol>
<p class="m">«Otros» es el importe mensual antes de impuestos que se suma a cada recibo. Los porcentajes se cambian en Más → Ajustes. El umbral de desviación (${NUM.format(a.umbral)} %) marca en naranja los recibos cuyo importe real difiere del teórico.</p>
<p class="warn card">⚠️ Es una estimación orientativa: no incluye bono social, exceso de potencia ni servicios extra. Los recibos sin desglose de franjas o marcados como pendientes de consumo quedan fuera del cálculo teórico y de la comparativa.</p></div>
<h2>Agua y gas</h2><div class="card"><p>Cada factura cubre un periodo (desde–hasta). Por factura: <b>consumo/mes</b> = consumo ÷ días · 30,4375 y <b>€/mes</b> = importe ÷ días · 30,4375. Para el intervalo elegido, cada factura se <b>prorratea por días</b> (si solo una parte del periodo cae dentro del intervalo, cuenta esa parte) y las medias mensuales se calculan solo sobre los días cubiertos por facturas. Si hay varios contratos (por ejemplo dos casas), se suman sus medias mensuales.</p><p class="m">Las facturas sin periodo o sin consumo no entran en las medias (se avisa y se pueden editar desde la tabla).</p></div>`},

 return`${back}<h1>Ayuda: tipos de gasto</h1><div class="card"><p><b>Los informes suman solo lo que tú apuntas.</b> Ningún contrato genera cargos ni estimaciones por sí solo.</p><p><b>Regla rápida:</b> si se contrata con un proveedor y quiero vigilar vencimiento o precio, es un <b>contrato</b>. Si es una obligación o un pago puntual, es un <b>gasto suelto</b>. La gasolina va como <b>repostaje</b>.</p></div>

 sOk=!f.s||(rc?(c?.tipoSuministro||'ninguno')===f.s:ui.gv!=='todos'),kOk=!f.k||(rc?r.contrato===f.k:ui.gv!=='todos');
 return(!f.a||aso===f.a)&&(!f.c||cat===f.c)&&sOk&&kOk&&(!f.d1||r.fecha>=f.d1)&&(!f.d2||r.fecha<=f.d2)&&(!f.q||[r.desc,r.concepto,r.notas,c?.nombre,an(aso)].join(' ').toLowerCase().includes(f.q.toLowerCase()))}
function setP(k){const t=new Date(),y=t.getFullYear(),m=t.getMonth(),F=(a,b)=>{ui.d1=ISO(a);ui.d2=ISO(b)};ui.per=k;
 if(k==='mes')F(new Date(y,m,1),new Date(y,m+1,0));else if(k==='mesant')F(new Date(y,m-1,1),new Date(y,m,0));else if(k==='tri'){const q=Math.floor(m/3)*3;F(new Date(y,q,1),new Date(y,q+3,0))}
 else if(k==='ano')F(new Date(y,0,1),new Date(y,11,31));else if(k==='anoant')F(new Date(y-1,0,1),new Date(y-1,11,31));else{ui.d1=addD(addM(today(),-12),1);ui.d2=today()}go()}

/* ===== 6b. ELECTRICIDAD Y COMPARATIVA (v2.1) ===== */
/* CÁLCULO TEÓRICO (única función calcTeo, reutilizada por recibo y por plan):
   días = (hasta − desde) + 1
   potencia = (P1·precioP1 + P2·precioP2) · días
   energía = (kWh1·e1 + kWh2·e2 + kWh3·e3) · (1 − descuento/100)
   contador = alquilerMes · 12 / 365 · días
   impuesto eléctrico = % · (potencia + energía)
   IVA = % · (potencia + energía + impuesto + contador + otros)
   total = potencia + energía + impuesto + contador + otros + IVA
   Es una estimación: no incluye bono social, exceso de potencia ni servicios extra. */
const num=v=>typeof v==='number'&&isFinite(v);
const esElec=(t,a)=>t==='electricidad'&&A(a)?.tipo==='casa';
const isElecC=c=>!!c&&esElec(c.tipoSuministro,c.asociado);
const eleCasas=()=>[...new Set(S.contratos.filter(isElecC).map(c=>c.asociado))].map(A).filter(Boolean);
const sg=n=>(n>0?'+':'')+eur(n),sgp=n=>(n>0?'+':'')+NUM.format(n)+' %';
const N3=new Intl.NumberFormat('es-ES',{minimumFractionDigits:3,maximumFractionDigits:3}),N6=new Intl.NumberFormat('es-ES',{maximumFractionDigits:6});
function tarifaFor(c,hasta){const t=(c?.tarifas||[]).slice().sort((a,b)=>a.desde.localeCompare(b.desde));if(!t.length)return null;let r=t[0];for(const x of t)if(x.desde<=hasta)r=x;return r}
function calcTeo(t,k,dias,aj){const n=x=>+x||0,
 potencia=(n(t.pot1)*n(t.pp1)+n(t.pot2)*n(t.pp2))*dias,
 energia=(n(k[0])*n(t.e1)+n(k[1])*n(t.e2)+n(k[2])*n(t.e3))*(1-n(t.dto)/100),
 contador=n(t.alq)*12/365*dias,otros=n(t.otros),
 imp=n(aj.impElec)/100*(potencia+energia),
 iva=n(aj.iva)/100*(potencia+energia+imp+contador+otros),
 total=potencia+energia+imp+contador+otros+iva;
 return{dias,potencia,energia,contador,otros,imp,iva,total}}
/* estado: ok | pend (sin datos de consumo a propósito) | sin (sin desglose de franjas) | notar (sin tarifa) */
function recData(r){const c=gc(r.contrato);if(!isElecC(c))return null;
 if(r.conDatos===false)return{r,c,estado:'pend'};
 if(!(num(r.kwh1)&&num(r.kwh2)&&num(r.kwh3)&&r.desde&&r.hasta))return{r,c,estado:'sin'};
 const t=tarifaFor(c,r.hasta);if(!t)return{r,c,estado:'notar'};
 const dias=diff(r.hasta,r.desde)+1,kwh=[r.kwh1,r.kwh2,r.kwh3],teo=calcTeo(t,kwh,dias,S.ajustes),dev=r.importe-teo.total;
 return{r,c,t,estado:'ok',kwh,dias,teo,real:r.importe,dev,devp:teo.total?dev/teo.total*100:0}}
const rKey=x=>x.estado==='pend'?x.r.fecha:(x.r.hasta||x.r.fecha);
function elecRecs(casa,d1,d2){return S.recibos.map(recData).filter(x=>x&&(!casa||x.c.asociado===casa)&&rKey(x)>=d1&&rKey(x)<=d2).sort((a,b)=>rKey(a).localeCompare(rKey(b)))}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function exportJ(){S.lastBackup=today();S.cambios=0;save(true);dl(`mis_servicios_${today()}.json`,JSON.stringify({app:'mis_servicios',...S,exportado:new Date().toISOString()},null,1),'application/json');go()}
function importJ(f){if(!f)return;const mode=(document.querySelector('input[name=impm]:checked')||{}).value||'reemplazar',r=new FileReader();
 r.onerror=()=>alert('No se pudo leer el archivo.');
 r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){alert('Archivo no válido: no es un JSON.');return}
  if(!d||d.app!=='mis_servicios'||typeof d.version!=='number'){alert('Archivo no válido: no es una copia de Mis servicios.');return}
  if(d.version>SCHEMA){alert('Esta copia es de una versión más reciente de la app (esquema '+d.version+'). Actualiza la app para importarla.');return}
  if(!['asociados','categorias','contratos','recibos','repostajes','gastos'].every(k=>Array.isArray(d[k]))||(d.version>=3&&!Array.isArray(d.planes))){alert('Archivo no válido: faltan datos.');return}
  if(mode==='fusion'){mergeJ(d);return}
  if(!ask('Importar SUSTITUYE todos los datos actuales por los del archivo. ¿Continuar?'))return;
  if(ask('¿Descargar antes una copia de los datos actuales?'))dl('mis_servicios_antes_de_importar_'+today()+'.json',JSON.stringify({app:'mis_servicios',...S}),'application/json');
  try{delete d.app;S=migrate(d);if(save())go('mas','bak')}catch(e){alert('No se pudo importar: '+e.message)}};
 r.readAsText(f)}
function mergeJ(d){const cols=[['asociados','asociados'],['conceptos','conceptos'],['contratos','contratos'],['recibos','facturas'],['repostajes','repostajes'],['gastos','gastos sueltos'],['planes','planes'],['ideas','ideas']],add={};
 cols.forEach(([k])=>{const ya=new Set((S[k]||[]).map(x=>x.id));add[k]=(Array.isArray(d[k])?d[k]:[]).filter(x=>x&&x.id&&!ya.has(x.id))});
 const cats=d.categorias.filter(c=>c&&!S.categorias.some(x=>String(x).toLowerCase()===String(c).toLowerCase())),
 res=cols.filter(([k])=>add[k].length).map(([k,n])=>add[k].length+' '+n).concat(cats.length?[cats.length+' categorías']:[]).join(', ');
 if(!res){alert('No hay nada nuevo que añadir: todo lo del archivo ya está en tu app.');return}
 if(!ask('Se añadirán: '+res+'.\nNo se borra ni se modifica nada de lo que ya tienes. ¿Continuar?'))return;
 cols.forEach(([k])=>{S[k]=(S[k]||[]).concat(add[k])});S.categorias=S.categorias.concat(cats);
 if(save()){alert('Importado: '+res+'.');go('mas','imp')}}
/* ===== PRECIOS (v2.4) ===== */
const prSort=c=>(c.precios||[]).slice().sort((a,b)=>String(a.desde||'').localeCompare(String(b.desde||''))),pct=(a,b)=>a?(b-a)/a*100:0;
function priceLine(c){const p=prSort(c);if(p.length<2)return'';const l=p[p.length-1],q=p[p.length-2];return`<div class="m">📈 Último cambio de precio (${fd(l.desde)}): ${eur(q.importe)} → ${eur(l.importe)} (${sgp(pct(q.importe,l.importe))})</div>`}
function verPrecios(id){const c=gc(id),p=prSort(c),t=isElecC(c)?(c.tarifas||[]).slice().sort((a,b)=>a.desde.localeCompare(b.desde)):[];
 $('#mod').innerHTML=`<div class="ov"><div class="card"><h2>Precios · ${esc(c.nombre)}</h2><p class="m">Histórico informativo: no modifica ningún gasto apuntado.</p>${p.length?`<table>${p.map((x,i)=>`<tr><td>${x.desde?fd(x.desde):'inicio'}</td><td class="n">${NUM.format(x.importe)} ${esc(x.unidad||'€')}</td><td class="n m">${i?sgp(pct(p[i-1].importe,x.importe)):''}</td><td class="n"><button class="s" onclick="subida('${id}','${x.id}')">✎</button><button class="s d" onclick="preDel('${id}','${x.id}')">✕</button></td></tr>${x.nota?`<tr><td colspan="4" class="m">${esc(x.nota)}</td></tr>`:''}`).join('')}</table>`:'<div class="m">Aún no hay precios registrados.</div>'}
${t.length?`<h2>Tarifas de electricidad (solo lectura; se editan en el contrato)</h2>${t.map(x=>`<div class="m"><b>Desde ${fd(x.desde)}</b> · ${tarTxt(x)}</div>`).join('')}`:''}
<div class="row sp" style="margin-top:10px"><button onclick="closeM()">Cerrar</button><button class="p" onclick="subida('${id}')">Registrar cambio de precio</button></div></div></div>`}
function subida(id,eid){const c=gc(id),fijo=c.tipoImporte!=='variable',cur=eid?(c.precios||[]).find(x=>x.id===eid):null,p=prSort(c),last=p[p.length-1],U=perU(c.periodicidad),
 base=cur||{desde:today(),importe:fijo?c.importe:last?.importe,unidad:last?.unidad||(fijo?'€/'+U:'')};
 modal(cur?'Editar precio':'Registrar cambio de precio',[{k:'desde',l:'Vigente desde',t:'date',r:1},{k:'importe',l:'Importe / precio',t:'number',r:1},{k:'unidad',l:'Unidad (ej. €/mes, €/kWh)'},{k:'nota',l:'Nota (motivo, oferta…)'}],base,o=>{
  c.precios=c.precios||[];if(cur)Object.assign(cur,o);else{if(!c.precios.length&&fijo&&num(c.importe))c.precios.push({id:uid(),desde:c.inicio||'',importe:c.importe,unidad:o.unidad||'€/'+U,nota:'Precio anterior'});c.precios.push({id:uid(),...o})}
  const s=prSort(c),u=s[s.length-1];if(fijo&&u&&num(u.importe))c.importe=u.importe;save();go();verPrecios(id)},'#mod2')}
function preDel(id,eid){if(!ask('¿Borrar este precio del histórico?'))return;const c=gc(id);c.precios=(c.precios||[]).filter(x=>x.id!==eid);const s=prSort(c),u=s[s.length-1];if(c.tipoImporte!=='variable'&&u&&num(u.importe))c.importe=u.importe;save();go();verPrecios(id)}
function infPre(){const L=S.contratos.map(c=>({c,p:prSort(c)})).filter(x=>x.p.length>=2).map(x=>{const a=x.p[0],b=x.p[x.p.length-1];return{c:x.c,a,b,n:x.p.length-1,pc:pct(a.importe,b.importe)}}).sort((x,y)=>y.pc-x.pc);
 return`<div class="card m">Vista informativa: no afecta a ningún total ni a los gastos apuntados.</div>${L.length?`<div class="card" style="overflow-x:auto;font-size:13px"><table><tr><th>Contrato</th><th class="n">Inicial</th><th class="n">Actual</th><th class="n">Variación</th><th class="n">Cambios</th></tr>${L.map(x=>`<tr><td>${esc(x.c.nombre)}<br><span class="m">${esc(an(x.c.asociado))} · último: ${fd(x.b.desde)}</span></td><td class="n">${NUM.format(x.a.importe)}</td><td class="n">${NUM.format(x.b.importe)}</td><td class="n">${sgp(x.pc)}</td><td class="n">${x.n}</td></tr>`).join('')}</table></div>`:'<div class="card m">Aún no hay contratos con al menos dos precios. Usa «Precios» en la ficha de un contrato.</div>'}<div class="card m">Los contratos de electricidad guardan su histórico en sus tarifas (visibles en «Precios», solo lectura).</div>`}
/* ===== 8. CALENDARIO (.ics) ===== */
function icsBuild(cs){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mis servicios//ES','CALSCALE:GREGORIAN'],st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',t=s=>s.replace(/-/g,''),x=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 cs.forEach(c=>{const i=info(c);if(!i)return;[['Límite de aviso',i.lim],['Vencimiento',i.v]].forEach(([n,f])=>{L.push('BEGIN:VEVENT',`UID:${uid()}@mis-servicios`,`DTSTAMP:${st}`,`DTSTART;VALUE=DATE:${t(f)}`,`DTEND;VALUE=DATE:${t(addD(f,1))}`,`SUMMARY:${x(n+': '+c.nombre)}`);
 S.ajustes.rec.forEach(d=>L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${x(n+' '+c.nombre)}`,`TRIGGER:-P${d}D`,'END:VALARM'));L.push('END:VEVENT')})});
 L.push('END:VCALENDAR');return L.join('\r\n')+'\r\n'}
function icsAll(){const a=S.contratos.filter(c=>c.estado==='activo'&&c.vence);if(!a.length)return alert('No hay contratos activos con vencimiento.');dl('mis_servicios.ics',icsBuild(a),'text/calendar')}
function icsOne(id){const c=gc(id);if(!c.vence)return alert('El contrato no tiene fecha de vencimiento.');dl('contrato.ics',icsBuild([c]),'text/calendar')}
go();setTimeout(bakPrompt,400);
</script></body></html>
