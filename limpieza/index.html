<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171d">
<title>Tareas del hogar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tareas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#15171d;--panel:#1e2128;--line:#32363f;--amber:#ffb224;--ok:#6fd68e;--bad:#ff5a4d;--tx:#f4f2ec;--dim:#9a9ca6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px 0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;flex:none;font-weight:700;color:var(--amber)}
header small{color:var(--dim);font-weight:400}
main{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
h3{font-size:.95rem;margin:12px 0 5px}
.d{font-size:.82rem;color:var(--dim);line-height:1.4;margin:4px 0}
select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:16px;padding:0 10px;height:40px;max-width:100%}
textarea{width:100%;height:70px;padding:8px;margin:6px 0}
input[type=number]{width:70px;text-align:center}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--amber)}
.btn,.chip{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:.95rem;display:inline-flex;align-items:center}
.chip.sel{background:var(--amber);color:#111;border-color:var(--amber);font-weight:700}
.row{display:flex;align-items:center;gap:8px;min-height:44px;flex-wrap:wrap;font-size:.92rem}
.r{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px;margin-bottom:5px}
.rn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.rn b{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn span{font-size:.78rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bad{color:var(--bad)}.am{color:var(--amber)}
.tag{font-style:normal;font-size:.7rem;color:#8fb4ff;border:1px solid #8fb4ff66;border-radius:6px;padding:0 5px;margin-right:2px}
.chip.cat{border-color:#8fb4ff66;color:#8fb4ff;border-radius:8px;min-height:34px;font-size:.88rem}
.chip.cat.sel{background:#8fb4ff;color:#111;border-color:#8fb4ff}
.sc>input{display:block;width:100%;margin:0 0 6px}.sc .row{margin:2px 0}.sc select,.sc input{min-width:0}
.ck{width:38px;height:38px;border-radius:50%;border:2px solid var(--ok);background:none;color:var(--ok);font-size:1.1rem;font-weight:800;flex:none}
.ck.u{border-color:var(--dim);color:var(--dim)}
.r.dn{opacity:.55}.r.dn b{text-decoration:line-through}
.idea{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.idea textarea{height:auto;min-height:56px;overflow:hidden;resize:none;margin:0}
.idea.dn textarea{text-decoration:line-through;opacity:.6}
footer{flex:none;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
nav{display:flex}nav button{flex:1;height:46px;background:none;border:0;border-top:3px solid transparent;color:var(--dim);font-size:.88rem;font-weight:600}
nav .sel{color:var(--tx);border-color:var(--amber)}
#sh{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sc{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sc>.btn,.sc .row .btn{margin:4px 6px 4px 0}
#tt{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#2a2e37;border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:10px;z-index:6;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
.x{float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:1rem}
.rt.pl{border-color:var(--amber)}
.ck.p{width:34px;height:34px;font-size:.8rem;font-weight:400;border-width:1px;border-color:var(--line);color:var(--dim)}
.r.dz{border-style:dashed}
.r.dz .rn b,.r.dz .rn span{white-space:normal;overflow:visible;text-overflow:clip}
.ck.p{font-size:1rem}
</style>
</head>
<body>
<div id="app">
<header><span>Tareas del hogar <small>v7</small></span><button class="btn" id="hp" aria-label="Nueva tarea" style="min-height:36px;padding:0 12px">＋</button></header>
<div id="hc" class="row" style="flex:none"></div>
<main id="mn"></main>
<footer><nav><button data-v="0" class="sel">Hoy</button><button data-v="1">Próximas</button><button data-v="2">Historial</button><button data-v="3">Más</button></nav></footer>
</div>
<div id="sh" hidden><div class="sc"></div></div>
<div id="tt" hidden></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fresh=()=>({homes:[{id:'h1',n:'Casa principal'},{id:'h2',n:'Segunda casa'}],people:[{id:'p1',n:'Yo'}],tasks:[],log:[],h:'h1',me:'p1',ideas:[],
  cats:[{id:'c1',n:'Limpieza'},{id:'c2',n:'Mantenimiento'},{id:'c3',n:'Extraordinaria'}],px:{cuts:[1,2,7,30],lg:1,ln:1,lu:30},bk:'',rt:{},bp:{n:15,d:14},ch:0,t0:'',cd:null,rv:'p',pd:3});
let S=fresh(),V=0,MP=0,PO=0,CF='',HF='a',HL=100,HQ='',IC=0,RK='',BLK=0,LE=[],SE=0,DP=null;
/* BLK=1 = modo seguro: los datos guardados no eran válidos; no se escribe nada hasta resolverlo (ver cargar/avisoDatos) */
/* c=0: ajuste de pantalla o dato efímero, no cuenta como cambio pendiente de copia */
const save=(c=1)=>{if(BLK)return;if(c)S.ch=(+S.ch||0)+1;try{localStorage.setItem('hogar1',JSON.stringify(S));SE=0}catch(e){if(!SE){SE=1;alert('No se ha podido guardar en este navegador (¿almacenamiento lleno?). Haz una copia de seguridad cuanto antes.')}}};

/* ---------- fechas ---------- */
const dn=s=>{const[y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)};
const ds=n=>new Date(n*864e5).toISOString().slice(0,10);
const tk=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const wd=n=>((n+3)%7+7)%7,DN=['L','M','X','J','V','S','D'],W3=['lun','mar','mié','jue','vie','sáb','dom'];
const fd=n=>{const s=ds(n);return W3[wd(n)]+' '+s.slice(8)+'/'+s.slice(5,7)+(s.slice(0,4)!==ds(tk()).slice(0,4)?'/'+s.slice(2,4):'')};
const ws=n=>n-wd(n);
const fixOn=(t,n)=>{if(!t.w.includes(wd(n)))return false;const k=t.fw||1;return k<2||((((ws(n)-ws(t.fa||0))/7)%k)+k)%k===0};
const pn=id=>(S.people.find(p=>p.id===id)||{n:'?'}).n;
const hn=id=>(S.homes.find(h=>h.id===id)||{n:'?'}).n;
const cn=id=>(S.cats.find(c=>c.id===id)||{n:''}).n;
const hs=()=>[S.h];
const R=(h,k)=>{S.rt[h]=S.rt[h]||{};return S.rt[h][k]=S.rt[h][k]||{st:[],w:[],d:'',x:[],g:0}};
const lg=(t,h)=>S.log.filter(l=>l.t===t.id&&l.h===h).sort((a,b)=>b.d.localeCompare(a.d));
/* ---- pausas (tareas detenibles): t.pz=1 detenible; t.fz=[{a:'AAAA-MM-DD' inicio, b:'AAAA-MM-DD' fin (el día b ya cuenta) o '' si es hasta que se active, o:1 si ya tocaba al detenerla}] ---- */
const fzl=t=>t.pz?(t.fz||[]).map(p=>({a:dn(p.a),b:p.b?dn(p.b):Infinity,o:p.o?1:0})).filter(p=>p.b>p.a).sort((x,y)=>x.a-y.a):[];
const fzNow=(t,T)=>fzl(t).find(p=>T>=p.a&&T<p.b)||null;
/* desplaza la fecha D por los días detenidos (lo = primer día que puede contar como detenido) */
function shift(t,D,lo){for(const p of fzl(t)){const a=Math.max(p.a,lo);if(p.b<=a)continue;if(p.o||D>=a){if(p.b===Infinity)return null;D=Math.max(D,a)+(p.b-a)}}return D}
/* fecha en la que toca. t.nx[casa] = fecha manual SOLO para la ocurrencia actual: sustituye a la calculada (antes o después) y se borra al registrar la tarea */
function due(t,h,T){const L=lg(t,h)[0],ld=L?dn(L.d):null,nx=t.nx&&t.nx[h];let d=null;
  if(t.m==='o'){if(L)return null;return shift(t,dn(t.dt||ds(T)),-Infinity)}
  else if(t.m==='s'){if(ld==null){const p=fzNow(t,T);d=p?(p.b===Infinity?null:p.b):T}else d=shift(t,ld+t.e,ld+1)}
  else if(t.m==='f'&&t.w.length){const K=(t.fw||1)*7,z=fzl(t),ok=n=>fixOn(t,n)&&!z.some(p=>n>=p.a&&n<p.b);let L0=ld;z.forEach(p=>{if(p.o&&(L0==null||p.a-1>L0))L0=p.a-1});
    let p=null;for(let i=0;i<K;i++)if(ok(T-i)){p=T-i;break}
    if(p!=null&&(L0==null?p===T:L0<p))d=p;else for(let i=1;i<=K+800;i++)if(ok(T+i)){d=T+i;break}}
  if(d!=null&&nx)d=dn(nx);return d}
const items=()=>{const T=tk();return S.tasks.filter(t=>t.h===S.h).map(t=>({t,h:t.h,d:due(t,t.h,T),z:fzNow(t,T)}))};
const ago=n=>n<=0?'hoy':n===1?'ayer':'hace '+n+' d';
const when=(L,T)=>L?ago(T-dn(L.d))+' · '+esc(pn(L.w)):'nunca hecha';
const pl=(n,a,b)=>n+' '+(n===1?a:b);
const frq=t=>t.m==='o'?'Una vez'+(t.dt?' · '+fd(dn(t.dt)):''):t.m==='f'?((t.fw||1)>1?'Cada '+t.fw+' sem · ':'')+'Días: '+t.w.map(d=>DN[d]).join(' '):
  'Cada '+(t.e%365===0?pl(t.e/365,'año','años'):t.e%30===0?pl(t.e/30,'mes','meses'):t.e%7===0?pl(t.e/7,'semana','semanas'):pl(t.e,'día','días'));
const dl=(d,T)=>d==null?'':d<T?`<b class="bad">atrasada ${pl(T-d,'día','días')}</b>`:d===T?'toca hoy':d===T+1?'mañana':'en '+(d-T)+' d';

/* ---------- validación de datos (al arrancar y al importar) ---------- */
/* err = problemas que bloquean (no se toca nada); av = cosas que se corrigen solas y se avisan */
const isO=x=>x!==null&&typeof x==='object'&&!Array.isArray(x),isS=x=>typeof x==='string',isD=x=>isS(x)&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&ds(dn(x))===x;
const ni=(v,lo,hi,df)=>{v=(typeof v==='number'||(isS(v)&&v.trim()!==''))?Math.floor(+v):NaN;return Number.isFinite(v)&&v>=lo&&v<=hi?v:df};
function validar(o){const err=[],av=[],A=m=>{if(!av.includes(m))av.push(m)},E=m=>{if(err.length<30)err.push(m)};
  if(!isO(o))return{err:['No es una copia de esta app (el contenido no es un objeto de datos)'],av,d:null};
  if(!Array.isArray(o.tasks))return{err:['No es una copia de esta app (falta la lista de tareas)'],av,d:null};
  const d={...fresh(),...o};
  const list=(k,df,ext)=>{if(!Array.isArray(d[k])){E('«'+k+'» no es una lista');d[k]=[];return}const ids=new Set();
    d[k]=d[k].map((x,n)=>{if(!isO(x)||!isS(x.id)||!x.id){E(k+' #'+(n+1)+': falta el identificador');return null}
      if(ids.has(x.id)){E(k+' #'+(n+1)+': identificador repetido');return null}ids.add(x.id);x={...x};
      if(df!==undefined&&(!isS(x.n)||!x.n.trim())){x.n=df;A('nombres vacíos sustituidos por uno genérico')}
      return ext?ext(x,n):x}).filter(Boolean)};
  list('homes','Casa');list('people','Persona');list('cats','Categoría');
  if(!d.homes.length)E('No hay ningún domicilio');if(!d.people.length)E('No hay ninguna persona');
  const H=new Set(d.homes.map(h=>h.id)),h0=d.homes[0]?d.homes[0].id:'';
  list('tasks',undefined,x=>{
    if(!isS(x.n)||!x.n.trim()){E('hay una tarea sin nombre');return null}
    if(!(isS(x.m)&&x.m.length===1&&'sfolx'.includes(x.m))){x.m='s';A('frecuencia no válida en alguna tarea: se usa «cada cierto tiempo»')}
    const e=ni(x.e,1,36500,0);if(e)x.e=e;else{x.e=14;if(x.m==='s')A('intervalo no válido en alguna tarea: se usan 14 días')}
    const wo=x.w;x.w=[...new Set((Array.isArray(wo)?wo:[]).filter(v=>Number.isInteger(v)&&v>=0&&v<=6))];if(!Array.isArray(wo)||x.w.length!==wo.length)A('días de la semana corregidos en alguna tarea');
    if(x.h!==undefined&&(!isS(x.h)||!H.has(x.h))){x.h=h0;A('tareas de un domicilio inexistente pasadas al primero')}
    x.note=isS(x.note)?x.note:'';x.c=isS(x.c)&&d.cats.some(c=>c.id===x.c)?x.c:'';
    x.ld=ni(x.ld,0,36500,0);x.fw=ni(x.fw,1,52,1);if(typeof x.fa!=='number'||!Number.isFinite(x.fa))delete x.fa;
    if(x.dt!==''&&x.dt!==undefined&&!isD(x.dt)){x.dt='';A('fechas no válidas corregidas en alguna tarea')}
    const nx={};if(isO(x.nx))for(const k of Object.keys(x.nx)){if(k!=='__proto__'&&isD(x.nx[k]))nx[k]=x.nx[k];else A('fechas manuales no válidas descartadas')}x.nx=nx;
    x.pz=x.pz?1:0;
    const fz=(Array.isArray(x.fz)?x.fz:[]).filter(p=>isO(p)&&isD(p.a)&&(p.b===''||(isD(p.b)&&p.b>p.a))).map(p=>({a:p.a,b:p.b,o:p.o?1:0}));if(Array.isArray(x.fz)&&fz.length!==x.fz.length)A('periodos de pausa no válidos descartados');x.fz=fz.sort((p,q)=>p.a.localeCompare(q.a));
    return x});
  {const ids=new Set(),th=new Map(d.tasks.map(t=>[t.id,t.h])),p0=d.people[0]?d.people[0].id:'';let lost=0;
   d.log=(Array.isArray(d.log)?d.log:(E('«log» no es una lista'),[])).map((x,n)=>{
     if(!isO(x)||!isS(x.t)||!isD(x.d)){E('registro #'+(n+1)+': tarea o fecha no válidas');return null}
     if(!th.has(x.t)){lost++;return null}x={...x};
     if(!isS(x.i)||!x.i||ids.has(x.i)){x.i=uid();A('identificadores de registros regenerados')}ids.add(x.i);
     if(!isS(x.h)||!x.h){x.h=th.get(x.t)||h0;A('registros sin domicilio: se asignó el de su tarea')}
     if(!isS(x.w)||!x.w){x.w=p0;A('registros sin persona: se asignó la primera')}
     if(x.c!==undefined&&!isD(x.c))delete x.c;if(x.z!==undefined&&!isD(x.z))delete x.z;return x}).filter(Boolean);
   if(lost)A(lost+' registros de tareas que ya no existen se descartan')}
  d.ideas=(Array.isArray(d.ideas)?d.ideas:[]).filter(isO).map(i=>({...i,id:isS(i.id)&&i.id?i.id:uid(),x:isS(i.x)?i.x:'',k:i.k?1:0}));
  d.h=isS(d.h)&&H.has(d.h)?d.h:h0;d.me=isS(d.me)&&d.people.some(p=>p.id===d.me)?d.me:(d.people[0]?d.people[0].id:'');
  {const q=isO(d.px)?d.px:{};d.px={...q,cuts:Array.isArray(q.cuts)?q.cuts.filter(v=>[1,2,7,14,30,90].includes(v)):[1,2,7,30],lg:q.lg===undefined?1:(q.lg?1:0),ln:ni(q.ln,1,999,1),lu:[7,30,365].includes(q.lu)?q.lu:30}}
  d.bk=isD(d.bk)?d.bk:'';d.t0=isD(d.t0)?d.t0:'';{const q=isO(d.bp)?d.bp:{};d.bp={n:ni(q.n,0,99999,15),d:ni(q.d,0,99999,14)}}d.ch=ni(d.ch,0,1e9,0);
  {const rt={};if(isO(d.rt))for(const h of Object.keys(d.rt)){if(h==='__proto__'||!isO(d.rt[h]))continue;const r={};
     for(const k of['s','a']){const q=d.rt[h][k];if(q===undefined)continue;if(!isO(q)){A('rutinas dañadas reiniciadas');continue}
       r[k]={st:(Array.isArray(q.st)?q.st:[]).filter(z=>isO(z)&&isS(z.id)&&z.id).map(z=>({id:z.id,n:isS(z.n)?z.n:'',l:z.l?1:0})),w:(Array.isArray(q.w)?q.w:[]).filter(v=>Number.isInteger(v)&&v>=0&&v<=6),d:isD(q.d)?q.d:'',x:(Array.isArray(q.x)?q.x:[]).filter(isS),g:q.g?1:0}}
     rt[h]=r}d.rt=rt}
  d.cd=isO(d.cd)&&isD(d.cd.d)&&H.has(d.cd.f)&&H.has(d.cd.t)?{d:d.cd.d,f:d.cd.f,t:d.cd.t}:null;
  d.pd=ni(d.pd,0,365,3);d.rv=['p','c','s'].includes(d.rv)?d.rv:'p';
  return{d,err,av}}
/* carga de los datos guardados: si no son válidos NO se sobrescriben (modo seguro) y se guarda una copia en hogar1_rescate */
function cargar(){let raw=null;try{raw=localStorage.getItem('hogar1')}catch(e){BLK=1;LE=['El navegador no deja leer el almacenamiento.'];return}
  if(!raw)return;let r;try{r=validar(JSON.parse(raw))}catch(e){r={err:['Los datos guardados no se pueden leer (JSON dañado).']}}
  if(r.err.length){BLK=1;LE=r.err;try{localStorage.setItem('hogar1_rescate',raw)}catch(_){}}else S=r.d}
function importar(txt){let o;try{o=JSON.parse(txt)}catch(_){alert('El archivo no es un JSON legible. No se ha cambiado nada.');return}
  const r=validar(o);if(r.err.length){alert('No se ha importado nada: la copia tiene errores.\n\n• '+r.err.slice(0,6).join('\n• ')+(r.err.length>6?'\n• …y '+(r.err.length-6)+' más':'')+'\n\nTus datos actuales siguen intactos.');return}
  if(!confirm('Se importará: '+r.d.tasks.length+' tareas, '+r.d.log.length+' registros y '+r.d.homes.length+' domicilios.'+(r.av.length?'\n\nSe corregirá automáticamente:\n• '+r.av.slice(0,6).join('\n• '):'')+'\n\nEsto reemplaza todos los datos actuales (se guarda una copia por si quieres deshacerlo). ¿Continuar?'))return;
  if(!BLK)try{localStorage.setItem('hogar1_prev',JSON.stringify(S))}catch(_){}
  S=r.d;mig();S.ch=0;BLK=0;save(0);close();render();toast('Copia importada')}
const hasPrev=()=>{try{return!!localStorage.getItem('hogar1_prev')}catch(e){return false}};
function restPrev(){let raw=null;try{raw=localStorage.getItem('hogar1_prev')}catch(e){}if(!raw){alert('No hay estado anterior guardado.');return}
  let r;try{r=validar(JSON.parse(raw))}catch(e){r={err:['ilegible']}}
  if(r.err.length){alert('El estado anterior no es válido. No se toca nada.');return}
  if(!confirm('Se volverá al estado de justo antes de la última importación ('+r.d.tasks.length+' tareas). El estado actual se guardará por si quieres volver a él. ¿Continuar?'))return;
  try{localStorage.setItem('hogar1_prev',JSON.stringify(S))}catch(e){}
  S=r.d;mig();BLK=0;save(0);render();toast('Estado anterior restaurado')}
function avisoDatos(){sheet(`<h3>⚠ Datos guardados con problemas</h3><p class="d">No se ha tocado nada: la app está en <b>modo seguro</b> y no guardará cambios hasta que lo resuelvas. Problemas detectados:</p><p class="d">• ${LE.slice(0,4).map(esc).join('<br>• ')}</p>
