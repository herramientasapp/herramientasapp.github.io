<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botiquín</title>
<style>
:root{--bg:#f1f4f2;--c:#fff;--t:#1d2a2c;--m:#5f6f72;--a:#0f6b6b;--ok:#1f8a4c;--w:#b45309;--bad:#b42318;--b:#d9e0de;--hi:#e6f2f2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1617;--c:#172123;--t:#e6eeee;--m:#98a9ab;--a:#4fb3b3;--ok:#4cc27f;--w:#f0a050;--bad:#f27a70;--b:#27363a;--hi:#1e2d2f}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding:12px 12px 84px}
small{color:var(--m)}
.hd{font-size:20px;font-weight:700;margin:6px 2px 12px}
.hd small{font-weight:400;font-size:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
.card.click{cursor:pointer}.card.click:hover{background:var(--hi)}
.row{display:flex;gap:10px;align-items:center;margin-top:8px}.row:first-child{margin-top:0}
.g{flex:1}
.bd{font-size:14px;color:var(--m)}
button{font:inherit;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
button.ok{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}
button.bad{color:var(--bad)}
button.ghost{background:none}
button.sm{padding:6px 10px;min-height:32px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--m);font-size:13px;min-height:56px}
nav button.on{color:var(--a);font-weight:700;box-shadow:inset 0 3px var(--a)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);margin-top:4px}
textarea{min-height:70px}
label{display:block;margin:10px 0 0;font-size:14px;color:var(--m)}
input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0}
.inl{display:flex;gap:8px}.inl>*{flex:1}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;overflow:auto;padding:12px;z-index:20}
#mod>div{background:var(--c);border-radius:12px;padding:14px;max-width:640px;margin:0 auto}
#v{max-width:700px;margin:0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--b);background:var(--c);font-size:13px;cursor:pointer;user-select:none;min-height:32px}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.chip.pers{border-radius:6px;border-color:var(--w);color:var(--w)}
.chip.pers.on{background:var(--w);color:#fff;border-color:var(--w)}
.chip.pers.unassigned{border-color:var(--m);color:var(--m)}
.chip.pers.unassigned.on{background:var(--m);color:#fff;border-color:var(--m)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;vertical-align:middle}
.badge.hay{background:rgba(31,138,76,.15);color:var(--ok)}
.badge.pocas{background:rgba(180,83,9,.15);color:var(--w)}
.badge.no{background:rgba(180,35,24,.15);color:var(--bad)}
.badge.cad{background:rgba(180,35,24,.2);color:var(--bad)}
.badge.prox{background:rgba(180,83,9,.2);color:var(--w)}
.badge.tipo{background:var(--hi);color:var(--m);font-weight:400}
.search{position:relative}
.search input{font-size:17px;padding:14px 14px 14px 44px;border-radius:12px}
.search::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--m);font-weight:700}
.hint{padding:10px;background:var(--hi);border-radius:8px;font-size:14px;margin:8px 0}
.loc-tag{display:inline-block;background:var(--hi);padding:4px 10px;border-radius:8px;font-size:13px;margin:2px 4px 2px 0}
.ph{border-radius:8px;max-width:100%;max-height:240px;cursor:zoom-in;display:block;margin-top:6px}
.alias-tag{display:inline-flex;align-items:center;gap:6px;background:var(--hi);padding:3px 8px;border-radius:12px;font-size:13px;margin:2px 4px 2px 0}
.alias-tag button{border:0;background:none;padding:0;min-height:auto;font-size:16px;color:var(--bad);cursor:pointer}
.sect-title{font-weight:700;font-size:15px;margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
.empty{color:var(--m);text-align:center;padding:24px;font-size:14px}
.ub-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.progress{background:var(--b);border-radius:10px;height:8px;overflow:hidden;margin:6px 0}
.progress>div{background:var(--a);height:100%;transition:width .2s}
.clitem{display:flex;align-items:flex-start;gap:10px}
.clitem label{margin:0;color:var(--t);display:flex;align-items:flex-start;gap:10px;cursor:pointer;flex:1}
.clitem input[type=checkbox]{margin-top:4px;flex-shrink:0;width:20px;height:20px}
.clitem .txt{line-height:1.3}
.clitem.done .txt{text-decoration:line-through;color:var(--m)}
details.fold{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
details.fold>summary{cursor:pointer;list-style:none;font-weight:700;display:flex;align-items:center;gap:8px;padding:0;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▸';display:inline-block;transition:transform .15s;color:var(--m);font-weight:400}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold[open]>summary{margin-bottom:8px}
.prompt-pre{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px;font-size:12px;color:var(--m);max-height:80px;overflow:hidden;position:relative;margin-top:6px;line-height:1.35}
.prompt-pre:after{content:'';position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.print-ubi-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;color:var(--t);cursor:pointer}
.print-ubi-row input[type=checkbox]{width:auto;margin:0;min-width:18px;min-height:18px}
#print-area{display:none}
@media print{
  @page{margin:1.2cm;size:A4}
  body{background:#fff;color:#000;padding:0}
  body>*:not(#print-area){display:none !important}
  #print-area{display:block !important;font:11pt/1.3 system-ui,sans-serif;color:#000}
  .p-head{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .p-head h1{font-size:20pt;margin:0 0 4px}
  .p-item{border:1px solid #999;border-radius:6px;padding:8px 10px;margin-bottom:8px;page-break-inside:avoid}
  .p-item h3{margin:0 0 2px;font-size:12pt}
  .p-item p{margin:2px 0;font-size:10.5pt}
  .p-alias{font-style:italic;color:#555}
  .p-cad{font-weight:700}
  .p-foot{margin-top:14px;font-size:9pt;color:#555;border-top:1px solid #ccc;padding-top:6px}
}
</style>
</head><body>
<div id="v"></div>
<div id="print-area"></div>
<div id="mod"><div id="mf"></div></div>
<nav>
<button data-a="tab" data-k="buscar">Buscar</button>
<button data-a="tab" data-k="ubi">Ubicaciones</button>
<button data-a="tab" data-k="med">Medicamentos</button>
<button data-a="tab" data-k="aju">Ajustes</button>
</nav>
<script>
// ===== BOTIQUÍN v3 =====
// v3: filtro persona en Buscar, prompts IA (store nuevo), botón IA en fichas,
//     búsqueda en notas, checklists plegados, impresión dinámica.
// DB v3: añade store "prompts". Migración transparente.

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dk(new Date())}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function fmtDate(s){if(!s)return'';try{var d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s}}
function inDays(n){return dk(new Date(Date.now()+n*864e5))}

var DEFAULT_PROMPT_TEXT=[
'Actúa como un asistente farmacéutico experto y ayúdame a digitalizar el botiquín de mi casa. Te voy a compartir una o varias fotos con cajas de medicamentos y productos de primeros auxilios.',
'',
'Tu tarea es identificar cada uno de los productos visibles en las imágenes y extraer su información clave. Para cada medicamento o producto que identifiques, debes generar obligatoriamente una ficha utilizando exactamente la estructura que te muestro a continuación (separando cada producto con una línea horizontal `---`):',
'',
'### [Número]. [Nombre comercial del producto]',
'* **Nombre comercial:** [Nombre que aparece en la caja]',
'* **Principio activo:** [Componente principal o combinación de componentes]',
'* **Otros nombres:** [Nombres genéricos comunes, marcas competidoras muy conocidas o variantes]',
'* **Para qué sirve:** [Explicación muy breve, sencilla y directa de su indicación principal]',
'* **Dosis / Presentación habitual:** [Formato, gramos/miligramos visibles o la pauta general habitual]',
'* **Dato de interés:** [Consejos útiles de toma, alertas de seguridad como somnolencia, si requiere receta médica obligatoria en España o trucos de conservación]',
'',
'REGLAS ESTRICTAS DE FORMATO:',
'1. No utilices introducciones largas ni comentarios de relleno antes de empezar el listado. Ve directo al grano.',
'2. Cada bloque debe ser limpio y fácil de copiar y pegar en los campos de un formulario.',
'3. Si un producto es de parafarmacia o material de cura (como gasas o cremas cosméticas), adáptalo indicando sus componentes principales en "Principio activo".',
'4. Evita los párrafos largos en el apartado "Para qué sirve"; utiliza un lenguaje accesible para no profesionales de la medicina.',
'',
'Por favor, confirma que has entendido las instrucciones y queda a la espera de que te suba las fotos.'
].join('\n');

// ---------- DB ----------
var DB_NAME='botiquin', DB_VER=3, db=null;
function openDB(){return new Promise(function(res,rej){
  var r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=function(e){
    var d=e.target.result;
    ['personas','ubicaciones','medicamentos','existencias','mejoras','checklists','prompts'].forEach(function(s){
      if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'});
    });
  };
  r.onsuccess=function(e){db=e.target.result;res()};
  r.onerror=function(){rej(r.error)};
})}
function dbAll(store){return new Promise(function(res,rej){
  var r=db.transaction(store,'readonly').objectStore(store).getAll();
  r.onsuccess=function(){res(r.result||[])};r.onerror=function(){rej(r.error)};
})}
function dbPut(store,obj){return new Promise(function(res,rej){
  var r=db.transaction(store,'readwrite').objectStore(store).put(obj);
  r.onsuccess=function(){res(obj)};r.onerror=function(){rej(r.error)};
})}
function dbDel(store,id){return new Promise(function(res,rej){
  var r=db.transaction(store,'readwrite').objectStore(store).delete(id);
  r.onsuccess=function(){res()};r.onerror=function(){rej(r.error)};
})}

// ---------- state ----------
var ST={personas:[],ubicaciones:[],medicamentos:[],existencias:[],mejoras:[],checklists:[],prompts:[]};
var CFG={}, CFG_KEY='botiquin1-cfg';
var TAB='buscar', Q='', UFILTER='', PFILTER='', CUR_CL=null;
var PICK_PROMPT_MED=null;

function loadCfg(){try{CFG=JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}catch(e){CFG={}}}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG))}catch(e){}}

async function loadAll(){
  ST.personas=await dbAll('personas');
  ST.ubicaciones=await dbAll('ubicaciones');
  ST.medicamentos=await dbAll('medicamentos');
  ST.existencias=await dbAll('existencias');
  ST.mejoras=await dbAll('mejoras');
  ST.checklists=await dbAll('checklists');
  ST.prompts=await dbAll('prompts');
  ST.ubicaciones.sort(function(a,b){return (a.orden||99)-(b.orden||99)||a.nombre.localeCompare(b.nombre)});
  ST.medicamentos.sort(function(a,b){return a.nombre.localeCompare(b.nombre)});
  ST.checklists.sort(function(a,b){return a.nombre.localeCompare(b.nombre)});
  ST.prompts.sort(function(a,b){return (a.titulo||'').localeCompare(b.titulo||'')});
}
async function ensureDefaults(){
  if(ST.ubicaciones.length===0){
    var defs=[
      {id:uid(),nombre:'Casa',tipo:'casa',notas:'',orden:1},
      {id:uid(),nombre:'Botiquín montaña',tipo:'botiquin',notas:'',orden:2},
      {id:uid(),nombre:'Botiquín viaje',tipo:'botiquin',notas:'',orden:3}
    ];
    for(var i=0;i<defs.length;i++) await dbPut('ubicaciones',defs[i]);
    ST.ubicaciones=defs;
  }
  if(ST.prompts.length===0){
    await dbPut('prompts',{id:'prompt_default_photo',titulo:'Extraer información de la foto del medicamento',texto:DEFAULT_PROMPT_TEXT,creado:Date.now(),actualizado:Date.now()});
    ST.prompts=await dbAll('prompts');
  }
}

// ---------- lookups ----------
function ubiName(id){var u=ST.ubicaciones.find(function(x){return x.id===id});return u?u.nombre:'(sin ubicación)'}
function medOf(ex){return ex.medId?ST.medicamentos.find(function(m){return m.id===ex.medId})||null:null}
function persName(id){var p=ST.personas.find(function(x){return x.id===id});return p?p.nombre:''}
function persLabel(id){if(id==='__none__')return 'sin asignar';return persName(id)||''}
function exName(ex){var m=medOf(ex);return m?m.nombre:(ex.nombreLibre||'(sin nombre)')}
function cadEf(ex,med){
  var cad=ex.caducidad||'';
  if(med&&+med.diasAbierto>0&&ex.abiertoEl){
    var d=new Date(ex.abiertoEl+'T00:00:00');d.setDate(d.getDate()+ +med.diasAbierto);
    var s=dk(d);if(!cad||s<cad)cad=s;
  }
  return cad;
}
function cadStatus(cad){if(!cad)return '';var t=today();if(cad<t)return 'cad';if(cad<inDays(30))return 'prox';return ''}
function cadBadge(cad){var s=cadStatus(cad);if(!s)return '';return '<span class="badge '+s+'">'+(s==='cad'?'Caducado':'Pronto')+'</span>'}
function estBadge(es){return '<span class="badge '+es+'">'+(es==='hay'?'Hay':es==='pocas'?'Pocas':'No hay')+'</span>'}
function medSig(m){return [norm(m.principioActivo),norm(m.dosis),norm(m.forma)].join('|')}
function findDuplicate(m){
  if(!m.principioActivo)return null;
  var s=medSig(m);
  return ST.medicamentos.find(function(x){return x.id!==m.id && x.principioActivo && medSig(x)===s})||null;
}
function clProgress(cl){
  var tot=cl.items.length, hec=cl.items.filter(function(i){return i.hecho}).length;
  return {tot:tot,hec:hec,pct:tot?Math.round(100*hec/tot):0};
}

// ---------- clipboard ----------
async function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{await navigator.clipboard.writeText(text);return true;}catch(e){}
  }
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){return false;}
}
function applyPromptVars(text,med){
  if(!med)return text||'';
  var map={'{medicamento}':med.nombre||'','{principioActivo}':med.principioActivo||'','{dosis}':med.dosis||'','{forma}':med.forma||'','{alias}':(med.alias||[]).join(', ')};
  var r=text||'';
  Object.keys(map).forEach(function(k){r=r.split(k).join(map[k])});
  return r;
}
function medContextBlock(med){
  if(!med)return '';
  var lines=['','---','Medicamento: '+(med.nombre||'—')];
  if(med.principioActivo)lines.push('Principio activo: '+med.principioActivo);
  if(med.dosis)lines.push('Dosis: '+med.dosis);
  if(med.forma)lines.push('Forma: '+med.forma);
  if(med.alias&&med.alias.length)lines.push('Alias: '+med.alias.join(', '));
  if(med.paraQue)lines.push('Para qué sirve: '+med.paraQue);
  return lines.join('\n');
}

// ---------- init ----------
(async function(){
  try{
    await openDB();await loadAll();loadCfg();await ensureDefaults();render();
    document.addEventListener('click',onClick);
    document.addEventListener('change',onChange);
    document.addEventListener('input',function(e){
      if(e.target.id==='q'){Q=e.target.value;$('#res').innerHTML=renderResultados()}
    });
  }catch(e){
    console.error(e);
    $('#v').innerHTML='<div class="card"><b>Error al iniciar</b><br>No se pudo abrir la base de datos.<br><small>'+esc(e&&e.message||e)+'</small></div>';
  }
})();

// ---------- render ----------
function render(){
  $('#print-area').innerHTML='';
  var html;
  if(TAB==='aju'&&CUR_CL){
    html=vChecklistDetail(CUR_CL);
  }else{
    var fn={buscar:vBuscar,ubi:vUbi,med:vMed,aju:vAju}[TAB]||vBuscar;
    html=fn();
  }
  $('#v').innerHTML=html;
  attachFoldListeners();
  [].forEach.call(document.querySelectorAll('nav button'),function(b){
    b.className=b.dataset.k===TAB?'on':'';
  });
  if(TAB==='buscar'){
    var qi=$('#q');
    if(qi&&!qi.value){qi.value=Q}
    if(qi){var l=qi.value.length;qi.setSelectionRange&&qi.setSelectionRange(l,l)}
  }
  window.scrollTo(0,0);
}
function attachFoldListeners(){
  [].forEach.call(document.querySelectorAll('details.fold'),function(d){
    if(d.dataset.listening)return;
    d.dataset.listening='1';
    d.addEventListener('toggle',function(){
      CFG['fold_'+d.dataset.fold]=d.open;saveCfg();
    });
  });
}

// ---------- BUSCAR ----------
function vBuscar(){
  var h='<div class="hd">Buscar<small> · tu botiquín</small></div>';
  h+='<div class="search"><input id="q" placeholder="Nombre, alias, principio, para qué, notas…" value="'+esc(Q)+'"></div>';
  h+='<div class="chips" id="chips">'+chipFiltros()+'</div>';
  h+='<div id="res">'+renderResultados()+'</div>';
  return h;
}
function chipFiltros(){
  var h='';
  h+='<span class="chip '+(UFILTER===''?'on':'')+'" data-a="clearloc">📍 Todas</span>';
  ST.ubicaciones.forEach(function(u){
    h+='<span class="chip '+(UFILTER===u.id?'on':'')+'" data-a="filtroubi" data-k="'+u.id+'">'+esc(u.nombre)+'</span>';
  });
  if(ST.personas.length>0){
    h+='<span class="chip pers '+(PFILTER===''?'on':'')+'" data-a="clearpers">👥 Todas</span>';
    ST.personas.forEach(function(p){
      h+='<span class="chip pers '+(PFILTER===p.id?'on':'')+'" data-a="filtropers" data-k="'+p.id+'">'+esc(p.nombre)+'</span>';
    });
    h+='<span class="chip pers unassigned '+(PFILTER==='__none__'?'on':'')+'" data-a="filtropers" data-k="__none__">Sin asignar</span>';
  }
  h+='<span class="chip" data-a="newmed">+ Medicamento</span>';
  h+='<span class="chip" data-a="newitem">+ Objeto</span>';
  return h;
}
function renderResultados(){
  if(!Q&&!UFILTER&&!PFILTER){return vDashboard()}
  var q=Q?norm(Q):'';
  var medHits={}, freeHits={};
  ST.existencias.forEach(function(ex){
    if(UFILTER&&ex.ubicacionId!==UFILTER)return;
    var m0=ex.medId?medOf(ex):null;
    if(PFILTER){
      var pid=m0?(m0.recetadoA||''):'';
      if(PFILTER==='__none__'){if(pid!=='')return;}
      else{if(pid!==PFILTER)return;}
    }
    if(ex.medId){
      var m=medOf(ex);
      if(!m){
        if(q&&norm(ex.nombreLibre||'').indexOf(q)<0)return;
        var kx=(ex.nombreLibre||'(medicamento borrado)').toLowerCase();
        (freeHits[kx]=freeHits[kx]||[]).push(ex);
        return;
      }
      if(q){
        var ss=[m.nombre,m.principioActivo,m.paraQue,m.dosis,m.pauta,m.forma,m.notas].concat(m.alias||[]);
        if(!ss.some(function(s){return norm(s).indexOf(q)>=0}))return;
      }
      (medHits[m.id]=medHits[m.id]||[]).push(ex);
    }else if(ex.nombreLibre){
      if(q&&norm(ex.nombreLibre).indexOf(q)<0&&norm(ex.notas||'').indexOf(q)<0)return;
      var kf=ex.nombreLibre.toLowerCase();
      (freeHits[kf]=freeHits[kf]||[]).push(ex);
    }
  });
  var medKeys=Object.keys(medHits), freeKeys=Object.keys(freeHits);
  if(!medKeys.length&&!freeKeys.length){
    var msg;
    var uName=UFILTER?ubiName(UFILTER):'';
    var pName=PFILTER?persLabel(PFILTER):'';
    if(q&&UFILTER&&PFILTER)msg='Sin resultados para «'+esc(Q)+'» en '+esc(uName)+' ('+esc(pName)+')';

// ---------- Impresión ----------
function buildPrintForUbi(ubiId){
  var u=ST.ubicaciones.find(function(x){return x.id===ubiId});
  if(!u)return '';
  var exs=ST.existencias.filter(function(e){return e.ubicacionId===ubiId});
  exs.sort(function(a,b){return exName(a).localeCompare(exName(b))});
  return printShell(u,exs);
}
function buildPrintSelection(ubiIds,persId){
  var h='';
  ubiIds.forEach(function(uid){
    var u=ST.ubicaciones.find(function(x){return x.id===uid});
    if(!u)return;
    var exs=ST.existencias.filter(function(e){
      if(e.ubicacionId!==uid)return false;
      if(persId){
        var m=medOf(e);var mp=m?(m.recetadoA||''):'';
        if(persId==='__none__'){if(mp!=='')return false;}
        else{if(mp!==persId)return false;}
      }
      return true;
    });
    if(!exs.length)return;
    exs.sort(function(a,b){return exName(a).localeCompare(exName(b))});
    h+='<div style="page-break-before:always">'+printShell(u,exs)+'</div>';
  });
  if(!h)h='<div class="p-head"><h1>Sin elementos que imprimir</h1><div>Revisa la selección.</div></div>';
  return h;
}
function printShell(u,exs){
  var h='<div class="p-head"><h1>'+esc(u.nombre)+'</h1><div>'+new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})+' · '+exs.length+' elemento'+(exs.length===1?'':'s')+'</div></div>';
  exs.forEach(function(ex){
    var m=medOf(ex);
    var titulo=ex.nombreLibre||(m?m.nombre:'(sin nombre)');
    h+='<div class="p-item"><h3>'+esc(titulo)+'</h3>';
    if(m){
      var sub=[m.principioActivo,m.dosis,m.forma].filter(Boolean).join(' · ');
      if(sub)h+='<p><b>'+esc(sub)+'</b></p>';
      if(m.alias&&m.alias.length)h+='<p class="p-alias">'+esc(m.alias.join(' · '))+'</p>';
      if(m.paraQue)h+='<p><b>Para qué:</b> '+esc(m.paraQue)+'</p>';
      if(m.pauta)h+='<p><b>Cómo tomar:</b> '+esc(m.pauta)+'</p>';
      if(m.advertencias)h+='<p><b>Advertencias:</b> '+esc(m.advertencias)+'</p>';
      if(m.nevera)h+='<p>❄ Conservar en nevera</p>';
      if(m.recetadoA){var pn=persName(m.recetadoA);if(pn)h+='<p><b>Recetado a:</b> '+esc(pn)+'</p>'}
    }
    var cad=cadEf(ex,m);
    var extra='';
    if(ex.abiertoEl&&m&&+m.diasAbierto>0)extra=' (abierto '+ex.abiertoEl+', caduca a los '+m.diasAbierto+' días)';
    h+='<p class="p-cad">Caducidad: '+esc(cad?fmtDate(cad):'—')+esc(extra)+'</p>';
    h+='<p>Estado: '+esc(ex.estado==='hay'?'Hay':ex.estado==='pocas'?'Quedan pocas':'No hay')+'</p>';
    if(ex.notas)h+='<p>Notas: '+esc(ex.notas)+'</p>';
    h+='</div>';
  });
  h+='<div class="p-foot">Listado informativo. No sustituye al prospecto ni la consulta médica.</div>';
  return h;
}

// ---------- export/import ----------
function exportJSON(){
  var data={v:3,app:'botiquin',ts:Date.now(),personas:ST.personas,ubicaciones:ST.ubicaciones,medicamentos:ST.medicamentos,existencias:ST.existencias,mejoras:ST.mejoras,checklists:ST.checklists,prompts:ST.prompts,cfg:CFG};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='botiquin-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  CFG.ultimaCopia=Date.now();saveCfg();
}
async function importJSON(text){
  var data=JSON.parse(text);
  if(!data||!Array.isArray(data.medicamentos))throw new Error('JSON no válido');
  if(!confirm('Esto sustituye TODOS los datos actuales. ¿Continuar?'))return;
  var stores=['personas','ubicaciones','medicamentos','existencias','mejoras','checklists','prompts'];
  for(var i=0;i<stores.length;i++){
    var s=stores[i];
    var olds=await dbAll(s);
    for(var j=0;j<olds.length;j++) await dbDel(s,olds[j].id);
    var arr=data[s]||[];
    for(var k=0;k<arr.length;k++) await dbPut(s,arr[k]);
  }
  CFG=data.cfg||CFG;saveCfg();
  CUR_CL=null;Q='';UFILTER='';PFILTER='';
  await loadAll();
  if(ST.prompts.length===0)await ensureDefaults();
  render();
  alert('Datos restaurados.');
}

async function onChange(e){
  var t=e.target;
  if(t.dataset&&t.dataset.a==='cltoggle'){
    var cl=ST.checklists.find(function(x){return x.id===t.dataset.cl});if(!cl)return;
    var it=cl.items.find(function(x){return x.id===t.dataset.k});if(!it)return;

    if(TAB==='aju'&&CUR_CL){$('#v').innerHTML=vChecklistDetail(CUR_CL)}
    return;
  }
  if(t.id==='fmfile'&&t.files&&t.files[0]){
    try{
      var data=await compressImage(t.files[0]);
      FM_FOTO=data;
      $('#fmfotoprev').innerHTML='<img class="ph" src="'+esc(data)+'" alt="receta">';
    }catch(er){alert('No se pudo procesar la imagen.')}
  }
}

function compressImage(file){
  return new Promise(function(res,rej){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var max=900,sc=Math.min(1,max/img.width);
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.72));
      };
      img.onerror=rej;img.src=e.target.result;
    };
    reader.onerror=rej;reader.readAsDataURL(file);
  });
}
