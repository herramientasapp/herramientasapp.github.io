<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Botiquín</title>
<style>
:root{--bg:#f1f4f2;--c:#fff;--t:#1d2a2c;--m:#5f6f72;--a:#0f6b6b;--ok:#1f8a4c;--w:#b45309;--bad:#b42318;--b:#d9e0de;--hi:#e6f2f2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1617;--c:#172123;--t:#e6eeee;--m:#98a9ab;--a:#4fb3b3;--ok:#4cc27f;--w:#f0a050;--bad:#f27a70;--b:#27363a;--hi:#1e2d2f}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding:12px 12px 84px}
small{color:var(--m)}
.hd{font-size:20px;font-weight:700;margin:6px 2px 12px}
.hd small{font-weight:400;font-size:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
.card.click{cursor:pointer}.card.click:hover{background:var(--hi)}
.row{display:flex;gap:10px;align-items:center;margin-top:8px}.row:first-child{margin-top:0}
.g{flex:1}
.bd{font-size:14px;color:var(--m)}
button{font:inherit;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
button.ok{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}
button.bad{color:var(--bad)}
button.ghost{background:none}
button.sm{padding:6px 10px;min-height:32px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--m);font-size:13px;min-height:56px}
nav button.on{color:var(--a);font-weight:700;box-shadow:inset 0 3px var(--a)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);margin-top:4px}
textarea{min-height:70px}
label{display:block;margin:10px 0 0;font-size:14px;color:var(--m)}
input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0}
.inl{display:flex;gap:8px}.inl>*{flex:1}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;overflow:auto;padding:12px;z-index:20}
#mod>div{background:var(--c);border-radius:12px;padding:14px;max-width:640px;margin:0 auto}
#v{max-width:700px;margin:0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--b);background:var(--c);font-size:13px;cursor:pointer;user-select:none;min-height:32px}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.chip.pers{border-radius:6px;border-color:var(--w);color:var(--w)}
.chip.pers.on{background:var(--w);color:#fff;border-color:var(--w)}
.chip.pers.unassigned{border-color:var(--m);color:var(--m)}
.chip.pers.unassigned.on{background:var(--m);color:#fff;border-color:var(--m)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;vertical-align:middle}
.badge.hay{background:rgba(31,138,76,.15);color:var(--ok)}
.badge.pocas{background:rgba(180,83,9,.15);color:var(--w)}
.badge.no{background:rgba(180,35,24,.15);color:var(--bad)}
.badge.cad{background:rgba(180,35,24,.2);color:var(--bad)}
.badge.prox{background:rgba(180,83,9,.2);color:var(--w)}
.badge.tipo{background:var(--hi);color:var(--m);font-weight:400}
.badge.med{background:rgba(15,107,107,.15);color:var(--a)}
.badge.mat{background:rgba(180,83,9,.15);color:var(--w)}
.search{position:relative}
.search input{font-size:17px;padding:14px 14px 14px 44px;border-radius:12px}
.search::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--m);font-weight:700}
.hint{padding:10px;background:var(--hi);border-radius:8px;font-size:14px;margin:8px 0}
.loc-tag{display:inline-block;background:var(--hi);padding:4px 10px;border-radius:8px;font-size:13px;margin:2px 4px 2px 0}
.ph{border-radius:8px;max-width:100%;max-height:240px;cursor:zoom-in;display:block;margin-top:6px}
.alias-tag{display:inline-flex;align-items:center;gap:6px;background:var(--hi);padding:3px 8px;border-radius:12px;font-size:13px;margin:2px 4px 2px 0}
.alias-tag button{border:0;background:none;padding:0;min-height:auto;font-size:16px;color:var(--bad);cursor:pointer}
.sect-title{font-weight:700;font-size:15px;margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
.empty{color:var(--m);text-align:center;padding:24px;font-size:14px}
.ub-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.progress{background:var(--b);border-radius:10px;height:8px;overflow:hidden;margin:6px 0}
.progress>div{background:var(--a);height:100%;transition:width .2s}
.clitem{display:flex;align-items:flex-start;gap:10px}
.clitem label{margin:0;color:var(--t);display:flex;align-items:flex-start;gap:10px;cursor:pointer;flex:1}
.clitem input[type=checkbox]{margin-top:4px;flex-shrink:0;width:20px;height:20px}
.clitem .txt{line-height:1.3}
.clitem.done .txt{text-decoration:line-through;color:var(--m)}
details.fold{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
details.fold>summary{cursor:pointer;list-style:none;font-weight:700;display:flex;align-items:center;gap:8px;padding:0;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▸';display:inline-block;transition:transform .15s;color:var(--m);font-weight:400}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold[open]>summary{margin-bottom:8px}
.prompt-pre{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px;font-size:12px;color:var(--m);max-height:80px;overflow:hidden;position:relative;margin-top:6px;line-height:1.35}
.prompt-pre:after{content:'';position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.print-ubi-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;color:var(--t);cursor:pointer}
.print-ubi-row input[type=checkbox]{width:auto;margin:0;min-width:18px;min-height:18px}
.caja-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px;margin-top:6px;font-size:14px;flex-wrap:wrap}
.caja-row .g{flex:1;min-width:140px}
#print-area{display:none}
@media print{
  @page{margin:1.2cm;size:A4}
  body{background:#fff;color:#000;padding:0}
  body>*:not(#print-area){display:none !important}
  #print-area{display:block !important;font:11pt/1.3 system-ui,sans-serif;color:#000}
  .p-head{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
  .p-head h1{font-size:20pt;margin:0 0 4px}
  .p-item{border:1px solid #999;border-radius:6px;padding:8px 10px;margin-bottom:8px;page-break-inside:avoid}
  .p-item h3{margin:0 0 2px;font-size:12pt}
  .p-item p{margin:2px 0;font-size:10.5pt}
  .p-alias{font-style:italic;color:#555}
  .p-cad{font-weight:700}
  .p-foot{margin-top:14px;font-size:9pt;color:#555;border-top:1px solid #ccc;padding-top:6px}
}
</style>
</head><body>
<div id="v"></div>
<div id="print-area"></div>
<div id="mod"><div id="mf"></div></div>
<nav>
<button data-a="tab" data-k="buscar">Buscar</button>
<button data-a="tab" data-k="med">Medicamentos</button>
<button data-a="tab" data-k="aju">Ajustes</button>
</nav>
<script>
// ===== BOTIQUÍN v4 =====
// Catálogo unificado: productos (medicamento | material de curas).
// Existencias = cajas individuales, cada una independiente.
// Import JSON: completo (sustituye) o parcial (fusión en catálogo).

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dk(new Date())}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function fmtDate(s){if(!s)return'';try{var d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s}}
function inDays(n){return dk(new Date(Date.now()+n*864e5))}

var FORMAS=['','comprimido','cápsula','jarabe','gotas','pomada','crema','colirio','inyección','supositorio','sobre','espray','otro'];
var CATEGORIAS=['','antiséptico','apósito','vendaje','instrumental','protección','otro'];

var DEFAULT_PROMPT_PHOTO=[
'Actúa como un asistente farmacéutico experto y ayúdame a digitalizar el botiquín de mi casa. Te voy a compartir una o varias fotos con cajas de medicamentos y productos de primeros auxilios.',
'',
'Tu tarea es identificar cada uno de los productos visibles en las imágenes y extraer su información clave. Para cada medicamento o producto que identifiques, debes generar obligatoriamente una ficha utilizando exactamente la estructura que te muestro a continuación (separando cada producto con una línea horizontal `---`):',
'',
'### [Número]. [Nombre comercial del producto]',
'* **Nombre comercial:** [Nombre que aparece en la caja]',
'* **Principio activo:** [Componente principal o combinación de componentes]',
'* **Otros nombres:** [Nombres genéricos comunes, marcas competidoras muy conocidas o variantes]',
'* **Para qué sirve:** [Explicación muy breve, sencilla y directa de su indicación principal]',
'* **Dosis / Presentación habitual:** [Formato, gramos/miligramos visibles o la pauta general habitual]',
'* **Dato de interés:** [Consejos útiles de toma, alertas de seguridad como somnolencia, si requiere receta médica obligatoria en España o trucos de conservación]',
'',
'REGLAS ESTRICTAS DE FORMATO:',
'1. No utilices introducciones largas ni comentarios de relleno antes de empezar el listado. Ve directo al grano.',
'2. Cada bloque debe ser limpio y fácil de copiar y pegar en los campos de un formulario.',
'3. Si un producto es de parafarmacia o material de cura (como gasas o cremas cosméticas), adáptalo indicando sus componentes principales en "Principio activo".',
'4. Evita los párrafos largos en el apartado "Para qué sirve"; utiliza un lenguaje accesible para no profesionales de la medicina.',
'',
'Por favor, confirma que has entendido las instrucciones y queda a la espera de que te suba las fotos.'
].join('\n');

var DEFAULT_PROMPT_IMPORT=[
'Genera un JSON válido para importar en mi aplicación de botiquín. Devuelve SOLO el JSON, sin explicaciones, sin bloques markdown ni texto adicional.',
'',
'FORMATO DE UN MEDICAMENTO:',
'{',
'  "tipo": "medicamento",',
'  "nombre": "Nombre comercial",',
'  "principioActivo": "Principio activo",',
'  "dosis": "500 mg",',
'  "forma": "comprimido",',
'  "alias": ["Otros nombres, marcas equivalentes"],',
'  "paraQue": "Indicación breve",',
'  "pauta": "Cómo se toma",',
'  "advertencias": "Avisos importantes",',
'  "conservacion": "Condiciones de conservación",',
'  "nevera": false,',
'  "diasAbierto": 0',
'}',
'',
'Valores posibles de "forma": comprimido, cápsula, jarabe, gotas, pomada, crema, colirio, inyección, supositorio, sobre, espray, otro.',
'',
'FORMATO DE UN MATERIAL DE CURAS:',
'{',
'  "tipo": "material",',
'  "nombre": "Agua oxigenada 250 ml",',
'  "categoria": "antiséptico",',
'  "alias": [],',
'  "paraQue": "Para qué se usa",',
'  "advertencias": "Precauciones",',
'  "notas": "Observaciones"',
'}',
'',
'Valores posibles de "categoria": antiséptico, apósito, vendaje, instrumental, protección, otro.',
'',
'Si hay varios productos, devuelve:',
'{ "productos": [ {...}, {...} ] }',
'',
'Rellena solo los campos que conozcas con certeza. No inventes datos.'
].join('\n');

// ---------- DB ----------
var DB_NAME='botiquin', DB_VER=4, db=null;
function openDB(){return new Promise(function(res,rej){
  var r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=function(e){
    var d=e.target.result;
    var tx=e.target.transaction;
    var ov=e.oldVersion;
    ['personas','ubicaciones','existencias','mejoras','checklists','prompts','productos'].forEach(function(s){
      if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'});
    });
    if(ov<4 && d.objectStoreNames.contains('medicamentos')){
      var medStore=tx.objectStore('medicamentos');
      var prodStore=tx.objectStore('productos');
      var exStore=tx.objectStore('existencias');
      var materialMap={};
      medStore.getAll().onsuccess=function(ev){
        var arr=ev.target.result||[];
        arr.forEach(function(m){ m.tipo='medicamento'; prodStore.put(m); });
      };
      exStore.getAll().onsuccess=function(ev){
        var arr=ev.target.result||[];
        arr.forEach(function(ex){
          if(ex.nombreLibre){
            var nn=norm(ex.nombreLibre);
            var pid=materialMap[nn];
            if(!pid){
              pid=uid();
              prodStore.put({id:pid,tipo:'material',nombre:ex.nombreLibre,alias:[],paraQue:'',advertencias:'',notas:ex.notas||'',categoria:'',creado:Date.now(),actualizado:Date.now()});
              materialMap[nn]=pid;
            }
            ex.productoId=pid;
            delete ex.nombreLibre;
            delete ex.medId;
            exStore.put(ex);
          } else if(ex.medId){
            ex.productoId=ex.medId;
            delete ex.medId;
            exStore.put(ex);
          }
        });
      };
    }
  };
  r.onsuccess=function(e){db=e.target.result;res()};
  r.onerror=function(){rej(r.error)};
})}
function dbAll(store){return new Promise(function(res,rej){
  if(!db.objectStoreNames.contains(store))return res([]);
  var r=db.transaction(store,'readonly').objectStore(store).getAll();
  r.onsuccess=function(){res(r.result||[])};r.onerror=function(){rej(r.error)};
})}
function dbPut(store,obj){return new Promise(function(res,rej){
  var r=db.transaction(store,'readwrite').objectStore(store).put(obj);
  r.onsuccess=function(){res(obj)};r.onerror=function(){rej(r.error)};
})}
function dbDel(store,id){return new Promise(function(res,rej){
  var r=db.transaction(store,'readwrite').objectStore(store).delete(id);
  r.onsuccess=function(){res()};r.onerror=function(){rej(r.error)};
})}

// ---------- state ----------
var ST={personas:[],ubicaciones:[],productos:[],existencias:[],mejoras:[],checklists:[],prompts:[]};
var CFG={}, CFG_KEY='botiquin1-cfg';
var TAB='buscar', Q='', UFILTER='', PFILTER='', TIPO_FILTER='', CUR_CL=null, UBI_DETAIL=null, PRODUCT_DETAIL=null;
var PICK_PROMPT_PROD=null;

function loadCfg(){try{CFG=JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}catch(e){CFG={}}}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG))}catch(e){}}

async function loadAll(){
  ST.personas=await dbAll('personas');
  ST.ubicaciones=await dbAll('ubicaciones');
  ST.productos=await dbAll('productos');
  ST.existencias=await dbAll('existencias');
  ST.mejoras=await dbAll('mejoras');
  ST.checklists=await dbAll('checklists');
  ST.prompts=await dbAll('prompts');
  ST.ubicaciones.sort(function(a,b){return (a.orden||99)-(b.orden||99)||a.nombre.localeCompare(b.nombre)});
  ST.productos.sort(function(a,b){return a.nombre.localeCompare(b.nombre)});
  ST.checklists.sort(function(a,b){return a.nombre.localeCompare(b.nombre)});
  ST.prompts.sort(function(a,b){return (a.titulo||'').localeCompare(b.titulo||'')});
}
async function ensureDefaults(){
  if(ST.ubicaciones.length===0){
    var defs=[
      {id:uid(),nombre:'Casa',tipo:'casa',notas:'',orden:1},
      {id:uid(),nombre:'Botiquín montaña',tipo:'botiquin',notas:'',orden:2},
      {id:uid(),nombre:'Botiquín viaje',tipo:'botiquin',notas:'',orden:3}
    ];
    for(var i=0;i<defs.length;i++) await dbPut('ubicaciones',defs[i]);
    ST.ubicaciones=defs;
  }
  var defaults=[
    {id:'prompt_default_photo',titulo:'Extraer información de la foto del medicamento',texto:DEFAULT_PROMPT_PHOTO},
    {id:'prompt_default_import',titulo:'Generar JSON para importar medicamento o material',texto:DEFAULT_PROMPT_IMPORT}
  ];
  for(var i=0;i<defaults.length;i++){
    var exists=ST.prompts.find(function(p){return p.id===defaults[i].id});
    if(!exists) await dbPut('prompts',{id:defaults[i].id,titulo:defaults[i].titulo,texto:defaults[i].texto,creado:Date.now(),actualizado:Date.now()});
  }
  ST.prompts=await dbAll('prompts');
  ST.prompts.sort(function(a,b){return (a.titulo||'').localeCompare(b.titulo||'')});
}

// ---------- lookups ----------
function ubiName(id){var u=ST.ubicaciones.find(function(x){return x.id===id});return u?u.nombre:'(sin ubicación)'}
function persName(id){var p=ST.personas.find(function(x){return x.id===id});return p?p.nombre:''}
function persLabel(id){if(id==='__none__')return 'sin asignar';return persName(id)||''}
function prodOf(exOrId){
  if(!exOrId)return null;
  var id=typeof exOrId==='string'?exOrId:(exOrId.productoId||exOrId.medId);
  if(!id)return null;
  return ST.productos.find(function(x){return x.id===id})||null;
}
function exName(ex){var p=prodOf(ex);return p?p.nombre:'(producto borrado)'}
function cadEf(ex,p){
  var cad=ex.caducidad||'';
  if(p&&p.tipo==='medicamento'&&+p.diasAbierto>0&&ex.abiertoEl){
    var d=new Date(ex.abiertoEl+'T00:00:00');d.setDate(d.getDate()+ +p.diasAbierto);
    var s=dk(d);if(!cad||s<cad)cad=s;
  }
  return cad;
}
function cadStatus(cad){if(!cad)return '';var t=today();if(cad<t)return 'cad';if(cad<inDays(30))return 'prox';return ''}
function cadBadge(cad){var s=cadStatus(cad);if(!s)return '';return '<span class="badge '+s+'">'+(s==='cad'?'Caducado':'Pronto')+'</span>'}
function estBadge(es){return '<span class="badge '+es+'">'+(es==='hay'?'Hay':es==='pocas'?'Pocas':'No hay')+'</span>'}
function tipoBadge(p){
  if(!p)return '';
  if(p.tipo==='material')return '<span class="badge mat">'+(p.categoria?'material · '+esc(p.categoria):'material')+'</span>';
  return '<span class="badge med">medicamento</span>';
}
function prodSig(p){
  if(!p)return '';
  if(p.tipo==='medicamento'){
    if(!p.principioActivo)return 'name:'+norm(p.nombre);
    return 'med:'+norm(p.principioActivo)+'|'+norm(p.dosis)+'|'+norm(p.forma);
  }
  return 'mat:'+norm(p.nombre);
}
function findDuplicateProd(p){
  if(!p.nombre)return null;
  var sig=prodSig(p);
  return ST.productos.find(function(x){return x.id!==p.id&&prodSig(x)===sig})||null;
}
function matchesQuery(p,q){
  if(!q)return true;
  var ss=[p.nombre,p.principioActivo,p.paraQue,p.dosis,p.pauta,p.forma,p.notas,p.categoria,p.advertencias].concat(p.alias||[]);
  return ss.some(function(s){return norm(s).indexOf(q)>=0});
}
function clProgress(cl){
  var tot=cl.items.length,hec=cl.items.filter(function(i){return i.hecho}).length;
  return {tot:tot,hec:hec,pct:tot?Math.round(100*hec/tot):0};
}
function exsByProd(prodId){return ST.existencias.filter(function(e){return e.productoId===prodId})}
function exsByUbi(ubiId){return ST.existencias.filter(function(e){return e.ubicacionId===ubiId})}
function locSummary(p){
  var exs=exsByProd(p.id);
  if(!exs.length)return '<small style="color:var(--m)">sin cajas registradas</small>';
  var byUbi={};
  exs.forEach(function(e){(byUbi[e.ubicacionId]=byUbi[e.ubicacionId]||[]).push(e)});
  return Object.keys(byUbi).map(function(uid){
    var u=ST.ubicaciones.find(function(x){return x.id===uid});
    var list=byUbi[uid];
    var states=list.map(function(e){return e.estado});
    var est=states.indexOf('no')>=0?'no':states.indexOf('pocas')>=0?'pocas':'hay';
    return '<span class="loc-tag">'+esc(u?u.nombre:'?')+' · '+list.length+' caja'+(list.length===1?'':'s')+' '+estBadge(est)+'</span>';
  }).join('');
}

// ---------- clipboard ----------
async function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{await navigator.clipboard.writeText(text);return true;}catch(e){}
  }
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){return false;}
}
function applyPromptVars(text,p){
  if(!p)return text||'';
  var map={'{medicamento}':p.nombre||'','{principioActivo}':p.principioActivo||'','{dosis}':p.dosis||'','{forma}':p.forma||'','{alias}':(p.alias||[]).join(', ')};
  var r=text||'';
  Object.keys(map).forEach(function(k){r=r.split(k).join(map[k])});
  return r;
}
function prodContextBlock(p){
  if(!p)return '';
  var lines=['','---','Producto: '+(p.nombre||'—')];
  if(p.tipo==='medicamento'){
    if(p.principioActivo)lines.push('Principio activo: '+p.principioActivo);
    if(p.dosis)lines.push('Dosis: '+p.dosis);
    if(p.forma)lines.push('Forma: '+p.forma);
    if(p.alias&&p.alias.length)lines.push('Alias: '+p.alias.join(', '));
    if(p.paraQue)lines.push('Para qué sirve: '+p.paraQue);
  } else {
    if(p.categoria)lines.push('Categoría: '+p.categoria);
    if(p.alias&&p.alias.length)lines.push('Alias: '+p.alias.join(', '));
    if(p.paraQue)lines.push('Para qué sirve: '+p.paraQue);
  }
  return lines.join('\n');
}

// ---------- render ----------
function render(){
  $('#print-area').innerHTML='';
  var html;
  if(PRODUCT_DETAIL){html=vProdDet(PRODUCT_DETAIL);}
  else if(UBI_DETAIL){html=vUbiDet(UBI_DETAIL);}
  else if(TAB==='aju'&&CUR_CL){html=vChecklistDetail(CUR_CL);}
  else{var fn={buscar:vBuscar,med:vMed,aju:vAju}[TAB]||vBuscar;html=fn();}
  $('#v').innerHTML=html;
  attachFoldListeners();
  [].forEach.call(document.querySelectorAll('nav button'),function(b){
    var on=false;
    if(PRODUCT_DETAIL){on=(b.dataset.k==='med'||b.dataset.k==='buscar');}
    else if(UBI_DETAIL){on=(b.dataset.k==='buscar');}
    else if(CUR_CL){on=(b.dataset.k==='aju');}
    else{on=(b.dataset.k===TAB);}
    b.className=on?'on':'';
  });
  if(TAB==='buscar'&&!PRODUCT_DETAIL&&!UBI_DETAIL){
    var qi=$('#q');
    if(qi){if(!qi.value){qi.value=Q}var l=qi.value.length;qi.setSelectionRange&&qi.setSelectionRange(l,l)}
  }
  window.scrollTo(0,0);
}
function attachFoldListeners(){
  [].forEach.call(document.querySelectorAll('details.fold'),function(d){
    if(d.dataset.listening)return;
    d.dataset.listening='1';
    d.addEventListener('toggle',function(){
      CFG['fold_'+d.dataset.fold]=d.open;saveCfg();
    });
  });
}

function chipFiltros(){

function renderResultados(){
  if(!Q&&!UFILTER&&!PFILTER){return vDashboard()}
  var q=Q?norm(Q):'';
  var prodHits={};
  ST.existencias.forEach(function(ex){
    if(UFILTER&&ex.ubicacionId!==UFILTER)return;
    var p=prodOf(ex);
    if(!p)return;
    if(PFILTER){
      var pid=p.recetadoA||'';
      if(PFILTER==='__none__'){if(pid!=='')return;}
      else{if(pid!==PFILTER)return;}
    }
    if(q&&!matchesQuery(p,q))return;
    (prodHits[p.id]=prodHits[p.id]||[]).push(ex);
  });
  var keys=Object.keys(prodHits);
  if(!keys.length){
    var msg;
    var uName=UFILTER?ubiName(UFILTER):'';
    var pName=PFILTER?persLabel(PFILTER):'';
    if(q&&UFILTER&&PFILTER)msg='Sin resultados para «'+esc(Q)+'» en '+esc(uName)+' ('+esc(pName)+')';
    else if(q&&UFILTER)msg='Sin resultados para «'+esc(Q)+'» en '+esc(uName);
    else if(q&&PFILTER)msg='Sin resultados para «'+esc(Q)+'» de '+esc(pName);
    else if(q)msg='Sin resultados para «'+esc(Q)+'»';
    else if(UFILTER&&PFILTER)msg='Nada en '+esc(uName)+' de '+esc(pName);
    else if(UFILTER)msg='Esta ubicación está vacía';
    else if(PFILTER)msg='No hay medicación de '+esc(pName);
    else msg='Sin resultados';
    return '<div class="empty">'+msg+'.</div>';
  }
  keys.sort(function(a,b){
    var pa=ST.productos.find(function(x){return x.id===a});
    var pb=ST.productos.find(function(x){return x.id===b});
    return (pa?pa.nombre:'').localeCompare(pb?pb.nombre:'');
  });
  var h='';
  keys.forEach(function(pid){
    var p=ST.productos.find(function(x){return x.id===pid});
    if(!p)return;
    h+=prodCard(p,prodHits[pid],true);
  });
  return h;
}
function vDashboard(){
  var h='';
  var rep=ST.existencias.filter(function(e){return e.estado==='pocas'||e.estado==='no'});
  if(rep.length){
    h+='<div class="sect-title">🛒 Reponer</div>';
    rep.forEach(function(ex){
      var p=prodOf(ex);
      h+='<div class="card"><div class="row"><div class="g"><b>'+esc(exName(ex))+'</b> '+estBadge(ex.estado)+(p?' '+tipoBadge(p):'')+'<br><small>'+esc(ubiName(ex.ubicacionId))+'</small></div>';
      h+='<button class="ok sm" data-a="reponer" data-k="'+ex.id+'">✓ Repuesto</button></div></div>';
    });
  }
  var cads=[];
  ST.existencias.forEach(function(ex){
    var p=prodOf(ex);var cad=cadEf(ex,p);var st=cadStatus(cad);
    if(st==='cad'||st==='prox')cads.push({ex:ex,cad:cad,st:st});
  });
  cads.sort(function(a,b){return a.cad<b.cad?-1:1});
  if(cads.length){
    h+='<div class="sect-title">⏰ Próximas caducidades</div>';
    cads.forEach(function(o){
      h+='<div class="card"><div class="row"><div class="g"><b>'+esc(exName(o.ex))+'</b> '+cadBadge(o.cad)+'<br><small>'+esc(ubiName(o.ex.ubicacionId))+' · caduca '+esc(fmtDate(o.cad))+'</small></div></div></div>';
    });
  }
  if(!rep.length&&!cads.length){
    h='<div class="hint">Todo en orden. Escribe arriba para buscar, o usa <b>+ Medicamento</b> / <b>+ Material</b> para empezar.</div>';
  }
  h+=resumenUbicaciones();
  return h;
}
function resumenUbicaciones(){
  if(!ST.ubicaciones.length)return '';
  var h='<div class="sect-title">📦 Ubicaciones</div>';
  ST.ubicaciones.forEach(function(u){
    var n=exsByUbi(u.id).length;
    h+='<div class="card click" data-a="verubi" data-k="'+u.id+'"><div class="ub-row"><div><b>'+esc(u.nombre)+'</b><br><small>'+(u.tipo==='botiquin'?'botiquín':u.tipo==='casa'?'casa':u.tipo||'')+' · '+n+' caja'+(n===1?'':'s')+'</small></div><span>›</span></div></div>';
  });
  return h;
}

function renderMedList(){
  var q=Q?norm(Q):'';
  var list=ST.productos.filter(function(p){
    if(TIPO_FILTER&&p.tipo!==TIPO_FILTER)return false;
    if(q&&!matchesQuery(p,q))return false;
    return true;
  });
  if(!list.length)return '<div class="empty">Sin productos'+(q?' para «'+esc(Q)+'»':'')+'.</div>';
  var h='';
  list.forEach(function(p){h+=prodCard(p,null,false)});
  return h;
}
function prodCard(p,exsOverride,showLocTags){
  var exs=exsOverride||exsByProd(p.id);
  var h='<div class="card">';
  h+='<div class="click" data-a="vermed" data-k="'+p.id+'">';
  h+='<b>'+esc(p.nombre)+'</b> '+(p.dosis?'<small>'+esc(p.dosis)+'</small>':'')+' '+tipoBadge(p);
  if(p.recetadoA&&persName(p.recetadoA))h+=' <span class="badge tipo">👤 '+esc(persName(p.recetadoA))+'</span>';
  if(p.alias&&p.alias.length)h+='<br><small>También: '+esc(p.alias.join(', '))+'</small>';
  if(p.tipo==='medicamento'&&p.principioActivo)h+='<br><small>'+esc(p.principioActivo)+(p.forma?' · '+esc(p.forma):'')+'</small>';
  if(p.paraQue)h+='<br><small>'+esc(p.paraQue)+'</small>';
  h+='<div class="row"><div class="g">';
  if(showLocTags&&exs){
    var byUbi={};
    exs.forEach(function(e){(byUbi[e.ubicacionId]=byUbi[e.ubicacionId]||[]).push(e)});
    Object.keys(byUbi).forEach(function(uid){
      var list=byUbi[uid];
      var states=list.map(function(e){return e.estado});
      var est=states.indexOf('no')>=0?'no':states.indexOf('pocas')>=0?'pocas':'hay';
      h+='<span class="loc-tag">'+esc(ubiName(uid))+' · '+list.length+' '+estBadge(est)+'</span>';
    });
  } else {
    h+=locSummary(p);
  }
  h+='</div><span>›</span></div>';
  h+='</div>';
  h+='<div class="row"><button class="sm ghost g" data-a="addboxprod" data-k="'+p.id+'">+ Caja</button><button class="sm ghost g" data-a="aiprompt" data-k="'+p.id+'">🤖 IA</button></div>';
  h+='</div>';
  return h;
}

function readProdForm(){
  var p=FP;
  p.nombre=$('#fpn').value.trim();
  if(p.tipo==='material'){p.categoria=$('#fpcat').value;}
  else{
    p.principioActivo=$('#fppa').value.trim();
    p.dosis=$('#fpd').value.trim();
    p.forma=$('#fpf').value;
  }
  p.alias=FP_ALIAS.slice();
  p.paraQue=$('#fppq').value.trim();
  if(p.tipo==='medicamento'){
    p.pauta=$('#fppt').value.trim();
  }
  p.advertencias=$('#fpad').value.trim();
  if(p.tipo==='medicamento'){
    p.conservacion=$('#fpco').value.trim();
    p.nevera=!!$('#fpnev').value;
    p.diasAbierto=Math.max(0,+$('#fpda').value||0);
    p.prospectoURL=$('#fpurl').value.trim();
    p.recetadoA=$('#fpra').value||'';
    p.recetaFoto=FP_FOTO||'';
  }
  p.notas=$('#fpno').value.trim();
  p.actualizado=Date.now();
  return p;
}
function mergeProds(dup,newP){
  if(!dup.alias)dup.alias=[];
  var names=[newP.nombre].concat(newP.alias||[]);
  names.forEach(function(n){
    if(n&&n!==dup.nombre&&dup.alias.indexOf(n)<0)dup.alias.push(n);
  });
  ['principioActivo','dosis','forma','paraQue','pauta','advertencias','conservacion','prospectoURL','notas','categoria'].forEach(function(k){
    if(!dup[k]&&newP[k])dup[k]=newP[k];
  });
  if(!dup.nevera&&newP.nevera)dup.nevera=true;
  if(!dup.diasAbierto&&+newP.diasAbierto>0)dup.diasAbierto=+newP.diasAbierto;
  dup.actualizado=Date.now();
  return dup;
}
function wouldChange(dup,newP){
  if(!dup.alias)dup.alias=[];
  var nameInAlias=dup.nombre===newP.nombre||dup.alias.indexOf(newP.nombre)>=0;
  if(!nameInAlias)return true;
  var fields=['principioActivo','dosis','forma','paraQue','pauta','advertencias','conservacion','prospectoURL','notas','categoria'];
  for(var i=0;i<fields.length;i++){if(!dup[fields[i]]&&newP[fields[i]])return true;}
  if(!dup.nevera&&newP.nevera)return true;
  if(!dup.diasAbierto&&+newP.diasAbierto>0)return true;
  return false;
}

function exportJSON(){

  document.body.appendChild(a);a.click();a.remove();

async function importJSON(text){
  var data;
  try{data=JSON.parse(text)}catch(e){throw new Error('JSON inválido');}
  var isFull=data.app==='botiquin'||(data.medicamentos&&data.existencias)||(data.productos&&data.existencias);
  if(!isFull) return await importPartial(text);
  if(!confirm('Esto sustituye TODOS los datos actuales. ¿Continuar?'))return;
  var stores=['personas','ubicaciones','existencias','mejoras','checklists','prompts','productos'];
  for(var i=0;i<stores.length;i++){
    var s=stores[i];
    var olds=await dbAll(s);
    for(var j=0;j<olds.length;j++) await dbDel(s,olds[j].id);
  }
  var simple=['personas','ubicaciones','mejoras','checklists','prompts'];
  for(var i=0;i<simple.length;i++){
    var s=simple[i];var arr=data[s]||[];
    for(var k=0;k<arr.length;k++) await dbPut(s,arr[k]);
  }
  var prods=data.productos||data.medicamentos||[];
  for(var i=0;i<prods.length;i++){
    var p=prods[i];
    if(!p.tipo)p.tipo='medicamento';
    await dbPut('productos',p);
  }
  var materialMap={};
  var exs=data.existencias||[];
  for(var i=0;i<exs.length;i++){
    var ex=exs[i];
    if(ex.productoId){await dbPut('existencias',ex);}
    else if(ex.medId){ex.productoId=ex.medId;delete ex.medId;await dbPut('existencias',ex);}
    else if(ex.nombreLibre){
      var nn=norm(ex.nombreLibre);
      var pid=materialMap[nn];
      if(!pid){
        pid=uid();
        await dbPut('productos',{id:pid,tipo:'material',nombre:ex.nombreLibre,alias:[],paraQue:'',advertencias:'',notas:ex.notas||'',categoria:'',creado:Date.now(),actualizado:Date.now()});
        materialMap[nn]=pid;
      }
      ex.productoId=pid;delete ex.nombreLibre;await dbPut('existencias',ex);
    }
  }
  CFG=data.cfg||CFG;saveCfg();
  CUR_CL=null;Q='';UFILTER='';PFILTER='';TIPO_FILTER='';PRODUCT_DETAIL=null;UBI_DETAIL=null;
  await loadAll();
  if(ST.prompts.length===0)await ensureDefaults();
  render();
  alert('Datos restaurados.');
}
function normalizeIncoming(p){
  return {
    id:uid(),
    tipo:p.tipo==='material'?'material':'medicamento',
    nombre:String(p.nombre||'').trim(),
    principioActivo:p.principioActivo||'',
    dosis:p.dosis||'',
    forma:p.forma||'',
    alias:Array.isArray(p.alias)?p.alias.slice():[],
    paraQue:p.paraQue||'',
    pauta:p.pauta||'',
    advertencias:p.advertencias||'',
    conservacion:p.conservacion||'',
    nevera:!!p.nevera,
    diasAbierto:+p.diasAbierto||0,
    prospectoURL:p.prospectoURL||'',
    notas:p.notas||'',
    categoria:p.categoria||'',
    creado:Date.now(),
    actualizado:Date.now()
  };
}
function findDupForImport(list,p){
  var byName=list.find(function(x){return norm(x.nombre)===norm(p.nombre)&&x.tipo===p.tipo});
  if(byName)return byName;
  if(p.tipo==='medicamento'&&p.principioActivo){
    var sig=norm(p.principioActivo)+'|'+norm(p.dosis)+'|'+norm(p.forma);
    var bySig=list.find(function(x){
      if(x.tipo!=='medicamento'||!x.principioActivo)return false;
      return (norm(x.principioActivo)+'|'+norm(x.dosis)+'|'+norm(x.forma))===sig;
    });
    if(bySig)return bySig;
  }
  return null;
}
async function importPartial(text){
  var data;
  try{data=JSON.parse(text)}catch(e){throw new Error('JSON inválido');}
  var arr;
  if(Array.isArray(data))arr=data;
  else if(data.productos&&Array.isArray(data.productos))arr=data.productos;
  else if(data.tipo==='medicamento'||data.tipo==='material'||data.nombre)arr=[data];
  else throw new Error('Formato no reconocido. Se esperaba un array, {productos:[...]} o un objeto único.');
  if(!arr.length)throw new Error('El archivo no contiene productos.');
  var nuevos=[],mergedExisting=[],fusionados=[],ignorados=[];
  for(var i=0;i<arr.length;i++){
    var inc=arr[i];
    if(!inc||!inc.nombre){ignorados.push({nombre:'(sin nombre)'});continue;}
    var np=normalizeIncoming(inc);
    var dup=findDupForImport(ST.productos,np);
    if(dup){
      if(wouldChange(dup,np)){
        var me=mergedExisting.find(function(x){return x.id===dup.id});
        if(me)mergeProds(me,np);
        else{var copy=JSON.parse(JSON.stringify(dup));mergeProds(copy,np);mergedExisting.push(copy);}
        fusionados.push({nuevo:np.nombre,dup:dup.nombre});
      } else {ignorados.push({nombre:np.nombre});}
      continue;
    }
    var dupNew=findDupForImport(nuevos,np);
    if(dupNew){
      if(wouldChange(dupNew,np)){mergeProds(dupNew,np);fusionados.push({nuevo:np.nombre,dup:dupNew.nombre});}
      else{ignorados.push({nombre:np.nombre});}
      continue;
    }
    nuevos.push(np);
  }
  var lines=['Importación parcial de catálogo:',''];
  lines.push('• Nuevos: '+nuevos.length);
  lines.push('• Fusionados con existentes: '+fusionados.length);
  lines.push('• Ignorados (idénticos): '+ignorados.length);
  lines.push('');
  if(nuevos.length){lines.push('Nuevos:');nuevos.forEach(function(p){lines.push('  + '+p.nombre)});lines.push('')}
  if(fusionados.length){lines.push('Fusionados:');fusionados.forEach(function(f){lines.push('  ~ '+f.nuevo+' → '+f.dup)});lines.push('')}
  if(ignorados.length){lines.push('Ignorados:');ignorados.forEach(function(ig){lines.push('  = '+ig.nombre)});lines.push('')}
  lines.push('¿Aplicar cambios?');
  if(!confirm(lines.join('\n')))return;
  for(var i=0;i<nuevos.length;i++) await dbPut('productos',nuevos[i]);
  for(var i=0;i<mergedExisting.length;i++) await dbPut('productos',mergedExisting[i]);
  await loadAll();
  render();
  alert('Importación aplicada.\nNuevos: '+nuevos.length+' · Fusionados: '+fusionados.length+' · Ignorados: '+ignorados.length);
}

    if(a==='delprompt'){

    }

      return;
    }

      var v=$('#fpa').value.trim();
      if(v){FP_ALIAS.push(v);$('#fpa').value='';$('#fpaliases').innerHTML=aliasList()}

    if(a==='saveprod'){
      var prod=readProdForm();

      if(k==='new'){

          }
        }
        await dbPut('productos',prod);await loadAll();closeMod();
        openExForm(newExObj(prod.id,''),true);
        return;
      }else{
        await dbPut('productos',prod);await loadAll();closeMod();render();return;
      }
    }
    if(a==='delprod'){
      if(!confirm('¿Borrar el producto y todas sus cajas?'))return;
      var prodToDel=ST.productos.find(function(x){return x.id===k});
      var fallbackName=prodToDel?prodToDel.nombre:'(producto borrado)';
      var exs=ST.existencias.filter(function(x){return x.productoId===k});
      for(var i=0;i<exs.length;i++) await dbDel('existencias',exs[i].id);
      for(var j=0;j<ST.checklists.length;j++){
        var cl=ST.checklists[j],changed=false;
        cl.items.forEach(function(it){
          if((it.productoId===k)||(it.medId===k)){
            it.productoId='';it.medId='';
            if(!it.texto)it.texto=fallbackName;
            changed=true;
          }
        });
        if(changed){cl.actualizado=Date.now();await dbPut('checklists',cl)}
      }
      await dbDel('productos',k);
      await loadAll();PRODUCT_DETAIL=null;render();return;
    }

    // Existencia
    if(a==='addboxprod'){openExForm(newExObj(k,t.dataset.u||''),true);return}
    if(a==='addboxubi'){openAddBoxChoice(k);return}
    if(a==='pickprod'){var u=t.dataset.u;closeMod();openExForm(newExObj(k,u),true);return}
    if(a==='picknewmed'){closeMod();openProdForm(newProdObj('medicamento'),true);return}
    if(a==='picknewmat'){closeMod();openProdForm(newProdObj('material'),true);return}
    if(a==='pm-pick'){var cb=PICK_CB;PICK_CB=null;closeMod();if(cb)await cb(k);return}
    if(a==='editex'){var ex=ST.existencias.find(function(x){return x.id===k});if(ex)openExForm(JSON.parse(JSON.stringify(ex)),false);return}
    if(a==='saveex'){
      var ex2=readExForm();
      if(!ex2.productoId){alert('Producto no válido.');return}
      if(!ex2.ubicacionId){alert('Elige una ubicación.');return}
      await dbPut('existencias',ex2);await loadAll();closeMod();render();return;
    }
    if(a==='delex'){if(!confirm('¿Quitar esta caja?'))return;await dbDel('existencias',k);await loadAll();render();return}
    if(a==='estado'){
      var ex3=ST.existencias.find(function(x){return x.id===k});if(!ex3)return;
      ex3.estado=ex3.estado==='hay'?'pocas':ex3.estado==='pocas'?'no':'hay';
      await dbPut('existencias',ex3);await loadAll();render();return;
    }
    if(a==='reponer'){
      var ex4=ST.existencias.find(function(x){return x.id===k});if(!ex4)return;
      ex4.estado='hay';await dbPut('existencias',ex4);await loadAll();
      if(TAB==='buscar'&&!PRODUCT_DETAIL&&!UBI_DETAIL){$('#res').innerHTML=renderResultados()}else{render()}
      return;
    }
    if(a==='dupex'){
      var exD=ST.existencias.find(function(x){return x.id===k});
      if(!exD)return;
      var newEx={id:uid(),productoId:exD.productoId,ubicacionId:'',estado:exD.estado,caducidad:exD.caducidad,abiertoEl:'',lote:'',notas:exD.notas,actualizado:Date.now()};
      openExForm(newEx,true);
      return;
    }
    if(a==='dupex_from_form'){
      var cur=readExForm();
      var cp=JSON.parse(JSON.stringify(cur));
      cp.id=uid();cp.ubicacionId='';cp.abiertoEl='';cp.actualizado=Date.now();
      openExForm(cp,true);
      return;
    }

    // Ubicación
    if(a==='newubi'){openUbiForm({id:uid(),nombre:'',tipo:'casa',notas:'',orden:ST.ubicaciones.length+1},true);return}
    if(a==='editu'){var u2=ST.ubicaciones.find(function(x){return x.id===k});if(u2)openUbiForm(JSON.parse(JSON.stringify(u2)),false);return}
    if(a==='saveubi'){
      var uu=readUbiForm();
      if(!uu.nombre){alert('Pon un nombre.');return}
      await dbPut('ubicaciones',uu);await loadAll();closeMod();render();return;
    }
    if(a==='delu'){
      var nEx=exsByUbi(k).length;
      if(!confirm('¿Borrar la ubicación'+(nEx?' y sus '+nEx+' cajas':'')+'?'))return;
      var ee=exsByUbi(k);
      for(var i=0;i<ee.length;i++) await dbDel('existencias',ee[i].id);
      await dbDel('ubicaciones',k);
      if(UFILTER===k)UFILTER='';
      if(UBI_DETAIL===k)UBI_DETAIL=null;
      await loadAll();render();return;
    }
    if(a==='printu'){doPrint(buildPrintForUbi(k));return}

    // Impresión dinámica
    if(a==='printselall'){[].forEach.call(document.querySelectorAll('.printubi'),function(cb){cb.checked=true});return}
    if(a==='printselnone'){[].forEach.call(document.querySelectorAll('.printubi'),function(cb){cb.checked=false});return}
    if(a==='printsel'){
      var ubiIds=[];
      [].forEach.call(document.querySelectorAll('.printubi'),function(cb){if(cb.checked)ubiIds.push(cb.dataset.k)});
      var persId=$('#printpers')?$('#printpers').value:'';
      if(!ubiIds.length){alert('Marca al menos una ubicación.');return}
      doPrint(buildPrintSelection(ubiIds,persId));return;
    }

    // Persona
    if(a==='newpers'){openPersForm({id:uid(),nombre:'',notas:''},true);return}
    if(a==='editpers'){var p=ST.personas.find(function(x){return x.id===k});if(p)openPersForm(JSON.parse(JSON.stringify(p)),false);return}
    if(a==='savepers'){
      var pp=readPersForm();
      if(!pp.nombre){alert('Pon un nombre.');return}
      await dbPut('personas',pp);await loadAll();closeMod();render();return;
    }
    if(a==='delpers'){
      if(!confirm('¿Borrar esta persona?'))return;
      for(var i=0;i<ST.productos.length;i++){
        if(ST.productos[i].recetadoA===k){ST.productos[i].recetadoA='';await dbPut('productos',ST.productos[i])}
      }
      await dbDel('personas',k);
      if(PFILTER===k)PFILTER='';
      await loadAll();render();return;
    }

    // Checklist
    if(a==='opencl'){CUR_CL=k;TAB='aju';PRODUCT_DETAIL=null;UBI_DETAIL=null;render();return}
    if(a==='backcl'){CUR_CL=null;render();return}
    if(a==='newcl'){openChecklistForm(newChecklistObj(),true);return}
    if(a==='editcl'){var cl2=ST.checklists.find(function(x){return x.id===k});if(cl2)openChecklistForm(JSON.parse(JSON.stringify(cl2)),false);return}
    if(a==='savecl'){
      syncChecklistForm();
      if(!FC.nombre){alert('Pon un nombre a la lista.');return}
      FC.actualizado=Date.now();
      await dbPut('checklists',FC);
      await loadAll();closeMod();
      CUR_CL=FC.id;TAB='aju';render();return;
    }
    if(a==='delcl'){
      if(!confirm('¿Borrar esta lista?'))return;
      await dbDel('checklists',k);await loadAll();
      if(CUR_CL===k)CUR_CL=null;
      render();return;
    }
    if(a==='usetpl'){
      var tp=$('#cltpl')?$('#cltpl').value:'';
      if(!tp){alert('Elige una plantilla.');return}
      var cl3=buildChecklistFromTemplate(tp);
      if(!cl3){alert('Plantilla no disponible.');return}
      await dbPut('checklists',cl3);
      await loadAll();CUR_CL=cl3.id;render();return;
    }
    if(a==='clall'||a==='clnone'){
      var cl4=ST.checklists.find(function(x){return x.id===CUR_CL});if(!cl4)return;
      var vv=(a==='clall');
      cl4.items.forEach(function(it){it.hecho=vv});
      cl4.actualizado=Date.now();
      await dbPut('checklists',cl4);await loadAll();render();return;
    }
    if(a==='clquickadd'){
      pickProduct(async function(prodId){
        var c=ST.checklists.find(function(x){return x.id===k});if(!c)return;
        c.items.push({id:uid(),productoId:prodId,texto:'',hecho:false,nota:''});
        c.actualizado=Date.now();
        await dbPut('checklists',c);await loadAll();
        CUR_CL=c.id;render();
      });
      return;
    }
    if(a==='clquicktext'){
      var txt=prompt('Texto del elemento (para comprar o que no es producto):');
      if(txt&&txt.trim()){
        var c2=ST.checklists.find(function(x){return x.id===k});if(!c2)return;
        c2.items.push({id:uid(),productoId:'',texto:txt.trim(),hecho:false,nota:''});
        c2.actualizado=Date.now();
        await dbPut('checklists',c2);await loadAll();CUR_CL=c2.id;render();
      }
      return;
    }
    if(a==='claddmed'){
      syncChecklistForm();
      pickProduct(function(prodId){
        FC.items.push({id:uid(),productoId:prodId,texto:'',hecho:false,nota:''});
        openChecklistForm(FC,false);
      });
      return;
    }
    if(a==='claddtext'){
      syncChecklistForm();
      var txt2=prompt('Texto del elemento:');
      if(txt2&&txt2.trim())FC.items.push({id:uid(),productoId:'',texto:txt2.trim(),hecho:false,nota:''});
      openChecklistForm(FC,false);
      return;
    }
    if(a==='cldelitem'){
      syncChecklistForm();
      FC.items.splice(+k,1);
      openChecklistForm(FC,false);
      return;
    }

    // Mejoras
    if(a==='mjadd'){
      var txt3=($('#mjt').value||'').trim();if(!txt3)return;
      await dbPut('mejoras',{id:uid(),ts:Date.now(),texto:txt3,estado:'abierta'});
      await loadAll();render();return;
    }
    if(a==='mjdone'){
      var mj=ST.mejoras.find(function(x){return x.id===k});
      if(mj){mj.estado=mj.estado==='hecha'?'abierta':'hecha';await dbPut('mejoras',mj);await loadAll();render()}
      return;
    }
    if(a==='mjdel'){await dbDel('mejoras',k);await loadAll();render();return}
    if(a==='mjcopy'){
      var abs=ST.mejoras.filter(function(x){return x.estado!=='hecha'});
      if(!abs.length){alert('No hay mejoras pendientes.');return}
      var t2=abs.map(function(x){return '- ['+new Date(x.ts).toLocaleDateString('es-ES')+'] '+x.texto}).join('\n');
      var okc=await copyToClipboard(t2);
      if(okc)alert('Copiado ('+abs.length+')');
      else prompt('Copia manualmente:',t2);
      return;
    }

    // Backup
    if(a==='export'){exportJSON();return}
    if(a==='showjson'){
      $('#jtxt').value=JSON.stringify({v:4,app:'botiquin',personas:ST.personas,ubicaciones:ST.ubicaciones,productos:ST.productos,existencias:ST.existencias,mejoras:ST.mejoras,checklists:ST.checklists,prompts:ST.prompts,cfg:CFG},null,2);
      return;
    }
    if(a==='import'){
      var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
      inp.onchange=async function(){if(!inp.files[0])return;var txt4=await inp.files[0].text();try{await importJSON(txt4)}catch(er){alert('Error: '+er.message)}};
      inp.click();return;
    }
    if(a==='importpartial'){
      var inp2=document.createElement('input');inp2.type='file';inp2.accept='.json,application/json';
      inp2.onchange=async function(){if(!inp2.files[0])return;var txt5=await inp2.files[0].text();try{await importPartial(txt5)}catch(er){alert('Error: '+er.message)}};
      inp2.click();return;
    }
    if(a==='restorejson'){
      try{await importJSON($('#jtxt').value)}catch(er){alert('Error: '+er.message)}
      return;
    }

    // Modal
    if(a==='closemod'){closeMod();return}
    if(a==='zoom'){
      var src=t.getAttribute('src');
      if(src){openMod('<img src="'+esc(src)+'" style="max-width:100%;display:block"><div class="row"><button data-a="closemod" style="width:100%">Cerrar</button></div>')}
      return;
    }
  }catch(err){
    console.error(err);alert('Error: '+(err&&err.message||err));
  }
}

async function onChange(e){
  var t=e.target;
  if(t.dataset&&t.dataset.a==='cltoggle'){
    var cl=ST.checklists.find(function(x){return x.id===t.dataset.cl});if(!cl)return;
    var it=cl.items.find(function(x){return x.id===t.dataset.k});if(!it)return;
    it.hecho=t.checked;
    cl.actualizado=Date.now();
    await dbPut('checklists',cl);await loadAll();
    if(TAB==='aju'&&CUR_CL){$('#v').innerHTML=vChecklistDetail(CUR_CL)}
    return;
  }
  if(t.id==='fpfile'&&t.files&&t.files[0]){
    try{
      var data=await compressImage(t.files[0]);
      FP_FOTO=data;
      $('#fpfotoprev').innerHTML='<img class="ph" src="'+esc(data)+'" alt="receta">';
    }catch(er){alert('No se pudo procesar la imagen.')}
  }
}

function compressImage(file){
  return new Promise(function(res,rej){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var max=900,sc=Math.min(1,max/img.width);
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.72));
      };
      img.onerror=rej;img.src=e.target.result;
    };
    reader.onerror=rej;reader.readAsDataURL(file);
  });
}
</script>
