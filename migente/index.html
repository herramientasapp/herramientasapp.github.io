<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c5f7c">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi gente">
<title>Mi gente</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#2d3436;--muted:#7f8c8d;--primary:#2c5f7c;--primary-soft:#e6eef3;--accent:#e07856;--accent-soft:#fbeae4;--sage:#7a9b86;--line:#e5e0d8;--warn:#d97706;--danger:#c0392b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1a1f24;--card:#242b32;--ink:#f0e9e0;--muted:#a0a8b0;--primary:#7fb3cc;--primary-soft:#1e3341;--accent:#f59e7c;--accent-soft:#3d2a23;--sage:#a8c5b8;--line:#34404a;--warn:#f0a853;--danger:#e57373;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:15;background:var(--primary);color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font:600 22px Georgia,serif;letter-spacing:.2px}
header .bell{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:4px 10px;position:relative}
header .bell .badge{position:absolute;top:0;right:2px;background:var(--accent);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;display:none;align-items:center;justify-content:center;font-weight:600}
header .bell .badge.on{display:flex}
#bellPanel{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px}
#bellPanel.open{display:block}
#bellPanel h3{margin:0 0 8px;font-size:15px;color:var(--primary)}
#bellPanel .alert{padding:8px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
#bellPanel .alert:last-child{border:0}
#bellPanel .alert .ico{font-size:20px}
#bellPanel .alert.backup{cursor:default}
#bellPanel .empty{color:var(--muted);font-size:14px;margin:0}
main{max-width:620px;margin:0 auto;padding:14px}
h2{font:600 24px Georgia,serif;margin:8px 0 4px}
.mut{color:var(--muted)}.s{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;margin-bottom:10px}
.search::placeholder{color:var(--muted)}

/* v1.3: tarjetas de persona más compactas */
.pcard{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin:4px 0;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit;min-height:0}
.pcard:active{background:var(--primary-soft)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font:600 17px Georgia,serif;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:96px;height:96px;font-size:38px}
.avatar.xl{width:140px;height:140px;font-size:54px}
.avatar.tiny{width:30px;height:30px;font-size:12px}
.pname{font-weight:600;font-size:15px;line-height:1.25}
.pmeta{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--primary-soft);color:var(--primary);margin-right:4px;margin-top:3px}
.ptag.dead{background:#eee;color:#666}
@media(prefers-color-scheme:dark){.ptag.dead{background:#333;color:#999}}
.dead-cross{color:var(--muted);font-weight:400;font-size:.9em;margin-left:2px}

.ficha-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ficha-head .info{flex:1}
.ficha-head h2{margin:0}
.ficha-head .apodo{font-size:14px;color:var(--muted);margin-top:2px}
.rel-chip{display:inline-block;padding:6px 12px;border-radius:20px;background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:14px;margin:4px 4px 4px 0}
.rel-chip.rel-mujer{background:var(--sage);color:#fff}
.ctx{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:8px;margin:10px 0;font-style:italic;color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:500;text-align:right}
.btn{display:inline-block;padding:12px 18px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin:4px 4px 0 0;font-family:inherit}
.btn.alt{background:var(--primary-soft);color:var(--primary)}
.btn.call{background:var(--accent);color:#fff;width:100%;margin:8px 0}
.btn.call.confirm{background:var(--warn);animation:pulse 1s infinite}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{display:block;width:100%;margin:8px 0}
.btn.small{padding:6px 12px;font-size:13px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
label{display:block;margin:10px 0;font-size:13px;color:var(--muted);font-weight:500}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
textarea{resize:vertical;min-height:60px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label{margin:0}
.photo-zone{display:flex;flex-direction:column;align-items:center;padding:16px;border:2px dashed var(--line);border-radius:14px;margin:10px 0;cursor:pointer;background:var(--bg)}
.photo-zone img{max-width:200px;max-height:200px;border-radius:12px}
.photo-zone .hint{color:var(--muted);font-size:13px;margin-top:8px}
input[type=file]{display:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 0;font-size:11px;cursor:pointer;font-family:inherit}
nav button span{display:block;font-size:22px;margin-bottom:2px}
nav button.on{color:var(--primary);font-weight:700}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:12px}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
.flash .reveal-btn{padding:16px 32px;font-size:18px;border-radius:14px;background:var(--primary);color:#fff;border:0;cursor:pointer;margin-top:20px;font-weight:600;font-family:inherit}
.sec{font:600 17px Georgia,serif;margin:20px 0 8px;color:var(--ink)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:var(--card);border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{margin:0 0 12px;font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin-bottom:8px;-webkit-overflow-scrolling:touch;flex-wrap:wrap}
.chips button{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.lnk{background:none;border:0;color:var(--primary);font-size:15px;cursor:pointer;padding:6px 0;font-family:inherit;text-align:left}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
details.card>summary{cursor:pointer;font-weight:600;padding:4px 0;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸ ';color:var(--muted)}
details.card[open]>summary::before{content:'▾ '}
.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.print-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px;background:var(--card)}
.print-item .pn{font-weight:bold;font-size:14px}
.print-item .pr{font-size:12px;color:var(--muted)}
.vinculo-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.vinculo-row:last-child{border:0}
.vinculo-row .v-name{flex:1;font-size:14px}
.vinculo-row .v-name a{color:var(--primary);text-decoration:none;font-weight:500}
.vinculo-row .v-tipo{font-size:12px;color:var(--muted);padding:2px 8px;background:var(--primary-soft);border-radius:10px}
.vinculo-row .v-del{background:none;border:0;color:var(--danger);font-size:20px;cursor:pointer;padding:0 6px;line-height:1}
.idea{padding:10px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border:0}
.idea .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.idea .texto{white-space:pre-wrap;margin-bottom:6px}
.idea.impl .texto{text-decoration:line-through;color:var(--muted)}
.idea .actions{display:flex;gap:6px;flex-wrap:wrap}
.grupo-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.grupo-row:last-child{border:0}
.grupo-row input,.grupo-row .icon-input{width:auto;flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.grupo-row .icon-input{flex:0 0 60px;text-align:center}
.picker{position:relative}
.picker input{padding-right:34px}
.picker .clear-pick{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;display:none;padding:4px 8px}
.picker .clear-pick.on{display:block}
.pick-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:4px;background:var(--bg)}
.pick-list .pick-item{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.pick-list .pick-item:last-child{border:0}
.pick-list .pick-item:hover,.pick-list .pick-item.sel{background:var(--primary-soft)}
.pick-list .pick-item .meta{color:var(--muted);font-size:12px}
.pick-list .pick-empty{padding:10px 12px;color:var(--muted);font-size:13px}
.tag-section{margin:12px 0}
.tag-section .tag-title{font:600 15px Georgia,serif;color:var(--ink);margin:0;display:flex;align-items:center;gap:6px}
.tag-section .tag-title .count{font-size:12px;color:var(--muted);font-weight:400}
.tag-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:14px;background:var(--accent-soft);color:var(--accent);border:1px dashed var(--accent);font-size:13px;cursor:pointer;font-family:inherit}
.tag-chip .n{font-weight:700;opacity:.85}
.form-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.form-actions .btn{flex:1 1 auto;min-width:140px;margin:0;text-align:center}
.banner-dup{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.banner-dup b{color:var(--accent)}
.group-h{font:600 14px Georgia,serif;color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.5px;font-size:12px}

/* v1.3: pantalla de bloqueo */
#lockScreen{position:fixed;inset:0;background:var(--primary);color:#fff;z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lockScreen.on{display:flex}
#lockScreen .lock-ico{font-size:64px;margin-bottom:16px}
#lockScreen h2{font:600 26px Georgia,serif;margin:0 0 8px;color:#fff}
#lockScreen p{opacity:.85;margin:0 0 24px;max-width:320px}
#lockScreen .btn{background:#fff;color:var(--primary);padding:16px 32px;font-size:17px}
#lockScreen .btn.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
#lockScreen .lock-msg{margin-top:16px;font-size:13px;opacity:.8;min-height:20px}

/* v1.3: sección de etiquetas */
.tag-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tag-edit-row:last-child{border:0}
.tag-edit-row .t-name{flex:1;font-size:14px}
.tag-edit-row .t-count{font-size:12px;color:var(--muted);padding:2px 8px;background:var(--primary-soft);border-radius:10px}
.tag-edit-row .btn.small{margin:0}
.password-row{display:flex;gap:8px;margin-top:8px}
.password-row input{flex:1}
.enc-opt{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px;color:var(--ink)}
.enc-opt input{width:auto;margin:0}
.warn-box{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}

@media print{
  body{padding:0;background:#fff;color:#000}
  header,nav,.noprint,.btn{display:none!important}
  main{padding:0;max-width:none}
  .print-grid{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .print-item{border:1px solid #ccc;page-break-inside:avoid}
  .print-item .pn{font-size:12pt}.print-item .pr{font-size:10pt;color:#555}
  @page{margin:12mm}
}

function nextBirthday(cumple){
  if(!cumple)return null;
  const parts=cumple.split('-');
  let mm,dd,y=null;
  if(parts.length===3){y=parseInt(parts[0]);mm=parseInt(parts[1]);dd=parseInt(parts[2]);}
  else if(parts.length===2){mm=parseInt(parts[0]);dd=parseInt(parts[1]);}
  else return null;
  if(isNaN(mm)||isNaN(dd)||mm<1||mm>12||dd<1||dd>31)return null;
  if(y!=null&&isNaN(y))y=null;
  const hoy=new Date();
  const hoy0=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate());
  let next=new Date(hoy.getFullYear(),mm-1,dd);
  if(next<hoy0)next=new Date(hoy.getFullYear()+1,mm-1,dd);
  const dias=Math.round((next-hoy0)/864e5);
  const age=y?next.getFullYear()-y:null;
  return{dias,age,fecha:next};
}

let webauthnAvailable=!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
function b64urlToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf.buffer;}
function bufToB64url(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

async function registerLock(){
  if(!webauthnAvailable){toast('Este navegador no permite el desbloqueo del móvil');return false;}
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const userId=crypto.getRandomValues(new Uint8Array(16));
    const cred=await navigator.credentials.create({
      publicKey:{
        challenge,
        rp:{name:'Mi gente'},
        user:{id:userId,name:'migente-user',displayName:'Mi gente'},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
        timeout:60000,
        attestation:'none'
      }
    });
    if(!cred)return false;
    await idbSet('lockCredId',bufToB64url(cred.rawId));
    return true;
  }catch(e){console.warn(e);toast('No se pudo activar el desbloqueo');return false;}
}
async function hasLockCredential(){const v=await idbGet('lockCredId');return !!v;}
async function unlockApp(){
  const msg=$('#lockMsg');if(msg)msg.textContent='';
  if(!webauthnAvailable){hideLock();return;}
  const credIdB64=await idbGet('lockCredId');
  if(!credIdB64){hideLock();return;}
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const cred=await navigator.credentials.get({
      publicKey:{
        challenge,
        allowCredentials:[{type:'public-key',id:b64urlToBuf(credIdB64)}],
        userVerification:'required',
        timeout:60000
      }
    });
    if(cred){hideLock();}
    else if(msg){msg.textContent='No se pudo verificar. Inténtalo de nuevo.';}
  }catch(e){
    console.warn(e);
    if(e.name==='NotAllowedError'){if(msg)msg.textContent='Desbloqueo cancelado. Toca "Desbloquear" para reintentar.';}
    else if(e.name==='InvalidStateError'||e.name==='NotFoundError'){
      if(msg)msg.textContent='El desbloqueo del móvil ha cambiado. Desactívalo y vuelve a activarlo en Ajustes.';
    }else{if(msg)msg.textContent='Error de desbloqueo. Reintenta o desactiva el bloqueo.';}
  }
}

  if(!confirm('¿Desactivar el bloqueo de la app? Podrás volver a activarlo en Ajustes.'))return;

}

  if(['hermano','hermana','hermano/a','primo','prima','primo segundo','prima segunda'].includes(t))return'Hermanos y primos';
  if(['tío','tía','tío/a','sobrino','sobrina','sobrino/a','tío abuelo','tía abuela','sobrino nieto','sobrina nieta','sobrino/a nieto/a'].includes(t))return'Tíos y sobrinos';

const ORDEN_CAT=['Cónyuge / pareja','Descendientes','Ascendientes','Hermanos y primos','Tíos y sobrinos','Familia política','Padrinos / ahijados','Otros'];
function renderVinculos(p){
  if(!p.vinculos||!p.vinculos.length)return'<p class="mut s">Sin vínculos registrados. Toca "+ Añadir vínculo" para empezar.</p>';
  const items=p.vinculos.map(v=>{const o=getP(v.personaId);if(!o)return null;return{persona:o,tipo:v.tipo};}).filter(Boolean);
  if(!items.length)return'<p class="mut s">Sin vínculos registrados.</p>';
  const byCat={};items.forEach(it=>{const cat=categoriaDeTipo(it.tipo);if(!byCat[cat])byCat[cat]=[];byCat[cat].push(it);});
  let html='';
  for(const cat of ORDEN_CAT){
    if(!byCat[cat])continue;
    html+=`<div class="group-h">${cat}</div>`;
    html+=byCat[cat].map(it=>`<div class="vinculo-row">
      ${avatar(it.persona,'tiny')}
      <span class="v-name"><a href="#" onclick="openFicha('${it.persona.id}');return false">${esc(it.persona.nombre)}</a>${it.persona.fallecido?'<span class="dead-cross">†</span>':''}</span>
      <span class="v-tipo">${esc(it.tipo)}</span>
      <button class="v-del" onclick="delVinculo('${p.id}','${it.persona.id}')" title="Borrar vínculo">×</button>
    </div>`).join('');
  }
  return html;
}

function filterPicker(q){
  q=norm(q);const list=document.getElementById('pickList');if(!list)return;
  const clearBtn=document.getElementById('pickClear');if(clearBtn)clearBtn.classList.toggle('on',!!q);
  const items=list.querySelectorAll('.pick-item');let shown=0;
  items.forEach(it=>{const ok=!q||it.dataset.norm.includes(q);it.style.display=ok?'':'none';if(ok)shown++;});
  let empty=list.querySelector('.pick-empty');
  if(!shown){if(!empty){empty=document.createElement('div');empty.className='pick-empty';empty.textContent='Sin coincidencias.';list.appendChild(empty);}}

}

function renderVinculoPicker(personId,q){
  const list=document.getElementById('v_persona_list');if(!list)return;
  q=norm(q);
  const otras=S.personas.filter(x=>x.id!==personId).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  const filtradas=otras.filter(x=>!q||norm(x.nombre).includes(q)||norm(x.apodo).includes(q));
  const sel=document.getElementById('v_persona').value;

function selectVinculo(id){
  const h=document.getElementById('v_persona');if(!h)return;
  h.value=id;const p=getP(id);
  const q=document.getElementById('v_persona_q');if(q&&p)q.value=p.nombre;

  if(list)list.innerHTML=`<div class="pick-item sel"><span>Seleccionado: <b>${esc(p?p.nombre:'')}</b></span></div>`;

function saveVinculo(personId){
  const otherId=$('#v_persona').value;const tipo=$('#v_tipo').value;
  if(!otherId||!tipo){toast('Elige persona y tipo');return;}
  addVinculo(personId,otherId,tipo);closeModal();toast('Vínculo añadido');
}
function addVinculo(personId,otherId,tipo){
  if(personId===otherId)return;
  const p=getP(personId),o=getP(otherId);if(!p||!o)return;
  if(!p.vinculos)p.vinculos=[];if(!o.vinculos)o.vinculos=[];
  const existingP=p.vinculos.find(v=>v.personaId===otherId);
  if(existingP)existingP.tipo=tipo;else p.vinculos.push({personaId:otherId,tipo});
  const inv=inverseTipo(tipo,p.sexo);
  const existingO=o.vinculos.find(v=>v.personaId===personId);
  if(existingO)existingO.tipo=inv;else o.vinculos.push({personaId:personId,tipo:inv});
  upd();
}
function delVinculo(personId,otherId){
  if(!confirm('¿Borrar este vínculo? Se borrará también el inverso.'))return;
  const p=getP(personId),o=getP(otherId);if(!p)return;
  p.vinculos=(p.vinculos||[]).filter(v=>v.personaId!==otherId);
  if(o)o.vinculos=(o.vinculos||[]).filter(v=>v.personaId!==personId);
  upd();toast('Vínculo borrado');
}
function recomputeAllInverses(){
  for(const p of S.personas){for(const v of(p.vinculos||[])){const o=getP(v.personaId);if(!o)continue;const inv=inverseTipo(v.tipo,p.sexo);const existing=(o.vinculos||[]).find(x=>x.personaId===p.id);if(existing)existing.tipo=inv;}}
}
function closeModal(){$('#modal').innerHTML='';}
function callStart(tel){
  const btn=$('#callBtn');if(!btn)return;
  if(btn.classList.contains('confirm')){
    const a=document.createElement('a');a.href='tel:'+tel;a.click();
    btn.classList.remove('confirm');const p=getP(currentId);
    btn.textContent='📞 Llamar a '+(p?p.nombre.split(' ')[0]:'');
    clearTimeout(callTimer);
  }else{
    btn.classList.add('confirm');btn.textContent='📞 ¿Seguro? Toca otra vez';
    callTimer=setTimeout(()=>{const b=$('#callBtn');if(!b)return;b.classList.remove('confirm');const p=getP(currentId);if(p)b.textContent='📞 Llamar a '+p.nombre.split(' ')[0];},3000);
  }
}

function borrarPersona(id){
  if(!confirm('¿Borrar esta persona? No se puede deshacer.'))return;
  S.personas=S.personas.filter(p=>p.id!==id);
  for(const p of S.personas){p.vinculos=(p.vinculos||[]).filter(v=>v.personaId!==id);}
  upd();go('personas');toast('Persona borrada');
}

function saveFormFromBtn(ev,action){

async function handlePhoto(input){
  const file=input.files[0];if(!file)return;
  const dataUri=await resizePhoto(file);
  const zone=$('.photo-zone');if(!zone)return;
  zone.innerHTML=`<img id="photoPreview" src="${dataUri}"><div class="hint">Toca para cambiar</div>`;
  zone.dataset.foto=dataUri;
}
function clearPhoto(){
  const zone=$('.photo-zone');if(!zone)return;
  zone.innerHTML=`<div style="font-size:48px;color:var(--muted)">📷</div><div class="hint">Toca para hacer una foto o elegir de la galería</div>`;
  zone.dataset.foto='';
}
function resizePhoto(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=400;let{width,height}=img;
        if(width>max||height>max){if(width>height){height=Math.round(height*max/width);width=max}else{width=Math.round(width*max/height);height=max}}
        const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}
function findDuplicates(nombre,excludeId){
  const key=norm(nombre);
  return S.personas.filter(p=>p.id!==excludeId&&norm(p.nombre)===key);
}
function saveForm(e,action){
  e.preventDefault();
  const f=e.target;
  const zone=$('.photo-zone');
  let foto;
  if(zone.dataset.foto!==undefined)foto=zone.dataset.foto||null;
  else foto=editingId?getP(editingId).foto:null;
  const datos={
    nombre:f.nombre.value.trim(),apodo:f.apodo.value.trim(),comoLlamar:f.comoLlamar.value.trim(),
    sexo:f.sexo.value,grupo:f.grupo.value,relacionConmigo:f.relacionConmigo.value.trim(),
    relacionMujer:f.relacionMujer?f.relacionMujer.value.trim():'',contexto:f.contexto.value.trim(),
    telefono:f.telefono.value.trim(),ciudad:f.ciudad.value.trim(),cumple:f.cumple.value.trim(),
    etiquetas:f.etiquetas.value.split(',').map(t=>t.trim()).filter(Boolean),notas:f.notas.value.trim(),
    ultimaVez:f.ultimaVez.value,fallecido:f.fallecido.checked,foto
  };
  if(!datos.nombre){toast('El nombre es obligatorio');return;}
  const dup=findDuplicates(datos.nombre,editingId);
  if(dup.length&&!f.dataset.dupConfirmed){
    const banner=document.getElementById('dupBanner');
    if(banner){
      banner.innerHTML=`<div class="banner-dup">Ya existe <b>${esc(dup[0].nombre)}</b>${dup.length>1?' y otros '+dup.length:''}. ¿Es la misma persona?</div>
      <div style="margin-top:6px">
        <button type="button" class="btn small alt" onclick="window.openFicha('${dup[0].id}')">Abrir la existente</button>
        <button type="button" class="btn small" onclick="document.getElementById('pform').dataset.dupConfirmed='1';document.getElementById('pform').requestSubmit()">Es otra persona, guardar igual</button>
      </div>`;
      banner.scrollIntoView({behavior:'smooth',block:'center'});
    }
    return;
  }
  const acc=f.__action||action||'stay';
  let savedId=null;
  if(editingId){
    const id=editingId;const old=getP(id);
    Object.assign(old,datos);recomputeAllInverses();savedId=id;editingId=null;upd();
    if(acc==='stay'){openFicha(savedId);toast('Guardado');}
  }else{
    const np={id:uid(),...datos,vinculos:[]};
    S.personas.push(np);savedId=np.id;upd();
  }
  if(acc==='new'){
    const g=datos.grupo;editingId=null;tab='anadir';sub='';render();
    setTimeout(()=>{const sel=document.querySelector('#pform select[name=grupo]');if(sel)sel.value=g;},0);
    toast('Guardado. Añade otra persona');window.scrollTo(0,0);
  }else if(acc==='family'){
    editingId=null;openFicha(savedId);toast('Guardado. Añade familiares desde Vínculos');
    setTimeout(()=>{addVinculoUI(savedId);},200);
  }else if(acc==='stay'&&!editingId){openFicha(savedId);toast('Añadido');}
}

function vFlash(){
  const pool=S.personas.filter(p=>!p.fallecido&&(!flashGroup||p.grupo===flashGroup));
  if(!pool.length){return `<h2>Repaso</h2><div class="empty"><div class="big">🎯</div><p>No hay personas para repasar.</p><p class="s">Añade personas a tu lista primero.</p></div>`;}
  if(!flashId||!pool.find(p=>p.id===flashId)){flashId=pool[Math.floor(Math.random()*pool.length)].id;flashRevealed=false;}
  const p=getP(flashId);const rel=p.relacionConmigo||p.relacionMujer||'';
  let html=`<button class="lnk" onclick="go('mas')">‹ Más</button><h2>Repaso</h2><div class="chips"><button class="${!flashGroup?'on':''}" onclick="flashGroup=null;flashId=null;render()">Todas</button>${S.grupos.map(g=>`<button class="${flashGroup===g.id?'on':''}" onclick="flashGroup='${g.id}';flashId=null;render()">${g.icono} ${esc(g.nombre)}</button>`).join('')}</div>`;
  html+=`<div class="flash">${avatar(p,'xl')}`;
  if(flashRevealed){
    html+=`<h2 style="margin-top:16px;margin-bottom:4px">${esc(p.nombre)}</h2>`;
    if(p.apodo)html+=`<p class="mut" style="margin:0">«${esc(p.apodo)}»</p>`;
    if(rel)html+=`<p style="margin:8px 0;font-size:18px"><span class="rel-chip">${esc(rel)}</span></p>`;
    if(p.contexto)html+=`<p class="ctx" style="max-width:400px">"${esc(p.contexto)}"</p>`;
  }else{
    html+=`<button class="reveal-btn" onclick="flashRevealed=true;render()">👁️ ¿Quién es?</button><p class="mut s" style="margin-top:16px">Piensa un momento antes de revelar.</p>`;
  }
  html+=`</div>`;
  if(flashRevealed){html+=`<div class="card noprint" style="text-align:center"><button class="btn" onclick="flashRevealed=false;flashId=null;render()">Otra persona</button><button class="btn alt" onclick="openFicha('${p.id}')">Ver ficha</button></div>`;}
  return html;
}

function vEtiquetas(){
  const tagMap={};
  for(const p of S.personas){for(const t of (p.etiquetas||[])){const key=norm(t);if(!key)continue;if(!tagMap[key])tagMap[key]={label:t,count:0};tagMap[key].count++;}}
  const tags=Object.entries(tagMap).sort((a,b)=>a[1].label.localeCompare(b[1].label,'es'));
  let html=`<button class="lnk" onclick="go('mas')">‹ Volver</button><h2>Etiquetas</h2>`;
  html+=`<p class="mut s">Renombrar una etiqueta la actualiza en todas las personas que la comparten. Borrarla la quita de todas.</p>`;
  html+=`<div class="card">`;
  if(!tags.length){html+=`<p class="mut s">Todavía no hay etiquetas. Añádelas al editar una persona.</p>`;}
  else{
    html+=tags.map(([key,v])=>`<div class="tag-edit-row">
      <span class="t-name">${esc(v.label)}</span>
      <span class="t-count">${v.count}</span>
      <button class="btn small alt" onclick="renameTag('${esc(v.label).replace(/'/g,"\\'")}')">✏️</button>
      <button class="btn small danger" onclick="deleteTag('${esc(v.label).replace(/'/g,"\\'")}')">🗑️</button>
    </div>`).join('');
  }
  html+=`</div>`;
  html+=`<div class="card"><div class="sec" style="margin-top:0">Crear etiqueta nueva</div>
    <p class="mut s" style="margin-top:0">Crea la etiqueta y asígnala a las personas que quieras.</p>
    <label>Nombre de la etiqueta<input id="newTagName" placeholder="Ej.: primos de María"></label>
    <button class="btn" onclick="openNewTagPicker()">Elegir personas y crear</button>
  </div>`;
  return html;
}
function renameTag(oldLabel){
  const tagMap={};
  for(const p of S.personas){for(const t of (p.etiquetas||[])){const key=norm(t);if(!key)continue;tagMap[key]=t;}}
  const oldKey=norm(oldLabel);
  const current=tagMap[oldKey]||oldLabel;
  const nuevo=prompt('Nuevo nombre para la etiqueta "'+current+'":',current);
  if(nuevo===null)return;
  const nn=nuevo.trim();
  if(!nn){toast('El nombre no puede estar vacío');return;}
  const newKey=norm(nn);
  if(newKey===oldKey){/* solo cambia mayúsculas/acentos visibles */
    for(const p of S.personas){p.etiquetas=(p.etiquetas||[]).map(t=>norm(t)===oldKey?nn:t);}
    upd();toast('Etiqueta actualizada');return;
  }
  /* fusionar si ya existe */
  let merged=0;
  for(const p of S.personas){
    if(!Array.isArray(p.etiquetas))continue;
    const tenia=p.etiquetas.some(t=>norm(t)===oldKey);
    if(!tenia)continue;
    /* quitar la vieja y añadir la nueva sin duplicar */
    p.etiquetas=p.etiquetas.filter(t=>norm(t)!==oldKey);
    if(!p.etiquetas.some(t=>norm(t)===newKey)){p.etiquetas.push(nn);}
    else merged++;
  }
  upd();
  toast(merged?`Etiqueta renombrada y fusionada (${merged} duplicados evitados)`:'Etiqueta renombrada en todas las personas');
}
function deleteTag(label){
  const key=norm(label);
  const count=S.personas.filter(p=>(p.etiquetas||[]).some(t=>norm(t)===key)).length;
  if(!confirm(`¿Borrar la etiqueta "${label}" de ${count} persona${count===1?'':'s'}?`))return;
  for(const p of S.personas){p.etiquetas=(p.etiquetas||[]).filter(t=>norm(t)!==key);}
  upd();toast('Etiqueta borrada');
}
function openNewTagPicker(){
  const nombre=$('#newTagName').value.trim();
  if(!nombre){toast('Escribe un nombre para la etiqueta');return;}
  const key=norm(nombre);
  const yaExiste=S.personas.some(p=>(p.etiquetas||[]).some(t=>norm(t)===key));
  if(yaExiste){
    if(!confirm(`La etiqueta "${nombre}" ya existe. ¿Añadirla a más personas?`))return;
  }
  const otras=S.personas.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  const listHtml=otras.map(p=>`<label style="display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px;color:var(--ink)"><input type="checkbox" class="tagpick" value="${p.id}" style="width:auto;margin:0"> ${esc(p.nombre)}${p.fallecido?' <span class="dead-cross">†</span>':''}${p.apodo?` <span class="mut s">«${esc(p.apodo)}»</span>`:''}</label>`).join('');
  $('#modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Asignar "${esc(nombre)}" a…</h3>
    <div class="pick-list" style="max-height:50vh">${listHtml||'<div class="pick-empty">No hay personas.</div>'}</div>
    <div style="margin-top:12px"><button class="btn" onclick="confirmNewTag('${esc(nombre).replace(/'/g,"\\'")}')">Guardar</button><button class="btn alt" onclick="closeModal()">Cancelar</button></div>
  </div></div>`;
}
function confirmNewTag(nombre){
  const key=norm(nombre);
  const checks=document.querySelectorAll('.tagpick:checked');
  let n=0;
  for(const c of checks){
    const p=getP(c.value);if(!p)continue;
    if(!Array.isArray(p.etiquetas))p.etiquetas=[];
    if(!p.etiquetas.some(t=>norm(t)===key)){p.etiquetas.push(nombre);n++;}
  }
  closeModal();upd();
  toast(n?`Etiqueta asignada a ${n} persona${n===1?'':'s'}`:'No se seleccionó ninguna persona');
}

function addGrupo(){const icono=$('#ng_icono').value.trim()||'📌';const nombre=$('#ng_nombre').value.trim();if(!nombre){toast('Pon un nombre');return;}S.grupos.push({id:uid(),nombre,icono});upd();toast('Grupo añadido');}
function delGrupo(i){
  const g=S.grupos[i];const count=S.personas.filter(p=>p.grupo===g.id).length;
  if(count>0){
    const otras=S.grupos.filter((_,idx)=>idx!==i);

function openExportModal(){
  $('#modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Exportar copia</h3>
    <div class="enc-opt"><input type="radio" name="encMode" id="encOn" value="on" checked><label for="encOn" style="margin:0;color:var(--ink);font-weight:500">Cifrada con contraseña <span class="mut s">(recomendado)</span></label></div>
    <div class="enc-opt"><input type="radio" name="encMode" id="encOff" value="off"><label for="encOff" style="margin:0;color:var(--ink);font-weight:500">Sin cifrar <span class="mut s">(red de seguridad si olvidas la contraseña)</span></label></div>
    <div id="encPwdBox">
      <label>Contraseña (mínimo 6 caracteres)<input type="password" id="expPwd" autocomplete="new-password"></label>
      <label>Repite la contraseña<input type="password" id="expPwd2" autocomplete="new-password"></label>
      <div class="warn-box">⚠️ Si olvidas esta contraseña, no podrás recuperar la copia. Guárdala en un lugar seguro.</div>
    </div>
    <div style="margin-top:12px"><button class="btn" onclick="doExport()">Exportar</button><button class="btn alt" onclick="closeModal()">Cancelar</button></div>
  </div></div>`;
  document.querySelectorAll('input[name=encMode]').forEach(r=>r.addEventListener('change',()=>{
    const on=document.getElementById('encOn').checked;
    document.getElementById('encPwdBox').style.display=on?'':'none';
  }));
}
async function deriveKey(password,salt,iter){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function doExport(){
  const cifrado=document.getElementById('encOn').checked;
  S.lastBackup=today();await save();
  const payload=JSON.stringify({app:'migente',...S,exportado:new Date().toISOString()});
  let blob,filename;
  if(cifrado){
    const pwd=document.getElementById('expPwd').value;
    const pwd2=document.getElementById('expPwd2').value;
    if(pwd.length<6){toast('La contraseña debe tener al menos 6 caracteres');return;}
    if(pwd!==pwd2){toast('Las contraseñas no coinciden');return;}
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const iter=310000;
    const key=await deriveKey(pwd,salt,iter);
    const enc=new TextEncoder();
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(payload));
    const out={app:'migente',encrypted:true,v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter,salt:bufToB64url(salt),iv:bufToB64url(iv),data:bufToB64url(ct)};
    blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
    filename=`mi-gente-cifrada-${today()}.json`;
  }else{
    blob=new Blob([JSON.stringify({app:'migente',...S,exportado:new Date().toISOString()},null,1)],{type:'application/json'});
    filename=`mi-gente-${today()}.json`;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  URL.revokeObjectURL(a.href);
  closeModal();
  toast(cifrado?'Copia cifrada descargada':'Copia sin cifrar descargada');
  setTimeout(render,100);
}
function importJSON(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.app!=='migente')throw 0;
      if(d.encrypted===true){
        const pwd=prompt('Esta copia está cifrada. Introduce la contraseña:');
        if(pwd===null){input.value='';return;}
        try{
          const salt=b64urlToBuf(d.salt);const iv=b64urlToBuf(d.iv);const ct=b64urlToBuf(d.data);
          const key=await deriveKey(pwd,salt,d.iter||310000);
          const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
          const txt=new TextDecoder().decode(dec);
          const inner=JSON.parse(txt);
          if(inner.app!=='migente'||!Array.isArray(inner.personas))throw 0;
          if(!confirm('Se reemplazarán todos los datos actuales. ¿Continuar?')){input.value='';return;}
          S=migrate(inner);S.set=Object.assign(DEF().set,S.set);
          await save();upd();go('inicio');toast('Copia cifrada cargada');
        }catch(e){alert('Contraseña incorrecta o archivo dañado.');}
      }else{
        if(!Array.isArray(d.personas))throw 0;
        if(!confirm('Se reemplazarán todos los datos actuales. ¿Continuar?')){input.value='';return;}
        S=migrate(d);S.set=Object.assign(DEF().set,S.set);
        await save();upd();go('inicio');toast('Copia cargada');
      }
    }catch(e){alert('Archivo no válido. Debe ser una copia de Mi gente.');}
    input.value='';
  };r.readAsText(f);
}
function exportCSV(){
  const headers=['nombre','apodo','comoLlamar','sexo','grupo','relacionConmigo','relacionMujer','contexto','telefono','ciudad','cumple','etiquetas','notas','ultimaVez','fallecido','vinculos'];
  const rows=S.personas.map(p=>{
    const grupo=getG(p.grupo);
    const vincs=(p.vinculos||[]).map(v=>{const o=getP(v.personaId);return o?`${o.nombre} (${v.tipo})`:'';}).filter(Boolean).join('; ');
    return [p.nombre||'',p.apodo||'',p.comoLlamar||'',p.sexo||'',grupo?grupo.nombre:'',p.relacionConmigo||'',p.relacionMujer||'',p.contexto||'',p.telefono||'',p.ciudad||'',p.cumple||'',(p.etiquetas||[]).join('; '),p.notas||'',p.ultimaVez||'',p.fallecido?'sí':'no',vincs];
  });
  const csv=[headers,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mi-gente-${today()}.csv`;a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV descargado');
}
