<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c5f7c">
<title>Mi gente</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#2d3436;--muted:#7f8c8d;--primary:#2c5f7c;--primary-soft:#e6eef3;--accent:#e07856;--accent-soft:#fbeae4;--sage:#7a9b86;--line:#e5e0d8;--warn:#d97706;--danger:#c0392b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1a1f24;--card:#242b32;--ink:#f0e9e0;--muted:#a0a8b0;--primary:#7fb3cc;--primary-soft:#1e3341;--accent:#f59e7c;--accent-soft:#3d2a23;--sage:#a8c5b8;--line:#34404a;--warn:#f0a853;--danger:#e57373;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:15;background:var(--primary);color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font:600 22px Georgia,serif;letter-spacing:.2px}
header .bell{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:4px 10px;position:relative}
header .bell .badge{position:absolute;top:0;right:2px;background:var(--accent);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;display:none;align-items:center;justify-content:center;font-weight:600}
header .bell .badge.on{display:flex}
#bellPanel{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px}
#bellPanel.open{display:block}
#bellPanel h3{margin:0 0 8px;font-size:15px;color:var(--primary)}
#bellPanel .alert{padding:8px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
#bellPanel .alert:last-child{border:0}
#bellPanel .alert .ico{font-size:20px}
#bellPanel .alert.backup{cursor:default}
#bellPanel .empty{color:var(--muted);font-size:14px;margin:0}
main{max-width:620px;margin:0 auto;padding:14px}
h2{font:600 24px Georgia,serif;margin:8px 0 4px}
.mut{color:var(--muted)}.s{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;margin-bottom:10px}
.search::placeholder{color:var(--muted)}
.pcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.pcard:active{background:var(--primary-soft)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font:600 22px Georgia,serif;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:96px;height:96px;font-size:38px}
.avatar.xl{width:140px;height:140px;font-size:54px}
.avatar.tiny{width:36px;height:36px;font-size:14px}
.pname{font-weight:600;font-size:16px}
.pmeta{font-size:13px;color:var(--muted);margin-top:2px}
.ptag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--primary-soft);color:var(--primary);margin-right:4px;margin-top:3px}
.ptag.dead{background:#eee;color:#666}
@media(prefers-color-scheme:dark){.ptag.dead{background:#333;color:#999}}
.ficha-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ficha-head .info{flex:1}
.ficha-head h2{margin:0}
.ficha-head .apodo{font-size:14px;color:var(--muted);margin-top:2px}
.rel-chip{display:inline-block;padding:6px 12px;border-radius:20px;background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:14px;margin:4px 4px 4px 0}
.rel-chip.rel-mujer{background:var(--sage);color:#fff}
.ctx{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:8px;margin:10px 0;font-style:italic;color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:500;text-align:right}
.btn{display:inline-block;padding:12px 18px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin:4px 4px 0 0;font-family:inherit}
.btn.alt{background:var(--primary-soft);color:var(--primary)}
.btn.call{background:var(--accent);color:#fff;width:100%;margin:8px 0}
.btn.call.confirm{background:var(--warn);animation:pulse 1s infinite}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{display:block;width:100%;margin:8px 0}
.btn.small{padding:6px 12px;font-size:13px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
label{display:block;margin:10px 0;font-size:13px;color:var(--muted);font-weight:500}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
textarea{resize:vertical;min-height:60px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label{margin:0}
.photo-zone{display:flex;flex-direction:column;align-items:center;padding:16px;border:2px dashed var(--line);border-radius:14px;margin:10px 0;cursor:pointer;background:var(--bg)}
.photo-zone img{max-width:200px;max-height:200px;border-radius:12px}
.photo-zone .hint{color:var(--muted);font-size:13px;margin-top:8px}
input[type=file]{display:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 0;font-size:11px;cursor:pointer;font-family:inherit}
nav button span{display:block;font-size:22px;margin-bottom:2px}
nav button.on{color:var(--primary);font-weight:700}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:12px}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center}
.flash .reveal-btn{padding:16px 32px;font-size:18px;border-radius:14px;background:var(--primary);color:#fff;border:0;cursor:pointer;margin-top:20px;font-weight:600;font-family:inherit}
.sec{font:600 17px Georgia,serif;margin:20px 0 8px;color:var(--ink)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:var(--card);border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{margin:0 0 12px;font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin-bottom:8px;-webkit-overflow-scrolling:touch;flex-wrap:wrap}
.chips button{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.lnk{background:none;border:0;color:var(--primary);font-size:15px;cursor:pointer;padding:6px 0;font-family:inherit;text-align:left}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
details.card>summary{cursor:pointer;font-weight:600;padding:4px 0;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸ ';color:var(--muted)}
details.card[open]>summary::before{content:'▾ '}
.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.print-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px;background:var(--card)}
.print-item .pn{font-weight:bold;font-size:14px}
.print-item .pr{font-size:12px;color:var(--muted)}
.vinculo-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vinculo-row:last-child{border:0}
.vinculo-row .v-name{flex:1}
.vinculo-row .v-name a{color:var(--primary);text-decoration:none;font-weight:500}
.vinculo-row .v-tipo{font-size:12px;color:var(--muted);padding:2px 8px;background:var(--primary-soft);border-radius:10px}
.vinculo-row .v-del{background:none;border:0;color:var(--danger);font-size:20px;cursor:pointer;padding:0 6px;line-height:1}
.idea{padding:10px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border:0}
.idea .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.idea .texto{white-space:pre-wrap;margin-bottom:6px}
.idea.impl .texto{text-decoration:line-through;color:var(--muted)}
.idea .actions{display:flex;gap:6px;flex-wrap:wrap}
.grupo-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.grupo-row:last-child{border:0}
.grupo-row input,.grupo-row .icon-input{width:auto;flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.grupo-row .icon-input{flex:0 0 60px;text-align:center}
@media print{
  body{padding:0;background:#fff;color:#000}
  header,nav,.noprint,.btn{display:none!important}
  main{padding:0;max-width:none}
  .print-grid{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .print-item{border:1px solid #ccc;page-break-inside:avoid}
  .print-item .pn{font-size:12pt}.print-item .pr{font-size:10pt;color:#555}
  @page{margin:12mm}
}
</style></head><body>
<header>
  <h1>Mi gente</h1>
  <button class="bell" onclick="toggleBell()">🔔<span class="badge" id="bellBadge"></span></button>
</header>
<div id="bellPanel"></div>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
const APP_VERSION='1.1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>iso(new Date());
const fd=s=>s?s.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const D=s=>new Date(s+'T12:00');
const days=(a,b)=>Math.round((D(a)-D(b))/864e5);

const GRUPOS_DEF=[
  {id:'familiaPropia',nombre:'Mi familia',icono:'👨‍👩‍👧'},
  {id:'familiaPolitica',nombre:'Familia política',icono:'💍'},
  {id:'amigos',nombre:'Amistades',icono:'🤝'},
  {id:'otros',nombre:'Otros',icono:'📌'}
];

const INVERSO_MAP={
  'padre':{m:'hijo',f:'hija',n:'hijo/a'},'madre':{m:'hijo',f:'hija',n:'hijo/a'},
  'hijo':{m:'padre',f:'madre',n:'padre/madre'},'hija':{m:'padre',f:'madre',n:'padre/madre'},
  'hermano':{m:'hermano',f:'hermana',n:'hermano/a'},'hermana':{m:'hermano',f:'hermana',n:'hermano/a'},
  'abuelo':{m:'nieto',f:'nieta',n:'nieto/a'},'abuela':{m:'nieto',f:'nieta',n:'nieto/a'},
  'nieto':{m:'abuelo',f:'abuela',n:'abuelo/a'},'nieta':{m:'abuelo',f:'abuela',n:'abuelo/a'},
  'bisabuelo':{m:'bisnieto',f:'bisnieta',n:'bisnieto/a'},'bisabuela':{m:'bisnieto',f:'bisnieta',n:'bisnieto/a'},
  'bisnieto':{m:'bisabuelo',f:'bisabuela',n:'bisabuelo/a'},'bisnieta':{m:'bisabuelo',f:'bisabuela',n:'bisabuelo/a'},
  'tío':{m:'sobrino',f:'sobrina',n:'sobrino/a'},'tía':{m:'sobrino',f:'sobrina',n:'sobrino/a'},
  'sobrino':{m:'tío',f:'tía',n:'tío/a'},'sobrina':{m:'tío',f:'tía',n:'tío/a'},
  'tío abuelo':{m:'sobrino nieto',f:'sobrina nieta',n:'sobrino/a nieto/a'},
  'tía abuela':{m:'sobrino nieto',f:'sobrina nieta',n:'sobrino/a nieto/a'},
  'sobrino nieto':{m:'tío abuelo',f:'tía abuela',n:'tío/a abuelo/a'},
  'sobrina nieta':{m:'tío abuelo',f:'tía abuela',n:'tío/a abuelo/a'},
  'primo':{m:'primo',f:'prima',n:'primo/a'},'prima':{m:'primo',f:'prima',n:'primo/a'},
  'primo segundo':{m:'primo segundo',f:'prima segunda',n:'primo/a segundo/a'},
  'prima segunda':{m:'primo segundo',f:'prima segunda',n:'primo/a segundo/a'},
  'cuñado':{m:'cuñado',f:'cuñada',n:'cuñado/a'},'cuñada':{m:'cuñado',f:'cuñada',n:'cuñado/a'},
  'suegro':{m:'yerno',f:'nuera',n:'yerno/nuera'},'suegra':{m:'yerno',f:'nuera',n:'yerno/nuera'},
  'yerno':{m:'suegro',f:'suegra',n:'suegro/a'},'nuera':{m:'suegro',f:'suegra',n:'suegro/a'},
  'esposo':{m:'esposo',f:'esposa',n:'esposo/a'},'esposa':{m:'esposo',f:'esposa',n:'esposo/a'},
  'pareja':{m:'pareja',f:'pareja',n:'pareja'},
  'novio':{m:'novio',f:'novia',n:'novio/a'},'novia':{m:'novio',f:'novia',n:'novio/a'},
  'ex pareja':{m:'ex pareja',f:'ex pareja',n:'ex pareja'},
  'ex novio':{m:'ex novio',f:'ex novia',n:'ex novio/a'},'ex novia':{m:'ex novio',f:'ex novia',n:'ex novio/a'},
  'amigo':{m:'amigo',f:'amiga',n:'amigo/a'},'amiga':{m:'amigo',f:'amiga',n:'amigo/a'},
  'amigo en común':{m:'amigo en común',f:'amigo en común',n:'amigo en común'},
  'compañero de trabajo':{m:'compañero de trabajo',f:'compañera de trabajo',n:'compañero/a de trabajo'},
  'compañera de trabajo':{m:'compañero de trabajo',f:'compañera de trabajo',n:'compañero/a de trabajo'},
  'compañero de la mili':{m:'compañero de la mili',f:'compañera de la mili',n:'compañero/a de la mili'},
  'compañero de clase':{m:'compañero de clase',f:'compañera de clase',n:'compañero/a de clase'},
  'vecino':{m:'vecino',f:'vecina',n:'vecino/a'},'vecina':{m:'vecino',f:'vecina',n:'vecino/a'},
  'conocido':{m:'conocido',f:'conocida',n:'conocido/a'},'conocida':{m:'conocido',f:'conocida',n:'conocido/a'},
  'jefe':{m:'empleado',f:'empleada',n:'empleado/a'},'jefa':{m:'empleado',f:'empleada',n:'empleado/a'},
  'empleado':{m:'jefe',f:'jefa',n:'jefe/a'},'empleada':{m:'jefe',f:'jefa',n:'jefe/a'},
  'padrino':{m:'ahijado',f:'ahijada',n:'ahijado/a'},'madrina':{m:'ahijado',f:'ahijada',n:'ahijado/a'},
  'ahijado':{m:'padrino',f:'madrina',n:'padrino/madrina'},'ahijada':{m:'padrino',f:'madrina',n:'padrino/madrina'},
  'hijo de amigo':{m:'padre de amigo',f:'padre de amigo',n:'padre/madre de amigo'},
  'hija de amigo':{m:'padre de amigo',f:'padre de amigo',n:'padre/madre de amigo'},
  'padre de amigo':{m:'hijo de amigo',f:'hija de amigo',n:'hijo/a de amigo'},
  'madre de amigo':{m:'hijo de amigo',f:'hija de amigo',n:'hijo/a de amigo'},
  'hermano de amigo':{m:'hermano de amigo',f:'hermana de amigo',n:'hermano/a de amigo'},
  'hermana de amigo':{m:'hermano de amigo',f:'hermana de amigo',n:'hermano/a de amigo'}
};

const TIPOS_OPCIONES=[
  'padre','madre','hijo','hija','hermano','hermana',
  'abuelo','abuela','nieto','nieta','bisabuelo','bisabuela','bisnieto','bisnieta',
  'tío','tía','sobrino','sobrina','tío abuelo','tía abuela','sobrino nieto','sobrina nieta',
  'primo','prima','primo segundo','prima segunda',
  'cuñado','cuñada','suegro','suegra','yerno','nuera',
  'esposo','esposa','pareja','novio','novia','ex pareja','ex novio','ex novia',
  'amigo','amiga','amigo en común',
  'compañero de trabajo','compañera de trabajo','compañero de la mili','compañero de clase',
  'vecino','vecina','conocido','conocida',
  'jefe','jefa','empleado','empleada',
  'padrino','madrina','ahijado','ahijada',
  'hijo de amigo','hija de amigo','padre de amigo','madre de amigo','hermano de amigo','hermana de amigo'
];

function inverseTipo(originalTipo,sexo){
  const m=INVERSO_MAP[originalTipo];
  if(!m)return originalTipo;
  if(sexo==='m')return m.m;
  if(sexo==='f')return m.f;
  return m.n;
}

const DEF=()=>({
  version:1.1,
  personas:[],
  grupos:JSON.parse(JSON.stringify(GRUPOS_DEF)),
  ideas:[],
  set:{miNombre:'',miMujer:'',umbralDias:180,diasCumple:15,mostrarRecientes:true,avisarCopia:true},
  lastBackup:null
});

let S=DEF();
let tab='inicio';
let sub='';
let currentId=null;
let editingId=null;
let flashGroup=null;
let flashId=null;
let flashRevealed=false;
let callTimer=null;
window.__searchQ='';
window.__grupoFilter='todos';
window.__printFilter='todos';

const db=new Promise(res=>{
  try{const r=indexedDB.open('migente',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}
});

async function load(){
  let v=null;const d=await db;
  if(d){try{v=await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){}}
  if(v)S=migrate(v);
  else{
    try{const ls=localStorage.getItem('migente');if(ls)S=migrate(JSON.parse(ls))}catch(e){}
  }
  S.set=Object.assign(DEF().set,S.set);
}
async function save(){
  const c=JSON.parse(JSON.stringify(S));
  const d=await db;
  if(d){try{d.transaction('kv','readwrite').objectStore('kv').put(c,'s')}catch(e){}}
  try{localStorage.setItem('migente',JSON.stringify(c))}catch(e){}
}
function migrate(d){
  d.version=d.version||1.0;
  if(d.version<1.1){
    if(!d.grupos||!d.grupos.length)d.grupos=JSON.parse(JSON.stringify(GRUPOS_DEF));
    (d.personas||[]).forEach(p=>{
      if(!p.vinculos)p.vinculos=[];
      if(p.sexo===undefined)p.sexo='';
      if(!p.grupo)p.grupo='otros';
    });
    if(!d.ideas)d.ideas=[];
    d.set=d.set||{};
    if(d.set.diasCumple===undefined)d.set.diasCumple=15;
    if(d.set.mostrarRecientes===undefined)d.set.mostrarRecientes=true;
    if(d.set.avisarCopia===undefined)d.set.avisarCopia=true;
    d.version=1.1;
  }
  return d;
}
function upd(){save();render();}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function getP(id){return S.personas.find(p=>p.id===id);}
function getG(id){return S.grupos.find(g=>g.id===id);}

function initials(nombre){
  if(!nombre)return '?';
  const parts=nombre.trim().split(/\s+/);
  if(parts.length===1)return parts[0][0].toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function avatar(p,cls=''){
  if(p.foto)return`<div class="avatar ${cls}"><img src="${p.foto}" alt=""></div>`;
  return`<div class="avatar ${cls}">${esc(initials(p.nombre))}</div>`;
}

function nextBirthday(cumple){
  if(!cumple)return null;
  const parts=cumple.split('-');
  let mm,dd,y=null;
  if(parts.length===3){y=parseInt(parts[0]);mm=parseInt(parts[1]);dd=parseInt(parts[2]);}
  else if(parts.length===2){mm=parseInt(parts[0]);dd=parseInt(parts[1]);}
  else return null;
  if(isNaN(mm)||isNaN(dd)||mm<1||mm>12||dd<1||dd>31)return null;
  if(y!=null&&isNaN(y))y=null;
  const hoy=new Date();
  const hoy0=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate());
  let next=new Date(hoy.getFullYear(),mm-1,dd);
  if(next<hoy0)next=new Date(hoy.getFullYear()+1,mm-1,dd);
  const dias=Math.round((next-hoy0)/864e5);
  const age=y?next.getFullYear()-y:null;
  return{dias,age,fecha:next};
}

function search(q){
  q=(q||'').toLowerCase().trim();
  if(!q)return S.personas;
  return S.personas.filter(p=>
    (p.nombre||'').toLowerCase().includes(q)||
    (p.apodo||'').toLowerCase().includes(q)||
    (p.contexto||'').toLowerCase().includes(q)||
    (p.notas||'').toLowerCase().includes(q)||
    (p.relacionConmigo||'').toLowerCase().includes(q)||
    (p.relacionMujer||'').toLowerCase().includes(q)||

  );

/* ============ CAMPANITA ============ */
function getAlerts(){
  const alerts=[];
  const N=S.set.diasCumple||15;
  for(const p of S.personas){
    if(p.fallecido)continue;
    const b=nextBirthday(p.cumple);
    if(b&&b.dias<=N){
      alerts.push({tipo:'cumple',ico:'🎂',texto:`${p.nombre} cumple ${b.dias===0?'¡hoy!':b.dias===1?'mañana':'en '+b.dias+' días'}`,personaId:p.id});
    }
  }
  if(S.set.avisarCopia&&S.personas.length){
    if(!S.lastBackup||days(today(),S.lastBackup)>30){
      alerts.push({tipo:'backup',ico:'💾',texto:'Hace más de 30 días que no guardas copia',personaId:null});
    }
  }
  return alerts;
}
function renderBell(){
  const alerts=getAlerts();
  const badge=$('#bellBadge');
  if(badge){
    badge.textContent=alerts.length;
    badge.classList.toggle('on',alerts.length>0);
  }
  const panel=$('#bellPanel');
  if(panel&&panel.classList.contains('open')){
    if(!alerts.length){panel.innerHTML='<p class="empty">Todo al día. No hay avisos.</p>';return;}
    panel.innerHTML=`<h3>Avisos</h3>`+alerts.map((a,i)=>{
      if(a.tipo==='cumple')return`<div class="alert" onclick="openFicha('${a.personaId}');toggleBell(true)"><span class="ico">${a.ico}</span><span>${esc(a.texto)}</span></div>`;
      return`<div class="alert backup"><span class="ico">${a.ico}</span><span>${esc(a.texto)}</span></div>`;
    }).join('');
  }
}
function toggleBell(forceClose){
  const panel=$('#bellPanel');
  if(!panel)return;
  if(forceClose===true){panel.classList.remove('open');return;}
  panel.classList.toggle('open');
  renderBell();
}

    .sort((a,b)=>(b.ultimaVez||'').localeCompare(a.ultimaVez||'')).slice(0,10);

  const total=S.personas.length;
  const nombres=S.set.miNombre?`Hola, ${esc(S.set.miNombre)}`:'Hola';

  let html=`<h2>${nombres}</h2>`;

      html+=recientes.map(p=>{

function renderVinculos(p){
  if(!p.vinculos||!p.vinculos.length)return'<p class="mut s">Sin vínculos registrados. Toca "+ Añadir vínculo" para empezar.</p>';
  const items=p.vinculos.map(v=>{
    const o=getP(v.personaId);
    if(!o)return null;
    return{persona:o,tipo:v.tipo};
  }).filter(Boolean);
  // Agrupar por tipo
  const byTipo={};
  items.forEach(it=>{if(!byTipo[it.tipo])byTipo[it.tipo]=[];byTipo[it.tipo].push(it.persona)});
  return Object.entries(byTipo).map(([tipo,personas])=>{
    return personas.map(persona=>`<div class="vinculo-row">
      ${avatar(persona,'tiny')}
      <span class="v-name"><a href="#" onclick="openFicha('${persona.id}');return false">${esc(persona.nombre)}</a></span>
      <span class="v-tipo">${esc(tipo)}</span>
      <button class="v-del" onclick="delVinculo('${p.id}','${persona.id}')" title="Borrar vínculo">×</button>
    </div>`).join('');
  }).join('');
}

function addVinculoUI(personId){
  const p=getP(personId);if(!p)return;

  if(!otras.length){toast('Necesitas al menos otra persona');return;}
  const opts=otras.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');
  const tipos=TIPOS_OPCIONES.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
  $('#modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">

    <label>Tipo de vínculo<select id="v_tipo">${tipos}</select></label>
    <div style="margin-top:12px">

      <button class="btn alt" onclick="closeModal()">Cancelar</button>
    </div>

function saveVinculo(personId){
  const otherId=$('#v_persona').value;
  const tipo=$('#v_tipo').value;
  if(!otherId||!tipo)return;
  addVinculo(personId,otherId,tipo);
  closeModal();
  toast('Vínculo añadido');
}
function addVinculo(personId,otherId,tipo){
  if(personId===otherId)return;
  const p=getP(personId),o=getP(otherId);
  if(!p||!o)return;
  if(!p.vinculos)p.vinculos=[];
  if(!o.vinculos)o.vinculos=[];
  const existingP=p.vinculos.find(v=>v.personaId===otherId);
  if(existingP)existingP.tipo=tipo;
  else p.vinculos.push({personaId:otherId,tipo});
  const inv=inverseTipo(tipo,p.sexo);
  const existingO=o.vinculos.find(v=>v.personaId===personId);
  if(existingO)existingO.tipo=inv;
  else o.vinculos.push({personaId:personId,tipo:inv});
  upd();
}
function delVinculo(personId,otherId){
  if(!confirm('¿Borrar este vínculo? Se borrará también el inverso.'))return;
  const p=getP(personId),o=getP(otherId);
  if(!p)return;
  p.vinculos=(p.vinculos||[]).filter(v=>v.personaId!==otherId);
  if(o)o.vinculos=(o.vinculos||[]).filter(v=>v.personaId!==personId);
  upd();
  toast('Vínculo borrado');
}
function recomputeAllInverses(){
  for(const p of S.personas){
    for(const v of(p.vinculos||[])){
      const o=getP(v.personaId);
      if(!o)continue;
      const inv=inverseTipo(v.tipo,p.sexo);
      const existing=(o.vinculos||[]).find(x=>x.personaId===p.id);
      if(existing)existing.tipo=inv;
    }
  }
}
function closeModal(){$('#modal').innerHTML='';}

function callStart(tel){
  const btn=$('#callBtn');if(!btn)return;
  if(btn.classList.contains('confirm')){
    const a=document.createElement('a');a.href='tel:'+tel;a.click();
    btn.classList.remove('confirm');
    const p=getP(currentId);
    btn.textContent='📞 Llamar a '+(p?p.nombre.split(' ')[0]:'');
    clearTimeout(callTimer);
  }else{
    btn.classList.add('confirm');
    btn.textContent='📞 ¿Seguro? Toca otra vez';
    callTimer=setTimeout(()=>{
      const b=$('#callBtn');if(!b)return;
      b.classList.remove('confirm');
      const p=getP(currentId);
      if(p)b.textContent='📞 Llamar a '+p.nombre.split(' ')[0];
    },3000);
  }
}

  S.personas=S.personas.filter(p=>p.id!==id);
  for(const p of S.personas){p.vinculos=(p.vinculos||[]).filter(v=>v.personaId!==id);}

async function handlePhoto(input){
  const file=input.files[0];if(!file)return;
  const dataUri=await resizePhoto(file);
  const zone=$('.photo-zone');
  if(!zone)return;
  zone.innerHTML=`<img id="photoPreview" src="${dataUri}"><div class="hint">Toca para cambiar</div>`;
  zone.dataset.foto=dataUri;
}
function clearPhoto(){
  const zone=$('.photo-zone');if(!zone)return;
  zone.innerHTML=`<div style="font-size:48px;color:var(--muted)">📷</div><div class="hint">Toca para hacer una foto o elegir de la galería</div>`;
  zone.dataset.foto='';
}
function resizePhoto(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=400;let{width,height}=img;
        if(width>max||height>max){if(width>height){height=Math.round(height*max/width);width=max}else{width=Math.round(width*max/height);height=max}}
        const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}

function saveForm(e){
  e.preventDefault();
  const f=e.target;
  const zone=$('.photo-zone');
  let foto;
  if(zone.dataset.foto!==undefined)foto=zone.dataset.foto||null;
  else foto=editingId?getP(editingId).foto:null;

  const datos={
    nombre:f.nombre.value.trim(),
    apodo:f.apodo.value.trim(),
    comoLlamar:f.comoLlamar.value.trim(),
    sexo:f.sexo.value,
    grupo:f.grupo.value,
    relacionConmigo:f.relacionConmigo.value.trim(),
    relacionMujer:f.relacionMujer?f.relacionMujer.value.trim():'',
    contexto:f.contexto.value.trim(),
    telefono:f.telefono.value.trim(),
    ciudad:f.ciudad.value.trim(),
    cumple:f.cumple.value.trim(),
    etiquetas:f.etiquetas.value.split(',').map(t=>t.trim()).filter(Boolean),
    notas:f.notas.value.trim(),
    ultimaVez:f.ultimaVez.value,
    fallecido:f.fallecido.checked,
    foto
  };
  if(!datos.nombre){toast('El nombre es obligatorio');return;}

  if(editingId){
    const id=editingId;
    const old=getP(id);
    Object.assign(old,datos);
    recomputeAllInverses();
    editingId=null;
    upd();openFicha(id);toast('Guardado');
  }else{
    const np={id:uid(),...datos,vinculos:[]};
    S.personas.push(np);
    upd();openFicha(np.id);toast('Añadido');
  }
}

/* ============ REPASO ============ */
function vFlash(){
  const pool=S.personas.filter(p=>!p.fallecido&&(!flashGroup||p.grupo===flashGroup));
  if(!pool.length){
    return `<h2>Repaso</h2><div class="empty"><div class="big">🎯</div><p>No hay personas para repasar.</p><p class="s">Añade personas a tu lista primero.</p></div>`;
  }
  if(!flashId||!pool.find(p=>p.id===flashId)){
    flashId=pool[Math.floor(Math.random()*pool.length)].id;
    flashRevealed=false;
  }
  const p=getP(flashId);
  const rel=p.relacionConmigo||p.relacionMujer||'';
  let html=`<button class="lnk" onclick="go('mas')">‹ Más</button><h2>Repaso</h2><div class="chips"><button class="${!flashGroup?'on':''}" onclick="flashGroup=null;flashId=null;render()">Todas</button>${S.grupos.map(g=>`<button class="${flashGroup===g.id?'on':''}" onclick="flashGroup='${g.id}';flashId=null;render()">${g.icono} ${esc(g.nombre)}</button>`).join('')}</div>`;
  html+=`<div class="flash">${avatar(p,'xl')}`;
  if(flashRevealed){
    html+=`<h2 style="margin-top:16px;margin-bottom:4px">${esc(p.nombre)}</h2>`;
    if(p.apodo)html+=`<p class="mut" style="margin:0">«${esc(p.apodo)}»</p>`;
    if(rel)html+=`<p style="margin:8px 0;font-size:18px"><span class="rel-chip">${esc(rel)}</span></p>`;
    if(p.contexto)html+=`<p class="ctx" style="max-width:400px">"${esc(p.contexto)}"</p>`;
  }else{
    html+=`<button class="reveal-btn" onclick="flashRevealed=true;render()">👁️ ¿Quién es?</button><p class="mut s" style="margin-top:16px">Piensa un momento antes de revelar.</p>`;
  }
  html+=`</div>`;
  if(flashRevealed){
    html+=`<div class="card noprint" style="text-align:center"><button class="btn" onclick="flashRevealed=false;flashId=null;render()">Otra persona</button><button class="btn alt" onclick="openFicha('${p.id}')">Ver ficha</button></div>`;
  }
  return html;
}

/* ============ MÁS ============ */
function vMas(){
  if(sub==='ajustes')return vAjustes();
  if(sub==='grupos')return vGrupos();
  if(sub==='ideas')return vIdeas();
  if(sub==='print')return vPrint();
  if(sub==='flash'){tab='flash';return vFlash();}
  const total=S.personas.length;
  const conFoto=S.personas.filter(p=>p.foto).length;
  const fallecidos=S.personas.filter(p=>p.fallecido).length;
  let html=`<h2>Más</h2>`;
  html+=`<div class="card"><div class="mut s">Tu lista</div><div style="font-size:20px;font-weight:600;margin:4px 0">${total} ${total===1?'persona':'personas'}</div><div class="mut s">${conFoto} con foto · ${fallecidos} fallecido${fallecidos===1?'':'s'} · ${S.grupos.length} grupos</div></div>`;
  html+=`<div class="card"><button class="btn alt block" onclick="go('mas','flash')">🎯 Repaso (flashcards)</button><button class="btn alt block" onclick="go('mas','ajustes')">⚙️ Ajustes</button><button class="btn alt block" onclick="go('mas','grupos')">📁 Grupos</button><button class="btn alt block" onclick="go('mas','ideas')">💡 Ideas de mejora</button><button class="btn alt block" onclick="go('mas','print')">🖨️ Hoja de contactos imprimible</button></div>`;
  html+=`<div class="card"><div class="sec" style="margin-top:0">Copia de seguridad</div><p class="mut s">Última copia: ${S.lastBackup?fd(S.lastBackup):'nunca'}</p><button class="btn block" onclick="exportJSON()">💾 Exportar copia (JSON)</button><label class="btn alt block" style="text-align:center;margin:8px 0 0;cursor:pointer">📂 Cargar copia<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label></div>`;
  html+=`<div class="card"><div class="sec" style="margin-top:0">Información</div><p class="mut s">Mi gente v${APP_VERSION} · datos solo en este dispositivo, sin nube.</p></div>`;
  return html;
}

function vAjustes(){
  return `<button class="lnk" onclick="go('mas')">‹ Volver</button>
  <h2>Ajustes</h2>
  <form onsubmit="saveAjustes(event)">
    <div class="card">
      <label>Tu nombre<input name="miNombre" value="${esc(S.set.miNombre||'')}" placeholder="Cómo quieres que te salude la app"></label>
      <label>Nombre de tu mujer (opcional)<input name="miMujer" value="${esc(S.set.miMujer||'')}" placeholder="Ej.: María"></label>
      <label>Avisar de cumpleaños con X días de antelación<input name="diasCumple" type="number" min="1" max="60" value="${S.set.diasCumple}"></label>
      <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="mostrarRecientes" ${S.set.mostrarRecientes?'checked':''} style="width:auto;margin:0"> Mostrar bloque "Vistos recientemente" en Inicio</label>
      <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="avisarCopia" ${S.set.avisarCopia?'checked':''} style="width:auto;margin:0"> Avisar si la copia de seguridad tiene más de 30 días</label>
    </div>
    <button type="submit" class="btn">Guardar</button>
  </form>
  <div class="card" style="margin-top:20px"><div class="sec" style="margin-top:0">Borrar todos los datos</div><p class="mut s">Elimina todas las personas, grupos e ideas. Haz copia antes.</p><button class="btn danger block" onclick="if(confirm('¿Borrar TODOS los datos? Esto no se puede deshacer.')){S=DEF();upd();go('inicio');toast('Todo borrado')}">Borrar todo</button></div>`;
}
function saveAjustes(e){
  e.preventDefault();
  const f=e.target;
  S.set.miNombre=f.miNombre.value.trim();
  S.set.miMujer=f.miMujer.value.trim();
  S.set.diasCumple=Math.max(1,Math.min(60,parseInt(f.diasCumple.value)||15));
  S.set.mostrarRecientes=f.mostrarRecientes.checked;
  S.set.avisarCopia=f.avisarCopia.checked;
  upd();go('mas');toast('Ajustes guardados');
}

function vGrupos(){
  let html=`<button class="lnk" onclick="go('mas')">‹ Volver</button><h2>Grupos</h2>`;
  html+=`<p class="mut s">Añade, edita o borra grupos. Al borrar un grupo con personas, te preguntará a dónde moverlas.</p>`;
  html+=`<div class="card">`;
  html+=S.grupos.map((g,i)=>{
    const count=S.personas.filter(p=>p.grupo===g.id).length;
    return`<div class="grupo-row">
      <input class="icon-input" value="${esc(g.icono)}" onchange="updateGrupo(${i},'icono',this.value)">
      <input value="${esc(g.nombre)}" onchange="updateGrupo(${i},'nombre',this.value)">
      <span class="mut s">${count}</span>
      <button class="btn alt small" onclick="delGrupo(${i})" style="margin:0">×</button>
    </div>`;
  }).join('');
  html+=`</div>`;
  html+=`<div class="card"><b>Nuevo grupo</b>
    <div class="grupo-row" style="margin-top:8px">
      <input class="icon-input" id="ng_icono" value="📌" maxlength="4">
      <input id="ng_nombre" placeholder="Ej.: Clases de guitarra">
      <button class="btn small" onclick="addGrupo()" style="margin:0">Añadir</button>
    </div>
  </div>`;
  return html;
}
function updateGrupo(i,campo,val){
  if(!val.trim()){render();return;}
  S.grupos[i][campo]=val.trim();
  upd();
}
function addGrupo(){
  const icono=$('#ng_icono').value.trim()||'📌';
  const nombre=$('#ng_nombre').value.trim();
  if(!nombre){toast('Pon un nombre');return;}
  S.grupos.push({id:uid(),nombre,icono});
  upd();toast('Grupo añadido');
}
function delGrupo(i){
  const g=S.grupos[i];
  const count=S.personas.filter(p=>p.grupo===g.id).length;
  if(count>0){
    const otras=S.grupos.filter((_,idx)=>idx!==i);
    if(!otras.length){toast('Debe quedar al menos un grupo');return;}
    const opts=otras.map(o=>`<option value="${o.id}">${o.icono} ${esc(o.nombre)}</option>`).join('');
    $('#modal').innerHTML=`<div class="modal-bg"><div class="modal"><h3>Borrar "${esc(g.nombre)}"</h3><p>${count} persona${count===1?'':'s'} en este grupo. ¿A dónde las mueves?</p><label>Grupo destino<select id="gdest">${opts}</select></label><div style="margin-top:12px"><button class="btn" onclick="confirmarDelGrupo(${i})">Mover y borrar</button><button class="btn alt" onclick="closeModal()">Cancelar</button></div></div></div>`;
  }else{
    if(!confirm('¿Borrar el grupo "'+g.nombre+'"?'))return;
    S.grupos.splice(i,1);upd();toast('Grupo borrado');
  }
}
function confirmarDelGrupo(i){
  const dest=$('#gdest').value;
  const g=S.grupos[i];
  S.personas.forEach(p=>{if(p.grupo===g.id)p.grupo=dest;});
  S.grupos.splice(i,1);
  closeModal();upd();toast('Grupo borrado');
}

function vIdeas(){
  const pendientes=S.ideas.filter(i=>i.estado==='pendiente');
  const implementadas=S.ideas.filter(i=>i.estado==='implementada');
  let html=`<button class="lnk" onclick="go('mas')">‹ Volver</button><h2>Ideas de mejora</h2>`;
  html+=`<p class="mut s">Apunta ideas para futuras versiones. Puedes copiarlas y pegarlas en el prompt de una IA.</p>`;
  html+=`<div class="card"><textarea id="ideaText" rows="4" placeholder="Escribe aquí la idea (admite varias líneas)"></textarea><button class="btn" onclick="addIdea()">Añadir idea</button></div>`;
  if(pendientes.length){
    html+=`<div class="sec">Pendientes (${pendientes.length})</div><div class="card">`;
    html+=pendientes.map(i=>renderIdea(i)).join('');
    html+=`</div>`;
    html+=`<button class="btn alt block" onclick="copyIdeas()">📋 Copiar pendientes para la IA</button>`;
  }
  if(implementadas.length){
    html+=`<div class="sec">Implementadas (${implementadas.length})</div><div class="card">`;
    html+=implementadas.map(i=>renderIdea(i)).join('');
    html+=`</div>`;
  }
  if(!S.ideas.length)html+=`<div class="empty"><div class="big">💡</div><p>Todavía no hay ideas.</p></div>`;
  return html;
}
function renderIdea(i){
  return`<div class="idea ${i.estado==='implementada'?'impl':''}">
    <div class="meta">${fd(i.fecha)}${i.fechaImplementada?' · implementada '+fd(i.fechaImplementada):''}</div>
    <div class="texto">${esc(i.texto)}</div>
    <div class="actions">
      <button class="btn small alt" onclick="toggleIdea('${i.id}')">${i.estado==='implementada'?'↺ Volver a pendiente':'✓ Implementada'}</button>
      <button class="btn small alt" onclick="copyIdea('${i.id}')">📋 Copiar</button>
      <button class="btn small danger" onclick="delIdea('${i.id}')">🗑️</button>
    </div>
  </div>`;
}
function addIdea(){
  const t=$('#ideaText').value.trim();
  if(!t)return;
  S.ideas.push({id:uid(),texto:t,fecha:today(),estado:'pendiente'});
  upd();toast('Idea añadida');
}
function toggleIdea(id){
  const i=S.ideas.find(x=>x.id===id);if(!i)return;
  if(i.estado==='pendiente'){i.estado='implementada';i.fechaImplementada=today();}
  else{i.estado='pendiente';delete i.fechaImplementada;}
  upd();
}
function delIdea(id){
  if(!confirm('¿Borrar esta idea?'))return;
  S.ideas=S.ideas.filter(x=>x.id!==id);upd();toast('Idea borrada');
}
function copyIdea(id){
  const i=S.ideas.find(x=>x.id===id);if(!i)return;
  copyText(i.texto,'Idea copiada');
}
function copyIdeas(){
  const pend=S.ideas.filter(i=>i.estado==='pendiente');
  if(!pend.length){toast('No hay ideas pendientes');return;}
  const txt='Ideas pendientes para Mi gente v'+APP_VERSION+':\n\n'+pend.map((i,n)=>`${n+1}. (${fd(i.fecha)}) ${i.texto}`).join('\n\n');
  copyText(txt,'Copiadas '+pend.length+' ideas');
}
function copyText(txt,msg){
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>prompt('Copia este texto:',txt));
  }else{
    prompt('Copia este texto:',txt);
  }
}

function vPrint(){
  const q=window.__printFilter||'todos';
  const personas=S.personas.filter(p=>q==='todos'||p.grupo===q).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  return `<button class="lnk noprint" onclick="go('mas')">‹ Volver</button>
  <h2 class="noprint">Hoja de contactos</h2>
  <div class="chips noprint"><button class="${q==='todos'?'on':''}" onclick="window.__printFilter='todos';render()">Todas</button>${S.grupos.map(g=>`<button class="${q===g.id?'on':''}" onclick="window.__printFilter='${g.id}';render()">${g.icono} ${esc(g.nombre)}</button>`).join('')}</div>
  <p class="mut s noprint">${personas.length} personas. Pulsa Imprimir para el PDF.</p>
  <button class="btn block noprint" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  <div class="print-grid">${personas.map(p=>{
    const rel=p.relacionConmigo||p.relacionMujer||'';
    return `<div class="print-item">${avatar(p)}<div><div class="pn">${esc(p.nombre)}${p.fallecido?' †':''}</div>${p.apodo?`<div class="pr">«${esc(p.apodo)}»</div>`:''}${rel?`<div class="pr">${esc(rel)}</div>`:''}${p.contexto?`<div class="pr" style="font-style:italic">${esc(p.contexto)}</div>`:''}</div></div>`;
  }).join('')}</div>`;
}

/* ============ BACKUP ============ */
function exportJSON(){
  S.lastBackup=today();save();
  const data=JSON.stringify({app:'migente',...S,exportado:new Date().toISOString()},null,1);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mi-gente-${today()}.json`;a.click();
  URL.revokeObjectURL(a.href);
  toast('Copia descargada');
  setTimeout(render,100);
}
function importJSON(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.app!=='migente'||!Array.isArray(d.personas))throw 0;
      if(!confirm('Se reemplazarán todos los datos actuales. ¿Continuar?'))return;
      S=migrate(d);
      S.set=Object.assign(DEF().set,S.set);
      upd();go('inicio');toast('Copia cargada');
    }catch(e){alert('Archivo no válido. Debe ser una copia de Mi gente.');}
  };r.readAsText(f);
}

load().then(()=>render());
</script>
