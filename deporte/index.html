<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Deporte v2.0.0</title>
<style>
  :root {
    --bg-main: #0b1220;
    --bg-card: #151f33;
    --bg-card-alt: #0e1728;
    --bg-header: rgba(11,18,32,.94);
    --border-color: #26344f;
    --border-subtle: #1e2c46;
    --text-main: #e8eefb;
    --text-muted: #93a3bd;
    --text-dim: #6b7c99;
    --primary: #2563eb;
    --primary-hover: #3b82f6;
    --accent: #7dd3fc;
    --danger-bg: #3b1016;
    --danger-border: #7f1d1d;
    --danger-text: #fca5a5;
    --grid-hour-height: 40px;
    --chip-bg: #0e1728;
    --chip-border: #26344f;
    --chip-text: #c3d0e6;
  }

  [data-theme="light"] {
    --bg-main: #f1f5f9;
    --bg-card: #ffffff;
    --bg-card-alt: #f8fafc;
    --bg-header: rgba(255,255,255,.94);
    --border-color: #cbd5e1;
    --border-subtle: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #475569;
    --text-dim: #94a3b8;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --accent: #0284c7;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;
    --danger-text: #dc2626;
    --chip-bg: #f1f5f9;
    --chip-border: #cbd5e1;
    --chip-text: #334155;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg-main);color:var(--text-main);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:30px;transition:background-color .2s,color .2s}
  
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-header);backdrop-filter:blur(8px);border-bottom:1px solid var(--border-color)}
  .topbar h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  
  .icon-btn{background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-main);width:36px;height:36px;border-radius:10px;font-size:18px;display:inline-flex;align-items:center;justify-content:center;line-height:1;cursor:pointer;flex:0 0 auto}
  .icon-btn:active{transform:scale(.95)}
  
  .wrap{padding:14px;max-width:850px;margin:0 auto}
  .card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:14px;margin-bottom:12px}
  
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border-color);background:var(--bg-card-alt);color:var(--text-main);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:linear-gradient(180deg,var(--primary-hover),var(--primary));border-color:var(--primary);color:#fff}
  .btn-block{width:100%}
  .btn-big{padding:16px;font-size:16px}
  .btn-danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text)}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tile{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .tile:active{transform:scale(.985)}
  .tile .ti{font-size:21px;line-height:1.1}
  .tile .tt{font-weight:650}
  .tile .ts{font-size:11.5px;color:var(--text-muted)}
  
  .lbl{display:block;font-size:11.5px;color:var(--text-muted);margin:0 0 5px;font-weight:650;letter-spacing:.3px;text-transform:uppercase}
  .input{width:100%;background:var(--bg-card-alt);border:1px solid var(--border-color);color:var(--text-main);border-radius:11px;padding:10px 12px;font-size:14.5px;font-family:inherit;outline:none}
  .input:focus{border-color:var(--primary-hover)}
  select.input{appearance:none}
  textarea.input{min-height:80px;resize:vertical}
  .field{margin-bottom:12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip-bg);border:1px solid var(--chip-border);color:var(--chip-text);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:600}
  .chip.sel{background:var(--primary);border-color:var(--primary-hover);color:#fff}
  
  .item{display:flex;gap:11px;align-items:center;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .item:active{filter:brightness(.95)}
  .item .ico{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
  .grow{flex:1;min-width:0}
  .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t2{font-size:12px;color:var(--text-muted);margin-top:1px}
  .muted{color:var(--text-muted)}
  .center{text-align:center}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);font-weight:700;margin:16px 0 8px}
  .empty{color:var(--text-dim);text-align:center;padding:18px 10px;font-size:13.5px}

  /* CALENDARIO - VISTA SEMANAL EN TABLA (GRID DE HORAS Y DÍAS) */
  .cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .cal-nav .lbl-sem{flex:1;text-align:center;font-weight:650;font-size:14.5px}
  
  .week-grid-container{width:100%;overflow-x:auto;background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;position:relative}
  .week-grid{display:grid;grid-template-columns:50px repeat(7, minmax(85px, 1fr));min-width:650px}
  
  .grid-header{position:sticky;top:0;z-index:10;background:var(--bg-card-alt);border-bottom:1px solid var(--border-color);text-align:center;padding:8px 4px;font-weight:700;font-size:12px}
  .grid-header.corner{position:sticky;left:0;z-index:11;background:var(--bg-card-alt);border-right:1px solid var(--border-color)}
  .grid-header .dname{color:var(--text-muted);font-size:10px;text-transform:uppercase}
  .grid-header .dnum{font-size:14px;color:var(--text-main)}
  .grid-header.hoy{background:rgba(37,99,235,.15);color:var(--primary-hover)}
  .grid-header.hoy .dnum{color:var(--primary-hover)}
  
  .time-col{position:sticky;left:0;z-index:9;background:var(--bg-card-alt);border-right:1px solid var(--border-color);color:var(--text-muted);font-size:11px;font-weight:600;text-align:center}
  .hour-cell{height:var(--grid-hour-height);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center}
  
  .day-col{position:relative;border-right:1px solid var(--border-subtle)}
  .day-col:last-child{border-right:none}
  .day-col .hour-slot{height:var(--grid-hour-height);border-bottom:1px solid var(--border-subtle);cursor:pointer}
  .day-col .hour-slot:hover{background:rgba(255,255,255,.03)}

  .grid-event{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 5px;font-size:11px;line-height:1.2;overflow:hidden;cursor:pointer;z-index:2;box-shadow:0 2px 4px rgba(0,0,0,.2);border-left:3px solid rgba(0,0,0,.3);color:#fff}
  .grid-event .ev-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid-event .ev-time{font-size:9.5px;opacity:.9}

  /* COLORS POR TIPO */
  .bg-senderismo{background:#059669}
  .bg-paseo{background:#0284c7}
  .bg-gimnasio{background:#7c3aed}
  .bg-otro{background:#d97706}
  .bg-natacion{background:#2563eb}
  .bg-running{background:#dc2626}

  /* CHECKLIST COMPACTO */
  .chk-compact{display:flex;align-items:center;gap:8px;background:var(--bg-card-alt);border:1px solid var(--border-subtle);border-radius:8px;padding:6px 9px;margin-bottom:5px;font-size:13.5px}
  .chk-compact .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex:0 0 auto;cursor:pointer}
  .chk-compact.on .box{background:var(--primary);border-color:var(--primary)}
  .chk-compact.on .txt{text-decoration:line-through;color:var(--text-dim)}
  .chk-compact .txt{flex:1;min-width:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{background:none;border:none;color:var(--text-muted);font-size:14px;padding:2px 4px;cursor:pointer;line-height:1}
  .mini:hover{color:var(--text-main)}

  /* RESUMEN COMPACTO */
  .res-card{padding:10px 12px;margin-bottom:8px}
  .res-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
  .res-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;background:var(--bg-card-alt);padding:8px;border-radius:8px;border:1px solid var(--border-subtle)}
  .m-box{display:flex;flex-direction:column}
  .m-lbl{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;font-weight:600}
  .m-val{font-size:13.5px;font-weight:700;color:var(--text-main)}

  /* DETAILS PLEGABLES */
  details.sec-fold{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;margin-bottom:10px;overflow:hidden}
  details.sec-fold summary{padding:12px 14px;font-weight:650;font-size:14px;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;outline:none;background:var(--bg-card)}
  details.sec-fold summary::-webkit-details-marker{display:none}
  details.sec-fold summary::after{content:'›';font-size:18px;transition:transform .2s;color:var(--text-muted)}
  details.sec-fold[open] summary::after{transform:rotate(90deg)}
  details.sec-fold summary:hover{background:var(--bg-card-alt)}
  .fold-body{padding:12px 14px;border-top:1px solid var(--border-color);background:var(--bg-card)}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(4,8,16,.75);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media(min-width:600px){.overlay{align-items:center;padding:20px}}
  .modal{background:var(--bg-card);border:1px solid var(--border-color);border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;color:var(--text-main)}
  @media(min-width:600px){.modal{border-radius:18px}}
  .modal h2{margin:0 0 14px;font-size:17px}
  .modal-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .modal-actions .btn{flex:1}

  .up{color:#4ade80;font-weight:600}
  .down{color:#f87171;font-weight:600}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .badge-imp{background:var(--primary);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = (n,d=1) => Number(Number(n).toFixed(d)).toLocaleString('es-ES');

function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ const p = String(k).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d,n){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function hoyKey(){ return dateKey(new Date()); }
function fmtFecha(k){ if(!k) return '—'; return parseKey(k).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}); }
function fmtFechaCorta(k){ return parseKey(k).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }

function inicioSemana(d, ini){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = x.getDay();
  const diff = (ini === 'domingo') ? dow : (dow + 6) % 7;
  return addDays(x, -diff);
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1900);
}

/* =====================================================================
   INDEXEDDB
   ===================================================================== */
const DB_NAME = 'deporte_v2', DB_VER = 1;
let db = null;

function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = ev => {
      const d = ev.target.result;
      const mk = (n,opt={}) => { if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,opt); };
      mk('tipos',          {keyPath:'id'});
      mk('subcategorias',  {keyPath:'id', autoIncrement:true});
      mk('actividades',    {keyPath:'id', autoIncrement:true});
      mk('planes',         {keyPath:'id', autoIncrement:true});
      mk('checklist',      {keyPath:'id', autoIncrement:true});
      mk('checkEstado',    {keyPath:'id'});
      mk('peso',           {keyPath:'id', autoIncrement:true});
      mk('prefs',          {keyPath:'k'});
      mk('ideas',          {keyPath:'id', autoIncrement:true});
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

function req(r){ return new Promise((res,rej)=>{ r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
const dbAll   = s     => req(db.transaction(s).objectStore(s).getAll());
const dbGet   = (s,k) => req(db.transaction(s).objectStore(s).get(k));
const dbPut   = (s,v) => req(db.transaction(s,'readwrite').objectStore(s).put(v));
const dbDel   = (s,k) => req(db.transaction(s,'readwrite').objectStore(s).delete(k));
const dbClear = s     => req(db.transaction(s,'readwrite').objectStore(s).clear());

/* =====================================================================
   DATOS DE FÁBRICA
   ===================================================================== */
const TIPOS_BASE = [
  {id:'senderismo', nombre:'Senderismo', icono:'🥾', visible:1, orden:1, color:'bg-senderismo'},
  {id:'paseo',      nombre:'Paseo',      icono:'🚶', visible:1, orden:2, color:'bg-paseo'},
  {id:'gimnasio',   nombre:'Gimnasio',   icono:'🏋️', visible:1, orden:3, color:'bg-gimnasio'},
  {id:'otro',       nombre:'Otro',       icono:'✨', visible:1, orden:4, color:'bg-otro'},
  {id:'natacion',   nombre:'Natación',   icono:'🏊', visible:0, orden:5, color:'bg-natacion'},
  {id:'running',    nombre:'Running',    icono:'🏃', visible:0, orden:6, color:'bg-running'},
];

const SUBCATS_BASE = [
  {tipo_id:'gimnasio', nombre:'Fitness / Pesas'},
  {tipo_id:'gimnasio', nombre:'Spinning'},
  {tipo_id:'gimnasio', nombre:'Pilates / Yoga'},
  {tipo_id:'gimnasio', nombre:'Actividad Dirigida'},
  {tipo_id:'senderismo', nombre:'Montaña'},
  {tipo_id:'senderismo', nombre:'Media Montaña'},
  {tipo_id:'paseo', nombre:'Urbano'},
  {tipo_id:'paseo', nombre:'Parque'}
];

const CHECK_FABRICA = {
  senderismo:{
    imprescindible:['Agua','Botas','Chubasquero','Comida','Móvil cargado','Botiquín'],
    opcional:['Bastones','Gorra','Crema solar','Cámara']
  },
  paseo:{ imprescindible:['Calzado cómodo'], opcional:['Agua','Auriculares'] },
  gimnasio:{ imprescindible:['Ropa deporte','Toalla','Candado','Botella agua'], opcional:['Auriculares','Guantes'] },
  otro:{ imprescindible:[], opcional:[] },
  natacion:{ imprescindible:['Bañador','Gafas','Gorro','Toalla'], opcional:['Secador','Tapones'] },
  running:{ imprescindible:['Zapatillas','Ropa técnica'], opcional:['Auriculares','Gel'] }
};

/* Campos específicos por tipo de actividad */
const CAMPOS_POR_TIPO = {
  senderismo:['distancia_km','desnivel_m','con_quien','ruta','wikiloc'],
  paseo:['distancia_km'],
  gimnasio:[],
  natacion:['distancia_m'],
  running:['distancia_km'],
  otro:['descripcion','distancia_km']
};

const CAMPO_DEF = {
  distancia_km: {label:'Distancia (km)', type:'number', step:'0.01'},
  desnivel_m:   {label:'Desnivel (m)', type:'number', step:'1'},
  con_quien:    {label:'Con quién', type:'text'},
  ruta:         {label:'Nombre de ruta', type:'text'},
  wikiloc:      {label:'Enlace Wikiloc', type:'url'},
  distancia_m:  {label:'Distancia (m)', type:'number', step:'1'},
  descripcion:  {label:'Descripción', type:'text'}
};

/* =====================================================================
   ESTADO GLOBAL
   ===================================================================== */
const S = {
  screen: 'inicio',
  theme: 'dark',
  tipos: [],
  subcategorias: [],
  prefs: {},
  form: null,
  calOffset: 0,
  chkTipo: 'senderismo',
  hist: {tipo:'', desde:'', hasta:''},
  resumenRango: 'semana',
  resumenDesde: '', resumenHasta: '',
  pesoForm: {fecha: hoyKey(), kg:''},
  pesoCache: [],
  planForm: null,
  nuevaIdeaText: ''
};

/* =====================================================================
   INICIALIZACIÓN / SEMILLA
   ===================================================================== */
async function seed(){
  const ya = await dbGet('prefs','seeded');
  if(ya) return;
  for(const t of TIPOS_BASE) await dbPut('tipos', {...t});
  for(const sc of SUBCATS_BASE) await dbPut('subcategorias', {...sc});
  
  let orden = 0;
  for(const tipo of Object.keys(CHECK_FABRICA)){
    for(const seccion of ['imprescindible','opcional']){
      for(const texto of CHECK_FABRICA[tipo][seccion]){
        await dbPut('checklist', {tipo_id:tipo, seccion, texto, orden: orden++});
      }
    }
  }
  await dbPut('prefs', {k:'semanaInicio', v:'lunes'});
  await dbPut('prefs', {k:'theme', v:'dark'});
  await dbPut('prefs', {k:'seeded', v:1});

  // Idea de ejemplo
  await dbPut('ideas', {
    texto: "Modificar vista del calendario a tabla semanal completa.\nImplementar subcategorías en gimnasio y modo claro.",
    fecha: hoyKey(),
    implementado: true
  });
}

async function loadState(){
  S.tipos = (await dbAll('tipos')).sort((a,b)=>a.orden-b.orden);
  S.subcategorias = await dbAll('subcategorias');
  const p = {};
  (await dbAll('prefs')).forEach(x => p[x.k] = x.v);
  S.prefs = p;
  S.theme = p.theme || 'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
}

async function setPref(k,v){
  await dbPut('prefs', {k, v});
  S.prefs[k] = v;
}

function toggleTheme(){
  const next = S.theme === 'dark' ? 'light' : 'dark';
  S.theme = next;
  setPref('theme', next);
  document.documentElement.setAttribute('data-theme', next);
  render();
}

const tipoDe = id => S.tipos.find(t => t.id === id) || {nombre:'—', icono:'•', color:'bg-otro'};
const prefInicio = () => S.prefs.semanaInicio || 'lunes';

/* =====================================================================
   NAVEGACIÓN Y TOPBAR
   ===================================================================== */
function go(screen){ S.screen = screen; render(); window.scrollTo(0,0); }

function topbar(titulo){
  return `<header class="topbar">
    ${S.screen === 'inicio' ? '' : '<button class="icon-btn" data-action="atras" aria-label="Volver">‹</button>'}
    <h1>${esc(titulo)}</h1>
    <div class="topbar-actions">
      <button class="icon-btn" data-action="toggle-theme" title="Cambiar Modo Claro/Oscuro">
        ${S.theme === 'dark' ? '☀️' : '🌙'}
      </button>
    </div>
  </header>`;
}

/* =====================================================================
   RENDER PRINCIPAL
   ===================================================================== */
async function render(){
  await loadState();
  let html = '';
  switch(S.screen){
    case 'inicio':     html = await viewInicio();     break;
    case 'actividad':  html = await viewActividad();  break;
    case 'calendario': html = await viewCalendario(); break;
    case 'checklist':  html = await viewChecklist();  break;
    case 'resumen':    html = await viewResumen();    break;
    case 'peso':       html = await viewPeso();       break;
    case 'historico':  html = await viewHistorico();  break;
    case 'ajustes':    html = await viewAjustes();    break;
  }
  $('#app').innerHTML = html;
  if(S.screen === 'peso') drawPesoChart();
}

/* =====================================================================
   1. INICIO
   ===================================================================== */
function itemActividad(a){
  const t = tipoDe(a.tipo_id);
  const extra = [];
  if(a.subcategoria) extra.push(a.subcategoria);
  if(a.duracion_min) extra.push(a.duracion_min + ' min');
  const km = a.distancia_km != null ? a.distancia_km : (a.distancia_m != null ? (a.distancia_m/1000) : null);
  if(km) extra.push(fmtNum(km,2) + ' km');
  return `<div class="item" data-action="ver-act" data-id="${a.id}">

const DIAS_LUN = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DIAS_DOM = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

async function viewCalendario(){
  const ini = prefInicio();
  const base  = inicioSemana(new Date(), ini);
  const start = addDays(base, S.calOffset * 7);
  const dias  = Array.from({length:7}, (_,i) => addDays(start, i));
  const kHoy  = hoyKey();

  const planes = await dbAll('planes');
  const nombres = (ini === 'domingo') ? DIAS_DOM : DIAS_LUN;

  const kIni = dateKey(dias[0]), kFin = dateKey(dias[6]);
  const esActual = S.calOffset === 0;
  const etiqueta = `${fmtFechaCorta(kIni)} – ${fmtFechaCorta(kFin)} ${parseKey(kFin).getFullYear()}`;

  // Filtrar planes de la semana vista
  const planesSemana = planes.filter(p => p.fecha >= kIni && p.fecha <= kFin);

  // Generar columnas de la tabla de la semana
  const gridHeaders = `
    <div class="grid-header corner">Hora</div>
    ${dias.map((d,i) => {
      const k = dateKey(d);
      const esHoy = (k === kHoy);
      return `<div class="grid-header ${esHoy ? 'hoy' : ''}">
        <div class="dname">${nombres[i]}</div>
        <div class="dnum">${d.getDate()}</div>
      </div>`;
    }).join('')}
  `;

  // Construir franjas horarias
  const horas = Array.from({length:15}, (_,i) => i + 7); // De 07:00 a 21:00

  let gridBody = '';
  // Columna de horas
  let timeCol = `<div class="time-col">`;
  horas.forEach(h => {
    timeCol += `<div class="hour-cell">${pad(h)}:00</div>`;
  });
  timeCol += `</div>`;

  // Columnas por cada día
  let daysCols = '';
  dias.forEach(d => {
    const k = dateKey(d);
    const planesDia = planesSemana.filter(p => p.fecha === k);

    let slotsHTML = '';
    horas.forEach(h => {
      slotsHTML += `<div class="hour-slot" data-action="plan-nuevo-slot" data-fecha="${k}" data-hora="${h}"></div>`;
    });

    // Colocar eventos dentro del día posicionados por hora
    let evsHTML = '';
    planesDia.forEach(p => {
      const t = tipoDe(p.tipo_id);
      const horaInicio = p.hora ? parseInt(p.hora.split(':')[0]) : 9;
      const minInicio = p.hora ? parseInt(p.hora.split(':')[1]) : 0;
      
      // Calcular posición vertical top y height
      const offsetHoras = Math.max(0, horaInicio - 7);
      const topPx = (offsetHoras * 40) + ((minInicio / 60) * 40);
      const durMin = p.duracion_min || 60;
      const heightPx = Math.max(26, (durMin / 60) * 40);

      evsHTML += `<div class="grid-event ${t.color || 'bg-otro'}" style="top:${topPx}px;height:${heightPx}px;"
                       data-action="plan-editar" data-id="${p.id}">
        <div class="ev-title">${t.icono} ${esc(p.subcategoria || t.nombre)}</div>
        <div class="ev-time">${pad(horaInicio)}:${pad(minInicio)} (${durMin}m)</div>
      </div>`;
    });

    daysCols += `<div class="day-col">${slotsHTML}${evsHTML}</div>`;
  });

  gridBody = timeCol + daysCols;

  return topbar('Calendario') + `
  <div class="wrap">
    <div class="cal-nav">
      <button class="icon-btn" data-action="sem-prev">‹</button>
      <div class="lbl-sem">${etiqueta}${esActual ? '<div class="muted" style="font-size:11.5px;font-weight:600">Esta semana</div>' : ''}</div>
      <button class="icon-btn" data-action="sem-next">›</button>
    </div>

    <div class="cal-tools" style="display:flex;gap:8px;margin-bottom:10px;">
      <button class="chip" data-action="sem-hoy">Hoy</button>
      <button class="chip" data-action="copiar-semana">Copiar semana pasada</button>
      <button class="chip" data-action="plan-nuevo">＋ Planificar</button>
    </div>

    <div class="week-grid-container">
      <div class="week-grid">
        ${gridHeaders}
        ${gridBody}
      </div>
    </div>
  </div>`;
}

async function copiarSemanaPasada(){
  const ini = prefInicio();
  const start = addDays(inicioSemana(new Date(), ini), S.calOffset * 7);
  const kIni = dateKey(addDays(start,-7));
  const kFin = dateKey(addDays(start,-1));
  const kIniAct = dateKey(start);
  const kFinAct = dateKey(addDays(start,6));

  const planes = await dbAll('planes');
  const previos = planes.filter(p => p.fecha >= kIni && p.fecha <= kFin);
  if(!previos.length){ toast('La semana pasada no tiene actividades'); return; }

  for(const p of previos){
    const nuevoDia = dateKey(addDays(parseKey(p.fecha), 7));
    await dbPut('planes', {
      tipo_id: p.tipo_id, fecha: nuevoDia, hora: p.hora || '09:00',
      subcategoria: p.subcategoria || '', duracion_min: p.duracion_min || 60, nota: p.nota || ''
    });
  }
  toast(previos.length + ' actividades copiadas');
  render();
}

/* =====================================================================
   5. RESUMEN COMPACTO (METRICAS RELEVANTES POR TIPO)
   ===================================================================== */
const RANGOS = [
  ['semana','Semana'], ['2semanas','2 sem'], ['mes','Mes'],
  ['trimestre','Trimestre'], ['año','Año'], ['personalizado','Personalizar']
];
const DIAS_RANGO = {semana:7, '2semanas':14, mes:30, trimestre:91, año:365};

function rangoActual(){
  const hoy = new Date();
  if(S.resumenRango === 'personalizado'){
    const desde = S.resumenDesde ? parseKey(S.resumenDesde) : addDays(hoy,-29);
    const hasta = S.resumenHasta ? parseKey(S.resumenHasta) : hoy;
    return {desde, hasta};
  }
  const n = DIAS_RANGO[S.resumenRango] || 7;
  return {desde: addDays(hoy, -(n-1)), hasta: hoy};
}

function totalesPorTipo(acts, tiposVis){
  const r = {};
  tiposVis.forEach(t => r[t.id] = {n:0, km:0, desn:0, min:0});
  for(const a of acts){
    const x = r[a.tipo_id];
    if(!x) continue;
    x.n++;
    x.km  += num(a.distancia_km) + num(a.distancia_m)/1000;
    x.desn += num(a.desnivel_m);
    x.min += num(a.duracion_min);
  }
  return r;
}

async function viewResumen(){
  const tiposVis = S.tipos.filter(t => t.visible);
  const acts = await dbAll('actividades');

  const {desde, hasta} = rangoActual();
  const kD = dateKey(desde), kH = dateKey(hasta);
  const enRango = acts.filter(a => a.fecha >= kD && a.fecha <= kH);
  const tot = totalesPorTipo(enRango, tiposVis);

  const tarjetas = tiposVis.map(t => {
    const a = tot[t.id];
    let camposHTML = `<div class="m-box"><span class="m-lbl">Sesiones</span><span class="m-val">${a.n}</span></div>`;
    
    if(a.min > 0) {
      camposHTML += `<div class="m-box"><span class="m-lbl">Tiempo</span><span class="m-val">${a.min} min</span></div>`;
    }

    // Mostrar distancia/desnivel SOLO en categorías donde aplica
    if(t.id === 'senderismo' || t.id === 'running' || t.id === 'natacion' || t.id === 'paseo' || t.id === 'otro'){
      if(a.km > 0) camposHTML += `<div class="m-box"><span class="m-lbl">Distancia</span><span class="m-val">${fmtNum(a.km,1)} km</span></div>`;
    }

    if(t.id === 'senderismo'){
      if(a.desn > 0) camposHTML += `<div class="m-box"><span class="m-lbl">Desnivel</span><span class="m-val">${fmtNum(a.desn,0)} m</span></div>`;
    }

    return `<div class="card res-card">
      <div class="res-head">${t.icono} ${esc(t.nombre)}</div>
      <div class="res-metrics">
        ${camposHTML}
      </div>
    </div>`;
  }).join('');

  return topbar('Resumen') + `
  <div class="wrap">
    <div class="chips" style="margin-bottom:12px">
      ${RANGOS.map(([k,l]) => `<button class="chip ${S.resumenRango === k ? 'sel' : ''}"
          data-action="resumen-rango" data-id="${k}">${l}</button>`).join('')}
    </div>

    ${S.resumenRango === 'personalizado' ? `<div class="card">
      <div class="row">
        <div class="field" style="margin:0"><label class="lbl">Desde</label>
          <input class="input" type="date" data-resumen="desde" value="${esc(S.resumenDesde)}"></div>
        <div class="field" style="margin:0"><label class="lbl">Hasta</label>
          <input class="input" type="date" data-resumen="hasta" value="${esc(S.resumenHasta)}"></div>
      </div>
    </div>` : ''}

    <div class="muted center" style="font-size:12px;margin-bottom:10px">
      Mostrando del ${fmtFecha(kD)} al ${fmtFecha(kH)}
    </div>

    ${tarjetas || '<div class="empty">Sin tipos de actividad seleccionados.</div>'}
  </div>`;
}

function drawPesoChart(){
  const cv = document.getElementById('pesoCanvas');
  if(!cv) return;
  const datos = S.pesoCache;
  if(datos.length < 2) return;

  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 300;
  const h = 160;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const kgs = datos.map(d => d.kg);
  const min = Math.min(...kgs) - 0.5;
  const max = Math.max(...kgs) + 0.5;
  const padX = 35, padY = 20;

  const X = i => padX + (w - padX*2) * (i / (datos.length - 1));
  const Y = kg => h - padY - (h - padY*2) * ((kg - min) / ((max - min) || 1));

  ctx.strokeStyle = S.theme === 'dark' ? '#1e2c46' : '#cbd5e1';
  ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const y = padY + (h - padY*2) * (i/3);
    ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(w-padX, y); ctx.stroke();
  }

  ctx.fillStyle = S.theme === 'dark' ? '#93a3bd' : '#475569';
  ctx.font = '10px system-ui,sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(fmtNum(max,1), padX-6, padY+3);
  ctx.fillText(fmtNum(min,1), padX-6, h-padY+3);

  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  datos.forEach((d,i) => { const x = X(i), y = Y(d.kg); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.stroke();

  ctx.fillStyle = '#0284c7';
  datos.forEach((d,i) => {
    ctx.beginPath();
    ctx.arc(X(i), Y(d.kg), 3.5, 0, Math.PI*2);
    ctx.fill();
  });
}

async function viewHistorico(){
  const todas = await dbAll('actividades');
  const f = S.hist;

  let lista = todas.slice();
  if(f.tipo)  lista = lista.filter(a => a.tipo_id === f.tipo);
  if(f.desde) lista = lista.filter(a => a.fecha >= f.desde);
  if(f.hasta) lista = lista.filter(a => a.fecha <= f.hasta);
  lista.sort((a,b) => (b.fecha||'').localeCompare(a.fecha||'') || (b.id - a.id));

  return topbar('Histórico') + `
  <div class="wrap">
    <div class="card">
      <div class="field">
        <label class="lbl">Tipo</label>
        <select class="input" data-filtro="tipo" data-rerender="1">
          <option value="">Todos los tipos</option>
          ${S.tipos.map(t => `<option value="${t.id}" ${f.tipo === t.id ? 'selected' : ''}>${t.icono} ${esc(t.nombre)}</option>`).join('')}
        </select>
      </div>
      <div class="row">
        <div class="field" style="margin:0"><label class="lbl">Desde</label>
          <input class="input" type="date" data-filtro="desde" data-rerender="1" value="${esc(f.desde)}"></div>
        <div class="field" style="margin:0"><label class="lbl">Hasta</label>
          <input class="input" type="date" data-filtro="hasta" data-rerender="1" value="${esc(f.hasta)}"></div>
      </div>
    </div>

    <div class="muted" style="font-size:12.5px;margin-bottom:10px">${lista.length} registros encontrados</div>

    ${lista.length ? lista.map(a => {
      const t = tipoDe(a.tipo_id);
      const partes = [];
      if(a.subcategoria) partes.push(a.subcategoria);
      if(a.duracion_min) partes.push(a.duracion_min + ' min');
      if(a.distancia_km) partes.push(fmtNum(a.distancia_km,2) + ' km');
      if(a.distancia_m)  partes.push(fmtNum(a.distancia_m,0) + ' m');
      if(a.desnivel_m)   partes.push(fmtNum(a.desnivel_m,0) + ' m desn.');
      return `<div class="item" data-action="ver-act" data-id="${a.id}">
        <div class="ico">${t.icono}</div>
        <div class="grow">
          <div class="t1">${esc(t.nombre)}${a.subcategoria ? ' · ' + esc(a.subcategoria) : ''}</div>
          <div class="t2">${fmtFecha(a.fecha)}${partes.length ? ' · ' + partes.join(' · ') : ''}</div>
          ${a.ruta ? `<div class="t2">🗺️ ${esc(a.ruta)}</div>` : ''}
        </div>
      </div>`;
    }).join('') : '<div class="empty">Sin resultados.</div>'}
  </div>`;
}

async function exportarJSON(){
  const datos = {};
  for(const s of ['tipos','subcategorias','actividades','planes','checklist','checkEstado','peso','prefs','ideas']){
    datos[s] = await dbAll(s);
  }
  datos.exportado = new Date().toISOString();
  datos.version = "2.0.0";
  const blob = new Blob([JSON.stringify(datos,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'deporte-v2-' + hoyKey() + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
  toast('Copia exportada');
}

async function importarJSON(file){
  try{
    const txt = await file.text();
    const d = JSON.parse(txt);
    for(const s of ['tipos','subcategorias','actividades','planes','checklist','checkEstado','peso','prefs','ideas']){
      if(!Array.isArray(d[s])) continue;
      await dbClear(s);
      for(const it of d[s]) await dbPut(s, it);
    }
    await dbPut('prefs', {k:'seeded', v:1});
    toast('Datos importados correctamente');
    render();
  }catch(err){
    alert('Error al importar el archivo: ' + err.message);
  }
}

async function borrarTodo(){
  if(!confirm('¿Eliminar TODOS los datos registrados?')) return;
  for(const s of ['tipos','subcategorias','actividades','planes','checklist','checkEstado','peso','prefs','ideas']){
    await dbClear(s);
  }
  await seed();
  toast('Datos borrados');
  go('inicio');
}

function showModal(html){

}
function cerrarModal(){
  $('#modal-root').innerHTML = '';
  S.planForm = null;
}

/* =====================================================================
   MANEJO DE EVENTOS DE ENTRADA Y ACCIONES
   ===================================================================== */
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.field && S.form){ S.form[t.dataset.field] = t.value; return; }
  if(t.dataset.peso && S.pesoForm){ S.pesoForm[t.dataset.peso] = t.value; return; }
  if(t.dataset.plan && S.planForm){ S.planForm[t.dataset.plan] = t.value; return; }
  if(t.dataset.resumen){ S['resumen' + t.dataset.resumen.charAt(0).toUpperCase() + t.dataset.resumen.slice(1)] = t.value; }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.pref){ setPref(t.dataset.pref, t.value).then(render); return; }
  if(t.dataset.tipoVisible){
    const tipo = S.tipos.find(x => x.id === t.dataset.tipoVisible);
    if(tipo){ tipo.visible = t.checked ? 1 : 0; dbPut('tipos', tipo).then(render); }
    return;
  }
  if(t.dataset.filtro && t.dataset.rerender){ S.hist[t.dataset.filtro] = t.value; render(); return; }
  if(t.dataset.plan && t.dataset.rerender === 'modal'){ abrirPlanModal(S.planForm); return; }
  if(t.id === 'fileImport' && t.files && t.files[0]){ importarJSON(t.files[0]); }
});

document.addEventListener('click', async e => {
  if(e.target.classList && e.target.classList.contains('overlay')){ cerrarModal(); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  switch(a){
    case 'toggle-theme': toggleTheme(); break;
    case 'atras':        go('inicio'); break;
    case 'go':           go(el.dataset.screen); break;

    /* REGISTRO DE ACTIVIDAD */
    case 'nueva-act': S.form = nuevoForm(); go('actividad'); break;
    case 'ver-act': {
      const act = await dbGet('actividades', Number(el.dataset.id));
      if(!act) return;
      const f = nuevoForm();
      Object.keys(f).forEach(k => { if(act[k] !== undefined && act[k] !== null) f[k] = act[k]; });
      f.id = act.id;
      f.fecha = act.fecha;
      S.form = f;
      go('actividad');
      break;
    }
    case 'form-tipo': S.form.tipo_id = el.dataset.id; S.form.subcategoria = ''; render(); break;
    case 'form-fecha': S.form.fecha = dateKey(addDays(new Date(), Number(el.dataset.dia))); render(); break;
    case 'guardar-act': await guardarActividad(); break;
    case 'borrar-act':
      if(confirm('¿Borrar esta actividad?')){
        await dbDel('actividades', S.form.id);
        S.form = null;
        toast('Actividad eliminada');
        go('inicio');
      }
      break;

    /* CALENDARIO */
    case 'sem-prev':  S.calOffset--; render(); break;
    case 'sem-next':  S.calOffset++; render(); break;
    case 'sem-hoy':   S.calOffset = 0; render(); break;
    case 'plan-nuevo': abrirPlanModal(null, hoyKey(), 9); break;
    case 'plan-nuevo-slot': abrirPlanModal(null, el.dataset.fecha, parseInt(el.dataset.hora)); break;
    case 'plan-editar': {
      const p = await dbGet('planes', Number(el.dataset.id));
      if(p) abrirPlanModal(p);
      break;
    }
    case 'plan-guardar': await guardarPlan(); break;
    case 'plan-borrar':
      if(confirm('¿Borrar este evento programado?')){
        await dbDel('planes', S.planForm.id);
        cerrarModal();
        toast('Evento borrado');
        render();
      }
      break;
    case 'copiar-semana': await copiarSemanaPasada(); break;
    case 'modal-close':   cerrarModal(); break;

    /* CHECKLIST */
    case 'chk-tipo': S.chkTipo = el.dataset.id; render(); break;
    case 'chk-toggle': {
      const id = Number(el.dataset.id);
      const cur = await dbGet('checkEstado', id);
      await dbPut('checkEstado', {id, marcado: !(cur && cur.marcado)});
      render();
      break;
    }
    case 'chk-mover': {
      const it = await dbGet('checklist', Number(el.dataset.id));
      it.seccion = it.seccion === 'imprescindible' ? 'opcional' : 'imprescindible';
      await dbPut('checklist', it);
      render();
      break;
    }
    case 'chk-renombrar': {
      const it = await dbGet('checklist', Number(el.dataset.id));
      const nuevo = prompt('Editar texto:', it.texto);
      if(nuevo && nuevo.trim()){
        it.texto = nuevo.trim();
        await dbPut('checklist', it);
        render();
      }
      break;
    }
    case 'chk-borrar': {
      const id = Number(el.dataset.id);
      if(confirm('¿Borrar ítem?')){
        await dbDel('checklist', id);
        await dbDel('checkEstado', id);
        render();
      }
      break;
    }
    case 'chk-add': {
      const texto = prompt('Nuevo ítem:');
      if(texto && texto.trim()){
        const todos = await dbAll('checklist');
        const orden = todos.length ? Math.max(...todos.map(x => x.orden || 0)) + 1 : 0;
        await dbPut('checklist', {tipo_id: S.chkTipo, seccion: el.dataset.seccion, texto: texto.trim(), orden});
        render();
      }
      break;
    }
    case 'chk-reset': {
      const items = (await dbAll('checklist')).filter(i => i.tipo_id === S.chkTipo);
      for(const it of items) await dbPut('checkEstado', {id: it.id, marcado: false});
      toast('Checklist reiniciada');
      render();
      break;
    }

    /* RESUMEN */
    case 'resumen-rango': S.resumenRango = el.dataset.id; render(); break;

    /* PESO */
    case 'peso-guardar': {
      const kg = num(S.pesoForm.kg);
      if(!kg){ toast('Introduce el peso'); return; }
      const fecha = S.pesoForm.fecha || hoyKey();
      await dbPut('peso', {fecha, kg});
      S.pesoForm = {fecha: hoyKey(), kg:''};
      toast('Peso guardado');
      render();
      break;
    }
    case 'peso-editar': {
      const p = await dbGet('peso', Number(el.dataset.id));
      if(p){ S.pesoForm = {fecha: p.fecha, kg: p.kg}; render(); window.scrollTo(0,0); }
      break;
    }
    case 'peso-borrar':
      if(confirm('¿Eliminar registro de peso?')){
        await dbDel('peso', Number(el.dataset.id));
        render();
      }
      break;

    /* SUBCATEGORÍAS EN AJUSTES */
    case 'subcat-add': {
      const nom = prompt('Nombre de la subcategoría:');
      if(nom && nom.trim()){
        await dbPut('subcategorias', {tipo_id: el.dataset.tipo, nombre: nom.trim()});
        toast('Subcategoría añadida');
        render();
      }
      break;
    }
    case 'subcat-borrar': {
      await dbDel('subcategorias', Number(el.dataset.id));
      toast('Subcategoría borrada');
      render();
      break;
    }

    /* IDEAS DE MEJORA EN AJUSTES */
    case 'idea-guardar': {
      const txt = $('#inputIdea').value;
      if(txt && txt.trim()){
        await dbPut('ideas', {texto: txt.trim(), fecha: hoyKey(), implementado: false});
        toast('Idea guardada');
        render();
      } else {
        toast('Escribe alguna idea');
      }
      break;
    }
    case 'idea-copiar': {
      const item = await dbGet('ideas', Number(el.dataset.id));
      if(item){
        navigator.clipboard.writeText(item.texto);
        toast('Texto copiado al portapapeles');
      }
      break;
    }
    case 'idea-toggle': {
      const item = await dbGet('ideas', Number(el.dataset.id));
      if(item){
        item.implementado = !item.implementado;
        await dbPut('ideas', item);
        render();
      }
      break;
    }
    case 'idea-borrar': {
      await dbDel('ideas', Number(el.dataset.id));
      render();
      break;
    }

    /* GESTIÓN GLOBAL */
    case 'exportar':   await exportarJSON(); break;
    case 'importar':   document.getElementById('fileImport').click(); break;
    case 'borrar-todo': await borrarTodo(); break;
  }
});
