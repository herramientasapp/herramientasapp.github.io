<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Deporte</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#0b1220;color:#e8eefb;font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:30px}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(11,18,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid #1c2942}
  .topbar h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
  .icon-btn{background:#151f33;border:1px solid #26344f;color:#e8eefb;width:36px;height:36px;border-radius:10px;font-size:20px;line-height:1;cursor:pointer;flex:0 0 auto}
  .wrap{padding:14px;max-width:760px;margin:0 auto}
  .card{background:#151f33;border:1px solid #26344f;border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #26344f;background:#1c2942;color:#e8eefb;padding:11px 14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:linear-gradient(180deg,#3b82f6,#2563eb);border-color:#2563eb;color:#fff}
  .btn-block{width:100%}
  .btn-big{padding:18px;font-size:17px}
  .btn-danger{background:#3b1016;border-color:#7f1d1d;color:#fca5a5}
  .btn-sm{padding:7px 10px;font-size:13px;border-radius:9px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tile{background:#151f33;border:1px solid #26344f;border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .tile:active{transform:scale(.985)}
  .tile .ti{font-size:21px;line-height:1.1}
  .tile .tt{font-weight:650}
  .tile .ts{font-size:11.5px;color:#93a3bd}
  .lbl{display:block;font-size:12px;color:#93a3bd;margin:0 0 5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .input{width:100%;background:#0e1728;border:1px solid #26344f;color:#e8eefb;border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
  .input:focus{border-color:#3b82f6}
  select.input{appearance:none}
  textarea.input{min-height:70px;resize:vertical}
  .field{margin-bottom:12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#0e1728;border:1px solid #26344f;color:#c3d0e6;border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600}
  .chip.sel{background:#1d4ed8;border-color:#3b82f6;color:#fff}
  .item{display:flex;gap:11px;align-items:center;padding:11px 12px;background:#151f33;border:1px solid #26344f;border-radius:12px;margin-bottom:8px;cursor:pointer}
  .item:active{background:#1a2740}
  .item .ico{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
  .grow{flex:1;min-width:0}
  .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t2{font-size:12.5px;color:#93a3bd;margin-top:1px}
  .muted{color:#93a3bd}
  .center{text-align:center}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#93a3bd;font-weight:700;margin:16px 0 8px}
  .empty{color:#6b7c99;text-align:center;padding:22px 10px;font-size:14px}

  /* CALENDARIO */
  .cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .cal-nav .lbl-sem{flex:1;text-align:center;font-weight:650;font-size:15px}
  .cal-tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .dia{background:#151f33;border:1px solid #26344f;border-radius:14px;margin-bottom:9px;overflow:hidden}
  .dia.hoy{border-color:#3b82f6;box-shadow:0 0 0 1px rgba(59,130,246,.35) inset}
  .dia-head{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#12203a;border-bottom:1px solid #1e2c46}
  .dia.hoy .dia-head{background:#14294a}
  .dname{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:#93a3bd;font-weight:700}
  .dnum{font-weight:700;font-size:15px}
  .dia.hoy .dname,.dia.hoy .dnum{color:#93c5fd}
  .badge-hoy{font-size:10.5px;background:#1d4ed8;color:#fff;border-radius:999px;padding:2px 8px;font-weight:700;letter-spacing:.4px}
  .add{margin-left:auto;background:#1c2942;border:1px solid #2c3d5c;color:#93c5fd;width:29px;height:29px;border-radius:9px;font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto}
  .planes{padding:8px 9px 9px}
  .plan{display:flex;gap:9px;align-items:flex-start;background:#0e1728;border:1px solid #223050;border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
  .plan:last-child{margin-bottom:0}
  .plan:active{background:#16223a}
  .pico{font-size:16px;line-height:1.3;flex:0 0 auto}
  .ptxt{flex:1;min-width:0}
  .ptxt b{font-weight:600;font-size:14px}
  .ptxt .dur{font-size:12px;color:#7dd3fc;margin-left:7px}
  .ptxt .nota{display:block;font-size:12px;color:#93a3bd;margin-top:2px;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vacio-dia{font-size:12.5px;color:#5b6c88;padding:2px 2px 4px}

  /* CHECKLIST */
  .chk{display:flex;align-items:center;gap:10px;background:#0e1728;border:1px solid #223050;border-radius:11px;padding:10px 11px;margin-bottom:7px}
  .chk .box{width:22px;height:22px;border-radius:7px;border:2px solid #3b4d6e;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 auto}
  .chk.on .box{background:#2563eb;border-color:#3b82f6}
  .chk.on .txt{text-decoration:line-through;color:#6b7c99}
  .chk .txt{flex:1;min-width:0}
  .mini{background:none;border:none;color:#5b6c88;font-size:15px;padding:4px 5px;cursor:pointer;line-height:1}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(4,8,16,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media(min-width:600px){.overlay{align-items:center;padding:20px}}
  .modal{background:#131e33;border:1px solid #26344f;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
  @media(min-width:600px){.modal{border-radius:18px}}
  .modal h2{margin:0 0 14px;font-size:17px}
  .modal-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .modal-actions .btn{flex:1}

  .up{color:#4ade80;font-weight:600}
  .down{color:#f87171;font-weight:600}
  .metric{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-top:1px solid #1e2c46}
  .metric:first-child{border-top:none}
  .metric .v{font-variant-numeric:tabular-nums;font-weight:600}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d4ed8;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .hist-tipo{display:inline-block;font-size:12px;color:#93a3bd}
  a{color:#7dd3fc}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = (n,d=1) => Number(Number(n).toFixed(d)).toLocaleString('es-ES');

function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ const p = String(k).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d,n){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function hoyKey(){ return dateKey(new Date()); }
function fmtFecha(k){ if(!k) return '—'; return parseKey(k).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}); }
function fmtFechaCorta(k){ return parseKey(k).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }
function inicioSemana(d, ini){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = x.getDay();
  const diff = (ini === 'domingo') ? dow : (dow + 6) % 7;
  return addDays(x, -diff);
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1900);
}

/* =====================================================================
   INDEXEDDB
   ===================================================================== */
const DB_NAME = 'deporte', DB_VER = 1;
let db = null;

function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = ev => {
      const d = ev.target.result;
      const mk = (n,opt={}) => { if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,opt); };
      mk('tipos',       {keyPath:'id'});
      mk('variantes',   {keyPath:'id', autoIncrement:true});
      mk('actividades', {keyPath:'id', autoIncrement:true});
      mk('planes',      {keyPath:'id', autoIncrement:true});
      mk('checklist',   {keyPath:'id', autoIncrement:true});
      mk('checkEstado', {keyPath:'id'});
      mk('peso',        {keyPath:'id', autoIncrement:true});
      mk('prefs',       {keyPath:'k'});
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
function req(r){ return new Promise((res,rej)=>{ r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
const dbAll   = s     => req(db.transaction(s).objectStore(s).getAll());
const dbGet   = (s,k) => req(db.transaction(s).objectStore(s).get(k));
const dbPut   = (s,v) => req(db.transaction(s,'readwrite').objectStore(s).put(v));
const dbDel   = (s,k) => req(db.transaction(s,'readwrite').objectStore(s).delete(k));
const dbClear = s     => req(db.transaction(s,'readwrite').objectStore(s).clear());

/* =====================================================================
   DATOS DE FÁBRICA
   ===================================================================== */
const TIPOS_BASE = [
  {id:'senderismo', nombre:'Senderismo', icono:'🥾', visible:1, orden:1},
  {id:'paseo',      nombre:'Paseo',      icono:'🚶', visible:1, orden:2},
  {id:'gimnasio',   nombre:'Gimnasio',   icono:'🏋️', visible:1, orden:3},
  {id:'otro',       nombre:'Otro',       icono:'✨', visible:1, orden:4},
  {id:'natacion',   nombre:'Natación',   icono:'🏊', visible:0, orden:5},
  {id:'running',    nombre:'Running',    icono:'🏃', visible:0, orden:6},
];

const CHECK_FABRICA = {
  senderismo:{
    imprescindible:['Agua','Botas','Chubasquero','Comida','Móvil cargado','Botiquín'],
    opcional:['Bastones','Gorra','Crema solar','Cámara']
  },
  paseo:{
    imprescindible:['Calzado cómodo'],
    opcional:['Agua','Auriculares']
  },
  gimnasio:{
    imprescindible:['Ropa deporte','Toalla','Candado','Botella agua'],
    opcional:['Auriculares','Guantes','Gomas']
  },
  otro:{ imprescindible:[], opcional:[] },
  natacion:{
    imprescindible:['Bañador','Gafas','Gorro','Toalla','Chanclas'],
    opcional:['Secador','Tapones']
  },
  running:{
    imprescindible:['Zapatillas','Ropa técnica'],
    opcional:['Auriculares','Gel']
  }
};

/* Campos específicos por tipo de actividad */
const CAMPOS_POR_TIPO = {
  senderismo:['distancia_km','desnivel_m','peso_mochila_kg','con_quien','ruta','wikiloc'],
  paseo:['distancia_km'],
  gimnasio:['tipo_sesion'],
  natacion:['distancia_m'],
  running:['distancia_km'],
  otro:['descripcion','distancia_km']
};
const CAMPO_DEF = {
  distancia_km:    {label:'Distancia (km)',      type:'number', step:'0.01'},
  desnivel_m:      {label:'Desnivel (m)',        type:'number', step:'1'},
  peso_mochila_kg: {label:'Peso mochila (kg)',   type:'number', step:'0.1'},
  con_quien:       {label:'Con quién',           type:'text'},
  ruta:            {label:'Nombre de ruta',      type:'text'},
  wikiloc:         {label:'Enlace Wikiloc',      type:'url'},
  tipo_sesion:     {label:'Tipo de sesión',      type:'select', opciones:['fuerza','cardio','mixto','dirigida']},
  distancia_m:     {label:'Distancia (m)',       type:'number', step:'1'},
  descripcion:     {label:'Descripción',         type:'text'}
};

/* =====================================================================
   ESTADO
   ===================================================================== */
const S = {
  screen:'inicio',
  tipos:[], variantes:[], prefs:{},
  form:null,
  calOffset:0,
  chkTipo:'senderismo',
  hist:{tipo:'', desde:'', hasta:''},
  resumenRango:'semana',
  resumenDesde:'', resumenHasta:'',
  pesoForm:{fecha:hoyKey(), kg:''},
  pesoCache:[],
  planForm:null
};

/* =====================================================================
   INICIALIZACIÓN / SEMILLA
   ===================================================================== */
async function seed(){
  const ya = await dbGet('prefs','seeded');
  if(ya) return;
  for(const t of TIPOS_BASE) await dbPut('tipos', {...t});
  let orden = 0;
  for(const tipo of Object.keys(CHECK_FABRICA)){
    for(const seccion of ['imprescindible','opcional']){
      for(const texto of CHECK_FABRICA[tipo][seccion]){
        await dbPut('checklist', {tipo_id:tipo, seccion, texto, orden: orden++});
      }
    }
  }
  await dbPut('prefs', {k:'semanaInicio',      v:'lunes'});
  await dbPut('prefs', {k:'calendarioVista',   v:'compacta'});
  await dbPut('prefs', {k:'calendarioOcultos', v:[]});
  await dbPut('prefs', {k:'seeded',            v:1});
}

async function loadState(){
  S.tipos    = (await dbAll('tipos')).sort((a,b)=>a.orden-b.orden);
  S.variantes = await dbAll('variantes');
  const p = {};
  (await dbAll('prefs')).forEach(x => p[x.k] = x.v);
  S.prefs = p;
}
async function setPref(k,v){
  await dbPut('prefs', {k, v});
  S.prefs[k] = v;
}
const tipoDe = id => S.tipos.find(t => t.id === id) || {nombre:'—', icono:'•'};
const prefInicio = () => S.prefs.semanaInicio || 'lunes';
const prefVista  = () => S.prefs.calendarioVista || 'compacta';
const prefOcultosCal = () => Array.isArray(S.prefs.calendarioOcultos) ? S.prefs.calendarioOcultos : [];

/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
function go(screen){ S.screen = screen; render(); window.scrollTo(0,0); }
function topbar(titulo){
  return `<header class="topbar">
    ${S.screen === 'inicio' ? '' : '<button class="icon-btn" data-action="atras" aria-label="Volver">‹</button>'}
    <h1>${esc(titulo)}</h1>
  </header>`;
}

/* =====================================================================
   RENDER PRINCIPAL
   ===================================================================== */
async function render(){
  await loadState();
  let html = '';
  switch(S.screen){
    case 'inicio':     html = await viewInicio();     break;
    case 'actividad':  html = await viewActividad();  break;
    case 'calendario': html = await viewCalendario(); break;
    case 'checklist':  html = await viewChecklist();  break;
    case 'resumen':    html = await viewResumen();    break;
    case 'peso':       html = await viewPeso();       break;
    case 'historico':  html = await viewHistorico();  break;
    case 'ajustes':    html = await viewAjustes();    break;
  }
  $('#app').innerHTML = html;
  if(S.screen === 'peso') drawPesoChart();
}

/* =====================================================================
   1. INICIO
   ===================================================================== */
function itemActividad(a){
  const t = tipoDe(a.tipo_id);
  const extra = [];
  if(a.duracion_min) extra.push(a.duracion_min + ' min');
  const km = a.distancia_km != null ? a.distancia_km : (a.distancia_m != null ? (a.distancia_m/1000) : null);
  if(km) extra.push(fmtNum(km,2) + ' km');
  return `<div class="item" data-action="ver-act" data-id="${a.id}">
    <div class="ico">${t.icono}</div>
    <div class="grow">
      <div class="t1">${esc(t.nombre)}${a.variante ? ' · ' + esc(a.variante) : ''}</div>
      <div class="t2">${fmtFecha(a.fecha)}${extra.length ? ' · ' + extra.join(' · ') : ''}</div>
    </div>
  </div>`;
}

async function viewInicio(){
  const acts = (await dbAll('actividades'))
    .sort((a,b) => (b.fecha||'').localeCompare(a.fecha||'') || (b.id - a.id))
    .slice(0,5);

  return topbar('Deporte') + `
  <div class="wrap">
    <button class="btn btn-primary btn-block btn-big" data-action="nueva-act">＋ Registrar actividad</button>

    <div class="sec-title">Accesos rápidos</div>
    <div class="tiles">
      <div class="tile" data-action="go" data-screen="calendario">
        <div class="ti">🗓️</div><div class="tt">Calendario</div>
        <div class="ts">Planifica la semana</div>
      </div>
      <div class="tile" data-action="go" data-screen="checklist">
        <div class="ti">🎒</div><div class="tt">Checklist</div>
        <div class="ts">Prepara la mochila</div>
      </div>
      <div class="tile" data-action="go" data-screen="resumen">
        <div class="ti">📊</div><div class="tt">Resumen</div>
        <div class="ts">Evolución por periodo</div>
      </div>
      <div class="tile" data-action="go" data-screen="peso">
        <div class="ti">⚖️</div><div class="tt">Peso</div>
        <div class="ts">Registro semanal</div>
      </div>
    </div>

    <div class="sec-title">Últimas actividades</div>
    ${acts.length ? acts.map(itemActividad).join('') : '<div class="empty">Todavía no hay actividades registradas.</div>'}

    <div class="row" style="margin-top:14px">
      <button class="btn" data-action="go" data-screen="historico">Histórico</button>
      <button class="btn" data-action="go" data-screen="ajustes">Ajustes</button>
    </div>
  </div>`;
}

/* =====================================================================
   2. REGISTRAR / EDITAR ACTIVIDAD
   ===================================================================== */
function nuevoForm(){
  const primero = S.tipos.find(t => t.visible) || S.tipos[0];
  return {
    id:null,
    tipo_id: primero ? primero.id : 'senderismo',
    fecha: hoyKey(),
    variante:'', duracion_min:'', notas:'',
    distancia_km:'', desnivel_m:'', peso_mochila_kg:'', con_quien:'',
    ruta:'', wikiloc:'', tipo_sesion:'', distancia_m:'', descripcion:''
  };
}

function campoHTML(c, valor){
  const d = CAMPO_DEF[c];
  if(d.type === 'select'){
    return `<div class="field"><label class="lbl">${d.label}</label>
      <select class="input" data-field="${c}">
        <option value="">—</option>
        ${d.opciones.map(o => `<option value="${o}" ${valor === o ? 'selected' : ''}>${o.charAt(0).toUpperCase()+o.slice(1)}</option>`).join('')}
      </select></div>`;
  }
  return `<div class="field"><label class="lbl">${d.label}</label>
    <input class="input" type="${d.type}" ${d.step ? `step="${d.step}"` : ''}
      ${d.type === 'number' ? 'inputmode="decimal"' : ''}
      data-field="${c}" value="${esc(valor ?? '')}"></div>`;
}

async function viewActividad(){
  if(!S.form) S.form = nuevoForm();
  const f = S.form;
  const tiposVis = S.tipos.filter(t => t.visible);
  const vars = S.variantes.filter(v => v.tipo_id === f.tipo_id).map(v => v.nombre);

  return topbar(f.id ? 'Editar actividad' : 'Registrar actividad') + `
  <div class="wrap">
    <div class="card">
      <label class="lbl">Tipo</label>
      <div class="chips">
        ${tiposVis.map(t => `<button class="chip ${t.id === f.tipo_id ? 'sel' : ''}"
            data-action="form-tipo" data-id="${t.id}">${t.icono} ${esc(t.nombre)}</button>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label class="lbl">Fecha</label>
        <input class="input" type="date" data-field="fecha" value="${esc(f.fecha)}">
        <div class="row" style="margin-top:8px">
          <button class="btn btn-sm" data-action="form-fecha" data-dia="0">Hoy</button>
          <button class="btn btn-sm" data-action="form-fecha" data-dia="-1">Ayer</button>
        </div>
      </div>

      <div class="field">
        <label class="lbl">Variante</label>
        <input class="input" data-field="variante" list="dl-variantes" value="${esc(f.variante)}"
               placeholder="opcional, autocompleta al escribir">
        <datalist id="dl-variantes">${vars.map(v => `<option value="${esc(v)}">`).join('')}</datalist>
      </div>

      <div class="field">
        <label class="lbl">Duración (min)</label>
        <input class="input" type="number" inputmode="numeric" data-field="duracion_min" value="${esc(f.duracion_min)}">

async function guardarActividad(){

  if(!f.fecha){ toast('Falta la fecha'); return; }

    tipo_id: f.tipo_id,
    fecha: f.fecha,
    variante: (f.variante || '').trim(),
    duracion_min: f.duracion_min === '' ? null : num(f.duracion_min),

  };
  for(const c of (CAMPOS_POR_TIPO[f.tipo_id] || [])){

    if(d.type === 'number') obj[c] = f[c] === '' ? null : num(f[c]);

  if(f.id) obj.id = f.id;
  await dbPut('actividades', obj);

  /* variante nueva: se crea sola, nunca se borra */
  const v = obj.variante;
  if(v && !S.variantes.some(x => x.tipo_id === obj.tipo_id && x.nombre.toLowerCase() === v.toLowerCase())){

   3. CALENDARIO SEMANAL  (inicio por defecto: lunes · vista: compacta)
   ===================================================================== */
const DIAS_LUN = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DIAS_DOM = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

async function viewCalendario(){
  const ini = prefInicio();
  const vista = prefVista();
  const ocultosCal = prefOcultosCal();

  const base  = inicioSemana(new Date(), ini);
  const start = addDays(base, S.calOffset * 7);
  const dias  = Array.from({length:7}, (_,i) => addDays(start, i));
  const kHoy  = hoyKey();

  const planes = await dbAll('planes');

  /* Tipos visibles en el calendario: visibles globalmente y no ocultos aquí */
  const visiblesCal = new Set(
    S.tipos.filter(t => t.visible && !ocultosCal.includes(t.id)).map(t => t.id)
  );

  const porDia = {};
  for(const p of planes){
    if(!visiblesCal.has(p.tipo_id)) continue;      /* se conservan, pero no se muestran */
    (porDia[p.fecha] = porDia[p.fecha] || []).push(p);
  }
  for(const k in porDia){
    porDia[k].sort((a,b) => (a.duracion_min||0) - (b.duracion_min||0) || a.id - b.id);
  }

  const nombres = (ini === 'domingo') ? DIAS_DOM : DIAS_LUN;
  const kIni = dateKey(dias[0]), kFin = dateKey(dias[6]);
  const esActual = S.calOffset === 0;

  const etiqueta = `${fmtFechaCorta(kIni)} – ${fmtFechaCorta(kFin)} ${parseKey(kFin).getFullYear()}`;

  const filas = dias.map((d,i) => {
    const k = dateKey(d);
    const esHoy = (k === kHoy);
    const lista = porDia[k] || [];

    const tarjetas = lista.map(p => {
      const t = tipoDe(p.tipo_id);
      const titulo = p.variante ? esc(p.variante) : esc(t.nombre);
      if(vista === 'compacta'){
        return `<div class="plan" data-action="plan-editar" data-id="${p.id}">
          <span class="pico">${t.icono}</span>
          <span class="ptxt"><b>${titulo}</b></span>
        </div>`;
      }
      return `<div class="plan" data-action="plan-editar" data-id="${p.id}">
        <span class="pico">${t.icono}</span>
        <span class="ptxt">
          <b>${titulo}</b>${p.duracion_min ? `<span class="dur">${p.duracion_min} min</span>` : ''}
          ${p.nota ? `<span class="nota">${esc(p.nota)}</span>` : ''}
        </span>
      </div>`;
    }).join('');

    return `<div class="dia ${esHoy ? 'hoy' : ''}">
      <div class="dia-head">
        <span class="dname">${nombres[i]}</span>
        <span class="dnum">${d.getDate()}</span>
        ${esHoy ? '<span class="badge-hoy">HOY</span>' : ''}
        <button class="add" data-action="plan-nuevo" data-fecha="${k}" aria-label="Añadir plan">＋</button>
      </div>
      <div class="planes">
        ${tarjetas || '<div class="vacio-dia">Sin planes</div>'}
      </div>
    </div>`;
  }).join('');

  return topbar('Calendario') + `
  <div class="wrap">
    <div class="cal-nav">
      <button class="icon-btn" data-action="sem-prev" aria-label="Semana anterior">‹</button>
      <div class="lbl-sem">${etiqueta}${esActual ? '<div class="muted" style="font-size:11.5px;font-weight:600">Esta semana</div>' : ''}</div>
      <button class="icon-btn" data-action="sem-next" aria-label="Semana siguiente">›</button>
    </div>

    <div class="cal-tools">
      <button class="chip" data-action="sem-hoy">Hoy</button>
      <button class="chip" data-action="copiar-semana">Copiar semana pasada</button>
      <button class="chip" data-action="cal-config">⚙ Configurar</button>
    </div>

    ${filas}
  </div>`;
}

async function copiarSemanaPasada(){
  const ini = prefInicio();
  const start = addDays(inicioSemana(new Date(), ini), S.calOffset * 7);
  const kIni = dateKey(addDays(start,-7));
  const kFin = dateKey(addDays(start,-1));
  const kIniAct = dateKey(start);
  const kFinAct = dateKey(addDays(start,6));

  const planes = await dbAll('planes');
  const previos = planes.filter(p => p.fecha >= kIni && p.fecha <= kFin);
  if(!previos.length){ toast('La semana pasada no tiene planes'); return; }

  const yaHay = planes.some(p => p.fecha >= kIniAct && p.fecha <= kFinAct);
  if(yaHay && !confirm('La semana actual ya tiene planes. ¿Añadir igualmente los de la semana anterior?')) return;

  for(const p of previos){
    const nuevoDia = dateKey(addDays(parseKey(p.fecha), 7));
    await dbPut('planes', {
      tipo_id: p.tipo_id, fecha: nuevoDia,
      variante: p.variante || '', duracion_min: p.duracion_min ?? null, nota: p.nota || ''
    });
  }
  toast(previos.length + ' planes copiados');
  render();
}

const RANGOS = [
  ['semana','Semana'], ['2semanas','2 semanas'], ['mes','Mes'],
  ['trimestre','Trimestre'], ['semestre','Semestre'], ['año','Año'], ['personalizado','Personalizado']
];
const DIAS_RANGO = {semana:7, '2semanas':14, mes:30, trimestre:91, semestre:182, año:365};

function rangoActual(){
  const hoy = new Date();
  if(S.resumenRango === 'personalizado'){
    const desde = S.resumenDesde ? parseKey(S.resumenDesde) : addDays(hoy,-29);
    const hasta = S.resumenHasta ? parseKey(S.resumenHasta) : hoy;
    return {desde, hasta};
  }
  const n = DIAS_RANGO[S.resumenRango] || 7;
  return {desde: addDays(hoy, -(n-1)), hasta: hoy};
}

function totalesPorTipo(acts, tiposVis){
  const r = {};
  tiposVis.forEach(t => r[t.id] = {n:0, km:0, desn:0, min:0});
  for(const a of acts){
    const x = r[a.tipo_id];
    if(!x) continue;
    x.n++;
    x.km  += num(a.distancia_km) + num(a.distancia_m)/1000;
    x.desn += num(a.desnivel_m);
    x.min += num(a.duracion_min);
  }
  return r;
}

function delta(cur, prev){
  if(prev === 0 && cur === 0) return '<span class="muted">—</span>';
  if(prev === 0) return '<span class="up">nuevo</span>';
  const p = ((cur - prev) / prev) * 100;
  const cls = p > 0 ? 'up' : (p < 0 ? 'down' : 'muted');
  const arrow = p > 0 ? '↑' : (p < 0 ? '↓' : '=');
  return `<span class="${cls}">${arrow} ${fmtNum(Math.abs(p),0)}%</span>`;
}

async function viewResumen(){
  const tiposVis = S.tipos.filter(t => t.visible);
  const acts = await dbAll('actividades');

  const {desde, hasta} = rangoActual();
  const nDias = Math.round((hasta - desde) / 86400000) + 1;
  const desdePrev = addDays(desde, -nDias);
  const hastaPrev = addDays(desde, -1);

  const kD = dateKey(desde), kH = dateKey(hasta);
  const kDP = dateKey(desdePrev), kHP = dateKey(hastaPrev);

  const enRango  = acts.filter(a => a.fecha >= kD && a.fecha <= kH);
  const enPrev   = acts.filter(a => a.fecha >= kDP && a.fecha <= kHP);

  const tot  = totalesPorTipo(enRango, tiposVis);
  const prev = totalesPorTipo(enPrev, tiposVis);

  const bloques = tiposVis.map(t => {
    const a = tot[t.id], b = prev[t.id];
    return `<div class="card">
      <div style="font-weight:650;margin-bottom:8px">${t.icono} ${esc(t.nombre)}</div>
      <div class="metric"><span>Actividades</span><span class="v">${a.n} ${delta(a.n, b.n)}</span></div>
      <div class="metric"><span>Distancia</span><span class="v">${fmtNum(a.km,2)} km ${delta(a.km, b.km)}</span></div>
      <div class="metric"><span>Desnivel</span><span class="v">${fmtNum(a.desn,0)} m ${delta(a.desn, b.desn)}</span></div>
      <div class="metric"><span>Duración</span><span class="v">${fmtNum(a.min,0)} min ${delta(a.min, b.min)}</span></div>
    </div>`;
  }).join('');

  return topbar('Resumen') + `
  <div class="wrap">
    <div class="chips" style="margin-bottom:14px">
      ${RANGOS.map(([k,l]) => `<button class="chip ${S.resumenRango === k ? 'sel' : ''}"
          data-action="resumen-rango" data-id="${k}">${l}</button>`).join('')}
    </div>

    ${S.resumenRango === 'personalizado' ? `<div class="card">
      <div class="row">
        <div class="field" style="margin:0"><label class="lbl">Desde</label>
          <input class="input" type="date" data-resumen="desde" value="${esc(S.resumenDesde)}"></div>
        <div class="field" style="margin:0"><label class="lbl">Hasta</label>
          <input class="input" type="date" data-resumen="hasta" value="${esc(S.resumenHasta)}"></div>
      </div>
    </div>` : ''}

    <div class="muted center" style="font-size:13px;margin-bottom:12px">
      ${fmtFecha(kD)} – ${fmtFecha(kH)} · comparado con ${fmtFecha(kDP)} – ${fmtFecha(kHP)}
    </div>

    ${bloques || '<div class="empty">No hay tipos visibles.</div>'}
  </div>`;
}

function drawPesoChart(){
  const cv = document.getElementById('pesoCanvas');
  if(!cv) return;
  const datos = S.pesoCache;
  if(datos.length < 2) return;

  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 300;
  const h = 180;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const kgs = datos.map(d => d.kg);
  const min = Math.min(...kgs) - 0.6;
  const max = Math.max(...kgs) + 0.6;
  const padX = 34, padY = 20;

  const X = i => padX + (w - padX*2) * (i / (datos.length - 1));
  const Y = kg => h - padY - (h - padY*2) * ((kg - min) / ((max - min) || 1));

  /* rejilla */
  ctx.strokeStyle = '#1e2c46';
  ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const y = padY + (h - padY*2) * (i/3);
    ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(w-padX, y); ctx.stroke();
  }

  /* etiquetas */
  ctx.fillStyle = '#6b7c99';
  ctx.font = '10px system-ui,sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(fmtNum(max,1), padX-6, padY+3);
  ctx.fillText(fmtNum(min,1), padX-6, h-padY+3);

  /* línea */
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  datos.forEach((d,i) => { const x = X(i), y = Y(d.kg); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.stroke();

  /* puntos */
  ctx.fillStyle = '#7dd3fc';
  datos.forEach((d,i) => {
    ctx.beginPath();
    ctx.arc(X(i), Y(d.kg), 3, 0, Math.PI*2);
    ctx.fill();
  });
}

/* =====================================================================
   7. HISTÓRICO
   ===================================================================== */
async function viewHistorico(){
  const todas = await dbAll('actividades');   /* incluye tipos ocultos */
  const f = S.hist;

  let lista = todas.slice();
  if(f.tipo)  lista = lista.filter(a => a.tipo_id === f.tipo);
  if(f.desde) lista = lista.filter(a => a.fecha >= f.desde);
  if(f.hasta) lista = lista.filter(a => a.fecha <= f.hasta);
  lista.sort((a,b) => (b.fecha||'').localeCompare(a.fecha||'') || (b.id - a.id));

  const soloSenderismo = f.tipo === 'senderismo';

  return topbar('Histórico') + `
  <div class="wrap">
    <div class="card">
      <div class="field">
        <label class="lbl">Tipo</label>
        <select class="input" data-filtro="tipo" data-rerender="1">
          <option value="">Todos (incluye ocultos)</option>
          ${S.tipos.map(t => `<option value="${t.id}" ${f.tipo === t.id ? 'selected' : ''}>${t.icono} ${esc(t.nombre)}${t.visible ? '' : ' (oculto)'}</option>`).join('')}
        </select>
      </div>
      <div class="row">
        <div class="field" style="margin:0"><label class="lbl">Desde</label>
          <input class="input" type="date" data-filtro="desde" data-rerender="1" value="${esc(f.desde)}"></div>
        <div class="field" style="margin:0"><label class="lbl">Hasta</label>
          <input class="input" type="date" data-filtro="hasta" data-rerender="1" value="${esc(f.hasta)}"></div>
      </div>
      <button class="btn btn-sm" style="margin-top:10px" data-action="hist-limpiar">Limpiar filtros</button>
    </div>

    <div class="muted" style="font-size:13px;margin-bottom:10px">${lista.length} actividades</div>

    ${lista.length ? lista.map(a => {
      const t = tipoDe(a.tipo_id);
      const partes = [];
      if(a.duracion_min) partes.push(a.duracion_min + ' min');
      if(a.distancia_km) partes.push(fmtNum(a.distancia_km,2) + ' km');
      if(a.distancia_m)  partes.push(fmtNum(a.distancia_m,0) + ' m');
      if(a.desnivel_m)   partes.push(fmtNum(a.desnivel_m,0) + ' m desn.');
      if(a.tipo_sesion)  partes.push(a.tipo_sesion);
      return `<div class="item" data-action="ver-act" data-id="${a.id}">
        <div class="ico">${t.icono}</div>
        <div class="grow">
          <div class="t1">${esc(t.nombre)}${a.variante ? ' · ' + esc(a.variante) : ''}</div>
          <div class="t2">${fmtFecha(a.fecha)}${partes.length ? ' · ' + partes.join(' · ') : ''}</div>
          ${soloSenderismo && a.ruta ? `<div class="t2">🗺️ ${esc(a.ruta)}${a.wikiloc ? ` · <a href="${esc(a.wikiloc)}" target="_blank" rel="noopener">Wikiloc</a>` : ''}</div>` : ''}
        </div>
        ${!t.visible ? '<span class="hist-tipo">oculto</span>' : ''}
      </div>`;
    }).join('') : '<div class="empty">Sin resultados.</div>'}
  </div>`;
}

async function exportarJSON(){
  const datos = {};
  for(const s of ['tipos','variantes','actividades','planes','checklist','checkEstado','peso','prefs']){
    datos[s] = await dbAll(s);
  }
  datos.exportado = new Date().toISOString();
  datos.version = 1;
  const blob = new Blob([JSON.stringify(datos,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'deporte-' + hoyKey() + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
  toast('JSON exportado');
}

async function importarJSON(file){
  try{
    const txt = await file.text();
    const d = JSON.parse(txt);
    for(const s of ['tipos','variantes','actividades','planes','checklist','checkEstado','peso','prefs']){
      if(!Array.isArray(d[s])) continue;
      await dbClear(s);
      for(const it of d[s]) await dbPut(s, it);
    }
    await dbPut('prefs', {k:'seeded', v:1});
    S.form = null;
    toast('Datos importados');
    render();
  }catch(err){
    alert('No se pudo importar el JSON: ' + err.message);
  }
}

async function borrarTodo(){
  if(!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) return;
  if(!confirm('Confirma de nuevo: se perderán actividades, planes, checklists y peso.')) return;
  for(const s of ['tipos','variantes','actividades','planes','checklist','checkEstado','peso','prefs']){
    await dbClear(s);
  }
  S.form = null;
  S.calOffset = 0;
  await seed();
  toast('Todo borrado');
  go('inicio');
}

function showModal(html){
  $('#modal-root').innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`;
}
function cerrarModal(){
  $('#modal-root').innerHTML = '';
  S.planForm = null;
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('input', e => {
  const t = e.target;

  if(t.dataset.field && S.form){ S.form[t.dataset.field] = t.value; return; }
  if(t.dataset.peso && S.pesoForm){ S.pesoForm[t.dataset.peso] = t.value; return; }
  if(t.dataset.plan && S.planForm){ S.planForm[t.dataset.plan] = t.value; return; }
  if(t.dataset.resumen){ S['resumen' + t.dataset.resumen.charAt(0).toUpperCase() + t.dataset.resumen.slice(1)] = t.value; }
});

document.addEventListener('change', e => {
  const t = e.target;

  /* Preferencias del calendario / ajustes */
  if(t.dataset.pref){
    setPref(t.dataset.pref, t.value).then(render);
    return;
  }

  /* Tipos visibles en el calendario */
  if(t.dataset.calTipo){
    const id = t.dataset.calTipo;
    const ocultos = prefOcultosCal().slice();
    const i = ocultos.indexOf(id);
    if(t.checked){ if(i >= 0) ocultos.splice(i,1); }
    else { if(i < 0) ocultos.push(id); }
    setPref('calendarioOcultos', ocultos).then(render);
    return;
  }

  /* Visibilidad global de tipos */
  if(t.dataset.tipoVisible){
    const tipo = S.tipos.find(x => x.id === t.dataset.tipoVisible);
    if(tipo){ tipo.visible = t.checked ? 1 : 0; dbPut('tipos', tipo).then(render); }
    return;
  }

  /* Filtros del histórico */
  if(t.dataset.filtro && t.dataset.rerender){
    S.hist[t.dataset.filtro] = t.value;
    render();
    return;
  }

  /* Re-render del modal de plan al cambiar el tipo */
  if(t.dataset.plan && t.dataset.rerender === 'modal'){
    abrirPlanModal(S.planForm);
    return;
  }

  /* Importar */
  if(t.id === 'fileImport'){
    if(t.files && t.files[0]) importarJSON(t.files[0]);
  }
});

document.addEventListener('click', async e => {
  /* Cierre del modal al tocar el fondo */
  if(e.target.classList && e.target.classList.contains('overlay')){
    cerrarModal();
    return;
  }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  switch(a){

    /* ---------- navegación ---------- */
    case 'atras':        go('inicio'); break;
    case 'go':           go(el.dataset.screen); break;

    /* ---------- actividad ---------- */
    case 'nueva-act':
      S.form = nuevoForm();
      go('actividad');
      break;

    case 'ver-act': {
      const act = await dbGet('actividades', Number(el.dataset.id));
      if(!act) return;
      const f = nuevoForm();
      Object.keys(f).forEach(k => { if(act[k] !== undefined && act[k] !== null) f[k] = act[k]; });
      f.id = act.id;
      f.fecha = act.fecha;
      S.form = f;
      go('actividad');
      break;
    }

    case 'form-tipo':
      S.form.tipo_id = el.dataset.id;
      render();
      break;

    case 'form-fecha': {
      const d = addDays(new Date(), Number(el.dataset.dia));
      S.form.fecha = dateKey(d);
      render();
      break;
    }

    case 'guardar-act':   await guardarActividad(); break;

    case 'borrar-act':
      if(confirm('¿Borrar esta actividad?')){
        await dbDel('actividades', S.form.id);
        S.form = null;
        toast('Actividad borrada');
        go('inicio');
      }
      break;

    /* ---------- calendario ---------- */
    case 'sem-prev':  S.calOffset--; render(); break;
    case 'sem-next':  S.calOffset++; render(); break;
    case 'sem-hoy':   S.calOffset = 0; render(); break;

    case 'plan-nuevo': abrirPlanModal(null, el.dataset.fecha); break;

    case 'plan-editar': {
      const p = await dbGet('planes', Number(el.dataset.id));
      if(p) abrirPlanModal(p);
      break;
    }

    case 'plan-guardar': await guardarPlan(); break;

    case 'plan-borrar':
      if(confirm('¿Borrar este plan?')){
        await dbDel('planes', S.planForm.id);
        cerrarModal();
        toast('Plan borrado');
        render();
      }
      break;

    case 'copiar-semana': await copiarSemanaPasada(); break;
    case 'cal-config':    abrirConfigCalendario(); break;
    case 'modal-close':   cerrarModal(); render(); break;

    /* ---------- checklist ---------- */
    case 'chk-tipo': S.chkTipo = el.dataset.id; render(); break;

    case 'chk-toggle': {
      const id = Number(el.dataset.id);
      const cur = await dbGet('checkEstado', id);
      await dbPut('checkEstado', {id, marcado: !(cur && cur.marcado)});
      render();
      break;
    }

    case 'chk-mover': {
      const it = await dbGet('checklist', Number(el.dataset.id));
      it.seccion = it.seccion === 'imprescindible' ? 'opcional' : 'imprescindible';
      await dbPut('checklist', it);
      render();
      break;
    }

    case 'chk-renombrar': {
      const it = await dbGet('checklist', Number(el.dataset.id));
      const nuevo = prompt('Nuevo nombre:', it.texto);
      if(nuevo && nuevo.trim()){
        it.texto = nuevo.trim();
        await dbPut('checklist', it);
        render();
      }
      break;
    }

    case 'chk-borrar': {
      const id = Number(el.dataset.id);
      if(confirm('¿Borrar este ítem?')){
        await dbDel('checklist', id);
        await dbDel('checkEstado', id);
        render();
      }
      break;
    }

    case 'chk-add': {
      const texto = prompt('Nuevo ítem:');
      if(texto && texto.trim()){
        const todos = await dbAll('checklist');
        const orden = todos.length ? Math.max(...todos.map(x => x.orden || 0)) + 1 : 0;
        await dbPut('checklist', {tipo_id: S.chkTipo, seccion: el.dataset.seccion, texto: texto.trim(), orden});
        render();
      }
      break;
    }

    case 'chk-reset': {
      const items = (await dbAll('checklist')).filter(i => i.tipo_id === S.chkTipo);
      for(const it of items) await dbPut('checkEstado', {id: it.id, marcado: false});
      toast('Checklist reiniciada');
      render();
      break;
    }

    /* ---------- resumen ---------- */
    case 'resumen-rango':
      S.resumenRango = el.dataset.id;
      render();
      break;

    /* ---------- peso ---------- */
    case 'peso-guardar': {
      const kg = num(S.pesoForm.kg);
      if(!kg){ toast('Introduce el peso'); return; }
      const fecha = S.pesoForm.fecha || hoyKey();
      const semana = dateKey(inicioSemana(parseKey(fecha), 'lunes'));
      const todas = await dbAll('peso');
      const existente = todas.find(p => {
        const s = p.semana || dateKey(inicioSemana(parseKey(p.fecha), 'lunes'));
        return s === semana;
      });
      if(existente) await dbPut('peso', {...existente, fecha, kg, semana});
      else await dbPut('peso', {fecha, kg, semana});
      S.pesoForm = {fecha: hoyKey(), kg:''};
      toast('Peso guardado');
      render();
      break;
    }

    case 'peso-editar': {
      const p = await dbGet('peso', Number(el.dataset.id));
      if(p){ S.pesoForm = {fecha: p.fecha, kg: p.kg}; render(); window.scrollTo(0,0); }
      break;
    }

    case 'peso-borrar':
      if(confirm('¿Borrar este registro de peso?')){
        await dbDel('peso', Number(el.dataset.id));
        render();
      }
      break;

    /* ---------- histórico ---------- */
    case 'hist-limpiar':
      S.hist = {tipo:'', desde:'', hasta:''};
      render();
      break;

    /* ---------- ajustes / datos ---------- */
    case 'exportar':   await exportarJSON(); break;
    case 'importar':   document.getElementById('fileImport').click(); break;
    case 'borrar-todo': await borrarTodo(); break;
  }
});
