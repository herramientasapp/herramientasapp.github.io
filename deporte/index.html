<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ocio y Deporte v4</title>
<style>
:root{--bg:#0b1220;--c:#151f33;--c2:#0e1728;--b:#26344f;--t:#e8eefb;--m:#93a3bd;--p:#2563eb;--ph:#3b82f6;--bad:#fca5a5;--w:#fcd34d}
[data-theme=light]{--bg:#f1f5f9;--c:#fff;--c2:#f8fafc;--b:#cbd5e1;--t:#0f172a;--m:#475569;--bad:#dc2626;--w:#b45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;padding-bottom:100px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--b)}
.top h1{font-size:19px;margin:0;flex:1}
.w{padding:14px;max-width:900px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{border:1px solid var(--b);background:var(--c2);color:var(--t);padding:11px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}.btn.d{color:var(--bad)}.btn.s{padding:7px 10px;font-size:14px}.btn.f{width:100%}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.g{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--m);font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--c2);border:1px solid var(--b);color:var(--t);border-radius:10px;padding:10px;font:inherit}
input[type=checkbox]{width:22px;height:22px}textarea{min-height:80px}
.m{color:var(--m);font-size:14px}.h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--m);font-weight:700;margin:16px 0 8px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.nav .mid{flex:1;text-align:center;font-weight:700;font-size:18px;line-height:1.2}
.nav .btn{min-width:48px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{border:1px solid var(--b);background:var(--c2);color:var(--t);border-radius:99px;padding:8px 13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.ev{display:flex;gap:10px;align-items:center;background:var(--c);border:1px solid var(--b);border-left:6px solid;border-radius:12px;padding:12px;margin-bottom:10px}
.ev.done{opacity:.55}.ev.solo{border-style:dashed;border-left-style:solid;background:transparent}
.tt{font-weight:700;font-size:17px}.hh{font-weight:700;font-size:15px;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ck{width:52px;height:52px;border:3px solid var(--m);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;flex:none;cursor:pointer}.ck.on{background:var(--p);border-color:var(--p)}
.drow{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:8px}.drow.hoy{border-color:var(--ph)}
.dh{font-weight:700;margin-bottom:6px;cursor:pointer}.dh.hoy{color:var(--ph)}
.mini{display:flex;gap:8px;align-items:center;padding:8px;margin-bottom:6px;background:var(--c2);border-left:5px solid;border-radius:8px;cursor:pointer}
.sc{overflow-x:auto;border:1px solid var(--b);border-radius:12px;background:var(--c)}
.gr{display:grid;grid-template-columns:48px repeat(7,minmax(120px,1fr));min-width:890px}
.gr .hd{position:sticky;top:0;z-index:5;background:var(--c2);text-align:center;font-weight:700;padding:8px 2px;border-bottom:1px solid var(--b);border-right:1px solid var(--b);cursor:pointer}
.hd.hoy{color:var(--ph)}
.hc{position:sticky;left:0;z-index:4;background:var(--c2);border-right:1px solid var(--b);font-size:12px;color:var(--m);font-weight:600}
.hc div{padding:2px 4px;text-align:right;border-bottom:1px solid var(--b)}
.col{position:relative;border-right:1px solid var(--b)}
.hl{position:absolute;left:0;right:0;border-bottom:1px solid var(--b)}
.ge{position:absolute;border-radius:8px;padding:5px 7px;color:#fff;font-size:13px;line-height:1.2;overflow:hidden;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ge b{display:block}.ge.done{opacity:.5}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--bg);border-top:1px solid var(--b);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tab button{flex:1;background:none;border:none;color:var(--m);font:inherit;font-size:13px;font-weight:700;padding:6px 2px;display:flex;flex-direction:column;align-items:center;min-height:56px;cursor:pointer}
.tab button span{font-size:23px}.tab .on{color:var(--ph)}
.tab .plus span{background:var(--p);color:#fff;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-18px}
.ov{position:fixed;inset:0;background:rgba(4,8,16,.75);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--c);border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:18px}}
.md h2{margin:0 0 6px;font-size:19px}.ma{display:flex;gap:8px;margin-top:16px}.ma .btn{flex:1}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;z-index:200;display:flex;gap:10px;align-items:center;max-width:92vw}
.ban{background:#422006;border:1px solid #78350f;color:var(--w);border-radius:12px;padding:12px;margin-bottom:12px}
.tile{display:block;width:100%;text-align:left;margin-bottom:8px}
.empty{text-align:center;color:var(--m);padding:16px}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="tab"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pk=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const add=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const hoyK=()=>dk(new Date()),dow=d=>d.getDay()||7,lun=d=>add(d,1-dow(d));
const mn=h=>{const[a,b]=String(h||'0:0').split(':').map(Number);return a*60+(b||0)};
const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],DS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const fl=(k,o)=>pk(k).toLocaleDateString('es-ES',o);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const fmt=n=>Number(Number(n).toFixed(1)).toLocaleString('es-ES');

/* ---------- Base de datos (misma que v3: tus datos se conservan) ---------- */
let db;const AI={keyPath:'id',autoIncrement:true},K={keyPath:'id'};
const ST={tipos:K,subcategorias:AI,actividades:AI,plantilla:AI,hechos:K,deberes:AI,tramos:K,checklist:AI,checkEstado:K,peso:AI,prefs:{keyPath:'k'},ideas:AI,planes:AI};
const DATOS=['tipos','subcategorias','actividades','plantilla','planes','hechos','deberes','checklist','checkEstado','peso','prefs','ideas'];
const rq=r=>new Promise((o,e)=>{r.onsuccess=()=>o(r.result);r.onerror=()=>e(r.error)});
const st=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const all=s=>rq(st(s).getAll()),get=(s,k)=>rq(st(s).get(k)),clr=s=>rq(st(s,'readwrite').clear()),raw=(s,v)=>rq(st(s,'readwrite').put(v));
async function chg(){const n=(+S.prefs.cambiosDesdeCopia||0)+1;S.prefs.cambiosDesdeCopia=n;await raw('prefs',{k:'cambiosDesdeCopia',v:n})}
async function put(s,v){const r=await raw(s,v);if(!['hechos','checkEstado','prefs'].includes(s))chg();return r}
async function del(s,k){await rq(st(s,'readwrite').delete(k));if(s!=='hechos'&&s!=='checkEstado')chg()}
const setP=async(k,v)=>{S.prefs[k]=v;await raw('prefs',{k,v})};
const P=(k,d)=>S.prefs[k]??d;
function openDB(){return new Promise((o,e)=>{const r=indexedDB.open('ocio_deporte',4);
 r.onupgradeneeded=ev=>{const d=ev.target.result;for(const n in ST)if(!d.objectStoreNames.contains(n))d.createObjectStore(n,ST[n])};
 r.onsuccess=()=>{db=r.result;o()};r.onerror=()=>e(r.error)})}

const TB=[['senderismo','Senderismo','🥾','#059669'],['paseo','Paseo','🚶','#0284c7'],['gimnasio','Gimnasio','🏋️','#7c3aed'],['guitarra','Guitarra','🎸','#be185d'],['ingles','Inglés','🗣️','#0891b2'],['limpieza','Limpieza','🧹','#65a30d'],['otro','Otro','✨','#d97706']];
const CHK={senderismo:['Agua','Botas','Chubasquero','Comida','Móvil cargado'],gimnasio:['Ropa deporte','Toalla','Candado','Botella agua'],guitarra:['Guitarra','Púas','Afinador','Cuaderno'],ingles:['Cuaderno','Bolígrafo'],paseo:['Calzado cómodo']};
async function seed(){const p={};(await all('prefs')).forEach(x=>p[x.k]=x.v);
 if(!p.seeded&&!(await all('tipos')).length){
  for(const[i,n,ic,c]of TB)await raw('tipos',{id:i,nombre:n,icono:ic,color:c,visible:1,orden:TB.findIndex(t=>t[0]===i)+1,soloTiempo:i==='limpieza'});
  let o=0;for(const t in CHK)for(const x of CHK[t])await raw('checklist',{tipo_id:t,seccion:'imprescindible',texto:x,orden:o++});
  await raw('prefs',{k:'seeded',v:1});}
 for(const t of await all('tipos'))if(t.soloTiempo===undefined){t.soloTiempo=t.id==='limpieza';await raw('tipos',t)}}

/* ---------- Estado ---------- */
const S={v:'dia',fecha:hoyK(),sem:dk(lun(new Date())),prefs:{},tipos:[],chkT:'senderismo',hp:'mes',reset:true};
async function load(){S.tipos=(await all('tipos')).sort((a,b)=>a.orden-b.orden);const p={};(await all('prefs')).forEach(x=>p[x.k]=x.v);
 Object.assign(S.prefs,p);document.documentElement.dataset.theme=P('theme','dark')}
const tipo=id=>S.tipos.find(t=>t.id===id)||{id,nombre:'—',icono:'•',color:'#d97706'};
const col=t=>t.color&&t.color[0]==='#'?t.color:'#d97706';
function toast(m,lbl,fn){document.querySelectorAll('.toast').forEach(x=>x.remove());const x=document.createElement('div');x.className='toast';x.innerHTML=`<span>${esc(m)}</span>`;
 if(fn){const b=document.createElement('button');b.className='btn s';b.textContent=lbl;b.onclick=()=>{x.remove();fn()};x.append(b)}
 document.body.append(x);setTimeout(()=>x.remove(),fn?6000:2200)}
async function delUndo(s,k,msg){const o=await get(s,k);if(!o)return;await del(s,k);render();toast(msg,'Deshacer',async()=>{await put(s,o);render()})}
function modal(h){$('#modal').innerHTML=`<div class="ov"><div class="md">${h}</div></div>`}
const close=()=>{$('#modal').innerHTML=''};
const q=n=>{const e=document.querySelector('#modal [name='+n+']');return e?(e.type==='checkbox'?e.checked:e.value):''};
const opts=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(l)}</option>`).join('');
const tipoOpts=sel=>opts(S.tipos.filter(t=>t.visible||t.id===sel).map(t=>[t.id,t.icono+' '+t.nombre]),sel);
const hdr=(t,back)=>`<header class="top">${back?'<button class="btn s" data-a="back">‹</button>':''}<h1>${esc(t)}</h1></header>`;

/* ---------- Eventos de un día ---------- */
function evDia(k,pl,pn){const d=dow(pk(k));
 return[...pl.filter(p=>+p.dia===d).map(p=>({...p,ref:String(p.id),store:'plantilla',fecha:k})),
  ...pn.filter(p=>p.fecha===k).map(p=>({...p,ref:'p'+p.id,store:'planes',puntual:1,fecha:k}))].sort((a,b)=>mn(a.hora_inicio)-mn(b.hora_inicio))}
const nombre=e=>{const t=tipo(e.tipo_id);return t.icono+' '+t.nombre+(e.subcategoria?' · '+e.subcategoria:'')+(e.puntual?' 📅':'')};

/* ---------- DÍA ---------- */
async function vDia(){
 const k=S.fecha,[pl,pn,H,deb,ck]=await Promise.all([all('plantilla'),all('planes'),all('hechos'),all('deberes'),0]);
 const HM=new Map(H.filter(h=>!h.omitido).map(h=>[h.id,h])),ev=evDia(k,pl,pn);
 const diff=Math.round((pk(k)-pk(hoyK()))/864e5),rel={0:'Hoy',1:'Mañana','-1':'Ayer'}[diff]||'';
 const pend=deb.filter(d=>d.estado!=='hecho').length;
 const card=e=>{const t=tipo(e.tipo_id),h=HM.get(e.ref+'_'+k),solo=t.soloTiempo;
  return`<div class="ev ${h?'done':''} ${solo?'solo':''}" style="border-left-color:${col(t)}"><div class="g">
   <div class="tt">${esc(nombre(e))}</div><div class="hh" style="color:${col(t)}">${e.hora_inicio}–${e.hora_fin}${solo?' · tiempo reservado':''}</div>
   ${e.nota?`<div class="m" style="white-space:pre-wrap">${esc(e.nota)}</div>`:''}
   <div class="acts">${solo?'':`<button class="btn s" data-a="chk" data-t="${e.tipo_id}">🎒 Qué llevar</button>`}
    <button class="btn s" data-a="edit" data-s="${e.store}" data-id="${e.id}">✎ Editar</button>
    ${h&&!solo?`<button class="btn s" data-a="datos" data-id="${h.actividad_id}">＋ Datos</button>`:''}</div></div>
   ${solo?'':`<div class="ck ${h?'on':''}" data-a="marcar" data-ref="${e.ref}" data-k="${k}">${h?'✓':''}</div>`}</div>`};
 return hdr('Día')+`<div class="w">${S.ban?`<div class="ban">💾 ${esc(S.ban)}. ¿Hacer copia de seguridad?<div class="row" style="margin-top:8px"><button class="btn s p" data-a="exportar">Exportar ahora</button><button class="btn s" data-a="snooze">Más tarde</button></div></div>`:''}
  <div class="nav"><button class="btn" data-a="dia" data-n="-1">‹</button><div class="mid">${rel?rel+'<br>':''}<span class="${rel?'m':''}" style="font-size:${rel?14:18}px">${DN[dow(pk(k))-1]} ${fl(k,{day:'numeric',month:'long'})}</span></div><button class="btn" data-a="dia" data-n="1">›</button></div>
  <div class="chips">${diff!==0?'<button class="chip" data-a="dia" data-n="0">Volver a hoy</button>':''}<label class="chip" style="margin:0">📅 Elegir fecha<input type="date" value="${k}" data-a-ch="fecha" style="position:absolute;opacity:0;width:1px;height:1px"></label></div>
  ${ev.length?ev.map(card).join(''):'<div class="empty">No hay nada este día.</div>'}
  <button class="btn f" data-a="nueva" data-f="${k}">＋ Añadir algo a este día</button>
  ${pend?`<div class="card m" style="margin-top:14px;cursor:pointer" data-a="go" data-v="deb">📌 ${pend} deber${pend>1?'es':''} pendiente${pend>1?'s':''} ›</div>`:''}</div>`}

/* ---------- SEMANA ---------- */
function layout(evs){const out=[];let cl=null;const cs=[];
 for(const e of evs){if(!cl||mn(e.hora_inicio)>=cl.fin){cl={ev:[],fin:0};cs.push(cl)}cl.ev.push(e);cl.fin=Math.max(cl.fin,mn(e.hora_fin))}
 for(const c of cs){const ln=[];for(const e of c.ev){let l=ln.findIndex(f=>f<=mn(e.hora_inicio));if(l<0){l=ln.length;ln.push(0)}ln[l]=mn(e.hora_fin);out.push({e,l,n:0,c})}c.n=ln.length}
 return out.map(o=>({...o,n:o.c.n}))}
async function vSem(){
 const[pl,pn,H]=await Promise.all([all('plantilla'),all('planes'),all('hechos')]);
 const HM=new Map(H.filter(h=>!h.omitido).map(h=>[h.id,h])),l0=pk(S.sem),kh=hoyK();
 const dias=[0,1,2,3,4,5,6].map(i=>{const d=add(l0,i),k=dk(d);return{i,d,k,ev:evDia(k,pl,pn)}});
 const vista=P('semVista','lista'),hp=+P('hpx',64),paso=+P('paso',1),l6=add(l0,6);
 const tit=`${l0.getDate()}${l0.getMonth()!==l6.getMonth()?' '+l0.toLocaleDateString('es-ES',{month:'short'}):''} – ${l6.getDate()} ${l6.toLocaleDateString('es-ES',{month:'long'})}`;
 let cuerpo='';
 if(vista==='lista')cuerpo=dias.map(({i,k,ev,d})=>`<div class="drow ${k===kh?'hoy':''}"><div class="dh ${k===kh?'hoy':''}" data-a="verdia" data-k="${k}">${DN[i]} ${d.getDate()}${k===kh?' · hoy':''} ›</div>
   ${ev.length?ev.map(e=>{const t=tipo(e.tipo_id);return`<div class="mini" style="border-left-color:${col(t)};${HM.has(e.ref+'_'+k)?'opacity:.55':''}" data-a="edit" data-s="${e.store}" data-id="${e.id}"><div class="g"><b>${esc(nombre(e))}</b><div class="m"><b style="color:${col(t)}">${e.hora_inicio}–${e.hora_fin}</b>${e.nota?' · '+esc(e.nota.split('\n')[0]):''}</div></div>${HM.has(e.ref+'_'+k)?'✓':''}</div>`}).join(''):'<div class="m">Libre</div>'}</div>`).join('');
 else{let a=mn(P('jornadaIni','07:00')),b=mn(P('jornadaFin','23:00'));
  for(const e of dias.flatMap(x=>x.ev)){a=Math.min(a,Math.floor(mn(e.hora_inicio)/60)*60);b=Math.max(b,Math.ceil(mn(e.hora_fin)/60)*60)}
  const nh=Math.ceil((b-a)/60),tot=nh*hp;let hc='';
  for(let h=0;h<nh;h+=paso)hc+=`<div style="height:${Math.min(paso,nh-h)*hp}px">${pad(Math.floor(a/60)+h)}:00</div>`;
  let g=`<div class="hd" style="cursor:default">Hora</div>`+dias.map(({i,d,k})=>`<div class="hd ${k===kh?'hoy':''}" data-a="verdia" data-k="${k}">${DS[i]} ${d.getDate()}</div>`).join('')+`<div class="hc" style="height:${tot}px">${hc}</div>`;
  for(const{k,ev}of dias){let lines='';for(let h=paso;h<=nh;h+=paso)lines+=`<div class="hl" style="top:${h*hp-1}px"></div>`;let es='';
   for(const{e,l,n}of layout(ev)){const t=tipo(e.tipo_id),w=100/n,top=(mn(e.hora_inicio)-a)/60*hp,h=Math.max(36,(mn(e.hora_fin)-mn(e.hora_inicio))/60*hp-2);
    es+=`<div class="ge ${HM.has(e.ref+'_'+k)?'done':''}" style="top:${top}px;height:${h}px;left:calc(${l*w}% + 2px);width:calc(${w}% - 4px);background:${col(t)}" data-a="edit" data-s="${e.store}" data-id="${e.id}"><b>${esc(e.hora_inicio)}–${esc(e.hora_fin)}</b>${esc(nombre(e))}${e.nota&&h>60?`<div style="opacity:.9">${esc(e.nota.split('\n')[0])}</div>`:''}</div>`}
   g+=`<div class="col" style="height:${tot}px">${lines}${es}</div>`}
  cuerpo=`<div class="row" style="margin-bottom:8px"><span class="m">Tamaño:</span><button class="btn s" data-a="zoom" data-n="-1">－</button><button class="btn s" data-a="zoom" data-n="1">＋</button>
   <select data-p="paso" style="flex:2">${opts([[1,'Marcas cada 1 h'],[2,'Marcas cada 2 h'],[3,'Marcas cada 3 h']],paso)}</select></div><div class="sc"><div class="gr">${g}</div></div>`}
 return hdr('Semana')+`<div class="w"><div class="nav"><button class="btn" data-a="sem" data-n="-1">‹</button><div class="mid">${tit}</div><button class="btn" data-a="sem" data-n="1">›</button></div>
  <div class="chips"><button class="chip ${vista==='lista'?'on':''}" data-a="vista" data-v="lista">☰ Lista</button><button class="chip ${vista==='horas'?'on':''}" data-a="vista" data-v="horas">▦ Por horas</button>
  ${S.sem!==dk(lun(new Date()))?'<button class="chip" data-a="sem" data-n="0">Esta semana</button>':''}</div>${cuerpo}
  <div class="m" style="text-align:center;margin-top:10px">Toca una actividad para editarla · toca el día para verlo</div></div>`}

/* ---------- Añadir / editar actividad ---------- */
function evModal(e){const once=e.store==='planes',subs=null;
 modal(`<h2>${e.id?'Editar':'Nueva'} actividad</h2>
 <label>Tipo</label><select name="tipo">${tipoOpts(e.tipo_id)}</select>
 <label>¿Cuándo?</label><select name="modo">${opts([['plantilla','🔁 Todas las semanas (rutina)'],['planes','📅 Solo un día concreto']],e.store)}</select>
 <div id="fd" ${once?'hidden':''}><label>Día de la semana</label><select name="dia">${opts(DN.map((n,i)=>[i+1,n]),e.dia)}</select></div>
 <div id="ff" ${once?'':'hidden'}><label>Fecha</label><input type="date" name="fecha" value="${esc(e.fecha||hoyK())}"></div>

/* ---------- Marcar hecho (se puede desmarcar tocando otra vez) ---------- */
const busy=new Set();
async function marcar(ref,k){const id=ref+'_'+k;if(busy.has(id))return;busy.add(id);
 try{const ex=await get('hechos',id);
  if(ex&&!ex.omitido){await del('hechos',id);if(ex.actividad_id)await del('actividades',ex.actividad_id);toast('Desmarcada')}
  else{if(ex)await del('hechos',id);const esP=ref[0]==='p',p=esP?await get('planes',+ref.slice(1)):await get('plantilla',+ref);if(!p)return;
   const aid=await put('actividades',{tipo_id:p.tipo_id,fecha:k,subcategoria:p.subcategoria||'',duracion_min:mn(p.hora_fin)-mn(p.hora_inicio),hora_inicio:p.hora_inicio,hora_fin:p.hora_fin,notas:p.nota||'',origen:esP?'puntual':'plantilla'});
   await raw('hechos',{id,plantilla_id:ref,fecha:k,actividad_id:aid});toast('¡Hecho! Toca otra vez para desmarcar')}
 }finally{busy.delete(id)}render()}

/* ---------- Copia ---------- */
function motivoCopia(){const c=+P('cambiosDesdeCopia',0),uc=+P('umbralCambiosCopia',1),ud=+P('umbralDiasCopia',30),u=P('ultimaCopia',''),m=[];
 if(P('snoozeCopia','')>new Date().toISOString())return'';
 if(c>=uc)m.push(c+(c>1?' datos nuevos':' dato nuevo')+' desde la última copia');
 if(u){const d=Math.floor((Date.now()-new Date(u))/864e5);if(d>=ud)m.push(d+' días sin copia')}else if(c>0&&!m.length)m.push('aún no has hecho ninguna copia');
 return m.join(' · ')}

 case 'evdel':{const x=S.ev;close();delUndo(x.store,x.id,'Actividad borrada');break}
 case 'datos':{const x=await get('actividades',id);if(x)datosModal(x);break}
 case 'registrar':datosModal({id:null,tipo_id:(S.tipos.find(t=>t.visible&&!t.soloTiempo)||{}).id,fecha:hoyK()});break;
 case 'actsave':actSave();break;
 case 'actdel':{const x=S.act;close();const hs=(await all('hechos')).filter(h=>h.actividad_id===x.id);for(const h of hs)await del('hechos',h.id);await del('actividades',x.id);render();
  toast('Borrada','Deshacer',async()=>{await put('actividades',x);for(const h of hs)await raw('hechos',h);render()});break}
 case 'hp':S.hp=D.v;render();break;
 case 'ctipo':S.chkT=D.id;render();break;
 case 'ctog':{const c=await get('checkEstado',id);await raw('checkEstado',{id,marcado:!(c&&c.marcado)});render();break}
 case 'cdel':delUndo('checklist',id,'Elemento borrado');break;
 case 'cadd':{const i=$('#n_'+D.s),v=i.value.trim();if(!v)return;await put('checklist',{tipo_id:S.chkT,seccion:D.s,texto:v,orden:Date.now()});render();break}
 case 'creset':for(const i of (await all('checklist')).filter(i=>i.tipo_id===S.chkT))await raw('checkEstado',{id:i.id,marcado:false});render();break;
 case 'dnuevo':dModal({id:null,tipo_id:(S.tipos.find(t=>t.visible&&!t.soloTiempo)||{}).id});break;
 case 'dedit':{const x=await get('deberes',id);if(x)dModal(x);break}
 case 'dsave':dSave();break;
 case 'ddel':{const x=S.deb;close();delUndo('deberes',x.id,'Deber borrado');break}
 case 'dtog':{const x=await get('deberes',id);if(x){const h=x.estado==='hecho';x.estado=h?'pendiente':'hecho';x.hecho_en=h?null:hoyK();await put('deberes',x);render()}break}
 case 'psave':{const kg=num($('#pk').value);if(!kg)return toast('Falta el peso');await put('peso',{fecha:$('#pf').value||hoyK(),kg});render();break}
 case 'pdel':delUndo('peso',id,'Registro borrado');break;
 case 'isave':{const v=$('#ni').value.trim();if(!v)return toast('Escribe algo');await put('ideas',{texto:v,fecha:hoyK(),implementado:false});render();break}
 case 'itog':{const x=await get('ideas',id);x.implementado=!x.implementado;await put('ideas',x);render();break}
 case 'idel':delUndo('ideas',id,'Idea borrada');break;
 case 'iedit':{const x=await get('ideas',id);S.idea=x;modal(`<h2>Editar idea</h2><textarea name="t" style="min-height:160px">${esc(x.texto)}</textarea><div class="ma"><button class="btn" data-a="close">Cancelar</button><button class="btn p" data-a="isv2">Guardar</button></div>`);break}
 case 'isv2':{const v=q('t').trim();if(!v)return;S.idea.texto=v;await put('ideas',S.idea);close();render();break}
 case 'cedit':{const c=S.tipos.find(t=>t.id===D.id);if(c)cModal(c);break}
 case 'cnueva':cModal({id:'',color:'#2563eb'});break;
 case 'csave':cSave();break;
 case 'exportar':exportar();break;case 'importar':$('#fi').click();break;
 case 'snooze':await setP('snoozeCopia',new Date(Date.now()+864e5).toISOString());render();break;
 }});

 try{history.replaceState({v:'dia'},'')}catch(e){}
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#modal').innerHTML&&['dia','sem','deb'].includes(S.v))render()});
 await render()}catch(e){document.getElementById('app').innerHTML=`<div style="padding:40px;text-align:center"><h2>Error al iniciar</h2><p>${esc(e.message)}</p></div>`}})();
