<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Ocio y Deporte v3.2</title>
<style>
  :root{
    --bg-main:#0b1220;--bg-card:#151f33;--bg-card-alt:#0e1728;
    --bg-header:rgba(11,18,32,.94);--border-color:#26344f;--border-subtle:#1e2c46;
    --text-main:#e8eefb;--text-muted:#93a3bd;--text-dim:#6b7c99;
    --primary:#2563eb;--primary-hover:#3b82f6;--accent:#7dd3fc;
    --danger-bg:#3b1016;--danger-border:#7f1d1d;--danger-text:#fca5a5;
    --warn-bg:#422006;--warn-border:#78350f;--warn-text:#fcd34d;
    --ok-bg:#052e16;--ok-border:#166534;--ok-text:#86efac;
    --chip-bg:#0e1728;--chip-border:#26344f;--chip-text:#c3d0e6;
  }
  [data-theme="light"]{
    --bg-main:#f1f5f9;--bg-card:#fff;--bg-card-alt:#f8fafc;
    --bg-header:rgba(255,255,255,.94);--border-color:#cbd5e1;--border-subtle:#e2e8f0;
    --text-main:#0f172a;--text-muted:#475569;--text-dim:#94a3b8;
    --primary:#2563eb;--primary-hover:#1d4ed8;--accent:#0284c7;
    --danger-bg:#fef2f2;--danger-border:#fecaca;--danger-text:#dc2626;
    --warn-bg:#fffbeb;--warn-border:#fde68a;--warn-text:#b45309;
    --ok-bg:#f0fdf4;--ok-border:#bbf7d0;--ok-text:#15803d;
    --chip-bg:#f1f5f9;--chip-border:#cbd5e1;--chip-text:#334155;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg-main);color:var(--text-main);
    font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:96px;
    transition:background-color .2s,color .2s}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:12px 14px;background:var(--bg-header);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border-color)}
  .topbar h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .icon-btn{background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-main);
    width:36px;height:36px;border-radius:10px;font-size:18px;display:inline-flex;
    align-items:center;justify-content:center;line-height:1;cursor:pointer;flex:0 0 auto;position:relative}
  .icon-btn:active{transform:scale(.95)}
  .badge-dot{position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;
    font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-main)}
  .wrap{padding:14px;max-width:900px;margin:0 auto}
  .card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border-color);
    background:var(--bg-card-alt);color:var(--text-main);padding:10px 14px;border-radius:12px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:linear-gradient(180deg,var(--primary-hover),var(--primary));border-color:var(--primary);color:#fff}
  .btn-block{width:100%}
  .btn-big{padding:16px;font-size:16px}
  .btn-danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text)}
  .btn-warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}
  .btn-ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-text)}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tile{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:14px;
    cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
  .tile:active{transform:scale(.985)}
  .tile .ti{font-size:21px;line-height:1.1}
  .tile .tt{font-weight:650}
  .tile .ts{font-size:11.5px;color:var(--text-muted)}
  .lbl{display:block;font-size:12.5px;color:var(--text-muted);margin:0 0 5px;
    font-weight:650;letter-spacing:.3px;text-transform:uppercase}
  .input{width:100%;background:var(--bg-card-alt);border:1px solid var(--border-color);
    color:var(--text-main);border-radius:11px;padding:10px 12px;font-size:14.5px;
    font-family:inherit;outline:none}
  .input:focus{border-color:var(--primary-hover)}
  select.input{appearance:none}
  textarea.input{min-height:70px;resize:vertical}
  .field{margin-bottom:12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip-bg);border:1px solid var(--chip-border);color:var(--chip-text);
    border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;
    font-family:inherit;font-weight:600}
  .chip.sel{background:var(--primary);border-color:var(--primary-hover);color:#fff}
  .item{display:flex;gap:11px;align-items:center;padding:10px 12px;background:var(--bg-card);
    border:1px solid var(--border-color);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .item:active{filter:brightness(.95)}
  .item .ico{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
  .grow{flex:1;min-width:0}
  .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t2{font-size:12px;color:var(--text-muted);margin-top:1px}
  .muted{color:var(--text-muted)}
  .center{text-align:center}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);
    font-weight:700;margin:16px 0 8px}
  .empty{color:var(--text-dim);text-align:center;padding:18px 10px;font-size:13.5px}

  /* BANNER COPIA */
  .banner-copia{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);
    border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
  .banner-copia .bc-text{font-size:13.5px;font-weight:600}
  .banner-copia .bc-actions{display:flex;gap:8px}

  /* HOY */
  .hoy-block{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg-card);
    border:1px solid var(--border-color);border-radius:12px;margin-bottom:8px}
  .hoy-block .ti{font-size:22px;flex:0 0 auto}
  .hoy-check{width:44px;height:44px;border-radius:8px;border:2px solid var(--text-muted);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
    cursor:pointer;flex:0 0 auto;background:transparent}
  .hoy-check.on{background:var(--primary);border-color:var(--primary)}
  .hoy-block.hecho .hoy-title{text-decoration:line-through;color:var(--text-dim)}
  .hoy-title{font-weight:650}
  .hoy-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
  .deber-mini{font-size:12.5px;margin-top:5px;padding:6px 8px;border-radius:8px;
    background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);
    display:flex;align-items:center;gap:6px;cursor:pointer}

  /* PLANTILLA SEMANAL (cuadrícula por horas) */
  .plantilla-container{background:var(--bg-card);border:1px solid var(--border-color);
    border-radius:14px;overflow-x:auto;position:relative}
  .plantilla-head{display:grid;grid-template-columns:56px repeat(7,minmax(90px,1fr));
    min-width:720px;position:sticky;top:0;z-index:10;background:var(--bg-card-alt);
    border-bottom:1px solid var(--border-color)}
  .plantilla-head>div{padding:6px 4px;text-align:center;font-weight:700;font-size:12px;
    border-right:1px solid var(--border-subtle)}
  .plantilla-head>div:last-child{border-right:none}
  .plantilla-head .corner{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;letter-spacing:.4px}
  .plantilla-head .day-head{position:relative;display:flex;flex-direction:column;gap:2px}
  .plantilla-head .day-head.hoy{background:rgba(37,99,235,.15)}
  .plantilla-head .dname{font-size:10px;text-transform:uppercase;color:var(--text-muted)}
  .plantilla-head .day-head.hoy .dname{color:var(--primary-hover)}
  .plantilla-head .dnum{font-size:13px}
  .plantilla-head .day-head.hoy .dnum{color:var(--primary-hover)}
  .plantilla-head .add-btn{margin-top:2px;border:1px dashed var(--border-color);background:transparent;
    color:var(--text-muted);border-radius:6px;font-size:13px;cursor:pointer;padding:2px;
    font-family:inherit;line-height:1}
  .plantilla-head .add-btn:hover{border-color:var(--primary);color:var(--primary)}
  .plantilla-body{display:grid;grid-template-columns:56px repeat(7,minmax(90px,1fr));
    min-width:720px;position:relative}
  .hours-col{position:sticky;left:0;z-index:6;background:var(--bg-card-alt);
    border-right:1px solid var(--border-color)}
  .hour-cell{height:44px;display:flex;align-items:flex-start;justify-content:flex-end;
    padding-right:6px;font-size:10.5px;color:var(--text-muted);font-weight:600;
    border-bottom:1px solid var(--border-subtle)}
  .day-body{position:relative;border-right:1px solid var(--border-subtle)}
  .day-body:last-child{border-right:none}
  .hour-line{position:absolute;left:0;right:0;height:44px;
    border-bottom:1px solid var(--border-subtle);pointer-events:none}
  .evento-plantilla{position:absolute;border-radius:6px;padding:4px 6px;color:#fff;
    font-size:11px;line-height:1.15;cursor:pointer;overflow:hidden;
    box-shadow:0 2px 4px rgba(0,0,0,.25);z-index:2}
  .evento-plantilla .ev-hora{font-size:10px;opacity:.92;display:flex;align-items:center;gap:4px}
  .evento-plantilla .ev-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evento-plantilla .ev-nota{font-size:10px;opacity:.85;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ev-chk{width:18px;height:18px;border:1.5px solid rgba(255,255,255,.85);
    border-radius:3px;display:flex;align-items:center;justify-content:center;
    font-size:8px;flex:0 0 auto;cursor:pointer;background:transparent}
  .ev-chk.on{background:rgba(255,255,255,.95);border-color:#fff;color:#111}
  .evento-plantilla.hecha{opacity:.5}

  /* Colores de chips de cat */
  .cat-color{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:4px}

  /* DEBERES */
  .deber-card{background:var(--bg-card);border:1px solid var(--border-color);
    border-radius:12px;padding:12px;margin-bottom:8px;position:relative}
  .deber-card.urgente{border-left:4px solid #dc2626}
  .deber-card.proximo{border-left:4px solid #d97706}
  .deber-card.vencido{border-left:4px solid #7f1d1d;background:var(--danger-bg)}
  .deber-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
  .deber-head .ico{font-size:18px;flex:0 0 auto}
  .deber-title{font-weight:700;font-size:14.5px;flex:1;min-width:0}
  .deber-meta{font-size:11.5px;color:var(--text-muted);margin-bottom:6px}
  .deber-desc{font-size:13px;color:var(--text-muted);margin-bottom:8px;white-space:pre-wrap}
  .deber-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .prio-alta{color:#dc2626;font-weight:700}
  .prio-media{color:#d97706;font-weight:700}
  .prio-baja{color:#64748b;font-weight:700}
  .hecho .deber-title{text-decoration:line-through;color:var(--text-dim)}

  /* Details */
  details.sec-fold{background:var(--bg-card);border:1px solid var(--border-color);
    border-radius:12px;margin-bottom:10px;overflow:hidden}
  details.sec-fold summary{padding:12px 14px;font-weight:650;font-size:14px;cursor:pointer;
    user-select:none;display:flex;align-items:center;justify-content:space-between;
    outline:none;background:var(--bg-card)}
  details.sec-fold summary::-webkit-details-marker{display:none}
  details.sec-fold summary::after{content:'›';font-size:18px;transition:transform .2s;color:var(--text-muted)}
  details.sec-fold[open] summary::after{transform:rotate(90deg)}
  details.sec-fold summary:hover{background:var(--bg-card-alt)}
  .fold-body{padding:12px 14px;border-top:1px solid var(--border-color);background:var(--bg-card)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(4,8,16,.75);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media(min-width:600px){.overlay{align-items:center;padding:20px}}
  .modal{background:var(--bg-card);border:1px solid var(--border-color);
    border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:520px;
    max-height:92vh;overflow:auto;color:var(--text-main)}
  @media(min-width:600px){.modal{border-radius:18px}}
  .modal h2{margin:0 0 14px;font-size:17px}
  .modal-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .modal-actions .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
    background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .mini{background:none;border:none;color:var(--text-muted);font-size:14px;
    padding:2px 4px;cursor:pointer;line-height:1}
  .mini:hover{color:var(--text-main)}
  .chk-compact{display:flex;align-items:center;gap:8px;background:var(--bg-card-alt);
    border:1px solid var(--border-subtle);border-radius:8px;padding:6px 9px;
    margin-bottom:5px;font-size:13.5px}
  .chk-compact .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--text-muted);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
    flex:0 0 auto;cursor:pointer}
  .chk-compact.on .box{background:var(--primary);border-color:var(--primary)}
  .chk-compact.on .txt{text-decoration:line-through;color:var(--text-dim)}
  .chk-compact .txt{flex:1;min-width:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Paleta de colores en modal */
  .paleta{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
  .paleta .sw{width:100%;aspect-ratio:1;border-radius:8px;cursor:pointer;
    border:2px solid transparent;position:relative}
  .paleta .sw.sel{border-color:var(--text-main);box-shadow:0 0 0 2px var(--bg-card) inset}

  .res-card{padding:10px 12px;margin-bottom:8px}
  .res-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
  .res-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;
    background:var(--bg-card-alt);padding:8px;border-radius:8px;border:1px solid var(--border-subtle)}
  .m-box{display:flex;flex-direction:column}
  .m-lbl{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;font-weight:600}
  .m-val{font-size:13.5px;font-weight:700}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--bg-header);backdrop-filter:blur(8px);border-top:1px solid var(--border-color);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;background:none;border:none;color:var(--text-muted);font:inherit;font-size:11.5px;font-weight:650;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:54px}
  .tabbar .tb-i{font-size:21px;line-height:1}
  .tabbar button.on{color:var(--primary-hover)}
  .tabbar .tb-add .tb-i{background:var(--primary);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-16px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .dia-row{display:flex;gap:10px;padding:10px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;margin-bottom:8px}
  .dia-row.hoy{border-color:var(--primary-hover);box-shadow:0 0 0 1px var(--primary-hover) inset}
  .dr-head{flex:0 0 52px;text-align:center}
  .dr-n{font-size:12px;text-transform:uppercase;color:var(--text-muted);font-weight:700}
  .dia-row.hoy .dr-n{color:var(--primary-hover)}
  .dr-d{font-size:20px;font-weight:750;line-height:1.1}
  .dr-head .add-btn{margin-top:6px;border:1px dashed var(--border-color);background:transparent;color:var(--text-muted);border-radius:8px;font-size:15px;cursor:pointer;width:100%;padding:4px 0}
  .dr-evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .dr-ev{display:flex;align-items:center;gap:8px;background:var(--bg-card-alt);border-radius:8px;padding:7px 9px;cursor:pointer}
  .dr-ev.hecha{opacity:.55}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="tab-root"></div>

<script>
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = (n,d=1) => Number(Number(n).toFixed(d)).toLocaleString('es-ES');
const dateKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const p=String(k).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
const addDays = (d,n) => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const hoyKey = () => dateKey(new Date());
const fmtFecha = k => !k ? '—' : parseKey(k).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});
const fmtFechaCorta = k => !k ? '—' : parseKey(k).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
function diasHasta(k){
  if(!k) return null;
  const d=parseKey(k); const h=new Date(); h.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.round((d-h)/86400000);
}
function labelDiasHasta(k){
  const n=diasHasta(k);
  if(n===null) return 'Sin fecha';
  if(n<0) return `Vencido hace ${-n}d`;
  if(n===0) return 'Vence hoy';
  if(n===1) return 'Vence mañana';
  if(n<=7) return `Vence en ${n} días`;
  return `Vence el ${fmtFechaCorta(k)}`;
}
function diaSemanaIdx(d){ const dow=d.getDay(); return dow===0?7:dow; } // lunes=1..dom=7
function slugify(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'cat';
}
function calcMin(ini, fin){
  if(!ini || !fin) return 0;
  const [h1,m1]=ini.split(':').map(Number); const [h2,m2]=fin.split(':').map(Number);
  return Math.max(0, (h2*60+m2)-(h1*60+m1));
}
function hhmmToMin(hhmm){
  const [h,m]=String(hhmm||'0:0').split(':').map(Number);
  return h*60+(m||0);
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}

/* Paleta de colores */
const PALETA = [
  '#059669','#0284c7','#7c3aed','#d97706','#2563eb','#dc2626','#be185d','#0891b2',
  '#65a30d','#7c2d12','#a16207','#0d9488','#9333ea','#e11d48','#0ea5e9','#14b8a6',
];
const COLOR_MAP_ANTIGUO = {
  'bg-senderismo':'#059669','bg-paseo':'#0284c7','bg-gimnasio':'#7c3aed',
  'bg-otro':'#d97706','bg-natacion':'#2563eb','bg-running':'#dc2626',
  'bg-guitarra':'#be185d','bg-ingles':'#0891b2','bg-limpieza':'#65a30d'
};
function tipoColor(t){
  if(!t) return '#d97706';
  if(t.color && t.color.startsWith('#')) return t.color;
  return COLOR_MAP_ANTIGUO[t.color] || '#d97706';
}

/* =====================================================================
   INDEXEDDB
   ===================================================================== */
const DB_NAME='ocio_deporte', DB_VER=4;
let db=null;
const STORES_DATOS=['tipos','subcategorias','actividades','plantilla','planes','hechos','deberes','checklist','checkEstado','peso','prefs','ideas'];

function abrirDBRaw(name, version){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(name, version);
    r.onupgradeneeded = ev => {
      const d = ev.target.result;
      const mk = (n,opt={}) => { if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,opt); };
      mk('tipos',{keyPath:'id'});
      mk('subcategorias',{keyPath:'id',autoIncrement:true});
      mk('actividades',{keyPath:'id',autoIncrement:true});
      mk('plantilla',{keyPath:'id',autoIncrement:true});
      mk('hechos',{keyPath:'id'});
      mk('deberes',{keyPath:'id',autoIncrement:true});
      mk('tramos',{keyPath:'id'});
      mk('checklist',{keyPath:'id',autoIncrement:true});
      mk('checkEstado',{keyPath:'id'});
      mk('peso',{keyPath:'id',autoIncrement:true});
      mk('prefs',{keyPath:'k'});
      mk('ideas',{keyPath:'id',autoIncrement:true});
      mk('planes',{keyPath:'id',autoIncrement:true});
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function existeDB(name){
  try{
    if(indexedDB.databases){
      const dbs = await indexedDB.databases();
      return dbs.some(d=>d.name===name);
    }
    return new Promise(res=>{
      const r = indexedDB.open(name,1); let created=false;
      r.onupgradeneeded=()=>{created=true};
      r.onsuccess=()=>{r.result.close(); res(!created)};
      r.onerror=()=>res(false);
    });
  }catch(e){ return false; }
}
function getAllFromStore(database, storeName){
  return new Promise((res,rej)=>{
    if(!database.objectStoreNames.contains(storeName)) return res([]);
    const tx = database.transaction(storeName);
    const r = tx.objectStore(storeName).getAll();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function copiarStores(origen, destino, stores){
  for(const s of stores){
    if(!origen.objectStoreNames.contains(s)) continue;
    if(!destino.objectStoreNames.contains(s)) continue;
    const items = await getAllFromStore(origen, s);
    if(!items.length) continue;
    await new Promise((res,rej)=>{
      const tx = destino.transaction(s,'readwrite');
      const store = tx.objectStore(s);
      for(const it of items) store.put(it);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }
}

/* -------- Wrappers con contador de cambios -------- */
let _silenciarCambios = false;
let _pendientesCambios = 0;
let _timerCambios = null;
const PREFS_CONTROL = new Set([
  'seeded','theme','ultimaCopia','cambiosDesdeCopia','snoozeCopia',
  'jornadaIni','jornadaFin','umbralCambiosCopia','umbralDiasCopia',
  'semanaInicio','avisoDias'
]);
async function incrementarCambios(){
  if(_silenciarCambios) return;
  _pendientesCambios++;
  if(_timerCambios) clearTimeout(_timerCambios);
  _timerCambios = setTimeout(async ()=>{
    const actual = Number(S.prefs.cambiosDesdeCopia || 0);
    S.prefs.cambiosDesdeCopia = actual + _pendientesCambios;
    _pendientesCambios = 0;
    _silenciarCambios = true;
    try{
      await new Promise((res,rej)=>{
        const r = db.transaction('prefs','readwrite').objectStore('prefs')
          .put({k:'cambiosDesdeCopia', v:S.prefs.cambiosDesdeCopia});
        r.onsuccess=res; r.onerror=()=>rej(r.error);
      });
    }catch(e){}
    _silenciarCambios = false;
  }, 400);
}

function req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const dbAll   = s     => req(db.transaction(s).objectStore(s).getAll());
const dbGet   = (s,k) => req(db.transaction(s).objectStore(s).get(k));
async function dbPut(s,v){
  const result = await req(db.transaction(s,'readwrite').objectStore(s).put(v));
  if(s==='prefs' && v && PREFS_CONTROL.has(v.k)) return result;
  if(s==='hechos'||s==='checkEstado') return result;
  incrementarCambios();
  return result;
}
const dbDel   = (s,k) => { const p=req(db.transaction(s,'readwrite').objectStore(s).delete(k)); if(s!=='hechos'&&s!=='checkEstado') incrementarCambios(); return p; };
const dbClear = s     => req(db.transaction(s,'readwrite').objectStore(s).clear());

async function seed(){
  const p0={}; (await dbAll('prefs')).forEach(x=>p0[x.k]=x.v);
  const yaSeed=!!p0.seeded;
  const tiposEx = await dbAll('tipos');
  const ids = new Set(tiposEx.map(t=>t.id));
  for(const t of (yaSeed?[]:TIPOS_BASE)){ if(!ids.has(t.id)) await dbPut('tipos', {...t}); }

  const subsEx = await dbAll('subcategorias');
  for(const sc of (yaSeed?[]:SUBCATS_BASE)){
    const existe = subsEx.some(s => s.tipo_id===sc.tipo_id && s.nombre===sc.nombre);
    if(!existe) await dbPut('subcategorias', {...sc});
  }

  const chkEx = await dbAll('checklist');
  let orden = chkEx.length ? Math.max(...chkEx.map(x=>x.orden||0)) + 1 : 0;
  for(const tipo of (yaSeed?[]:Object.keys(CHECK_FABRICA))){
    const tiene = chkEx.some(i=>i.tipo_id===tipo);
    if(tiene) continue;
    for(const sec of ['imprescindible','opcional']){
      for(const txt of CHECK_FABRICA[tipo][sec]){
        await dbPut('checklist', {tipo_id:tipo, seccion:sec, texto:txt, orden:orden++});
      }
    }
  }

  const p = {}; (await dbAll('prefs')).forEach(x=>p[x.k]=x.v);
  if(!p.semanaInicio) await dbPut('prefs',{k:'semanaInicio',v:'lunes'});
  if(!p.theme) await dbPut('prefs',{k:'theme',v:'dark'});
  if(!p.avisoDias) await dbPut('prefs',{k:'avisoDias',v:3});
  if(!p.jornadaIni) await dbPut('prefs',{k:'jornadaIni',v:'07:00'});
  if(!p.jornadaFin) await dbPut('prefs',{k:'jornadaFin',v:'23:00'});
  if(!p.umbralCambiosCopia) await dbPut('prefs',{k:'umbralCambiosCopia',v:15});
  if(!p.umbralDiasCopia) await dbPut('prefs',{k:'umbralDiasCopia',v:30});
  if(!p.cambiosDesdeCopia) await dbPut('prefs',{k:'cambiosDesdeCopia',v:0});
  await dbPut('prefs',{k:'seeded',v:1});

  const ideas = await dbAll('ideas');
  if(ideas.length===0 && !yaSeed){
    await dbPut('ideas', {
      texto: "v3.1.0: Plantilla rediseñada por horas, categorías editables, migración desde v2, recordatorio de copia y Peso accesible desde Hoy.",
      fecha: hoyKey(), implementado: true
    });
  }
}

async function migrarPlantillaAntigua(){
  const planes = await dbAll('plantilla');
  const T_MAP = {manana:['07:00','12:00'], mediodia:['12:00','16:00'], tarde:['16:00','20:00'], noche:['20:00','23:00']};
  for(const p of planes){
    if(p.hora_inicio !== undefined) continue;
    const t = T_MAP[p.tramo] || ['09:00','10:00'];
    const nuevo = {
      id: p.id, tipo_id: p.tipo_id, dia: p.dia,
      hora_inicio: t[0], hora_fin: t[1],
      subcategoria: p.subcategoria || '', nota: p.nota || ''

    _silenciarCambios = true;
    await dbPut('plantilla', nuevo);
    _silenciarCambios = false;
  }
}

async function debeRecomendarCopia(){
  const cambios = Number(S.prefs.cambiosDesdeCopia||0);
  const ultima = S.prefs.ultimaCopia;
  const snooze = S.prefs.snoozeCopia;
  if(snooze && new Date(snooze) > new Date()) return false;
  const uC = Number(S.prefs.umbralCambiosCopia||15);
  const uD = Number(S.prefs.umbralDiasCopia||30);
  if(cambios >= uC) return true;
  if(ultima){
    const dias = (Date.now() - new Date(ultima).getTime()) / 86400000;
    if(dias >= uD) return true;
  } else {
    if(cambios >= uC) return true;
  }
  return false;
}
function motivoCopia(){
  const cambios = Number(S.prefs.cambiosDesdeCopia||0);
  const uC = Number(S.prefs.umbralCambiosCopia||15);
  const uD = Number(S.prefs.umbralDiasCopia||30);
  const ultima = S.prefs.ultimaCopia;
  const motivos = [];
  if(cambios >= uC) motivos.push(`${cambios} cambios desde la última copia`);
  if(ultima){
    const dias = Math.floor((Date.now() - new Date(ultima).getTime()) / 86400000);
    if(dias >= uD) motivos.push(`${dias} días sin copia`);
  } else if(cambios>0) {
    motivos.push('aún no has hecho ninguna copia');
  }
  return motivos.join(' · ') || 'ha pasado tiempo desde la última copia';
}

  const x=document.createElement('div'); x.className='toast'; x.style.display='flex'; x.style.gap='12px'; x.style.alignItems='center';

function lunesDe(d){ return addDays(d, -(diaSemanaIdx(d)-1)); }
async function eventosDia(k,plantilla,planes){
  plantilla=plantilla||await dbAll('plantilla'); planes=planes||await dbAll('planes');
  const dia=diaSemanaIdx(parseKey(k)), ev=[];
  for(const p of plantilla) if(Number(p.dia)===dia) ev.push({...p,ref:String(p.id),store:'plantilla',fecha:k,puntual:false});
  for(const p of planes) if(p.fecha===k) ev.push({...p,ref:'p'+p.id,store:'planes',puntual:true});
  return ev.sort((a,b)=>(a.hora_inicio||'').localeCompare(b.hora_inicio||''));
}

const HORA_PX = 44;
function layoutDia(eventos){
  const sorted = [...eventos].sort((a,b)=>(a.hora_inicio||'').localeCompare(b.hora_inicio||''));
  const clusters = [];
  let cluster = null;
  for(const ev of sorted){
    if(!cluster || hhmmToMin(ev.hora_inicio) >= hhmmToMin(cluster.fin)){
      if(cluster) clusters.push(cluster);
      cluster = {eventos:[ev], fin: ev.hora_fin};
    } else {
      cluster.eventos.push(ev);
      if(hhmmToMin(ev.hora_fin) > hhmmToMin(cluster.fin)) cluster.fin = ev.hora_fin;
    }
  }
  if(cluster) clusters.push(cluster);
  const result = [];
  for(const c of clusters){
    const lanes = [];
    const asign = [];
    for(const ev of c.eventos){
      let lane = lanes.findIndex(fin => hhmmToMin(fin) <= hhmmToMin(ev.hora_inicio));
      if(lane === -1){ lane = lanes.length; lanes.push(ev.hora_fin); }
      else { lanes[lane] = ev.hora_fin; }
      asign.push({evento:ev, lane});
    }
    for(const a of asign) result.push({...a, lanes: lanes.length});
  }
  return result;
}

function tablaSemana(dias,H,kHoy){
  return '<div class="semtabla">'+dias.map(({i,d,k,ev})=>{
    const esHoy=k===kHoy;
    return `<div class="dia-row ${esHoy?'hoy':''}">
      <div class="dr-head"><div class="dr-n">${DIAS[i]}</div><div class="dr-d">${d.getDate()}</div>
        <button class="add-btn" data-action="plantilla-nueva" data-dia="${i+1}" title="Añadir">＋</button></div>
      <div class="dr-evs">${ev.length?ev.map(e=>{
        const t=tipoDe(e.tipo_id), c=tipoColor(t), h=H.get(e.ref+'_'+k), hecho=!!h&&!h.omitido;
        return `<div class="dr-ev ${hecho?'hecha':''}" style="border-left:5px solid ${c}" data-action="plantilla-editar" data-id="${e.id}" data-store="${e.store}">
          <div class="grow"><div class="t1" style="white-space:normal">${t.icono} ${esc(t.nombre)}${e.subcategoria?' · '+esc(e.subcategoria):''}${e.puntual?' 📅':''}</div>
          <div class="t2"><b style="color:${c}">${e.hora_inicio}–${e.hora_fin}</b>${e.nota?' · '+esc(e.nota.split('\n')[0]):''}</div></div>
          ${esHoy?`<span class="hoy-check ${hecho?'on':''}" style="width:36px;height:36px" data-action="plantilla-marcar" data-plantilla="${e.ref}" data-fecha="${k}">${hecho?'✓':''}</span>`:(hecho?'<span>✓</span>':'')}
        </div>`;}).join(''):'<div class="muted" style="font-size:13.5px;padding:6px 0">Libre</div>'}</div></div>`;
  }).join('')+'</div>';
}
function cuadriculaSemana(dias,H,kHoy){
  let iniMin=hhmmToMin(S.prefs.jornadaIni||'07:00'), finMin=hhmmToMin(S.prefs.jornadaFin||'23:00');
  if(finMin<=iniMin) finMin=iniMin+60;
  for(const e of dias.flatMap(x=>x.ev)){ iniMin=Math.min(iniMin,Math.floor(hhmmToMin(e.hora_inicio)/60)*60); finMin=Math.max(finMin,Math.ceil(hhmmToMin(e.hora_fin)/60)*60); }
  const numHoras=Math.ceil((finMin-iniMin)/60), totalH=numHoras*HORA_PX;
  const header='<div class="corner">Hora</div>'+dias.map(({i,d,k})=>`<div class="day-head ${k===kHoy?'hoy':''}"><div class="dname">${DIAS[i]}</div><div class="dnum">${d.getDate()}</div><button class="add-btn" data-action="plantilla-nueva" data-dia="${i+1}">＋</button></div>`).join('');
  let hoursHTML=''; for(let i=0;i<numHoras;i++){ const m=iniMin+i*60; hoursHTML+=`<div class="hour-cell">${pad(Math.floor(m/60))}:${pad(m%60)}</div>`; }
  let body=`<div class="hours-col">${hoursHTML}</div>`;
  for(const {k,ev} of dias){
    let lines=''; for(let j=0;j<numHoras;j++) lines+=`<div class="hour-line" style="top:${j*HORA_PX}px"></div>`;
    let evs='';
    for(const {evento:p,lane,lanes} of layoutDia(ev)){
      const t=tipoDe(p.tipo_id), color=tipoColor(t), h=H.get(p.ref+'_'+k), hecho=!!h&&!h.omitido, w=100/lanes;
      const topPx=((hhmmToMin(p.hora_inicio)-iniMin)/60)*HORA_PX, hPx=Math.max(30,(Math.max(15,calcMin(p.hora_inicio,p.hora_fin))/60)*HORA_PX);
      evs+=`<div class="evento-plantilla ${hecho?'hecha':''}" style="top:${topPx}px;height:${hPx}px;left:calc(${lane*w}% + 2px);width:calc(${w}% - 4px);background:${color}" data-action="plantilla-editar" data-id="${p.id}" data-store="${p.store}">
        <div class="ev-hora">${k===kHoy?`<span class="ev-chk ${hecho?'on':''}" data-action="plantilla-marcar" data-plantilla="${p.ref}" data-fecha="${k}">${hecho?'✓':''}</span>`:''}${p.hora_inicio}–${p.hora_fin}</div>
        <div class="ev-title">${t.icono} ${esc(p.subcategoria||t.nombre)}${p.puntual?' 📅':''}</div>
        ${p.nota?`<div class="ev-nota">${esc(p.nota.split('\n')[0])}</div>`:''}</div>`;
    }
    body+=`<div class="day-body" style="height:${totalH}px">${lines}${evs}</div>`;
  }
  return `<div class="plantilla-container"><div class="plantilla-head">${header}</div><div class="plantilla-body">${body}</div></div>`;
}

async function guardarPlantilla(){
  const f=S.plantillaForm; if(!f) return;
  if(!f.hora_inicio||!f.hora_fin){ toast('Pon hora inicio y fin'); return; }
  if(hhmmToMin(f.hora_fin)<=hhmmToMin(f.hora_inicio)){ toast('La hora fin debe ser mayor'); return; }
  const esP=f.store==='planes';
  if(esP&&!f.fecha){ toast('Falta la fecha'); return; }
  const obj={tipo_id:f.tipo_id,hora_inicio:f.hora_inicio,hora_fin:f.hora_fin,subcategoria:(f.subcategoria||'').trim(),nota:(f.nota||'').trim()};
  if(esP) obj.fecha=f.fecha; else obj.dia=Number(f.dia);
  if(f.id) obj.id=f.id;
  const nuevo=!f.id;
  await dbPut(f.store||'plantilla',obj);
  cerrarModal(); S.plantillaForm=null; toast(nuevo?'Añadido':'Actualizado'); render();
}
const _busy=new Set();
async function marcarPlantillaHecha(ref,fecha){
  const id=`${ref}_${fecha}`;
  if(_busy.has(id)) return; _busy.add(id);
  try{
    const ex=await dbGet('hechos',id);
    if(ex){
      await dbDel('hechos',id);
      if(ex.actividad_id) await dbDel('actividades',ex.actividad_id);
      toast(ex.omitido?'Recuperada':'Desmarcado');
    } else {
      const esP=String(ref).startsWith('p');
      const p=esP?await dbGet('planes',Number(String(ref).slice(1))):await dbGet('plantilla',Number(ref));
      if(!p){ toast('No existe'); return; }
      const dur=calcMin(p.hora_inicio,p.hora_fin);
      const actId=await req(db.transaction('actividades','readwrite').objectStore('actividades').add({
        tipo_id:p.tipo_id,fecha,subcategoria:p.subcategoria||'',duracion_min:dur||null,
        hora_inicio:p.hora_inicio,hora_fin:p.hora_fin,notas:(p.nota||'').trim(),origen:esP?'puntual':'plantilla'}));
      await dbPut('hechos',{id,plantilla_id:ref,fecha,actividad_id:actId});
      incrementarCambios();
      toastAccion('¡Hecho!','＋ Datos',()=>editarActividadPorId(actId),5000);
    }
  } finally { _busy.delete(id); }
  render();
}

async function viewDeberes(){
  const todos = await dbAll('deberes');
  const filtro = S.deberFiltro;
  const avisoDias = Number(S.prefs.avisoDias) || 3;
  let lista = todos.slice();
  if(filtro==='pendientes') lista = lista.filter(d=>d.estado==='pendiente'||d.estado==='en_curso');
  else if(filtro==='hechos') lista = lista.filter(d=>d.estado==='hecho');
  else if(filtro==='vencidos') lista = lista.filter(d=>d.estado!=='hecho' && d.fecha_limite && diasHasta(d.fecha_limite)<0);

  lista.sort((a,b)=>{
    if(a.estado==='hecho' && b.estado!=='hecho') return 1;
    if(b.estado==='hecho' && a.estado!=='hecho') return -1;
    const da = a.fecha_limite ? diasHasta(a.fecha_limite) : 9999;
    const db2 = b.fecha_limite ? diasHasta(b.fecha_limite) : 9999;
    return da - db2;
  });

  const grupos = {vencen_hoy:[], vencidos:[], esta_semana:[], mas_adelante:[], sin_fecha:[], hechos:[]};
  for(const d of lista){
    if(d.estado==='hecho'){ grupos.hechos.push(d); continue; }
    if(!d.fecha_limite){ grupos.sin_fecha.push(d); continue; }
    const n = diasHasta(d.fecha_limite);
    if(n<0) grupos.vencidos.push(d);
    else if(n===0) grupos.vencen_hoy.push(d);
    else if(n<=avisoDias) grupos.esta_semana.push(d);
    else grupos.mas_adelante.push(d);
  }

  const renderDeber = d => {
    const t = tipoDe(d.tipo_id);
    const n = diasHasta(d.fecha_limite);
    let cls = '';
    if(d.estado!=='hecho' && n!==null){
      if(n<0) cls='vencido'; else if(n<=1) cls='urgente'; else if(n<=avisoDias) cls='proximo';
    }
    const prioCls = d.prioridad==='alta'?'prio-alta':d.prioridad==='baja'?'prio-baja':'prio-media';
    const hechos = d.estado==='hecho';
    return `<div class="deber-card ${cls} ${hechos?'hecho':''}">
      <div class="deber-head">
        <span class="ico">${t.icono}</span>
        <div class="deber-title">${esc(d.titulo)}</div>
      </div>
      <div class="deber-meta">
        ${esc(t.nombre)}${d.subcategoria?' · '+esc(d.subcategoria):''}
        · <span class="${prioCls}">${(d.prioridad||'media').toUpperCase()}</span>
        · ${labelDiasHasta(d.fecha_limite)}
        ${hechos && d.hecho_en?' · Hecho el '+fmtFechaCorta(d.hecho_en):''}
      </div>
      ${d.descripcion?`<div class="deber-desc">${esc(d.descripcion)}</div>`:''}
      ${hechos && d.nota_resultado?`<div class="deber-desc">📝 ${esc(d.nota_resultado)}</div>`:''}
      <div class="deber-actions">
        ${!hechos?`<button class="btn btn-sm btn-primary" data-action="deber-hecho" data-id="${d.id}">✓ Hecho</button>`:''}
        ${!hechos && d.fecha_limite && n!==null && n<0?`<button class="btn btn-sm btn-warn" data-action="deber-reprogramar" data-id="${d.id}">+7 días</button>`:''}
        ${!hechos?`<button class="btn btn-sm" data-action="deber-en-curso" data-id="${d.id}">${d.estado==='en_curso'?'◐ En curso':'◯ En curso'}</button>`:''}
        <button class="btn btn-sm" data-action="deber-editar" data-id="${d.id}">✎</button>
        <button class="btn btn-sm btn-danger" data-action="deber-borrar" data-id="${d.id}">🗑</button>
      </div>
    </div>`;
  };

  const seccion = (titulo, arr) => arr.length ? `
    <div class="sec-title">${titulo} (${arr.length})</div>
    ${arr.map(renderDeber).join('')}` : '';

  return await topbar('Deberes') + `
  <div class="wrap">
    <button class="btn btn-primary btn-block btn-big" data-action="deber-nuevo" style="margin-bottom:12px">＋ Nuevo deber</button>
    <div class="chips" style="margin-bottom:14px">
      <button class="chip ${filtro==='pendientes'?'sel':''}" data-action="deber-filtro" data-id="pendientes">Pendientes</button>
      <button class="chip ${filtro==='vencidos'?'sel':''}" data-action="deber-filtro" data-id="vencidos">Vencidos</button>
      <button class="chip ${filtro==='hechos'?'sel':''}" data-action="deber-filtro" data-id="hechos">Hechos</button>

const RANGOS=[['semana','Esta semana'],['2semanas','2 sem'],['mes','Este mes'],['trimestre','Trim'],['año','Año'],['personalizado','Personalizar']];
const DIAS_RANGO={semana:7,'2semanas':14,mes:30,trimestre:91,'año':365};
function rangoActual(){
  const hoy=new Date();
  if(S.resumenRango==='personalizado'){
    const d = S.resumenDesde?parseKey(S.resumenDesde):addDays(hoy,-29);
    const h = S.resumenHasta?parseKey(S.resumenHasta):hoy;
    return {desde:d, hasta:h};
  }
  if(S.resumenRango==='semana') return {desde:lunesDe(hoy), hasta:hoy};
  if(S.resumenRango==='mes') return {desde:new Date(hoy.getFullYear(),hoy.getMonth(),1), hasta:hoy};
  const n=DIAS_RANGO[S.resumenRango]||7;
  return {desde:addDays(hoy,-(n-1)), hasta:hoy};
}
function totalesPorTipo(acts,tiposVis){
  const r={}; tiposVis.forEach(t=>r[t.id]={n:0,km:0,desn:0,min:0});
  for(const a of acts){
    const x=r[a.tipo_id]; if(!x) continue;
    x.n++; x.km+=num(a.distancia_km)+num(a.distancia_m)/1000;
    x.desn+=num(a.desnivel_m); x.min+=num(a.duracion_min);
  }
  return r;
}
async function viewResumen(){
  const tiposVis = S.tipos.filter(t=>t.visible);
  const acts = await dbAll('actividades');
  const {desde,hasta} = rangoActual();
  const kD=dateKey(desde), kH=dateKey(hasta);
  const enRango = acts.filter(a=>a.fecha>=kD && a.fecha<=kH);
  const tiposRes = S.tipos.filter(t=>t.visible||enRango.some(a=>a.tipo_id===t.id));
  const tot = totalesPorTipo(enRango, tiposRes);
  const tarjetas = tiposRes.map(t=>{
    const a = tot[t.id];
    let html = `<div class="card res-card"><div class="res-head">${t.icono} ${esc(t.nombre)}</div>
      <div class="res-metrics">
        <div class="m-box"><span class="m-lbl">Sesiones</span><span class="m-val">${a.n}</span></div>`;
    if(a.min>0) html += `<div class="m-box"><span class="m-lbl">Tiempo</span><span class="m-val">${a.min} min</span></div>`;
    if(a.km>0)
      html += `<div class="m-box"><span class="m-lbl">Distancia</span><span class="m-val">${fmtNum(a.km,1)} km</span></div>`;
    if(a.desn>0)
      html += `<div class="m-box"><span class="m-lbl">Desnivel</span><span class="m-val">${fmtNum(a.desn,0)} m</span></div>`;
    html += `</div></div>`;
    return html;
  }).join('');
  return await topbar('Resumen') + `
  <div class="wrap">
    <div class="chips" style="margin-bottom:12px">
      ${RANGOS.map(([k,l])=>`<button class="chip ${S.resumenRango===k?'sel':''}" data-action="resumen-rango" data-id="${k}">${l}</button>`).join('')}
    </div>
    ${S.resumenRango==='personalizado'?`<div class="card"><div class="row">
      <div class="field" style="margin:0"><label class="lbl">Desde</label>
        <input class="input" type="date" data-resumen="desde" value="${esc(S.resumenDesde)}"></div>
      <div class="field" style="margin:0"><label class="lbl">Hasta</label>
        <input class="input" type="date" data-resumen="hasta" value="${esc(S.resumenHasta)}"></div>
    </div></div>`:''}
    <div class="muted center" style="font-size:12px;margin-bottom:10px">Del ${fmtFecha(kD)} al ${fmtFecha(kH)}</div>
    ${tarjetas||'<div class="empty">Sin tipos visibles.</div>'}

}

function drawPesoChart(){
  const cv=document.getElementById('pesoCanvas'); if(!cv) return;
  const datos=S.pesoCache; if(datos.length<2) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth||300, h=160;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const kgs=datos.map(d=>d.kg);
  const min=Math.min(...kgs)-0.5, max=Math.max(...kgs)+0.5;
  const padX=35, padY=20;
  const X=i=>padX+(w-padX*2)*(i/(datos.length-1));
  const Y=kg=>h-padY-(h-padY*2)*((kg-min)/((max-min)||1));
  ctx.strokeStyle=S.theme==='dark'?'#1e2c46':'#cbd5e1'; ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=padY+(h-padY*2)*(i/3);ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(w-padX,y);ctx.stroke();}
  ctx.fillStyle=S.theme==='dark'?'#93a3bd':'#475569'; ctx.font='10px system-ui';
  ctx.textAlign='right'; ctx.fillText(fmtNum(max,1),padX-6,padY+3); ctx.fillText(fmtNum(min,1),padX-6,h-padY+3);
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.5; ctx.beginPath();
  datos.forEach((d,i)=>{const x=X(i),y=Y(d.kg);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke();
  ctx.fillStyle='#0284c7'; datos.forEach((d,i)=>{ctx.beginPath();ctx.arc(X(i),Y(d.kg),3.5,0,Math.PI*2);ctx.fill();});
}

async function guardarCategoria(){
  const f = S.catForm; if(!f) return;
  if(!f.nombre || !f.nombre.trim()){ toast('Falta el nombre'); return; }
  let id = f.id;
  if(!id){
    // generar id único
    const base = slugify(f.nombre);
    let n = base, i = 1;
    const existentes = new Set(S.tipos.map(t=>t.id));
    while(existentes.has(n)){ n = base + '-' + (++i); }
    id = n;
  }
  const obj = {
    id, nombre:f.nombre.trim(), icono:(f.icono||'🏷️').trim(),
    color:f.color || PALETA[0], visible:f.visible?1:0,
    orden: Number(f.orden)||1
  };
  await dbPut('tipos', obj);
  cerrarModal(); S.catForm=null;
  toast(f.id?'Actualizada':'Creada');
  render();
}
async function borrarCategoria(){
  const f = S.catForm; if(!f || !f.id) return;
  const [acts, debs, plans] = await Promise.all([dbAll('actividades'), dbAll('deberes'), dbAll('plantilla')]);
  const usos = {
    a: acts.filter(x=>x.tipo_id===f.id).length,
    d: debs.filter(x=>x.tipo_id===f.id).length,
    p: plans.filter(x=>x.tipo_id===f.id).length
  };
  const total = usos.a + usos.d + usos.p;
  const msg = total>0
    ? `La categoría "${f.nombre}" tiene ${usos.a} actividades, ${usos.d} deberes y ${usos.p} en la plantilla. ¿Moverlos todos a "Otro" y borrarla?`
    : `¿Borrar la categoría "${f.nombre}"?`;
  if(!confirm(msg)) return;
  if(total>0){
    const nuevo = 'otro';
    for(const a of acts.filter(x=>x.tipo_id===f.id)){ a.tipo_id=nuevo; await dbPut('actividades', a); }
    for(const d of debs.filter(x=>x.tipo_id===f.id)){ d.tipo_id=nuevo; await dbPut('deberes', d); }
    for(const p of plans.filter(x=>x.tipo_id===f.id)){ p.tipo_id=nuevo; await dbPut('plantilla', p); }
  }
  await dbDel('tipos', f.id);
  // Borrar subcategorías de esa categoría
  const subs = (await dbAll('subcategorias')).filter(s=>s.tipo_id===f.id);
  for(const s of subs) await dbDel('subcategorias', s.id);
  cerrarModal(); S.catForm=null;
  toast('Categoría borrada');
  render();
}

/* =====================================================================

   ===================================================================== */
async function exportarJSON(opts={}){
  const datos={};
  for(const s of STORES_DATOS)
    datos[s] = await dbAll(s);
  datos.exportado = new Date().toISOString();
  datos.version = "3.2.0";
  const blob = new Blob([JSON.stringify(datos,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='ocio-deporte-'+hoyKey()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);

  // Actualizar tracking de copia
  _silenciarCambios = true;
  await dbPut('prefs',{k:'ultimaCopia', v:new Date().toISOString()});
  await dbPut('prefs',{k:'cambiosDesdeCopia', v:0});
  await dbPut('prefs',{k:'snoozeCopia', v:''});
  _silenciarCambios = false;
  S.prefs.ultimaCopia = new Date().toISOString();
  S.prefs.cambiosDesdeCopia = 0;
  S.prefs.snoozeCopia = '';
  S.mostrarBannerCopia = false;
  toast('Copia exportada');
  if(opts.rerender) render();
}
async function importarJSON(file){
  const inp=document.getElementById('fileImport');
  try{
    const d=JSON.parse(await file.text());
    if(!d||typeof d!=='object'||(!Array.isArray(d.tipos)&&!Array.isArray(d.actividades))) throw new Error('El archivo no parece una copia de Ocio y Deporte');
    if(!confirm('Importar reemplazará TODOS los datos actuales. ¿Continuar?')) return;
    _silenciarCambios=true;
    try{
      for(const s of STORES_DATOS){ if(!Array.isArray(d[s])) continue; await dbClear(s); for(const it of d[s]) await dbPut(s,it); }
      await dbPut('prefs',{k:'seeded',v:1});
    } finally { _silenciarCambios=false; }
    toast('Importado'); render();
  }catch(err){ alert('Error: '+err.message); }
  finally{ if(inp) inp.value=''; }
}
async function borrarTodo(){
  if(!confirm('¿Eliminar TODOS los datos? Antes se descargará una copia de seguridad.')) return;
  await exportarJSON();
  for(const s of STORES_DATOS)
    await dbClear(s);
  _silenciarCambios = true;
  await seed();
  await dbPut('prefs',{k:'cambiosDesdeCopia',v:0});
  await dbPut('prefs',{k:'ultimaCopia',v:''});
  await dbPut('prefs',{k:'snoozeCopia',v:''});
  _silenciarCambios = false;
  toast('Borrado'); go('hoy');
}

document.addEventListener('toggle', e=>{
  if(e.target.tagName==='DETAILS' && e.target.dataset.fold){
    S.ajustesOpen[e.target.dataset.fold] = e.target.open;
  }
}, true);

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.field && S.form){ S.form[t.dataset.field]=t.value; return; }
  if(t.dataset.peso && S.pesoForm){ S.pesoForm[t.dataset.peso]=t.value; return; }
  if(t.dataset.plantilla && S.plantillaForm){ S.plantillaForm[t.dataset.plantilla]=t.value; return; }
  if(t.dataset.deber && S.deberForm){ S.deberForm[t.dataset.deber]=t.value; return; }
  if(t.dataset.cat && S.catForm){ S.catForm[t.dataset.cat]=t.value; return; }
  if(t.dataset.resumen){ S['resumen'+t.dataset.resumen.charAt(0).toUpperCase()+t.dataset.resumen.slice(1)] = t.value; }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.resumen){ render(); return; }
  if(t.dataset.pref){ setPref(t.dataset.pref, t.value).then(render); return; }
  if(t.dataset.tipoVisible){
    const tipo = S.tipos.find(x=>x.id===t.dataset.tipoVisible);
    if(tipo){ tipo.visible = t.checked?1:0; dbPut('tipos',tipo).then(render); }
    return;
  }
  if(t.dataset.cat==='visible' && S.catForm){ S.catForm.visible = t.checked?1:0; return; }
  if(t.dataset.filtro && t.dataset.rerender){ S.hist[t.dataset.filtro]=t.value; render(); return; }
  if(t.dataset.plantilla && t.dataset.rerender==='modal-plantilla'){ abrirPlantillaModal(S.plantillaForm); return; }
  if(t.dataset.deber && t.dataset.rerender==='modal-deber'){ abrirDeberModal(S.deberForm); return; }
  if(t.id==='fileImport' && t.files && t.files[0]){ importarJSON(t.files[0]); }
});
document.addEventListener('click', async e=>{
  if(e.target.classList && e.target.classList.contains('overlay')) return;
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case 'toggle-theme': toggleTheme(); break;
    case 'go': go(el.dataset.screen); break;
    case 'modal-close': cerrarModal(); break;

    /* HOY */
    case 'hoy-marcar': await marcarPlantillaHecha(el.dataset.plantilla, el.dataset.fecha); break;

    /* COPIA */
    case 'copia-ahora': await exportarJSON({rerender:true}); break;
    case 'copia-snooze': {
      const snooze = new Date(Date.now() + 7*86400000).toISOString();
      _silenciarCambios = true;
      await dbPut('prefs',{k:'snoozeCopia',v:snooze});
      _silenciarCambios = false;
      S.prefs.snoozeCopia = snooze;
      S.mostrarBannerCopia = false;
      render(); break;
    }
    case 'copia-reset': {
      _silenciarCambios = true;
      await dbPut('prefs',{k:'cambiosDesdeCopia',v:0});
      _silenciarCambios = false;
      S.prefs.cambiosDesdeCopia = 0;
      toast('Contador reseteado'); render(); break;
    }

    /* PLANTILLA */
    case 'plantilla-nueva': {
      S.plantillaForm = {
        id:null, dia:Number(el.dataset.dia),
        tipo_id:(S.tipos.find(t=>t.visible)||{id:'gimnasio'}).id,
        hora_inicio:'09:00', hora_fin:'10:00',
        subcategoria:'', nota:''
      };
      abrirPlantillaModal(S.plantillaForm); break;
    }
    case 'plantilla-editar': {
      const st = el.dataset.store || 'plantilla';
      const p = await dbGet(st, Number(el.dataset.id));
      if(p) abrirPlantillaModal({...p, store:st});
      break;
    }
    case 'plantilla-guardar': await guardarPlantilla(); break;
    case 'plantilla-borrar': { const f=S.plantillaForm; cerrarModal(); await borrarConUndo(f.store||'plantilla', f.id, 'Actividad borrada'); break; }
    case 'ev-modo': {
      const f=S.plantillaForm; f.store=el.dataset.store;
      if(f.store==='planes' && f.dia && !S.plantillaForm._fechaTocada) f.fecha=dateKey(addDays(lunesDe(new Date()), Number(f.dia)-1));
      abrirPlantillaModal(f); break;
    }
    case 'sem-vista': await setPref('semanaVista', el.dataset.id); render(); break;
    case 'hoy-saltar': await dbPut('hechos',{id:`${el.dataset.plantilla}_${el.dataset.fecha}`,plantilla_id:el.dataset.plantilla,fecha:el.dataset.fecha,omitido:true}); render(); break;
    case 'act-datos': await editarActividadPorId(el.dataset.id); break;
    case 'chk-ir': S.chkTipo=el.dataset.id; go('checklist'); break;
    case 'back': history.back(); break;
    case 'menu-add': showModal(`<h2>¿Qué quieres añadir?</h2>
      <button class="btn btn-block btn-big" data-action="menu-registrar">✅ Registrar algo que ya he hecho</button>
      <button class="btn btn-block btn-big" style="margin-top:10px" data-action="menu-puntual">📅 Planificar algo con fecha</button>
      <button class="btn btn-block btn-big" style="margin-top:10px" data-action="menu-deber">📌 Nuevo deber</button>
      <div class="modal-actions"><button class="btn" data-action="modal-close">Cancelar</button></div>`); break;
    case 'menu-registrar': cerrarModal(); S.form=nuevoForm(); go('actividad'); break;
    case 'menu-puntual': abrirPlantillaModal({...nuevoEvento(), store:'planes'}); break;
    case 'menu-deber': abrirDeberModal(null); break;
    case 'plantilla-marcar':
      e.stopPropagation();
      await marcarPlantillaHecha(el.dataset.plantilla, el.dataset.fecha);
      break;

    /* DEBERES */
    case 'deber-nuevo': abrirDeberModal(null); break;
    case 'deber-editar': {
      const d = await dbGet('deberes', Number(el.dataset.id));
      if(d) abrirDeberModal(d);
      break;
    }
    case 'deber-guardar': await guardarDeber(); break;
    case 'deber-filtro': S.deberFiltro = el.dataset.id; render(); break;
    case 'deber-hecho': {
      const d = await dbGet('deberes', Number(el.dataset.id));
      if(d){
        const prev={...d};
        d.estado='hecho'; d.hecho_en=hoyKey();
        await dbPut('deberes', d); render();
        toastAccion('¡Deber hecho!','Deshacer',async()=>{ await dbPut('deberes',prev); render(); });
      }
      break;
    }
    case 'deber-en-curso': {
      const d = await dbGet('deberes', Number(el.dataset.id));
      if(d){ d.estado = d.estado==='en_curso'?'pendiente':'en_curso'; await dbPut('deberes', d); render(); }
      break;
    }
    case 'deber-reprogramar': {
      const d = await dbGet('deberes', Number(el.dataset.id));
      if(d && d.fecha_limite){
        d.fecha_limite = dateKey(addDays(parseKey(d.fecha_limite),7));
        await dbPut('deberes', d); toast('+7 días'); render();
      }
      break;
    }
    case 'deber-borrar': await borrarConUndo('deberes', Number(el.dataset.id), 'Deber borrado'); break;
    case 'deber-fecha': { const n=el.dataset.dias; S.deberForm.fecha_limite = n===''?null:dateKey(addDays(new Date(),Number(n))); abrirDeberModal(S.deberForm); break; }

    /* CATEGORÍAS */
    case 'cat-add': abrirCatModal(null); break;
    case 'cat-editar': {
      const cat = S.tipos.find(t=>t.id===el.dataset.id);
      if(cat) abrirCatModal(cat);
      break;
    }
    case 'cat-guardar': await guardarCategoria(); break;
    case 'cat-borrar': await borrarCategoria(); break;
    case 'cat-color': {
      if(S.catForm){ S.catForm.color = el.dataset.color; abrirCatModal(S.catForm); }
      break;
    }

    /* ACTIVIDAD SUELTA */
    case 'nueva-act': S.form=nuevoForm(); go('actividad'); break;
    case 'ver-act': {
      const act = await dbGet('actividades', Number(el.dataset.id));
      if(!act) return;
      const f = nuevoForm();
      Object.keys(f).forEach(k=>{ if(act[k]!==undefined && act[k]!==null) f[k]=act[k]; });
      f.id=act.id; f.fecha=act.fecha; S.form=f; go('actividad');
      break;
    }
    case 'form-tipo': S.form.tipo_id = el.dataset.id; S.form.subcategoria=''; render(); break;
    case 'form-fecha': S.form.fecha = dateKey(addDays(new Date(), Number(el.dataset.dia))); render(); break;
    case 'guardar-act': await guardarActividad(); break;
    case 'borrar-act':
      if(confirm('¿Borrar actividad?')){
        for(const h of (await dbAll('hechos')).filter(h=>h.actividad_id===S.form.id)) await dbDel('hechos',h.id);
        await dbDel('actividades', S.form.id);
        S.form=null; toast('Borrada'); go('hoy');
      }
      break;

    /* CHECKLIST */
    case 'chk-tipo': S.chkTipo = el.dataset.id; render(); break;
    case 'chk-toggle': {
      const id = Number(el.dataset.id);
      const cur = await dbGet('checkEstado', id);
      await dbPut('checkEstado', {id, marcado: !(cur && cur.marcado)});
      render(); break;
    }
    case 'chk-mover': {
      const it = await dbGet('checklist', Number(el.dataset.id));
      it.seccion = it.seccion==='imprescindible'?'opcional':'imprescindible';
      await dbPut('checklist', it); render(); break;
    }
    case 'chk-renombrar': {
      const it = await dbGet('checklist', Number(el.dataset.id));
      const n = prompt('Editar texto:', it.texto);
      if(n && n.trim()){ it.texto=n.trim(); await dbPut('checklist', it); render(); }
      break;
    }
    case 'chk-borrar': await borrarConUndo('checklist', Number(el.dataset.id), 'Ítem borrado'); break;
    case 'chk-add': {
      const texto = prompt('Nuevo ítem:');
      if(texto && texto.trim()){
        const todos = await dbAll('checklist');
        const orden = todos.length ? Math.max(...todos.map(x=>x.orden||0))+1 : 0;
        await dbPut('checklist', {tipo_id:S.chkTipo, seccion:el.dataset.seccion, texto:texto.trim(), orden});
        render();
      }
      break;
    }
    case 'chk-reset': {
      const items = (await dbAll('checklist')).filter(i=>i.tipo_id===S.chkTipo);
      for(const it of items) await dbPut('checkEstado', {id:it.id, marcado:false});
      toast('Reiniciada'); render(); break;
    }

    /* RESUMEN */
    case 'resumen-rango': S.resumenRango = el.dataset.id; render(); break;

    /* PESO */
    case 'peso-guardar': {
      const kg = num(S.pesoForm.kg);
      if(!kg){ toast('Falta el peso'); return; }
      const o={fecha:S.pesoForm.fecha||hoyKey(), kg}; if(S.pesoForm.id) o.id=S.pesoForm.id;
      await dbPut('peso', o);
      S.pesoForm={fecha:hoyKey(), kg:''}; toast('Guardado'); render(); break;
    }
    case 'peso-editar': {
      const p = await dbGet('peso', Number(el.dataset.id));
      if(p){ S.pesoForm={id:p.id, fecha:p.fecha, kg:p.kg}; render(); window.scrollTo(0,0); }
      break;
    }
    case 'peso-borrar': await borrarConUndo('peso', Number(el.dataset.id), 'Registro borrado'); break;

    /* SUBCATEGORÍAS */
    case 'subcat-add': {
      const nom = prompt('Nombre:');
      if(nom && nom.trim()){
        await dbPut('subcategorias', {tipo_id:el.dataset.tipo, nombre:nom.trim()});
        toast('Añadida'); render();
      }
      break;
    }
    case 'subcat-borrar': {
      await borrarConUndo('subcategorias', Number(el.dataset.id), 'Subcategoría borrada'); break;
    }

    /* IDEAS */
    case 'idea-guardar': {
      const txt = $('#inputIdea').value;
      if(txt && txt.trim()){
        await dbPut('ideas', {texto:txt.trim(), fecha:hoyKey(), implementado:false});
        toast('Guardada'); render();
      } else toast('Escribe algo');
      break;
    }
    case 'idea-toggle': {
      const i = await dbGet('ideas', Number(el.dataset.id));
      if(i){ i.implementado = !i.implementado; await dbPut('ideas', i); render(); }
      break;
    }
    case 'idea-borrar': await borrarConUndo('ideas', Number(el.dataset.id), 'Idea borrada'); break;
    case 'idea-editar': {
      const i=await dbGet('ideas',Number(el.dataset.id));
      if(i){ S.ideaEd={...i}; showModal(`<h2>Editar idea</h2><div class="field"><textarea class="input" id="ideaEdTxt" style="min-height:150px">${esc(i.texto)}</textarea></div><div class="modal-actions"><button class="btn" data-action="modal-close">Cancelar</button><button class="btn btn-primary" data-action="idea-editar-guardar">Guardar</button></div>`); }
      break;
    }
    case 'idea-editar-guardar': {
      const txt=$('#ideaEdTxt').value.trim(); if(!txt){ toast('Escribe algo'); break; }
      S.ideaEd.texto=txt; await dbPut('ideas',S.ideaEd); S.ideaEd=null; cerrarModal(); toast('Actualizada'); render(); break;
    }

    /* DATOS */
    case 'exportar': await exportarJSON({rerender:true}); break;
    case 'importar': document.getElementById('fileImport').click(); break;
    case 'borrar-todo': await borrarTodo(); break;
  }
});

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(async function init(){
  try{
    await openDB();
    _silenciarCambios=true; try{ await seed(); } finally { _silenciarCambios=false; }
    try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
    try{ history.replaceState({screen:'hoy'},''); }catch(e){}
    await loadState();
    S.mostrarBannerCopia = await debeRecomendarCopia();
    await render();
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML = `
      <div style="padding:40px;text-align:center;color:#fca5a5">
        <h2>Error al iniciar</h2>
        <p>${esc(e.message)}</p>
        <button onclick="location.reload()" style="margin-top:12px;padding:10px 20px;border-radius:10px">Recargar</button>
      </div>`;
  }
})();
</script>
