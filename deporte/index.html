<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Ocio y Deporte</title>
<style>
  :root {
    --bg-main:#0b1220; --bg-card:#151f33; --bg-card-alt:#0e1728;
    --bg-header:rgba(11,18,32,.94); --border-color:#26344f; --border-subtle:#1e2c46;
    --text-main:#e8eefb; --text-muted:#93a3bd; --text-dim:#6b7c99;
    --primary:#2563eb; --primary-hover:#3b82f6; --accent:#7dd3fc;
    --danger-bg:#3b1016; --danger-border:#7f1d1d; --danger-text:#fca5a5;
    --warn-bg:#422006; --warn-border:#78350f; --warn-text:#fcd34d;
    --chip-bg:#0e1728; --chip-border:#26344f; --chip-text:#c3d0e6;
  }
  [data-theme="light"]{
    --bg-main:#f1f5f9; --bg-card:#fff; --bg-card-alt:#f8fafc;
    --bg-header:rgba(255,255,255,.94); --border-color:#cbd5e1; --border-subtle:#e2e8f0;
    --text-main:#0f172a; --text-muted:#475569; --text-dim:#94a3b8;
    --primary:#2563eb; --primary-hover:#1d4ed8; --accent:#0284c7;
    --danger-bg:#fef2f2; --danger-border:#fecaca; --danger-text:#dc2626;
    --warn-bg:#fffbeb; --warn-border:#fde68a; --warn-text:#b45309;
    --chip-bg:#f1f5f9; --chip-border:#cbd5e1; --chip-text:#334155;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg-main);color:var(--text-main);
    font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:30px;
    transition:background-color .2s,color .2s}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 14px;background:var(--bg-header);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border-color)}
  .topbar h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .icon-btn{background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-main);
    width:36px;height:36px;border-radius:10px;font-size:18px;display:inline-flex;
    align-items:center;justify-content:center;line-height:1;cursor:pointer;flex:0 0 auto;position:relative}
  .icon-btn:active{transform:scale(.95)}
  .badge-dot{position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;
    font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-main)}
  .wrap{padding:14px;max-width:850px;margin:0 auto}
  .card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border-color);
    background:var(--bg-card-alt);color:var(--text-main);padding:10px 14px;border-radius:12px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:linear-gradient(180deg,var(--primary-hover),var(--primary));border-color:var(--primary);color:#fff}
  .btn-block{width:100%}
  .btn-big{padding:16px;font-size:16px}
  .btn-danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text)}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .btn-warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tile{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:14px;
    cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
  .tile:active{transform:scale(.985)}
  .tile .ti{font-size:21px;line-height:1.1}
  .tile .tt{font-weight:650}
  .tile .ts{font-size:11.5px;color:var(--text-muted)}
  .lbl{display:block;font-size:11.5px;color:var(--text-muted);margin:0 0 5px;
    font-weight:650;letter-spacing:.3px;text-transform:uppercase}
  .input{width:100%;background:var(--bg-card-alt);border:1px solid var(--border-color);
    color:var(--text-main);border-radius:11px;padding:10px 12px;font-size:14.5px;
    font-family:inherit;outline:none}
  .input:focus{border-color:var(--primary-hover)}
  select.input{appearance:none}
  textarea.input{min-height:70px;resize:vertical}
  .field{margin-bottom:12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip-bg);border:1px solid var(--chip-border);color:var(--chip-text);
    border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;
    font-family:inherit;font-weight:600}
  .chip.sel{background:var(--primary);border-color:var(--primary-hover);color:#fff}
  .item{display:flex;gap:11px;align-items:center;padding:10px 12px;background:var(--bg-card);
    border:1px solid var(--border-color);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .item:active{filter:brightness(.95)}
  .item .ico{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
  .grow{flex:1;min-width:0}
  .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t2{font-size:12px;color:var(--text-muted);margin-top:1px}
  .muted{color:var(--text-muted)}
  .center{text-align:center}
  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);
    font-weight:700;margin:16px 0 8px}
  .empty{color:var(--text-dim);text-align:center;padding:18px 10px;font-size:13.5px}

  /* HOY */
  .hoy-block{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg-card);
    border:1px solid var(--border-color);border-radius:12px;margin-bottom:8px}
  .hoy-block .ti{font-size:22px;flex:0 0 auto}
  .hoy-check{width:32px;height:32px;border-radius:8px;border:2px solid var(--text-muted);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
    cursor:pointer;flex:0 0 auto;background:transparent}
  .hoy-check.on{background:var(--primary);border-color:var(--primary)}
  .hoy-block.hecho .hoy-title{text-decoration:line-through;color:var(--text-dim)}
  .hoy-title{font-weight:650}
  .hoy-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
  .deber-mini{font-size:12.5px;margin-top:5px;padding:6px 8px;border-radius:8px;
    background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);
    display:flex;align-items:center;gap:6px;cursor:pointer}

  /* PLANTILLA SEMANAL ESTÁTICA */
  .plantilla-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .week-grid-container{width:100%;overflow-x:auto;background:var(--bg-card);
    border:1px solid var(--border-color);border-radius:14px;position:relative}
  .week-grid{display:grid;grid-template-columns:70px repeat(7,minmax(85px,1fr));min-width:680px}
  .grid-header{position:sticky;top:0;z-index:10;background:var(--bg-card-alt);
    border-bottom:1px solid var(--border-color);text-align:center;padding:8px 4px;
    font-weight:700;font-size:12px}
  .grid-header.corner{position:sticky;left:0;z-index:11;background:var(--bg-card-alt);
    border-right:1px solid var(--border-color)}
  .grid-header .dname{color:var(--text-muted);font-size:10px;text-transform:uppercase}
  .grid-header .dnum{font-size:14px;color:var(--text-main)}
  .grid-header.hoy{background:rgba(37,99,235,.15);color:var(--primary-hover)}
  .grid-header.hoy .dnum{color:var(--primary-hover)}
  .tramo-col{position:sticky;left:0;z-index:9;background:var(--bg-card-alt);
    border-right:1px solid var(--border-color);color:var(--text-muted);font-size:11px;
    font-weight:600;text-align:center;display:flex;flex-direction:column;justify-content:center;padding:6px 4px}
  .tramo-col .tname{color:var(--text-main);font-weight:700;font-size:12px}
  .tramo-col .thours{font-size:10px;margin-top:2px}
  .day-col-plantilla{position:relative;border-right:1px solid var(--border-subtle);
    padding:6px;display:flex;flex-direction:column;gap:5px;min-height:110px}
  .day-col-plantilla:last-child{border-right:none}
  .celda-add{flex:1;border:1px dashed var(--border-color);border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);
    font-size:16px;cursor:pointer;min-height:22px}
  .celda-add:hover{border-color:var(--primary);color:var(--primary)}
  .celda-act{border-radius:8px;padding:6px 7px;font-size:11.5px;line-height:1.25;
    overflow:hidden;cursor:pointer;color:#fff;position:relative;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .celda-act .ca-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:4px}
  .celda-act .ca-title .chk-mini{width:14px;height:14px;border-radius:3px;
    border:1.5px solid rgba(255,255,255,.7);flex:0 0 auto;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:9px}
  .celda-act .ca-title .chk-mini.on{background:rgba(255,255,255,.9);border-color:#fff;color:#111}
  .celda-act .ca-sub{font-size:10px;opacity:.9;margin-top:1px}
  .celda-act.hecha{opacity:.55}

  /* Colores por tipo */
  .bg-senderismo{background:#059669} .bg-paseo{background:#0284c7}
  .bg-gimnasio{background:#7c3aed} .bg-otro{background:#d97706}
  .bg-natacion{background:#2563eb} .bg-running{background:#dc2626}
  .bg-guitarra{background:#be185d} .bg-ingles{background:#0891b2}

  /* DEBERES */
  .deber-card{background:var(--bg-card);border:1px solid var(--border-color);
    border-radius:12px;padding:12px;margin-bottom:8px;position:relative}
  .deber-card.urgente{border-left:4px solid #dc2626}
  .deber-card.proximo{border-left:4px solid #d97706}
  .deber-card.vencido{border-left:4px solid #7f1d1d;background:var(--danger-bg)}
  .deber-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
  .deber-head .ico{font-size:18px;flex:0 0 auto}
  .deber-title{font-weight:700;font-size:14.5px;flex:1;min-width:0}
  .deber-meta{font-size:11.5px;color:var(--text-muted);margin-bottom:6px}
  .deber-desc{font-size:13px;color:var(--text-muted);margin-bottom:8px;white-space:pre-wrap}
  .deber-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .prio-alta{color:#dc2626;font-weight:700}
  .prio-media{color:#d97706;font-weight:700}
  .prio-baja{color:#64748b;font-weight:700}
  .hecho .deber-title{text-decoration:line-through;color:var(--text-dim)}

  /* Detalles plegables */
  details.sec-fold{background:var(--bg-card);border:1px solid var(--border-color);
    border-radius:12px;margin-bottom:10px;overflow:hidden}
  details.sec-fold summary{padding:12px 14px;font-weight:650;font-size:14px;cursor:pointer;
    user-select:none;display:flex;align-items:center;justify-content:space-between;
    outline:none;background:var(--bg-card)}
  details.sec-fold summary::-webkit-details-marker{display:none}
  details.sec-fold summary::after{content:'›';font-size:18px;transition:transform .2s;color:var(--text-muted)}
  details.sec-fold[open] summary::after{transform:rotate(90deg)}
  details.sec-fold summary:hover{background:var(--bg-card-alt)}
  .fold-body{padding:12px 14px;border-top:1px solid var(--border-color);background:var(--bg-card)}

  .overlay{position:fixed;inset:0;background:rgba(4,8,16,.75);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media(min-width:600px){.overlay{align-items:center;padding:20px}}
  .modal{background:var(--bg-card);border:1px solid var(--border-color);
    border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:520px;
    max-height:92vh;overflow:auto;color:var(--text-main)}
  @media(min-width:600px){.modal{border-radius:18px}}
  .modal h2{margin:0 0 14px;font-size:17px}
  .modal-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .modal-actions .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .mini{background:none;border:none;color:var(--text-muted);font-size:14px;
    padding:2px 4px;cursor:pointer;line-height:1}
  .mini:hover{color:var(--text-main)}
  .chk-compact{display:flex;align-items:center;gap:8px;background:var(--bg-card-alt);
    border:1px solid var(--border-subtle);border-radius:8px;padding:6px 9px;
    margin-bottom:5px;font-size:13.5px}
  .chk-compact .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--text-muted);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
    flex:0 0 auto;cursor:pointer}
  .chk-compact.on .box{background:var(--primary);border-color:var(--primary)}
  .chk-compact.on .txt{text-decoration:line-through;color:var(--text-dim)}
  .chk-compact .txt{flex:1;min-width:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = (n,d=1) => Number(Number(n).toFixed(d)).toLocaleString('es-ES');

function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ const p = String(k).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d,n){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function hoyKey(){ return dateKey(new Date()); }
function fmtFecha(k){ if(!k) return '—'; return parseKey(k).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}); }
function fmtFechaCorta(k){ if(!k) return '—'; return parseKey(k).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }
function diasHasta(k){ if(!k) return null; const d = parseKey(k); const h = new Date(); h.setHours(0,0,0,0); d.setHours(0,0,0,0); return Math.round((d-h)/86400000); }
function labelDiasHasta(k){
  const n = diasHasta(k);
  if(n === null) return 'Sin fecha';
  if(n < 0) return `Vencido hace ${-n} día${-n===1?'':'s'}`;
  if(n === 0) return 'Vence hoy';
  if(n === 1) return 'Vence mañana';
  if(n <= 7) return `Vence en ${n} días`;
  return `Vence el ${fmtFechaCorta(k)}`;
}
function inicioSemana(d, ini){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = x.getDay();
  const diff = (ini === 'domingo') ? dow : (dow + 6) % 7;
  return addDays(x, -diff);
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 1900);
}

/* =====================================================================
   INDEXEDDB
   ===================================================================== */
const DB_NAME='ocio_deporte', DB_VER=3;
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = ev => {
      const d = ev.target.result;
      const mk=(n,opt={})=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,opt); };
      mk('tipos',{keyPath:'id'});
      mk('subcategorias',{keyPath:'id',autoIncrement:true});
      mk('actividades',{keyPath:'id',autoIncrement:true});
      mk('plantilla',{keyPath:'id',autoIncrement:true});  // actividades recurrentes semanales
      mk('hechos',{keyPath:'id'});                        // id = plantilla_id+fecha
      mk('deberes',{keyPath:'id',autoIncrement:true});
      mk('tramos',{keyPath:'id'});
      mk('checklist',{keyPath:'id',autoIncrement:true});
      mk('checkEstado',{keyPath:'id'});
      mk('peso',{keyPath:'id',autoIncrement:true});
      mk('prefs',{keyPath:'k'});
      mk('ideas',{keyPath:'id',autoIncrement:true});
    };
    r.onsuccess = ()=>{ db=r.result; res(db); };
    r.onerror = ()=>rej(r.error);
  });
}
function req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const dbAll = s => req(db.transaction(s).objectStore(s).getAll());
const dbGet = (s,k) => req(db.transaction(s).objectStore(s).get(k));
const dbPut = (s,v) => req(db.transaction(s,'readwrite').objectStore(s).put(v));
const dbDel = (s,k) => req(db.transaction(s,'readwrite').objectStore(s).delete(k));
const dbClear = s => req(db.transaction(s,'readwrite').objectStore(s).clear());

/* =====================================================================
   DATOS DE FÁBRICA
   ===================================================================== */
const TIPOS_BASE = [
  {id:'senderismo', nombre:'Senderismo', icono:'🥾', visible:1, orden:1, color:'bg-senderismo'},
  {id:'paseo',      nombre:'Paseo',      icono:'🚶', visible:1, orden:2, color:'bg-paseo'},
  {id:'gimnasio',   nombre:'Gimnasio',   icono:'🏋️', visible:1, orden:3, color:'bg-gimnasio'},
  {id:'guitarra',   nombre:'Guitarra',   icono:'🎸', visible:1, orden:4, color:'bg-guitarra'},
  {id:'ingles',     nombre:'Inglés',     icono:'🗣️', visible:1, orden:5, color:'bg-ingles'},
  {id:'otro',       nombre:'Otro',       icono:'✨', visible:1, orden:6, color:'bg-otro'},
  {id:'natacion',   nombre:'Natación',   icono:'🏊', visible:0, orden:7, color:'bg-natacion'},
  {id:'running',    nombre:'Running',    icono:'🏃', visible:0, orden:8, color:'bg-running'},
];
const SUBCATS_BASE = [
  {tipo_id:'gimnasio', nombre:'Fitness / Pesas'},
  {tipo_id:'gimnasio', nombre:'Spinning'},
  {tipo_id:'gimnasio', nombre:'Pilates / Yoga'},
  {tipo_id:'senderismo', nombre:'Montaña'},
  {tipo_id:'paseo', nombre:'Urbano'},
  {tipo_id:'guitarra', nombre:'Clase'},
  {tipo_id:'guitarra', nombre:'Práctica personal'},
  {tipo_id:'ingles', nombre:'Clase conversación'},
  {tipo_id:'ingles', nombre:'Estudio personal'},
];
const CHECK_FABRICA = {
  senderismo:{ imprescindible:['Agua','Botas','Chubasquero','Comida','Móvil cargado','Botiquín'],
               opcional:['Bastones','Gorra','Crema solar'] },
  paseo:{ imprescindible:['Calzado cómodo'], opcional:['Agua'] },
  gimnasio:{ imprescindible:['Ropa deporte','Toalla','Candado','Botella agua'], opcional:['Auriculares','Guantes'] },
  guitarra:{ imprescindible:['Guitarra','Púas','Afinador','Cuaderno'], opcional:['Metrónomo','Atril'] },
  ingles:{ imprescindible:['Cuaderno','Bolígrafo'], opcional:['Libro','App de apoyo'] },
  otro:{ imprescindible:[], opcional:[] },
};
const CAMPOS_POR_TIPO = {
  senderismo:['distancia_km','desnivel_m','ruta','con_quien'],
  paseo:['distancia_km'],
  gimnasio:[],
  guitarra:['pieza','lugar'],
  ingles:['tema','lugar'],
  natacion:['distancia_m'],
  running:['distancia_km'],
  otro:['descripcion'],
};
const CAMPO_DEF = {
  distancia_km:{label:'Distancia (km)', type:'number', step:'0.01'},
  desnivel_m:{label:'Desnivel (m)', type:'number', step:'1'},
  ruta:{label:'Ruta / pieza', type:'text'},
  con_quien:{label:'Con quién', type:'text'},
  pieza:{label:'Pieza / ejercicio', type:'text'},
  tema:{label:'Tema / contenido', type:'text'},
  lugar:{label:'Lugar / asociación', type:'text'},
  distancia_m:{label:'Distancia (m)', type:'number', step:'1'},
  descripcion:{label:'Descripción', type:'text'},
};
const TRAMOS_BASE = [
  {id:'manana',   nombre:'Mañana',   ini:'07:00', fin:'12:00', orden:1},
  {id:'mediodia', nombre:'Mediodía', ini:'12:00', fin:'16:00', orden:2},
  {id:'tarde',    nombre:'Tarde',    ini:'16:00', fin:'20:00', orden:3},
  {id:'noche',    nombre:'Noche',    ini:'20:00', fin:'23:00', orden:4},
];
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']; // índice 1..7 (lunes=1)
const DIAS_NOMBRE = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

/* =====================================================================
   ESTADO GLOBAL
   ===================================================================== */
const S = {
  screen:'hoy',
  theme:'dark',
  tipos:[], subcategorias:[], prefs:[], tramos:[],

/* =====================================================================
   SEMILLA / CARGA
   ===================================================================== */
async function seed(){
  const ya = await dbGet('prefs','seeded');
  if(ya) return;
  for(const t of TIPOS_BASE) await dbPut('tipos', {...t});
  for(const sc of SUBCATS_BASE) await dbPut('subcategorias', {...sc});
  for(const t of TRAMOS_BASE) await dbPut('tramos', {...t});
  let orden = 0;
  for(const tipo of Object.keys(CHECK_FABRICA)){
    for(const sec of ['imprescindible','opcional']){
      for(const txt of CHECK_FABRICA[tipo][sec]){
        await dbPut('checklist', {tipo_id:tipo, seccion:sec, texto:txt, orden:orden++});
      }
    }
  }
  await dbPut('prefs', {k:'semanaInicio', v:'lunes'});
  await dbPut('prefs', {k:'theme', v:'dark'});
  await dbPut('prefs', {k:'avisoDias', v:3});
  await dbPut('prefs', {k:'seeded', v:1});
  await dbPut('ideas', {
    texto: "v3.0.0: Añadida pantalla Hoy, Deberes, plantilla semanal estática y categorías Guitarra/Inglés.",
    fecha: hoyKey(), implementado: true
  });
}
async function loadState(){
  S.tipos = (await dbAll('tipos')).sort((a,b)=>a.orden-b.orden);
  S.subcategorias = await dbAll('subcategorias');
  S.tramos = (await dbAll('tramos')).sort((a,b)=>a.orden-b.orden);
  const p={}; (await dbAll('prefs')).forEach(x=>p[x.k]=x.v);
  S.prefs=p; S.theme=p.theme||'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
}
async function setPref(k,v){ await dbPut('prefs',{k,v}); S.prefs[k]=v; }
function toggleTheme(){
  const next = S.theme==='dark'?'light':'dark';
  S.theme=next; setPref('theme',next);
  document.documentElement.setAttribute('data-theme', next); render();
}
const tipoDe = id => S.tipos.find(t=>t.id===id) || {nombre:'—',icono:'•',color:'bg-otro'};
const prefInicio = () => S.prefs.semanaInicio || 'lunes';

/* =====================================================================
   TOPBAR con badge de deberes
   ===================================================================== */
async function topbar(titulo, opts={}){
  let badge = '';
  if(!opts.sinBadge){
    const pend = (await dbAll('deberes')).filter(d => d.estado !== 'hecho');
    if(pend.length){
      const vencenPronto = pend.filter(d => {
        const n = diasHasta(d.fecha_limite); return n !== null && n <= (Number(S.prefs.avisoDias)||3);
      }).length;
      if(vencenPronto > 0){
        badge = `<button class="icon-btn" data-action="go" data-screen="deberes" title="Deberes pendientes">
          📌<span class="badge-dot">${vencenPronto}</span></button>`;
      }
    }
  }
  return `<header class="topbar">
    ${S.screen==='hoy' ? '' : '<button class="icon-btn" data-action="go" data-screen="hoy" aria-label="Inicio">‹</button>'}
    <h1>${esc(titulo)}</h1>
    <div class="topbar-actions">
      ${badge}
      <button class="icon-btn" data-action="toggle-theme" title="Tema">${S.theme==='dark'?'☀️':'🌙'}</button>
    </div>
  </header>`;
}

/* =====================================================================

   ===================================================================== */
async function render(){
  await loadState();
  let html='';
  switch(S.screen){
    case 'hoy':        html = await viewHoy();        break;
    case 'plantilla':  html = await viewPlantilla();  break;
    case 'deberes':    html = await viewDeberes();    break;
    case 'actividad':  html = await viewActividad();  break;
    case 'checklist':  html = await viewChecklist();  break;
    case 'resumen':    html = await viewResumen();    break;
    case 'peso':       html = await viewPeso();       break;
    case 'historico':  html = await viewHistorico();  break;
    case 'ajustes':    html = await viewAjustes();    break;
  }
  $('#app').innerHTML = html;
  if(S.screen==='peso') drawPesoChart();
}

function diaSemanaIdx(d){
  const dow = d.getDay(); // 0=dom..6=sab
  return dow === 0 ? 7 : dow; // lunes=1..domingo=7
}
async function viewHoy(){
  const hoy = new Date();
  const kHoy = hoyKey();
  const diaIdx = diaSemanaIdx(hoy);

  const plantilla = await dbAll('plantilla');
  const hechos = await dbAll('hechos');
  const setHechos = new Set(hechos.map(h=>h.id));
  const deberes = await dbAll('deberes');
  const avisoDias = Number(S.prefs.avisoDias) || 3;

  // Actividades de hoy desde plantilla
  const actsHoy = plantilla.filter(p => Number(p.dia) === diaIdx)
    .sort((a,b) => (a.tramo||'').localeCompare(b.tramo||''));

  const deberesPendientes = deberes.filter(d => d.estado !== 'hecho');
  const deberesUrgentes = deberesPendientes.filter(d => {
    const n = diasHasta(d.fecha_limite); return n !== null && n <= avisoDias;
  }).sort((a,b) => (a.fecha_limite||'').localeCompare(b.fecha_limite||''));

  const deberesPorTipo = {};
  deberesPendientes.forEach(d => {
    if(!deberesPorTipo[d.tipo_id]) deberesPorTipo[d.tipo_id]=[];

  });

  const actsHTML = actsHoy.length ? actsHoy.map(a => {
    const t = tipoDe(a.tipo_id);
    const hechoId = `${a.id}_${kHoy}`;
    const hecho = setHechos.has(hechoId);
    const deberesTipo = (deberesPorTipo[a.tipo_id]||[]).slice(0,2);
    return `<div class="hoy-block ${hecho?'hecho':''}">
      <div class="ti">${t.icono}</div>
      <div class="grow">
        <div class="hoy-title">${esc(t.nombre)}${a.subcategoria ? ' · '+esc(a.subcategoria) : ''}</div>
        <div class="hoy-sub">${tramoLabel(a.tramo)}${a.nota ? ' · '+esc(a.nota) : ''}</div>
        ${deberesTipo.map(d => `<div class="deber-mini" data-action="deber-editar" data-id="${d.id}">
          📌 ${esc(d.titulo)} · ${labelDiasHasta(d.fecha_limite)}</div>`).join('')}
      </div>
      <div class="hoy-check ${hecho?'on':''}" data-action="hoy-marcar" data-plantilla="${a.id}" data-fecha="${kHoy}">
        ${hecho?'✓':''}
      </div>
    </div>`;
  }).join('') : '<div class="empty">Hoy no tienes actividades planificadas. ¡Disfruta del día libre!</div>';

  const deberesHTML = deberesUrgentes.length ? deberesUrgentes.map(d => {
    const t = tipoDe(d.tipo_id);
    const n = diasHasta(d.fecha_limite);
    const cls = n!==null && n<0 ? 'urgente' : 'proximo';
    return `<div class="deber-card ${cls}">
      <div class="deber-head">
        <span class="ico">${t.icono}</span>
        <div class="deber-title">${esc(d.titulo)}</div>
      </div>
      <div class="deber-meta">${t.nombre}${d.subcategoria ? ' · '+esc(d.subcategoria) : ''} · ${labelDiasHasta(d.fecha_limite)}</div>
      <div class="deber-actions">
        <button class="btn btn-sm btn-primary" data-action="deber-hecho" data-id="${d.id}">✓ Hecho</button>
        <button class="btn btn-sm" data-action="deber-editar" data-id="${d.id}">✎</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">Sin deberes urgentes. ¡Bien!</div>';

  return await topbar('Hoy') + `
  <div class="wrap">
    <div style="margin-bottom:14px">
      <div style="font-size:20px;font-weight:750">${DIAS_NOMBRE[diaIdx-1]}, ${hoy.getDate()} de ${hoy.toLocaleDateString('es-ES',{month:'long'})}</div>
      <div class="muted" style="font-size:13px">Tu agenda de hoy</div>
    </div>

    <div class="sec-title">Actividades de hoy</div>
    ${actsHTML}

    <div class="sec-title" style="margin-top:20px">Deberes que vencen pronto</div>
    ${deberesHTML}

    <div class="sec-title" style="margin-top:20px">Accesos rápidos</div>
    <div class="tiles">
      <div class="tile" data-action="go" data-screen="plantilla">
        <div class="ti">🗓️</div><div class="tt">Mi semana</div>
        <div class="ts">Plantilla semanal</div>
      </div>
      <div class="tile" data-action="go" data-screen="deberes">
        <div class="ti">📌</div><div class="tt">Deberes</div>
        <div class="ts">${deberesPendientes.length} pendientes</div>
      </div>
      <div class="tile" data-action="go" data-screen="checklist">
        <div class="ti">🎒</div><div class="tt">Checklist</div>
        <div class="ts">Preparación</div>
      </div>
      <div class="tile" data-action="go" data-screen="resumen">
        <div class="ti">📊</div><div class="tt">Resumen</div>
        <div class="ts">Estadísticas</div>

    </div>

    <div class="row" style="margin-top:14px">
      <button class="btn" data-action="nueva-act">＋ Registrar actividad suelta</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" data-action="go" data-screen="historico">Histórico</button>
      <button class="btn" data-action="go" data-screen="ajustes">Ajustes</button>
    </div>
  </div>`;
}
function tramoLabel(id){
  const t = S.tramos.find(x=>x.id===id);
  return t ? `${t.nombre} (${t.ini}–${t.fin})` : (id||'');

/* Marcar celda como hecha hoy → registra actividad en histórico */
async function marcarPlantillaHecha(plantillaId, fecha){
  const id = `${plantillaId}_${fecha}`;
  const existente = await dbGet('hechos', id);
  if(existente){
    await dbDel('hechos', id);
    // Borrar actividad asociada
    if(existente.actividad_id) await dbDel('actividades', existente.actividad_id);
    toast('Desmarcado');
  } else {
    const p = await dbGet('plantilla', Number(plantillaId));
    if(!p){ toast('No existe'); return; }
    const tramo = S.tramos.find(t=>t.id===p.tramo);
    const actId = await new Promise((res,rej)=>{
      const r = db.transaction('actividades','readwrite').objectStore('actividades').add({
        tipo_id:p.tipo_id, fecha, subcategoria:p.subcategoria||'',
        duracion_min:null, notas:`[Plantilla] ${tramo?tramo.nombre:''} ${p.nota||''}`.trim(),
        origen:'plantilla'
      });
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
    await dbPut('hechos', {id, plantilla_id:Number(plantillaId), fecha, actividad_id:actId});
    toast('¡Hecho! Registrado en histórico');
  }
  render();
}

/* =====================================================================
   3. DEBERES
   ===================================================================== */
async function viewDeberes(){
  const todos = await dbAll('deberes');
  const filtro = S.deberFiltro;
  const avisoDias = Number(S.prefs.avisoDias) || 3;

  let lista = todos.slice();
  if(filtro==='pendientes') lista = lista.filter(d=>d.estado==='pendiente'||d.estado==='en_curso');
  else if(filtro==='hechos') lista = lista.filter(d=>d.estado==='hecho');
  else if(filtro==='vencidos') lista = lista.filter(d=>d.estado!=='hecho' && d.fecha_limite && diasHasta(d.fecha_limite)<0);

  // Ordenación: urgentes primero
  lista.sort((a,b)=>{
    if(a.estado==='hecho' && b.estado!=='hecho') return 1;
    if(b.estado==='hecho' && a.estado!=='hecho') return -1;
    const da = a.fecha_limite ? diasHasta(a.fecha_limite) : 9999;
    const db2 = b.fecha_limite ? diasHasta(b.fecha_limite) : 9999;
    return da - db2;
  });

  // Agrupar
  const grupos = {vencen_hoy:[], vencidos:[], esta_semana:[], mas_adelante:[], sin_fecha:[], hechos:[]};
  for(const d of lista){
    if(d.estado==='hecho'){ grupos.hechos.push(d); continue; }
    if(!d.fecha_limite){ grupos.sin_fecha.push(d); continue; }
    const n = diasHasta(d.fecha_limite);
    if(n < 0) grupos.vencidos.push(d);
    else if(n === 0) grupos.vencen_hoy.push(d);
    else if(n <= avisoDias) grupos.esta_semana.push(d);
    else grupos.mas_adelante.push(d);
  }

  const renderDeber = d => {
    const t = tipoDe(d.tipo_id);
    const n = diasHasta(d.fecha_limite);
    let cls = '';
    if(d.estado!=='hecho' && n!==null){
      if(n<0) cls='vencido'; else if(n<=1) cls='urgente'; else if(n<=avisoDias) cls='proximo';
    }
    const prioCls = d.prioridad==='alta'?'prio-alta':d.prioridad==='baja'?'prio-baja':'prio-media';
    const hechos = d.estado==='hecho';
    return `<div class="deber-card ${cls} ${hechos?'hecho':''}">
      <div class="deber-head">
        <span class="ico">${t.icono}</span>
        <div class="deber-title">${esc(d.titulo)}</div>
      </div>
      <div class="deber-meta">
        ${esc(t.nombre)}${d.subcategoria ? ' · '+esc(d.subcategoria) : ''}
        · <span class="${prioCls}">${(d.prioridad||'media').toUpperCase()}</span>
        · ${labelDiasHasta(d.fecha_limite)}
        ${hechos && d.hecho_en ? ' · Hecho el '+fmtFechaCorta(d.hecho_en) : ''}
      </div>
      ${d.descripcion ? `<div class="deber-desc">${esc(d.descripcion)}</div>` : ''}
      ${hechos && d.nota_resultado ? `<div class="deber-desc">📝 ${esc(d.nota_resultado)}</div>` : ''}
      <div class="deber-actions">
        ${!hechos ? `<button class="btn btn-sm btn-primary" data-action="deber-hecho" data-id="${d.id}">✓ Hecho</button>` : ''}
        ${!hechos && d.fecha_limite && n!==null && n<0 ? `<button class="btn btn-sm btn-warn" data-action="deber-reprogramar" data-id="${d.id}">+7 días</button>` : ''}
        ${!hechos ? `<button class="btn btn-sm" data-action="deber-en-curso" data-id="${d.id}">${d.estado==='en_curso'?'◐ En curso':'◯ En curso'}</button>` : ''}
        <button class="btn btn-sm" data-action="deber-editar" data-id="${d.id}">✎</button>
        <button class="btn btn-sm btn-danger" data-action="deber-borrar" data-id="${d.id}">🗑</button>
      </div>
    </div>`;
  };

  const seccion = (titulo, arr) => arr.length ? `
    <div class="sec-title">${titulo} (${arr.length})</div>
    ${arr.map(renderDeber).join('')}
  ` : '';

  return await topbar('Deberes') + `
  <div class="wrap">
    <button class="btn btn-primary btn-block btn-big" data-action="deber-nuevo" style="margin-bottom:12px">＋ Nuevo deber</button>

    <div class="chips" style="margin-bottom:14px">
      <button class="chip ${filtro==='pendientes'?'sel':''}" data-action="deber-filtro" data-id="pendientes">Pendientes</button>
      <button class="chip ${filtro==='vencidos'?'sel':''}" data-action="deber-filtro" data-id="vencidos">Vencidos</button>
      <button class="chip ${filtro==='hechos'?'sel':''}" data-action="deber-filtro" data-id="hechos">Hechos</button>
      <button class="chip ${filtro==='todos'?'sel':''}" data-action="deber-filtro" data-id="todos">Todos</button>
    </div>

    ${seccion('Vencen hoy', grupos.vencen_hoy)}
    ${seccion('Vencidos', grupos.vencidos)}
    ${seccion('Próximos días', grupos.esta_semana)}
    ${seccion('Más adelante', grupos.mas_adelante)}
    ${seccion('Sin fecha límite', grupos.sin_fecha)}
    ${seccion('Hechos', grupos.hechos)}

    ${lista.length===0 ? '<div class="empty">Sin deberes que mostrar.</div>' : ''}
  </div>`;
}

  S.deberForm = d ? {...d} : {

const RANGOS=[['semana','Semana'],['2semanas','2 sem'],['mes','Mes'],['trimestre','Trim'],['año','Año'],['personalizado','Personalizar']];
const DIAS_RANGO={semana:7,'2semanas':14,mes:30,trimestre:91,'año':365};
function rangoActual(){
  const hoy=new Date();
  if(S.resumenRango==='personalizado'){
    const d = S.resumenDesde?parseKey(S.resumenDesde):addDays(hoy,-29);
    const h = S.resumenHasta?parseKey(S.resumenHasta):hoy;
    return {desde:d, hasta:h};
  }
  const n=DIAS_RANGO[S.resumenRango]||7;
  return {desde:addDays(hoy,-(n-1)), hasta:hoy};
}
function totalesPorTipo(acts,tiposVis){
  const r={}; tiposVis.forEach(t=>r[t.id]={n:0,km:0,desn:0,min:0});
  for(const a of acts){
    const x=r[a.tipo_id]; if(!x) continue;
    x.n++; x.km+=num(a.distancia_km)+num(a.distancia_m)/1000;
    x.desn+=num(a.desnivel_m); x.min+=num(a.duracion_min);
  }
  return r;
}
async function viewResumen(){
  const tiposVis = S.tipos.filter(t=>t.visible);
  const acts = await dbAll('actividades');
  const {desde,hasta} = rangoActual();
  const kD=dateKey(desde), kH=dateKey(hasta);
  const enRango = acts.filter(a=>a.fecha>=kD && a.fecha<=kH);
  const tot = totalesPorTipo(enRango, tiposVis);

  const tarjetas = tiposVis.map(t=>{
    const a = tot[t.id];
    let html = `<div class="card res-card"><div class="res-head">${t.icono} ${esc(t.nombre)}</div>
      <div class="res-metrics">
        <div class="m-box"><span class="m-lbl">Sesiones</span><span class="m-val">${a.n}</span></div>`;
    if(a.min>0) html += `<div class="m-box"><span class="m-lbl">Tiempo</span><span class="m-val">${a.min} min</span></div>`;
    if(['senderismo','running','natacion','paseo'].includes(t.id) && a.km>0)
      html += `<div class="m-box"><span class="m-lbl">Distancia</span><span class="m-val">${fmtNum(a.km,1)} km</span></div>`;
    if(t.id==='senderismo' && a.desn>0)
      html += `<div class="m-box"><span class="m-lbl">Desnivel</span><span class="m-val">${fmtNum(a.desn,0)} m</span></div>`;
    html += `</div></div>`;
    return html;
  }).join('');

  return await topbar('Resumen') + `
  <div class="wrap">
    <div class="chips" style="margin-bottom:12px">
      ${RANGOS.map(([k,l])=>`<button class="chip ${S.resumenRango===k?'sel':''}" data-action="resumen-rango" data-id="${k}">${l}</button>`).join('')}
    </div>
    ${S.resumenRango==='personalizado'?`<div class="card"><div class="row">
      <div class="field" style="margin:0"><label class="lbl">Desde</label>
        <input class="input" type="date" data-resumen="desde" value="${esc(S.resumenDesde)}"></div>
      <div class="field" style="margin:0"><label class="lbl">Hasta</label>
        <input class="input" type="date" data-resumen="hasta" value="${esc(S.resumenHasta)}"></div>
    </div></div>`:''}
    <div class="muted center" style="font-size:12px;margin-bottom:10px">Del ${fmtFecha(kD)} al ${fmtFecha(kH)}</div>
    ${tarjetas||'<div class="empty">Sin tipos visibles.</div>'}
  </div>`;
}

function drawPesoChart(){
  const cv=document.getElementById('pesoCanvas'); if(!cv) return;
  const datos=S.pesoCache; if(datos.length<2) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth||300, h=160;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const kgs=datos.map(d=>d.kg);
  const min=Math.min(...kgs)-0.5, max=Math.max(...kgs)+0.5;
  const padX=35, padY=20;
  const X=i=>padX+(w-padX*2)*(i/(datos.length-1));
  const Y=kg=>h-padY-(h-padY*2)*((kg-min)/((max-min)||1));
  ctx.strokeStyle=S.theme==='dark'?'#1e2c46':'#cbd5e1'; ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=padY+(h-padY*2)*(i/3);ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(w-padX,y);ctx.stroke();}
  ctx.fillStyle=S.theme==='dark'?'#93a3bd':'#475569'; ctx.font='10px system-ui';
  ctx.textAlign='right'; ctx.fillText(fmtNum(max,1),padX-6,padY+3); ctx.fillText(fmtNum(min,1),padX-6,h-padY+3);
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.5; ctx.beginPath();
  datos.forEach((d,i)=>{const x=X(i),y=Y(d.kg);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke();
  ctx.fillStyle='#0284c7'; datos.forEach((d,i)=>{ctx.beginPath();ctx.arc(X(i),Y(d.kg),3.5,0,Math.PI*2);ctx.fill();});
}

            <option value="lunes" ${ini==='lunes'?'selected':''}>Lunes</option>
            <option value="domingo" ${ini==='domingo'?'selected':''}>Domingo</option>
          </select>
        </div>
        <div class="field">
          <label class="lbl">Días de antelación de aviso de deberes</label>
          <input class="input" type="number" min="0" max="30" data-pref="avisoDias" value="${esc(S.prefs.avisoDias||3)}">
          <div class="muted" style="font-size:11.5px;margin-top:4px">Los deberes que venzan en ≤ estos días aparecerán como "próximos" y en el badge de la topbar.</div>
        </div>
      </div>
    </details>
    <details class="sec-fold">
      <summary>Ideas de mejora</summary>
      <div class="fold-body">
        <div class="field">
          <label class="lbl">Nueva idea</label>
          <textarea class="input" id="inputIdea" placeholder="Escribe aquí"></textarea>
        </div>
        <button class="btn btn-primary btn-block btn-sm" data-action="idea-guardar">Guardar</button>
        <div style="margin-top:14px">
          ${ideas.map(i=>`
            <div class="card" style="padding:10px;margin-bottom:8px;background:var(--bg-card-alt)">
              <div style="white-space:pre-wrap;font-size:13.5px">${esc(i.texto)}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
                <span style="font-size:11px;color:var(--text-muted)">${fmtFecha(i.fecha)}</span>
                <div style="display:flex;gap:6px">
                  <button class="btn btn-sm" data-action="idea-toggle" data-id="${i.id}">${i.implementado?'✓ Listo':'Marcar listo'}</button>
                  <button class="mini" data-action="idea-borrar" data-id="${i.id}">✕</button>
                </div>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </details>
    <details class="sec-fold">
      <summary>Datos</summary>
      <div class="fold-body">
        <button class="btn btn-block" data-action="exportar">⬇ Exportar JSON</button>
        <button class="btn btn-block" style="margin-top:8px" data-action="importar">⬆ Importar JSON</button>
        <input type="file" id="fileImport" accept="application/json,.json" hidden>
        <button class="btn btn-danger btn-block" style="margin-top:12px" data-action="borrar-todo">Borrar todo</button>
      </div>
    </details>
    <div style="text-align:center;margin-top:24px;font-size:12px;color:var(--text-muted)">
      Ocio y Deporte · <b>v3.0.0</b>
    </div>
  </div>`;
}
async function exportarJSON(){
  const datos={};
  for(const s of ['tipos','subcategorias','actividades','plantilla','hechos','deberes','tramos','checklist','checkEstado','peso','prefs','ideas'])
    datos[s] = await dbAll(s);
  datos.exportado = new Date().toISOString();
  datos.version = "3.0.0";
  const blob = new Blob([JSON.stringify(datos,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='ocio-deporte-'+hoyKey()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('Exportado');
}
async function importarJSON(file){
  try{
    const txt = await file.text(); const d = JSON.parse(txt);
    for(const s of ['tipos','subcategorias','actividades','plantilla','hechos','deberes','tramos','checklist','checkEstado','peso','prefs','ideas']){
      if(!Array.isArray(d[s])) continue;
      await dbClear(s); for(const it of d[s]) await dbPut(s, it);
    }
    await dbPut('prefs',{k:'seeded',v:1});
    toast('Importado'); render();
  }catch(err){ alert('Error: '+err.message); }
}
async function borrarTodo(){
  if(!confirm('¿Eliminar TODOS los datos?')) return;
  for(const s of ['tipos','subcategorias','actividades','plantilla','hechos','deberes','tramos','checklist','checkEstado','peso','prefs','ideas'])
    await dbClear(s);
  await seed(); toast('Borrado'); go('hoy');
}

/* =====================================================================
   MODAL
   ===================================================================== */
function showModal(html){ $('#modal-root').innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`; }
function cerrarModal(){ $('#modal-root').innerHTML=''; S.plantillaForm=null; S.deberForm=null; }

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.field && S.form){ S.form[t.dataset.field]=t.value; return; }
  if(t.dataset.peso && S.pesoForm){ S.pesoForm[t.dataset.peso]=t.value; return; }
  if(t.dataset.plantilla && S.plantillaForm){ S.plantillaForm[t.dataset.plantilla]=t.value; return; }
  if(t.dataset.deber && S.deberForm){ S.deberForm[t.dataset.deber]=t.value; return; }
  if(t.dataset.resumen){ S['resumen'+t.dataset.resumen.charAt(0).toUpperCase()+t.dataset.resumen.slice(1)] = t.value; }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.pref){ setPref(t.dataset.pref, t.value).then(render); return; }
  if(t.dataset.tipoVisible){
    const tipo = S.tipos.find(x=>x.id===t.dataset.tipoVisible);
    if(tipo){ tipo.visible = t.checked?1:0; dbPut('tipos',tipo).then(render); }
    return;
  }
  if(t.dataset.filtro && t.dataset.rerender){ S.hist[t.dataset.filtro]=t.value; render(); return; }
  if(t.dataset.plantilla && t.dataset.rerender==='modal-plantilla'){ abrirPlantillaModal(S.plantillaForm); return; }
  if(t.dataset.deber && t.dataset.rerender==='modal-deber'){ abrirDeberModal(S.deberForm); return; }
  if(t.id==='fileImport' && t.files && t.files[0]){ importarJSON(t.files[0]); }
});
document.addEventListener('click', async e=>{
  if(e.target.classList && e.target.classList.contains('overlay')){ cerrarModal(); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case 'toggle-theme': toggleTheme(); break;
    case 'go': go(el.dataset.screen); break;
    case 'modal-close': cerrarModal(); break;

    /* HOY */
    case 'hoy-marcar': await marcarPlantillaHecha(el.dataset.plantilla, el.dataset.fecha); break;

    /* PLANTILLA */
    case 'plantilla-nueva': S.plantillaForm={
        id:null, dia:Number(el.dataset.dia), tramo:el.dataset.tramo,
        tipo_id:(S.tipos.find(t=>t.visible)||{id:'gimnasio'}).id,
        subcategoria:'', nota:''
      };
      abrirPlantillaModal(S.plantillaForm); break;
    case 'plantilla-editar': {
      const p = await dbGet('plantilla', Number(el.dataset.id));
      if(p) abrirPlantillaModal(p);
      break;
    }
    case 'plantilla-guardar': await guardarPlantilla(); break;
    case 'plantilla-borrar':
      if(confirm('¿Borrar actividad recurrente?')){
        await dbDel('plantilla', S.plantillaForm.id);
        cerrarModal(); toast('Borrado'); render();
      }
      break;
    case 'plantilla-marcar':
      e.stopPropagation();
      await marcarPlantillaHecha(el.dataset.plantilla, el.dataset.fecha);
      break;
    case 'plantilla-hoy-marcar-todo': {
      const hoy = new Date(); const kHoy = hoyKey();
      const diaIdx = diaSemanaIdx(hoy);
      const plan = (await dbAll('plantilla')).filter(p=>Number(p.dia)===diaIdx);
      for(const p of plan) await marcarPlantillaHecha(p.id, kHoy);
      toast(plan.length+' marcadas');
      break;
    }

    /* DEBERES */
    case 'deber-nuevo': abrirDeberModal(null); break;
    case 'deber-editar': {
      const d = await dbGet('deberes', Number(el.dataset.id));
      if(d) abrirDeberModal(d);
      break;
    }
    case 'deber-guardar': await guardarDeber(); break;
    case 'deber-filtro': S.deberFiltro = el.dataset.id; render(); break;
    case 'deber-hecho': {
      const d = await dbGet('deberes', Number(el.dataset.id));
      if(d){
        const nota = prompt('Nota de resultado (opcional):', d.nota_resultado||'');
        d.estado='hecho'; d.hecho_en=hoyKey();
        if(nota!==null) d.nota_resultado=nota;
        await dbPut('deberes', d);
        toast('¡Hecho!');
        render();
      }
      break;
    }
    case 'deber-en-curso': {
      const d = await dbGet('deberes', Number(el.dataset.id));
      if(d){ d.estado = d.estado==='en_curso'?'pendiente':'en_curso'; await dbPut('deberes', d); render(); }
      break;
    }
    case 'deber-reprogramar': {
      const d = await dbGet('deberes', Number(el.dataset.id));
      if(d && d.fecha_limite){
        d.fecha_limite = dateKey(addDays(parseKey(d.fecha_limite),7));
        await dbPut('deberes', d); toast('+7 días'); render();
      }
      break;
    }
    case 'deber-borrar':
      if(confirm('¿Borrar deber?')){ await dbDel('deberes', Number(el.dataset.id)); render(); }
      break;

    /* ACTIVIDAD SUELTA */
    case 'nueva-act': S.form=nuevoForm(); go('actividad'); break;
    case 'ver-act': {
      const act = await dbGet('actividades', Number(el.dataset.id));
      if(!act) return;
      const f = nuevoForm();
      Object.keys(f).forEach(k=>{ if(act[k]!==undefined && act[k]!==null) f[k]=act[k]; });
      f.id=act.id; f.fecha=act.fecha; S.form=f; go('actividad');
      break;
    }
    case 'form-tipo': S.form.tipo_id = el.dataset.id; S.form.subcategoria=''; render(); break;
    case 'form-fecha': S.form.fecha = dateKey(addDays(new Date(), Number(el.dataset.dia))); render(); break;
    case 'guardar-act': await guardarActividad(); break;
    case 'borrar-act':
      if(confirm('¿Borrar actividad?')){
        await dbDel('actividades', S.form.id);
        S.form=null; toast('Borrada'); go('hoy');
      }
      break;

    /* CHECKLIST */
    case 'chk-tipo': S.chkTipo = el.dataset.id; render(); break;
    case 'chk-toggle': {
      const id = Number(el.dataset.id);
      const cur = await dbGet('checkEstado', id);
      await dbPut('checkEstado', {id, marcado: !(cur && cur.marcado)});
      render(); break;
    }
    case 'chk-mover': {
      const it = await dbGet('checklist', Number(el.dataset.id));
      it.seccion = it.seccion==='imprescindible'?'opcional':'imprescindible';
      await dbPut('checklist', it); render(); break;
    }
    case 'chk-renombrar': {
      const it = await dbGet('checklist', Number(el.dataset.id));
      const n = prompt('Editar texto:', it.texto);
      if(n && n.trim()){ it.texto=n.trim(); await dbPut('checklist', it); render(); }
      break;
    }
    case 'chk-borrar':
      if(confirm('¿Borrar ítem?')){
        await dbDel('checklist', Number(el.dataset.id));
        await dbDel('checkEstado', Number(el.dataset.id));
        render();
      }
      break;
    case 'chk-add': {
      const texto = prompt('Nuevo ítem:');
      if(texto && texto.trim()){
        const todos = await dbAll('checklist');
        const orden = todos.length ? Math.max(...todos.map(x=>x.orden||0))+1 : 0;
        await dbPut('checklist', {tipo_id:S.chkTipo, seccion:el.dataset.seccion, texto:texto.trim(), orden});
        render();
      }
      break;
    }
    case 'chk-reset': {
      const items = (await dbAll('checklist')).filter(i=>i.tipo_id===S.chkTipo);
      for(const it of items) await dbPut('checkEstado', {id:it.id, marcado:false});
      toast('Reiniciada'); render(); break;
    }

    /* RESUMEN */
    case 'resumen-rango': S.resumenRango = el.dataset.id; render(); break;

    /* PESO */
    case 'peso-guardar': {
      const kg = num(S.pesoForm.kg);
      if(!kg){ toast('Falta el peso'); return; }
      await dbPut('peso', {fecha:S.pesoForm.fecha||hoyKey(), kg});
      S.pesoForm={fecha:hoyKey(), kg:''}; toast('Guardado'); render(); break;
    }
    case 'peso-editar': {
      const p = await dbGet('peso', Number(el.dataset.id));
      if(p){ S.pesoForm={fecha:p.fecha, kg:p.kg}; render(); window.scrollTo(0,0); }
      break;
    }
    case 'peso-borrar':
      if(confirm('¿Borrar?')){ await dbDel('peso', Number(el.dataset.id)); render(); }
      break;

    /* SUBCATEGORÍAS */
    case 'subcat-add': {
      const nom = prompt('Nombre:');
      if(nom && nom.trim()){
        await dbPut('subcategorias', {tipo_id:el.dataset.tipo, nombre:nom.trim()});
        toast('Añadida'); render();
      }
      break;
    }
    case 'subcat-borrar': {
      await dbDel('subcategorias', Number(el.dataset.id));
      render(); break;
    }

    /* TRAMOS */
    case 'tramo-add': {
      const nombre = prompt('Nombre del tramo (ej: "Siesta"):');
      if(!nombre) break;
      const ini = prompt('Hora inicio (HH:MM):', '14:00');
      const fin = prompt('Hora fin (HH:MM):', '16:00');
      if(!ini || !fin) break;
      const tramos = await dbAll('tramos');
      const orden = tramos.length ? Math.max(...tramos.map(t=>t.orden||0))+1 : 1;
      await dbPut('tramos', {id:'tramo_'+Date.now(), nombre:nombre.trim(), ini, fin, orden});
      toast('Añadido'); render(); break;
    }
    case 'tramo-editar': {
      const tr = await dbGet('tramos', el.dataset.id);
      if(!tr) break;
      const nombre = prompt('Nombre:', tr.nombre);
      if(nombre===null) break;
      const ini = prompt('Hora inicio:', tr.ini);
      if(ini===null) break;
      const fin = prompt('Hora fin:', tr.fin);
      if(fin===null) break;
      tr.nombre=nombre.trim(); tr.ini=ini; tr.fin=fin;
      await dbPut('tramos', tr); render(); break;
    }

    /* IDEAS */
    case 'idea-guardar': {
      const txt = $('#inputIdea').value;
      if(txt && txt.trim()){
        await dbPut('ideas', {texto:txt.trim(), fecha:hoyKey(), implementado:false});
        toast('Guardada'); render();
      } else toast('Escribe algo');
      break;
    }
    case 'idea-toggle': {
      const i = await dbGet('ideas', Number(el.dataset.id));
      if(i){ i.implementado = !i.implementado; await dbPut('ideas', i); render(); }
      break;
    }
    case 'idea-borrar': await dbDel('ideas', Number(el.dataset.id)); render(); break;

    /* DATOS */
    case 'exportar': await exportarJSON(); break;
    case 'importar': document.getElementById('fileImport').click(); break;
    case 'borrar-todo': await borrarTodo(); break;
  }
});

/* ARRANQUE */
(async function init(){
  await openDB();
  await seed();
  await render();
})();
</script>
</body>
</html>
