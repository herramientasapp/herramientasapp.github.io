<style>

<script>
// ---- constantes y utilidades
const APP='Quién paga',VER='7.0.0',APP_VER=VER,FN='QuienPaga',APPS=['Quién paga','¿Quién paga?'];
const CATS=[['desa','🥐','Desayuno'],['cena','🍽️','Comida/Cena'],['copas','🍸','Copas'],['helado','🍦','Helados/cafés'],['cult','🎟️','Entradas/cultura'],['comp','🛍️','Compras'],['parking','🅿️','Parking'],['gasolina','⛽','Gasolina'],['viaje','🧳','Viajes'],['otro','✨','Otros']];
const PL={u:'Nosotros',t:'Ellos',h:'A medias',p:'Privado'};
const NOS={id:'nos',name:'Nosotros'};
const DEF_TITLE='Quién paga',OLD_TITLE='Això ho pague jo';
const cn=k=>{const c=CATS.find(x=>x[0]===k)||CATS[CATS.length-1];return c[1]+' '+c[2]};
const ci=k=>(CATS.find(x=>x[0]===k)||CATS[CATS.length-1])[1];
const $=s=>document.querySelector(s);
const uid=()=>[...crypto.getRandomValues(new Uint8Array(9))].map(b=>(b%36).toString(36)).join('');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Math.round(n*100)/100).toLocaleString('es-ES')+' €';
const fd=d=>{const x=new Date(d+'T12:00');return isNaN(x)?'—':x.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})};
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date());
const okD=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);
const fr=id=>id==='nos'?NOS:S.friends.find(f=>f.id===id);
const AF=()=>S.friends.filter(f=>!f.arch);
const hasData=()=>!!S&&!!(S.outings.length||S.friends.length||S.peace.length||S.ideas.length);
let TT=0;
function toast(m,ms=2200){const t=$('#t');clearTimeout(TT);if(!m){t.style.display='none';return}t.textContent=m;t.style.display='block';TT=setTimeout(()=>t.style.display='none',ms)}
function toastU(m,prev){UNDO=prev;const t=$('#t');clearTimeout(TT);t.innerHTML=esc(m)+'<button class="ub" onclick="undo()">Deshacer</button>';t.style.display='block';TT=setTimeout(()=>{t.style.display='none';UNDO=null},7000)}
function undo(){if(!UNDO||!S)return;S=norm(JSON.parse(UNDO));UNDO=null;save(1);render();toast('Deshecho')}
function show(h){let d=$('#sh');if(!d){d=document.createElement('div');d.id='sh';d.onclick=e=>{if(e.target===d)closeSh()};document.body.appendChild(d)}d.innerHTML=`<div class="card shc">${h}</div>`;d.hidden=false}
function closeSh(){const d=$('#sh');if(d){d.hidden=true;d.innerHTML=''}}
const OPN=new Set();
const dt=(id,t,h)=>`<details class="dt" ${OPN.has(id)?'open':''} ontoggle="this.open?OPN.add('${id}'):OPN.delete('${id}')"><summary>${t}</summary><div class="dc">${h}</div></details>`;
const mb=n=>n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(2).replace('.',',')+' MB';
// importes: admite sumas y operaciones sencillas (45+12,5), sin eval
function calc(s){s=String(s==null?'':s).replace(/\s/g,'').replace(/,/g,'.');if(!s||!/^[\d.+\-*/()]+$/.test(s))return null;let i=0;
const P=()=>{let v=T();while(s[i]==='+'||s[i]==='-'){const o=s[i++],w=T();v=o==='+'?v+w:v-w}return v};
const T=()=>{let v=F();while(s[i]==='*'||s[i]==='/'){const o=s[i++],w=F();v=o==='*'?v*w:v/w}return v};
const F=()=>{if(s[i]==='('){i++;const v=P();if(s[i++]!==')')throw 0;return v}if(s[i]==='-'){i++;return -F()}const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
try{const v=P();if(i!==s.length||!isFinite(v))return null;return Math.round(v*100)/100}catch(e){return null}}

// ---- estado (solo en memoria; en disco va en IndexedDB qp_db)
let S=null,REV=0,V={n:'home'},D=null,arm=null,peaceOpen=false,Q='',repMode='f',E={sc:'all',per:'0',from:'',to:''},UNDO=null,MIGD=null,EMERG=false,POST=0,BADMAIN=null,AUTOFAIL=0,SNL=null;
function legacyGet(){try{const s=JSON.parse(localStorage.getItem('qp'));return s&&typeof s==='object'&&Array.isArray(s.friends)?s:null}catch(e){return null}}
// normaliza y repara sin descartar datos
function norm(s,legacy){s=s&&typeof s==='object'?s:{};const A=x=>Array.isArray(x)?x:[],ob=x=>x&&typeof x==='object';
const o={...s};
o.friends=A(s.friends).filter(ob).map(f=>({...f,id:typeof f.id==='string'&&f.id?f.id:uid(),name:String(f.name==null?'':f.name)}));
o.outings=A(s.outings).filter(ob).map(x=>({...x,id:typeof x.id==='string'&&x.id?x.id:uid(),f:String(x.f==null?'nos':x.f),date:okD(x.date)?x.date:fmt(new Date(+x.c||Date.now())),c:+x.c||0,car:['n','u','t'].includes(x.car)?x.car:'n',note:String(x.note==null?'':x.note),exps:A(x.exps).filter(ob).map(e=>({...e,k:String(e.k||'otro'),p:['u','t','h','p'].includes(e.p)?e.p:'h',a:isFinite(+e.a)?+e.a:0,n:String(e.n==null?'':e.n)}))}));
o.peace=A(s.peace).filter(ob).map(p=>({...p,id:typeof p.id==='string'&&p.id?p.id:uid(),f:String(p.f==null?'':p.f),date:okD(p.date)?p.date:fmt(new Date(+p.c||Date.now())),c:+p.c||0,note:String(p.note==null?'':p.note)}));
o.ideas=A(s.ideas).filter(ob).map(i=>({...i,id:typeof i.id==='string'&&i.id?i.id:uid(),t:String(i.t==null?'':i.t),done:!!i.done}));
o.tol=isFinite(+o.tol)&&o.tol!==null&&o.tol!==''&&+o.tol>=0?+o.tol:5;o.bk=+o.bk||0;o.ch=+o.ch||0;o.bkD=Math.max(1,Math.floor(+o.bkD)||30);o.bkN=Math.max(1,Math.floor(+o.bkN)||1);
if(o.autoUp===undefined)o.autoUp=true;if(o.names===undefined)o.names=true;
if(!o.title||(legacy&&o.title===OLD_TITLE))o.title=DEF_TITLE;
return o}
const valid=s=>!!s&&typeof s==='object'&&['friends','outings','peace','ideas'].every(k=>Array.isArray(s[k]))&&s.friends.every(f=>f&&typeof f.id==='string')&&s.outings.every(o=>o&&typeof o.id==='string'&&okD(o.date)&&Array.isArray(o.exps)&&o.exps.every(e=>e&&typeof e.a==='number'&&isFinite(e.a)))&&s.peace.every(p=>p&&typeof p.id==='string');

// ---- lógica
const eff=o=>o.exps.reduce((s,e)=>s+(e.p==='u'?e.a/2:e.p==='t'?-e.a/2:0),0);
const mc=(o,e)=>o.f==='nos'||e.p!=='t'?e.a:0;
function evs(f){return[...S.outings.filter(o=>o.f===f).map(o=>({t:'o',d:o.date,c:o.c,o})),...S.peace.filter(p=>p.f===f).map(p=>({t:'p',d:p.date,c:p.c,p}))].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.c-b.c)}
function segs(f){const r=[];let s={outs:[],end:null,st:null};for(const e of evs(f)){if(e.t==='o')s.outs.push(e.o);else if(e.p.m!==false){s.end=e.p;r.push(s);s={outs:[],end:null,st:e.p}}}r.push(s);return r}
const bal=f=>segs(f).pop().outs.reduce((s,o)=>s+eff(o),0);
const msg=b=>b>S.tol?['Les toca','g','➡️']:b<-S.tol?['Nos toca','o','⬅️']:['En paz','n','🤝'];
const sg=n=>{n=Math.round(n*100)/100;return(n>0?'+':n<0?'−':'')+eur(Math.abs(n))};
const CL={u:['Nos toca coche','o','⬅️'],t:['Les toca coche','g','➡️'],any:['Cualquiera','n','🎲']},CP={u:'Nos tocaba coche',t:'Les tocaba coche',any:'Cualquiera'};
function car(f){const cmp=(a,b)=>a.date<b.date?-1:a.date>b.date?1:a.c-b.c;
const zp=S.peace.filter(p=>p.f===f&&p.cz).sort(cmp).pop();
const all=S.outings.filter(o=>o.f===f&&o.car!=='n').sort(cmp),os=zp?all.filter(o=>cmp(o,zp)>0):all;
const lim=new Date(Date.now()-183*864e5).toISOString().slice(0,10),r=os.filter(o=>o.date>=lim),n=(l,k)=>l.filter(o=>o.car===k).length,last=all[all.length-1];
let nx=null;if(os.length){const a=n(r,'u'),b=n(r,'t');nx=a>b?'t':b>a?'u':'any'}else if(all.length)nx='any';
return{last,nx,z:zp,su:n(os,'u'),st:n(os,'t'),tu:n(all,'u'),tt:n(all,'t'),ru:n(r,'u'),rt:n(r,'t')}}
const carCard=k=>`<div class="card cc"><b>🚗 Coche</b>${k.nx?`<div class="mid ${CL[k.nx][1]}">${CL[k.nx][2]} ${CL[k.nx][0]}</div>`:'<div class="mid mu">Sin datos todavía</div>'}<div class="mu">${k.last?`Último: ${PL[k.last.car].toLowerCase()} (${fd(k.last.date)})<br>`:''}${k.z?`Desde ${fd(k.z.date)}: nosotros ${k.su} · ellos ${k.st}<br>`:''}Total${k.z?' histórico':''}: nosotros ${k.tu} · ellos ${k.tt}<br>Últimos 6 meses: nosotros ${k.ru} · ellos ${k.rt}</div></div>`;

// ---- navegación
function go(n,id,pop){if(!S)return;if(UPD&&n!=='form'){flush().finally(()=>location.reload());return}const rp=V.n==='form';V={n,id};arm=null;peaceOpen=false;render();window.scrollTo(0,0);if(!pop){const h={n,id};rp?history.replaceState(h,''):history.pushState(h,'')}}
const openF=id=>id==='nos'?go('nos'):go('friend',id);
function render(){const a=$('#app');if(!S){a.innerHTML='';return}document.title=S.title||DEF_TITLE;if(V.n==='form'&&!D)V={n:'home'};(({home:vHome,am:vAm,friend:vFriend,nos:vNos,rep:vRep,eco:vEco,ideas:vIdeas,set:vSet,form:vForm})[V.n]||vHome)(a)}
function dbtn(k,id){return k==='f'?`<a class="del" onclick="del('f','${id}')">${arm==='f'+id?'¿Seguro? Púlsalo otra vez':'Borrar'}</a>`:`<a class="del" onclick="del('${k}','${id}')">Borrar</a>`}
function del(k,id){if(k==='f'){if(arm!==k+id){arm=k+id;return render()}arm=null;const f=fr(id),n=S.outings.filter(o=>o.f===id).length;if(!f||!confirm(`Se borrará a «${f.name}» y TODO su historial (${n} salidas). Si solo quieres quitarlo de la lista, usa «Archivar». ¿Borrar?`))return render()}
const prev=JSON.stringify(S);
if(k==='o')S.outings=S.outings.filter(o=>o.id!==id);
if(k==='p')S.peace=S.peace.filter(o=>o.id!==id);
if(k==='i')S.ideas=S.ideas.filter(o=>o.id!==id);
if(k==='f'){S.friends=S.friends.filter(o=>o.id!==id);S.outings=S.outings.filter(o=>o.f!==id);S.peace=S.peace.filter(o=>o.f!==id)}
save(1);render();toastU(k==='f'?'Amigo borrado':'Borrado',prev)}
function addF(){const i=$('#nf'),v=i.value.trim();if(!v)return toast('Escribe un nombre');S.friends.push({id:uid(),name:v});save(1);render()}
function ren(id){const f=fr(id),v=prompt('Nombre',f.name);if(v&&v.trim()){f.name=v.trim();save(1);render()}}
function arcF(id,v){const f=fr(id);if(!f)return;f.arch=!!v;if(!v)delete f.arch;save(1);render();toast(v?'Archivado: ya no sale en la lista (su historial se conserva)':'Recuperado')}
const selP=(oc,val)=>`<select onchange="${oc}">${[NOS,...S.friends].map(f=>`<option value="${f.id}" ${f.id===val?'selected':''}>${f.id==='nos'?'💑 ':''}${esc(f.name)}${f.arch?' (archivado)':''}</option>`).join('')}</select>`;
// ---- búsqueda
const nz=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function srch(){const q=nz(Q.trim());if(!q)return'';
const fs=[NOS,...S.friends].filter(f=>nz(f.name).includes(q)),r=[];
S.outings.forEach(o=>{const f=fr(o.f);if(!f)return;[o.note,...o.exps.map(e=>e.n)].filter(t=>t&&nz(t).includes(q)).forEach(t=>r.push({f,d:o.date,t}))});
S.peace.forEach(p=>{const f=fr(p.f);if(f&&p.note&&nz(p.note).includes(q))r.push({f,d:p.date,t:p.note})});
r.sort((a,b)=>a.d<b.d?1:-1);
if(!fs.length&&!r.length)return'<p class="mu c">Sin resultados.</p>';
return(fs.length?'<div class="mu">👤 Personas</div>'+fs.map(f=>`<div class="ev hit" onclick="openF('${f.id}')"><b>${esc(f.name)}</b>${f.arch?' <span class="mu">(archivado)</span>':''}</div>`).join(''):'')+(r.length?'<div class="mu">💬 Comentarios</div>'+r.slice(0,30).map(x=>`<div class="ev hit" onclick="openF('${x.f.id}')"><b>${esc(x.f.name)}</b> · ${fd(x.d)}<div class="mu nl">${esc(x.t)}</div></div>`).join(''):'')}
const sBox=()=>`<input type="search" placeholder="🔍 Buscar persona o comentario…" value="${esc(Q)}" oninput="Q=this.value;$('#res').innerHTML=srch()"><div id="res">${srch()}</div>`;
// ---- vistas
function vHome(a){let h=`<h1 class="c">${esc(S.title)}</h1>`;

else h+='<div class="card">Empieza añadiendo con quién salís habitualmente.</div><div class="row"><input id="nf" placeholder="Nuevo amigo o pareja"><button onclick="addF()">Añadir</button></div>';a.innerHTML=h}
function tl(f,n){const nos=f==='nos';return evs(f).reverse().slice(0,n).map(x=>{if(x.t==='p'){const p=x.p,l=[];
if(p.m!==false)l.push(p.mb==null?'💶 Dinero a cero':`💶 Dinero a cero (${Math.abs(p.mb)<.01?'sin diferencia':p.mb>0?'a nuestro favor':'a su favor'}): nosotros ${sg(p.mb)} · ellos ${sg(-p.mb)}`);
if(p.cz)l.push('🚗 Coche a cero'+(p.cb&&p.cb.nx?` (${CP[p.cb.nx]})`:''));
return `<div class="ev peace">🤝 <b>${p.m!==false&&p.cz?'Gastos y coches en paz':p.cz?'Coches en paz':'Gastos en paz'}</b> · ${fd(p.date)}${l.map(t=>`<div class="mu">${t}</div>`).join('')}${p.note?`<div class="mu nl">💬 ${esc(p.note)}</div>`:''}<div class="acts"><a onclick="edPn('${p.id}')">${p.note?'Editar nota':'Añadir nota'}</a>${dbtn('p',p.id)}</div></div>`}
const o=x.o;return `<div class="ev"><b>${fd(o.date)}</b>${o.car!=='n'?' · 🚗 '+PL[o.car].toLowerCase():''}${o.exps.map(e=>`<div>${cn(e.k)} · ${eur(e.a)}${nos?'':' · '+PL[e.p]}${e.n?` <span class="mu nl">— ${esc(e.n)}</span>`:''}</div>`).join('')}${o.note?`<div class="mu nl">💬 ${esc(o.note)}</div>`:''}<div class="acts"><a onclick="editO('${o.id}')">Editar</a>${dbtn('o',o.id)}</div></div>`}).join('')||'<p class="mu c">Aún no hay salidas.</p>'}
function tlS(f,wc){return S.outings.filter(o=>o.f===f).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.c-a.c).map(o=>`<div class="ev"><b>${fd(o.date)}</b>${wc&&o.car!=='n'?' · 🚗 '+PL[o.car].toLowerCase():''}${o.exps.map(e=>`<div>${cn(e.k)}${e.n?` <span class="mu nl">— ${esc(e.n)}</span>`:''}</div>`).join('')}${o.note?`<div class="mu nl">💬 ${esc(o.note)}</div>`:''}</div>`).join('')||'<p class="mu c">Aún no hay salidas.</p>'}
function edPn(id){const p=S.peace.find(x=>x.id===id);if(!p)return;show(`<b>Nota del «en paz» del ${fd(p.date)}</b><textarea id="epn" class="ta" rows="3" oninput="rz(this)">${esc(p.note)}</textarea><div class="bt"><button onclick="svPn('${id}')">Guardar</button><button class="sec" onclick="closeSh()">Cancelar</button></div>`);rz($('#epn'))}
function svPn(id){const p=S&&S.peace.find(x=>x.id===id),e=$('#epn');if(p&&e){p.note=e.value.trim();save(1)}closeSh();render()}
function vNos(a){const mm=today().slice(0,7),L=S.outings.filter(o=>o.f==='nos'),tm=ag(L.filter(o=>o.date.slice(0,7)===mm)).tot,ta=ag(L).tot;
a.innerHTML=`<div class="top"><a onclick="go('home')">← Inicio</a><a onclick="go('rep','nos')">📊 Informe</a></div><h1>💑 Nosotros</h1>
<div class="card"><div class="sp"><span>Este mes</span><b>${eur(tm)}</b></div><div class="sp"><span class="mu">Total acumulado</span><span class="mu">${eur(ta)}</span></div></div>
<button class="fab" onclick="newO('nos')">+ Nueva salida</button><h3>Últimos movimientos</h3>${tl('nos',10)}<p class="c"><a onclick="go('rep','nos')">Ver historial completo</a></p>`}
function vFriend(a){const f=fr(V.id);if(!f)return go('home');const b=bal(f.id),[t,c,ic]=msg(b),k=car(f.id),mon=S.outings.some(o=>o.f===f.id&&o.exps.length)||!S.outings.some(o=>o.f===f.id),w=Math.min(Math.abs(b)/100,1)*50;
a.innerHTML=`<div class="top"><a onclick="go('am')">← Amigos</a><a onclick="go('rep','${f.id}')">📊 Informe</a></div><h1>${esc(f.name)} <a onclick="ren('${f.id}')" style="font-size:16px">✏️</a></h1>
${f.arch?`<div class="note ok" onclick="arcF('${f.id}',0)">📦 Archivado (no sale en la lista). Toca para recuperarlo.</div>`:''}
${mon?`<div class="card"><div class="pill ${c}">${ic} ${t}</div><div class="gauge"><i class="${b>0?'g':'o'}" style="${b>0?'left':'right'}:50%;width:${w}%"></i><u></u></div><div class="lab"><span>← Nos toca</span><span>Les toca →</span></div><p class="c">${c==='n'?`Saldo: nosotros <b>${sg(b)}</b> · ellos <b>${sg(-b)}</b>`:`Diferencia orientativa: <b>${eur(Math.abs(b))}</b>`}</p></div>`:''}
${carCard(k)}
<button class="fab" onclick="newO('${f.id}')">+ Nueva salida</button>
<div class="bt" style="margin:0 0 12px"><button onclick="carQ('${f.id}','u')">🚗 Hoy coche nuestro</button><button onclick="carQ('${f.id}','t')">🚗 Hoy coche suyo</button></div>
<div class="card">${peaceOpen?`<b>${peaceOpen==='m'?'💶 Gastos en paz':'🚗 Coches en paz'}</b><div class="mu">${peaceOpen==='m'?`Saldo actual: nosotros ${sg(b)} · ellos ${sg(-b)}`:`${k.nx?CL[k.nx][2]+' '+CL[k.nx][0]:'Sin datos'}. Los contadores del coche volverán a cero.`}</div><label>Nota (opcional)</label><textarea id="pn" class="ta" rows="2" placeholder="${peaceOpen==='m'?'Ej: compensado con la cena de cumpleaños':'Ej: Pedro hizo muchos km una sola vez'}" oninput="rz(this)"></textarea><div class="row" style="margin:8px 0 0"><button style="flex:1" onclick="peaceOpen=false;render()">Cancelar</button><button style="flex:1" onclick="doPeace()">Confirmar</button></div>`:`<div class="row" style="margin:0"><button style="flex:1" onclick="peaceOpen='m';render()">💶 Gastos en paz</button><button style="flex:1" onclick="peaceOpen='c';render()">🚗 Coches en paz</button></div>`}</div>
<h3>Últimos movimientos</h3>${tl(f.id,8)}<p class="c"><a onclick="go('rep','${f.id}')">Ver historial completo</a></p>`}
function carQ(f,k){const prev=JSON.stringify(S);S.outings.push({id:uid(),f,date:today(),exps:[],car:k,note:'',c:Date.now()});S.lastF=f;save(1);render();toastU(`🚗 Anotado: hoy coche ${k==='u'?'nuestro':'suyo'}`,prev)}
function doPeace(){const m=peaceOpen==='m',k=car(V.id);S.peace.push({id:uid(),f:V.id,date:today(),note:$('#pn').value.trim(),c:Date.now(),m,cz:!m,mb:m?bal(V.id):null,cb:{nx:k.nx}});save(1);peaceOpen=false;render();toast(m?'Gastos en paz':'Coches en paz')}
// formulario
function newO(f){const lf=S.lastF&&(S.lastF==='nos'||(fr(S.lastF)&&!fr(S.lastF).arch))?S.lastF:null;D={id:null,f:f||(V.n==='nos'?'nos':lf||(AF()[0]?AF()[0].id:'nos')),date:today(),exps:[],car:'n',note:''};go('form')}
function editO(id){const o=S.outings.find(o=>o.id===id);if(!o)return;D=JSON.parse(JSON.stringify(o));D.exps.forEach(e=>e.x=e.a?String(e.a).replace('.',','):'');go('form')}
function seg(path,val,opts){return `<div class="seg">${Object.entries(opts).map(([k,l])=>`<button class="${k===val?'on':''}" onclick="${path}='${k}';render()">${l}</button>`).join('')}</div>`}
function addE(k){D.exps.push({k,p:D.f==='nos'?'u':'h',a:0,n:'',x:''});render();setTimeout(()=>{const e=$('#a'+(D.exps.length-1));if(e)e.focus()},50)}
function amIn(i,el){const e=D.exps[i];if(!e)return;e.x=el.value;const v=calc(el.value),h=$('#h'+i);if(h)h.textContent=/[+*/]|.-/.test(el.value.trim())?(v==null?'…':'= '+eur(v)):''}
function amPlus(i){const el=$('#a'+i);if(!el)return;if(el.value&&!/[+\-*/]$/.test(el.value))el.value+='+';amIn(i,el);el.focus()}
function vForm(a){const nos=D.f==='nos',cur=fr(D.f),opts=D.id?[cur].filter(Boolean):[NOS,...AF(),...(cur&&cur.arch?[cur]:[])];
a.innerHTML=`<div class="top"><a onclick="D.id?openF(D.f):history.length>1?history.back():go('home')">← Cancelar</a></div><h1>${D.id?'Editar':'Nueva'} salida</h1>
<div class="card"><label>Con quién</label><select onchange="D.f=this.value;if(D.f==='nos'){D.car='n';D.exps.forEach(e=>{if(e.p==='t'||e.p==='h')e.p='u'})}render()">${opts.map(f=>`<option value="${f.id}" ${f.id===D.f?'selected':''}>${esc(f.name)}</option>`).join('')}</select><label>Fecha</label><input type="date" value="${D.date}" onchange="if(this.value)D.date=this.value;else this.value=D.date"></div>
${D.exps.map((e,i)=>`<div class="card"><div class="sp"><b>${cn(e.k)}</b><a class="del" onclick="D.exps.splice(${i},1);render()">Quitar</a></div>${nos?'':`<label>¿Quién pagó?</label>${seg('D.exps['+i+'].p',e.p,PL)}`}<div class="am"><input id="a${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="Importe${nos?'':' aproximado'} en €" value="${esc(e.x!=null?e.x:(e.a?String(e.a).replace('.',','):''))}" oninput="amIn(${i},this)"><button type="button" onclick="amPlus(${i})" title="Sumar otro importe">＋</button></div><div class="mu" id="h${i}"></div><textarea class="ta" rows="2" placeholder="Comentario (opcional)" oninput="D.exps[${i}].n=this.value;rz(this)">${esc(e.n)}</textarea></div>`).join('')}
<div class="card"><label>Añadir gasto${nos?'':' (en una excursión solo de coche, no añadas ninguno)'}</label><div class="chips">${CATS.map(c=>`<button onclick="addE('${c[0]}')">${c[1]} ${c[2]}</button>`).join('')}</div></div>
<div class="card">${nos?'':`<label>🚗 ¿Quién puso el coche?</label>${seg('D.car',D.car,{n:'Ninguno',u:'Nosotros',t:'Ellos'})}`}<label>Comentario de la salida</label><textarea oninput="D.note=this.value" placeholder="Opcional">${esc(D.note)}</textarea></div>
<button class="fab" onclick="saveO()">Guardar salida</button>`;
D.exps.forEach((e,i)=>{const el=$('#a'+i);if(el)amIn(i,el)});a.querySelectorAll('textarea.ta').forEach(rz)}
function saveO(){if(!D)return;if(!D.exps.length&&D.car==='n')return toast('Añade algún gasto'+(D.f==='nos'?'':' o el coche'));
if(!okD(D.date))return toast('Pon la fecha');
for(const e of D.exps){const raw=String(e.x==null?(e.a||''):e.x).trim(),v=raw===''?0:calc(raw);if(v==null||v<0)return toast('Importe no válido en '+cn(e.k));e.a=v}
if(D.exps.some(e=>!e.a)&&!confirm('Hay algún gasto con importe 0. ¿Guardar igualmente?'))return;
const o=JSON.parse(JSON.stringify(D));o.exps.forEach(e=>delete e.x);if(o.f==='nos')o.car='n';
if(o.id&&S.outings.some(x=>x.id===o.id))S.outings=S.outings.map(x=>x.id===o.id?o:x);else{o.id=uid();o.c=Date.now();S.outings.push(o)}
S.lastF=o.f;save(1);const f=o.f;D=null;openF(f);toast('Salida guardada')}
// informes
function chart(f){let v=0,p=[0],m=[];for(const e of evs(f)){if(e.t==='o'){v+=eff(e.o);p.push(v)}else if(e.p.m!==false){v=0;p.push(0);m.push(p.length-1)}}
if(p.length<2)return '<p class="mu">Sin datos todavía.</p>';
const W=320,H=130,mx=Math.max(10,...p.map(Math.abs)),x=i=>10+i*(W-20)/(p.length-1),y=v=>H/2-v/mx*(H/2-14);
return `<svg data-cap="Sobre la línea: les toca · bajo la línea: nos toca" viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--ln)"/>${m.map(i=>`<line x1="${x(i)}" x2="${x(i)}" y1="12" y2="${H}" stroke="var(--g)" stroke-dasharray="3 3"/><text x="${x(i)}" y="10" font-size="10" text-anchor="middle">🤝</text>`).join('')}<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${p.map((v,i)=>x(i)+','+y(v)).join(' ')}"/></svg><div class="lab"><span>↓ Nos toca</span><span>Les toca ↑</span></div>`}
function bars(mo){const ks=Object.keys(mo).sort().slice(-12);if(ks.length<2)return'';const W=320,H=130,mx=Math.max(1,...ks.map(k=>mo[k].t)),bw=(W-20)/ks.length;
return `<div class="card"><b>Gasto por meses${ks.length<Object.keys(mo).length?' (últimos 12)':''}</b><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${ks.map((k,i)=>{const h=Math.max(1,mo[k].t/mx*(H-30)),x=10+i*bw+bw*.15,y=H-16-h;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--ac)"/><text x="${(x+bw*.35).toFixed(1)}" y="${H-4}" font-size="9" text-anchor="middle" fill="var(--mu)">${esc(new Date(k+'-15T12:00').toLocaleDateString('es-ES',{month:'short'}).replace('.',''))}</text>`}).join('')}</svg></div>`}
function ag(L){const ct={},mo={},rows=[];let tot=0,pv=0;L.forEach(o=>{let c=0,p=0;o.exps.forEach(e=>{const v=mc(o,e);if(!v)return;c+=v;if(e.p==='p')p+=v;ct[e.k]=(ct[e.k]||0)+v;const m=o.date.slice(0,7);(mo[m]=mo[m]||{t:0,c:{}}).t+=v;mo[m].c[e.k]=(mo[m].c[e.k]||0)+v});tot+=c;pv+=p;rows.push({o,c,p})});rows.sort((a,b)=>a.o.date<b.o.date?1:-1);return{ct,mo,tot,pv,rows}}
const cats=ct=>CATS.filter(c=>ct[c[0]]).map(c=>`<div class="sp"><span>${c[1]} ${c[2]}</span><b>${eur(ct[c[0]])}</b></div>`).join('')||'<span class="mu">Sin gastos.</span>';
function aggH(g){return `<div class="card"><div class="sp"><b>Total</b><b class="big" style="margin:0">${eur(g.tot)}</b></div>${g.pv?`<div class="mu">De ello, gastos privados: ${eur(g.pv)}</div>`:''}<p class="mu" style="margin:6px 0 0">Lo que hemos pagado de nuestro bolsillo: todo lo que pagamos nosotros (completo, aunque luego compensen), lo «a medias» y lo privado, y todo en salidas de Nosotros. Lo que pagaron ellos no cuenta.</p></div>
<h3>Por categoría</h3><div class="card">${cats(g.ct)}</div>
<h3>Por meses</h3>${bars(g.mo)}${Object.keys(g.mo).sort().reverse().map(mm=>`<div class="card"><div class="sp"><b>${new Date(mm+'-15T12:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b><b>${eur(g.mo[mm].t)}</b></div><div class="mu">${Object.entries(g.mo[mm].c).map(([k,v])=>ci(k)+' '+eur(v)).join(' · ')}</div></div>`).join('')||'<p class="mu">Sin gastos.</p>'}
<h3>Por salida</h3>${g.rows.map(({o,c,p})=>`<div class="ev"><div class="sp"><b>${fd(o.date)} · ${esc((fr(o.f)||{name:'?'}).name)}</b><b>${eur(c)}</b></div><div class="mu">${o.exps.filter(e=>mc(o,e)).map(e=>ci(e.k)+' '+eur(mc(o,e))+(e.p==='p'?' 🔒':'')).join(' · ')||'Sin gastos'}${p?` · privado ${eur(p)}`:''}</div></div>`).join('')||'<p class="mu">Sin salidas.</p>'}`}
function vRep(a){const f=fr(V.id);if(!f)return go('home');const nos=f.id==='nos',os=S.outings.filter(o=>o.f===f.id);
const hd=`<div class="top"><a onclick="openF('${f.id}')">← ${esc(f.name)}</a><a onclick="doPdf()">📄 PDF</a></div>${selP("go('rep',this.value)",f.id)}<h1>Informe · ${esc(f.name)}</h1>`;
if(nos)return a.innerHTML=hd+aggH(ag(os))+'<h3>Todas las salidas</h3>'+tl('nos',999);
const ss=segs(f.id),ct={},full=repMode==='f';
os.forEach(o=>o.exps.forEach(e=>ct[e.k]=(ct[e.k]||0)+e.a));
const sm=(L,p)=>L.reduce((x,o)=>x+o.exps.filter(e=>e.p===p).reduce((y,e)=>y+e.a,0),0);
a.innerHTML=hd+`${seg('repMode',repMode,{s:'Solo salidas',c:'Salidas + 🚗',f:'Completo'})}
${repMode==='c'?carCard(car(f.id)):''}
${full?`<div class="card"><b>Saldo a lo largo del tiempo</b>${chart(f.id)}</div>
<h3>Tramos entre «en paz»</h3>${ss.map(s=>{const d0=s.st?fd(s.st.date):(s.outs[0]?fd(s.outs[0].date):'—'),b=s.outs.reduce((x,o)=>x+eff(o),0);
return `<div class="card"><b>${d0} → ${s.end?fd(s.end.date)+' 🤝':'hoy (tramo actual)'}</b><div class="mu">${s.outs.length} salidas<br>Pagamos nosotros: ${eur(sm(s.outs,'u'))} · Pagaron ellos: ${eur(sm(s.outs,'t'))} · A medias: ${eur(sm(s.outs,'h'))} · Privado: ${eur(sm(s.outs,'p'))}<br>Saldo del tramo: ${eur(Math.abs(b))} ${Math.abs(b)<.01?'':b>0?'a nuestro favor':'a su favor'}<br>Coche: nosotros ${s.outs.filter(o=>o.car==='u').length} · ellos ${s.outs.filter(o=>o.car==='t').length}${s.end&&s.end.note?`<br>🤝 ${esc(s.end.note)}`:''}</div></div>`}).reverse().join('')}
<h3>Total gastado por categoría</h3><div class="card">${cats(ct)}</div>
<h2 style="margin:18px 0 0">Mis gastos</h2>${aggH(ag(os))}`:''}
<h3>Todas las salidas</h3>${full?tl(f.id,999):tlS(f.id,repMode==='c')}`}
// informe económico
function rng(){if(E.per==='c')return[E.from||'0000-00-00',E.to||'9999-99-99'];if(E.per==='o')return['0000-00-00','9999-99-99'];const n=new Date(),y=n.getFullYear(),m=n.getMonth();if(E.per==='0')return[fmt(new Date(y,m,1)),'9999-99-99'];return[fmt(new Date(y,m-+E.per,1)),fmt(new Date(y,m,0))]}
const PER={0:'Mes actual',1:'1 mes (anterior)',2:'2 meses',3:'3 meses',6:'6 meses',12:'1 año',o:'Desde el origen'};

const dIn=(k,v)=>`<input type="date" value="${v}" onchange="E.${k}=this.value;E.per=(E.from||E.to)?'c':'0';render()">`;
a.innerHTML=`<div class="top"><a onclick="go('home')">← Inicio</a><a onclick="doPdf()">📄 PDF</a></div><h1>📊 Mis gastos</h1>
<div class="card"><label>Quién</label><select onchange="E.sc=this.value;render()">${sc.map(([k,n])=>`<option value="${k}" ${k===E.sc?'selected':''}>${esc(n)}</option>`).join('')}</select>
<label>Periodo</label><select onchange="E.per=this.value;E.from=E.to='';render()">${E.per==='c'?'<option value="c" selected>Personalizado</option>':''}${Object.entries(PER).map(([k,n])=>`<option value="${k}" ${k===E.per?'selected':''}>${n}</option>`).join('')}</select>
<label>O elige fechas</label><div class="row">${dIn('from',E.from)}${dIn('to',E.to)}${E.per==='c'?`<button onclick="E.from=E.to='';E.per='0';render()">✕</button>`:''}</div></div>
${aggH(ag(L))}`}
// ideas

const BRIDGE="/**\n * PUENTE DRIVE PARA COPIAS CIFRADAS · versión 1\n *\n * Qué hace: recibe trozos de archivos YA CIFRADOS por la app y los guarda en\n *   Mi unidad / Apps / Backups / <carpeta de la app> / <copia> / 0001.part, 0002.part…\n * Seguridad:\n *   - Todo va por HTTPS (script.google.com no admite HTTP).\n *   - La clave del puente (SECRET) NO viaja nunca, ni en la URL ni en el cuerpo:\n *     cada petición lleva una firma HMAC-SHA256 que se calcula con ella.\n *   - Hora y número de un solo uso (nonce): una petición capturada no se puede repetir.\n *   - El contenido ya llega cifrado de extremo a extremo (AES-GCM con tu contraseña maestra):\n *     ni el puente ni Google pueden leerlo.\n * Clave SECRET: Configuración del proyecto (engranaje) > Propiedades de la secuencia de\n *   comandos > Añadir propiedad: nombre SECRET, valor = la clave que genera la app (mín. 16).\n * Implementación: Implementar > Nueva implementación > Aplicación web >\n *   Ejecutar como: Yo · Quién tiene acceso: Cualquier usuario.\n */\nconst VERSION = 1;\nconst ROOT = ['Apps', 'Backups'];\nconst SKEW = 600000;       // margen de hora: 10 min\nconst MAXD = 6000000;      // máx. caracteres base64 por petición (~4,5 MB)\nconst SUB = '_subiendo_';  // prefijo de copias a medio subir\nconst ID = /^[0-9A-Za-z_-]{6,80}$/;\n\nfunction doGet() { return out_({ ok: 0, e: 'post' }); }\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction hex_(b) {\n  return b.map(function (x) { return ('0' + (x & 255).toString(16)).slice(-2); }).join('');\n}\nfunction sha_(s) {\n  return hex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, s, Utilities.Charset.UTF_8));\n}\nfunction same_(a, b) {\n  if (a.length !== b.length) return false;\n  var r = 0;\n  for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);\n  return r === 0;\n}\nfunction nm_(i) { return ('0000' + i).slice(-4) + '.part'; }\nfunction int_(x, a, b) { return typeof x === 'number' && (x | 0) === x && x >= a && x <= b; }\n\nfunction rootF_() {\n  var f = DriveApp.getRootFolder();\n  ROOT.forEach(function (n) {\n    var it = f.getFoldersByName(n);\n    f = it.hasNext() ? it.next() : f.createFolder(n);\n  });\n  return f;\n}\nfunction appF_(app) {\n  var r = rootF_(), it = r.getFoldersByName(app);\n  return it.hasNext() ? it.next() : r.createFolder(app);\n}\nfunction sub_(af, name, create) {\n  var it = af.getFoldersByName(name);\n  if (it.hasNext()) return it.next();\n  return create ? af.createFolder(name) : null;\n}\nfunction desc_(f) {\n  try { var d = JSON.parse(f.getDescription() || ''); return d && d.t ? d : null; } catch (x) { return null; }\n}\n\nfunction doPost(e) {\n  try {\n    var q;\n    try { q = JSON.parse(e.postData.contents); } catch (x) { return out_({ ok: 0, e: 'bad' }); }\n    if (!q || q.v !== 1 || typeof q.a !== 'string' || typeof q.app !== 'string' || typeof q.ts !== 'number' ||\n        typeof q.n !== 'string' || typeof q.ps !== 'string' || typeof q.s !== 'string') return out_({ ok: 0, e: 'bad' });\n    var sec = PropertiesService.getScriptProperties().getProperty('SECRET');\n    if (!sec || sec.length < 16) return out_({ ok: 0, e: 'nosecret' });\n    var d = typeof q.d === 'string' ? q.d : '';\n    if (d.length > MAXD) return out_({ ok: 0, e: 'big' });\n    // 1) firma (todo lo firmado es ASCII)\n    var msg = ['1', q.a, q.app, q.ts, q.n, q.ps, d ? sha_(d) : ''].join('|');\n    var sig = hex_(Utilities.computeHmacSha256Signature(msg, sec));\n    if (!same_(sig, q.s)) { Utilities.sleep(1500); return out_({ ok: 0, e: 'auth' }); }\n    // 2) hora y repetición\n    if (Math.abs(Date.now() - q.ts) > SKEW) return out_({ ok: 0, e: 'ts' });\n    var cache = CacheService.getScriptCache();\n    if (!/^[0-9a-f]{32}$/.test(q.n) || cache.get('n' + q.n)) return out_({ ok: 0, e: 'rep' });\n    cache.put('n' + q.n, '1', 1500);\n    if (!/^[a-z0-9_-]{2,40}$/.test(q.app)) return out_({ ok: 0, e: 'app' });\n    var p;\n    try { p = JSON.parse(q.ps); } catch (x) { return out_({ ok: 0, e: 'bad' }); }\n    if (!p || typeof p !== 'object') p = {};\n    // 3) acción (de una en una)\n    var lock = LockService.getScriptLock();\n    if (!lock.tryLock(25000)) return out_({ ok: 0, e: 'busy' });\n    try { return act_(q.a, q.app, p, d); } finally { try { lock.releaseLock(); } catch (x) { } }\n  } catch (err) {\n    return out_({ ok: 0, e: 'int', m: String(err && err.message || err).slice(0, 120) });\n  }\n}\n\nfunction act_(a, app, p, d) {\n  var af, sf, it, f, i;\n  switch (a) {\n    case 'ping':\n      appF_(app);\n      return out_({ ok: 1, v: VERSION, folder: ROOT.join('/') + '/' + app });\n\n    case 'put':\n      if (!ID.test(p.id || '') || !int_(p.i, 1, 9999) || !d) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, SUB + p.id, true);\n      it = sf.getFilesByName(nm_(p.i));\n      while (it.hasNext()) it.next().setTrashed(true);\n      f = sf.createFile(Utilities.newBlob(Utilities.base64Decode(d), 'application/octet-stream', nm_(p.i)));\n      if (typeof p.sz === 'number' && f.getSize() !== p.sz) { f.setTrashed(true); return out_({ ok: 0, e: 'sz' }); }\n      return out_({ ok: 1, i: p.i });\n\n    case 'fin': {\n      if (!ID.test(p.id || '') || !int_(p.total, 1, 9999) || typeof p.size !== 'number') return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, SUB + p.id, false);\n      if (!sf) { // ¿ya estaba terminada? (respuesta perdida en un reintento)\n        var fin = sub_(af, p.id, false), ds = fin && desc_(fin);\n        return ds && ds.t === p.total && ds.s === p.size ? out_({ ok: 1, again: 1 }) : out_({ ok: 0, e: 'nf' });\n      }\n      var n = 0, sum = 0, seen = {};\n      it = sf.getFiles();\n      while (it.hasNext()) {\n        f = it.next();\n        var nm = f.getName();\n        if (/^\\d{4}\\.part$/.test(nm)) { seen[nm] = 1; n++; sum += f.getSize(); }\n      }\n      for (i = 1; i <= p.total; i++) if (!seen[nm_(i)]) return out_({ ok: 0, e: 'miss', m: 'falta ' + nm_(i) });\n      if (n !== p.total || sum !== p.size) return out_({ ok: 0, e: 'miss', m: n + '/' + p.total + ' trozos · ' + sum + '/' + p.size + ' bytes' });\n      sf.setDescription(JSON.stringify({ t: p.total, s: p.size, n: String(p.name || '').slice(0, 120), d: new Date().toISOString() }));\n      it = af.getFoldersByName(p.id);\n      while (it.hasNext()) { var old = it.next(); if (desc_(old)) old.setTrashed(true); }\n      sf.setName(p.id);\n      var tr = retain_(af, int_(p.keep, 2, 50) ? p.keep : 10);\n      clean_(af);\n      return out_({ ok: 1, trashed: tr });\n    }\n\n    case 'list': {\n      af = appF_(app);\n      var r = [];\n      it = af.getFolders();\n      while (it.hasNext()) {\n        f = it.next();\n        if (f.getName().indexOf(SUB) === 0) continue;\n        var dd = desc_(f);\n        if (dd) r.push({ id: f.getName(), t: dd.t, s: dd.s, n: dd.n, d: f.getDateCreated().toISOString() });\n      }\n      r.sort(function (x, y) { return x.d < y.d ? 1 : -1; });\n      return out_({ ok: 1, l: r });\n    }\n\n    case 'get':\n      if (!ID.test(p.id || '') || !int_(p.i, 1, 9999)) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, p.id, false);\n      if (!sf || !desc_(sf)) return out_({ ok: 0, e: 'nf' });\n      it = sf.getFilesByName(nm_(p.i));\n      if (!it.hasNext()) return out_({ ok: 0, e: 'nf' });\n      return out_({ ok: 1, i: p.i, d: Utilities.base64Encode(it.next().getBlob().getBytes()) });\n\n    case 'del':\n      if (!ID.test(p.id || '')) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, p.id, false);\n      if (!sf || !desc_(sf)) return out_({ ok: 0, e: 'nf' });\n      sf.setTrashed(true);\n      return out_({ ok: 1 });\n  }\n  return out_({ ok: 0, e: 'bad' });\n}\n\n// Solo toca copias creadas por este puente (las que llevan descripción propia).\nfunction retain_(af, keep) {\n  var a = [], it = af.getFolders(), f;\n  while (it.hasNext()) { f = it.next(); if (f.getName().indexOf(SUB) !== 0 && desc_(f)) a.push(f); }\n  a.sort(function (x, y) { return y.getDateCreated() - x.getDateCreated(); });\n  var k = 0;\n  for (var i = keep; i < a.length; i++) { a[i].setTrashed(true); k++; }\n  return k;\n}\n// Copias a medio subir de hace más de un día: a la papelera.\nfunction clean_(af) {\n  var it = af.getFolders(), f;\n  while (it.hasNext()) {\n    f = it.next();\n    if (f.getName().indexOf(SUB) === 0 && Date.now() - f.getDateCreated().getTime() > 864e5) f.setTrashed(true);\n  }\n}\n";

try{await inQ(async()=>{LA=Date.now();const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),raw=new Uint8Array(await crypto.subtle.exportKey('raw',k)),wk=await kdf(p,ub64(SEG.salt),SEG.it),w=await enc(wk,raw,2);raw.fill(0);
segSave({dek:{iv:b64(w.iv),ct:b64(w.ct)}});
const src=await allRaw('d'),recs=[];for(const x of src){const r=await unseal(x,'d');recs.push(await seal(r,'e',k))}
let t=DB.transaction('e','readwrite'),os=t.objectStore('e'),fin=tdone(t);os.clear();recs.forEach(r=>os.put(r));await fin;
const k2=await dekOpen(p),back=await allRaw('e'),m=new Map(src.map(x=>[x.id,x]));if(back.length!==src.length)throw new Error('faltan registros al verificar');
for(const y of back){const o=m.get(y.id),r=await unseal(y,'e',k2);if(!o||o.j!==r.j||o.rev!==y.rev||o.t!==y.t)throw new Error('la verificación no coincide')}
DEK=k2;segSave({enc:1});t=DB.transaction('d','readwrite');fin=tdone(t);t.objectStore('d').clear();await fin;try{localStorage.removeItem('qp')}catch(e){}});
toast('');render();alert('✅ Datos de este móvil cifrados y verificados.')}
catch(e){toast('');if(!SEG.enc){DEK=null;segSave({dek:null});try{const t=DB.transaction('e','readwrite'),f=tdone(t);t.objectStore('e').clear();await f}catch(x){}}render();alert('No se pudo cifrar: '+((e&&e.message)||e)+'\nNo ha cambiado nada: tus datos siguen como estaban.')}}
async function encOff(){if(!SEG?.enc||!DEK)return;if(!confirm('¿Quitar el cifrado? Los datos de este móvil quedarán sin cifrar (las copias siguen cifradas).'))return;const p=await confirmPw();if(!p)return;toast('Descifrando la base…',6e4);await flush();
try{await inQ(async()=>{LA=Date.now();const src=await allRaw('e'),plain=[];for(const x of src)plain.push(await unseal(x,'e'));
let t=DB.transaction('d','readwrite'),os=t.objectStore('d'),fin=tdone(t);os.clear();plain.forEach(r=>os.put({id:r.id,t:r.t,rev:r.rev,j:r.j}));await fin;
const back=await allRaw('d'),m=new Map(plain.map(x=>[x.id,x]));if(back.length!==plain.length)throw new Error('faltan registros al verificar');for(const y of back){const o=m.get(y.id);if(!o||o.j!==y.j||o.rev!==y.rev)throw new Error('la verificación no coincide')}
segSave({enc:0,dek:null});DEK=null;t=DB.transaction('e','readwrite');fin=tdone(t);t.objectStore('e').clear();await fin});toast('');render();alert('Cifrado quitado.')}
catch(e){toast('');if(SEG.enc){try{const t=DB.transaction('d','readwrite'),f=tdone(t);t.objectStore('d').clear();await f}catch(x){}}render();alert('No se pudo quitar el cifrado: '+((e&&e.message)||e)+'\nTus datos siguen cifrados e intactos.')}}
/* la clave antigua 'qp' (localStorage, en claro) se borra solo cuando la base nueva está verificada y hay copia */
async function legacyCleanup(){try{if(EMERG||!DB||!legacyGet())return;const st=await getState();if(st&&st.S&&Array.isArray(st.S.outings))localStorage.removeItem('qp')}catch(e){}}
/* carga de datos (al arrancar o al desbloquear) */
async function bootData(){if(!DB){EMERG=true;const L=legacyGet();S=norm(L||{},!!L);return}
try{if(SEG?.enc){const t=DB.transaction('d','readwrite'),f=tdone(t);t.objectStore('d').clear();await f}else if((await rq(DB.transaction('e').objectStore('e').count()))>0){const t=DB.transaction('e','readwrite'),f=tdone(t);t.objectStore('e').clear();await f}}catch(e){}
let st=null,err=null;try{st=await getState()}catch(e){err=e}
if(err){let raw=null;try{raw=await rawGet(SN(),'state')}catch(e){}REV=raw?raw.rev:0;let L=[];try{L=await snList()}catch(e){}const ok=L.find(x=>!x.bad);
if(ok&&confirm(`No se ha podido leer la base principal.\n\n¿Cargar el punto de restauración del ${new Date(ok.at).toLocaleString('es-ES')} (${ok.n} salidas)?`)){S=norm(ok.data);PEND=1;await flush();if(!SVERR)return}
BADMAIN=String(err);S=norm({});return}
if(st){S=norm(st.S);REV=st.rev;return}
const L=legacyGet();if(!L){S=norm({});REV=0;return}
// migración desde la v6 (localStorage → IndexedDB), verificada; la clave antigua no se borra todavía
S=norm(L,true);REV=0;try{await inQ(wr);const v=await getState();if(!v||JSON.stringify(norm(v.S))!==JSON.stringify(S))throw new Error('verificación');MIGD={f:S.friends.length,n:S.outings.length};try{localStorage.setItem('qp_mig',JSON.stringify(MIGD))}catch(x){}await snapQ('paso desde la versión 6')}
catch(e){try{const t=DB.transaction(SN(),'readwrite'),f=tdone(t);t.objectStore(SN()).delete('state');await f}catch(x){}EMERG=true;DB=null;S=norm(L,true);alert('No se pudo pasar a la base nueva ('+((e&&e.message)||e)+'). La app sigue con el almacenamiento anterior y tus datos están intactos.')}}
function migMsg(){show(`<h3>✅ Versión ${VER}</h3><p>Tus datos (${MIGD.f} amigos y ${MIGD.n} salidas) se han pasado a la base nueva y se han comprobado uno a uno.</p><small>Ahora toca protegerlos: crea la contraseña maestra (huella), conecta Drive y cifra los datos de este móvil, todo desde Ajustes. Empieza haciendo una copia.</small><div class=bt><button onclick="migOk();bkNow()">${pteOn()?'Subir copia a Drive':'Descargar copia cifrada'}</button><button class=sec onclick="migOk();OPN.add('seg');go('set')">Ir a Seguridad</button><button class=sec onclick="migOk()">Más tarde</button></div>`)}
function migOk(){closeSh();MIGD=null;try{localStorage.removeItem('qp_mig')}catch(x){}}
async function postStart(){if(!MIGD){try{const m=JSON.parse(localStorage.getItem('qp_mig'));if(m&&typeof m.n==='number')MIGD=m}catch(e){}}try{if(DB&&!EMERG&&!BADMAIN&&S&&hasData()){const ks=(await rq(DB.transaction(SN()).objectStore(SN()).getAllKeys())).filter(k=>String(k).startsWith('sn-')).map(k=>+k.slice(3)),last=ks.length?Math.max(...ks):0;if(Date.now()-last>20*36e5)await snapQ('automático (diario)')}}catch(e){}
if(MIGD)return migMsg();if(bkDue()){if(autoOk())drvUp(1);else if(!autoOn())bkAsk();else if(!PW)bkAsk()}}

// ---- PWA, teclado, historial
let UPD=false,chkUpd=()=>toast('Actualizaciones no disponibles aquí');
if('serviceWorker' in navigator){let had=!!navigator.serviceWorker.controller;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had){had=true;return}UPD=true;if(V.n!=='form')flush().finally(()=>location.reload())});
navigator.serviceWorker.register('sw.js').then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})});chkUpd=()=>r.update().then(()=>toast('Comprobado: si hay versión nueva se aplicará sola'),()=>toast('Sin conexión: no se ha podido comprobar'))}).catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const vv=window.visualViewport;
function kb(){document.documentElement.style.setProperty('--tmh',Math.max(110,(vv?vv.height:innerHeight)*.4)+'px');const a=document.activeElement;if(a&&a.tagName==='TEXTAREA')setTimeout(()=>a.scrollIntoView({block:'center'}),100)}
kb();if(vv)vv.addEventListener('resize',kb);
document.addEventListener('focusin',e=>{if(e.target.tagName==='TEXTAREA')setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),350)});
addEventListener('storage',e=>{if(e.key==='qp_seg'){let n=null;try{n=JSON.parse(e.newValue)}catch(x){}if(!!(n&&n.enc)!==!!(SEG&&SEG.enc))flush().finally(()=>location.reload());else SEG=n}else if(e.key==='qp_pte'){try{PTE=JSON.parse(e.newValue)}catch(x){PTE=null}}});
try{BC=new BroadcastChannel('qp_db');BC.onmessage=m=>{if(!S||!DB||EMERG||!m.data||m.data.rev===REV)return;inQ(async()=>{if(PEND||!S)return;const st=await getState();if(st&&st.rev!==REV){S=norm(st.S);REV=st.rev;if(V.n!=='form')render()}}).catch(()=>{})}}catch(e){}
history.replaceState({n:'home'},'');
window.addEventListener('popstate',e=>{if(!S)return;let h=e.state||{n:'home'};if(h.n==='form'&&!D)h={n:'home'};go(h.n,h.id,true)});
/* arranque: primero el bloqueo; con datos cifrados no se lee ni escribe nada hasta desbloquear */
(async()=>{DBP=(async()=>{try{DB=await opn()}catch(e){DB=null}})();lockUI();await DBP;
if(SEG?.enc&&!DB){$('#app').innerHTML='<div class="card">No se puede abrir la base de datos de este navegador. Cierra otras ventanas de la app y vuelve a abrirla.</div>';return}
if(!SEG?.enc){try{await bootData()}catch(e){alert('No se pudieron leer los datos: '+((e&&e.message)||e))}render()}
if(!LOCK&&S){POST=1;postStart()}})();
</script></body></html>
