<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi música</title>
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#1b2233;--mut:#667086;--acc:#3d4fd1;--acct:#fff;--line:#d9dee7;--bad:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151d;--card:#1b2030;--ink:#e8ebf3;--mut:#9aa3b8;--acc:#8fa2ff;--acct:#12151d;--line:#2d3550;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12151d;--card:#1b2030;--ink:#e8ebf3;--mut:#9aa3b8;--acc:#8fa2ff;--acct:#12151d;--line:#2d3550;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri,button.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px 12px}
.side{position:sticky;top:0;z-index:6;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:8px 10px;margin-bottom:10px;box-shadow:0 2px 8px #0003}
@media(min-width:860px){.wrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px;align-items:start;padding-top:12px}.side{top:12px;border-top:1px solid var(--line);border-radius:14px;padding:12px;margin:0}}
.nowr{display:flex;align-items:center;gap:8px}.nt{flex:1;min-width:0}
#now{font-weight:650;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowa{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.3em}
.src{display:inline-block;font-size:10px;line-height:1;padding:3px 5px;border-radius:5px;margin-right:6px;vertical-align:1px;color:#fff;background:#e62117;flex:none}
.src.lo{background:var(--acc);color:var(--acct)}.src.vi{background:#6b4fd0;color:#fff}.nowr .src{font-size:13px;padding:6px 8px;margin:0}
.prog{display:flex;align-items:center;gap:6px;margin-top:6px}.prog input{padding:0;border:0;flex:1;min-width:0;accent-color:var(--acc);background:transparent}.prog small{min-width:40px;text-align:center;font-size:11px}
.ctl{display:flex;gap:4px;margin-top:4px}.ctl button{flex:1;font-size:15px;padding:5px 0;min-width:0}
.vid{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-top:8px;position:relative}
.vid.hide{height:0;aspect-ratio:auto;margin:0}
.vid iframe{width:100%;height:100%}
.vid video{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}.vid.vv video{display:block}
.vid .lm{position:absolute;inset:0;display:none;place-items:center;color:#fff;background:#111;text-align:center;padding:10px}.vid.local .lm{display:grid}
nav{display:flex;gap:6px;margin-bottom:12px}nav button{flex:1}
h2{font-size:20px;margin:0 0 10px}h3{margin:0 0 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bar input{flex:2 1 160px}.bar select{flex:1 1 120px;width:auto}
.mut{color:var(--mut)}small{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.row.cur{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.row img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;cursor:pointer;flex:none;background:var(--line)}
.inf{flex:1;min-width:0}.inf b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inf span{margin-right:8px}.bad{color:var(--bad)}
.chip{display:inline-block;background:var(--bg);border-radius:20px;padding:0 8px;font-size:12px;margin:2px 4px 0 0}
.btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}.btns button{padding:3px 8px}
@media(max-width:520px){.row{flex-wrap:wrap}.row img{width:80px}.btns{max-width:none;width:100%;justify-content:flex-start}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:16px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
.end{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.idea{white-space:pre-wrap}.done .idea{text-decoration:line-through;color:var(--mut)}

body{padding-bottom:70px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--ink);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--bg);padding:8px 2px;font-size:12px;line-height:1.2}
.tabs button span{display:block;font-size:18px}
.tabs button.on{background:var(--acc);color:var(--acct)}
.fab{position:fixed;right:14px;bottom:84px;width:52px;height:52px;border-radius:50%;font-size:26px;padding:0;z-index:4;box-shadow:0 2px 8px #0005}
@media(min-width:860px){body{padding-bottom:0}.tabs{position:static;flex-direction:column;border-radius:12px;overflow:hidden;margin-top:12px}.tabs button{display:flex;gap:10px;align-items:center;padding:10px 14px;font-size:15px;text-align:left}.tabs button span{display:inline;font-size:16px}.fab{bottom:20px}}
.az{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.az button{padding:2px 9px;flex:none}
.row.c{padding:5px 8px;margin-bottom:4px;flex-wrap:nowrap}.row.c img{width:56px}.row.c .btns{flex-wrap:nowrap;max-width:none;width:auto}
.inf small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.chip{border:1px solid var(--line);cursor:pointer;padding:2px 10px;margin:3px 4px 0 0}
#toast{bottom:76px}#toast button{margin-left:8px;padding:2px 8px}
.ph{width:96px;aspect-ratio:16/9;border-radius:6px;flex:none;background:var(--line);display:grid;place-items:center;font-size:20px;cursor:pointer}.row.c .ph{width:56px}@media(max-width:520px){.row:not(.c) .ph{width:80px}}
.row.top{align-items:flex-start}.inf b.b3{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
details.sec>summary{cursor:pointer;font-weight:650;font-size:16px}details.sec[open]>summary{margin-bottom:8px}
.sec label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
dialog label.pk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:0;padding:5px 0}.pk input{width:auto}

.row[data-id],.row[data-qi]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fch{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;align-items:center}
.fch>*{flex:none}.fch select{width:auto;max-width:170px;padding:4px 8px}.fch button{padding:4px 10px;border-radius:20px}
.row.u{padding:4px 8px;margin-bottom:3px;gap:8px}.row.u .inf b{font-weight:500}.row.u .btns button{padding:2px 8px}
.ck{display:none;font-size:22px;line-height:1;flex:none;width:24px;text-align:center}
body.sel .ck{display:block}body.sel .row[data-id] .btns{display:none}body.sel .fab{display:none}body.sel{padding-bottom:190px}
.row.picked{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
#sb,#prg{position:fixed;left:8px;right:8px;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:8px;box-shadow:0 2px 10px #0006;display:none}
#prg{z-index:8;padding:8px 10px}#prg progress{width:100%;margin:6px 0;accent-color:var(--acc)}
#sb .t{font-weight:650;margin-bottom:6px}#sb .a{display:flex;flex-wrap:wrap;gap:5px}#sb button{padding:5px 9px}
body.sel #toast{bottom:200px}
@media(min-width:860px){#sb,#prg{left:auto;right:14px;bottom:14px;width:min(520px,calc(100vw - 28px))}body.sel{padding-bottom:0}body.sel #toast{bottom:150px}}
dialog.wide{width:min(700px,96vw)}
details.fd{margin-left:10px}details.fd>summary{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;cursor:pointer}

.panel{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.panel.f{background:color-mix(in srgb,var(--acc) 10%,var(--card));border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.panel.l{background:color-mix(in srgb,var(--ink) 5%,var(--bg))}
.pt{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.bar.sub{border-top:1px dashed var(--line);padding-top:8px;align-items:center}.bar.sub small{flex:none}
details.sec>summary{list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::after{content:'▾';color:var(--mut)}details.sec[open]>summary::after{content:'▴'}
body.drv{overflow:hidden;overscroll-behavior:none}
#drv{display:none;position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;z-index:30;background:var(--bg);flex-direction:column;justify-content:flex-start;gap:12px;padding:max(14px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
#drv.on{display:flex}
#drv .dtop{display:flex;justify-content:space-between;align-items:center;gap:8px}#drv .dx{padding:12px 18px;font-size:18px;font-weight:650}
#drv .dmid{flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:2px 0}
#drv input[type=range]{touch-action:pan-x}
#dico{font-size:40px;line-height:1}#dtit{font-size:clamp(18px,5vw,28px);font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#dart{font-size:clamp(15px,4vw,21px);color:var(--mut)}#dq{font-size:13px;color:var(--mut)}
#dprog{width:100%;height:10px;accent-color:var(--acc)}.dtm{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-top:-8px}
.dctl{display:flex;gap:12px}.dctl button{flex:1;font-size:38px;padding:20px 0;border-radius:18px}.dctl button#dpp{flex:1.6;background:var(--acc);color:var(--acct);border-color:var(--acc)}
.dvol{display:flex;gap:12px;align-items:center}.dvol button{font-size:38px;padding:16px 26px;min-width:96px;border-radius:18px}.dvol input{flex:1;padding:0;height:48px;accent-color:var(--acc);background:transparent;border:0}
.dopt{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.dopt button{flex:1 1 150px;padding:12px 8px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<aside class="side">
 <div class="nowr"><span id="nsrc"></span><div class="nt"><div id="now">Nada en reproducción</div><div id="nowa"></div></div></div>
 <div class="prog"><small id="tcur">0:00</small><input type="range" id="seek" min="0" max="10000" value="0" aria-label="Posición" disabled><small id="tdur">–:–</small></div>
 <div class="ctl">
  <button data-a="prv" title="Anterior" aria-label="Anterior">⏮</button>
  <button data-a="pp" id="bpp" title="Reproducir o pausar" aria-label="Reproducir o pausar">⏯</button>
  <button data-a="nxt" title="Siguiente" aria-label="Siguiente">⏭</button>
  <button data-a="shf" id="bshf" title="Aleatorio" aria-label="Aleatorio">🔀</button>
  <button data-a="rep" id="brep" title="Repetir" aria-label="Repetir">🔁</button>
  <button data-a="vid" id="bvid" title="Mostrar u ocultar el vídeo" aria-label="Mostrar u ocultar el vídeo">📺</button>
  <button data-a="queue" id="bq" title="Ver la cola" aria-label="Ver la cola">☰</button>
  <button data-a="gsearch" title="Buscar en toda la biblioteca" aria-label="Buscar en toda la biblioteca">🔍</button>
  <button data-a="drive" title="Modo conducción" aria-label="Modo conducción">🚗</button>
 </div>
 <div class="vid hide" id="vidbox"><div id="yt"></div><video id="lv" playsinline></video><div class="lm">🎧 Reproduciendo en modo local</div></div>
 <div class="tabs"><button data-a="tab" data-v="lib"><span>🎵</span>Biblioteca</button><button data-a="tab" data-v="art"><span>🎤</span>Artistas</button><button data-a="tab" data-v="gen"><span>🏷️</span>Géneros</button><button data-a="tab" data-v="pls"><span>📋</span>Listas</button><button data-a="tab" data-v="set"><span>⚙️</span>Ajustes</button></div>
</aside>
<main>
 <div id="bk"></div><div id="main"></div>
</main>
</div>
<button class="fab pri" data-a="add" aria-label="Añadir canciones">＋</button>
<div id="drv" role="dialog" aria-label="Modo conducción">
 <div class="dtop"><button class="dx" data-a="dexit">✕ Salir</button><small id="dstat"></small></div>
 <div class="dmid"><div id="dico">🎧</div><div id="dtit">Nada en reproducción</div><div id="dart"></div><div id="dq"></div></div>
 <progress id="dprog" max="10000" value="0"></progress><div class="dtm"><span id="dcur">0:00</span><span id="ddur">–:–</span></div>
 <div class="dctl"><button data-a="prv" aria-label="Anterior">⏮</button><button data-a="pp" id="dpp" aria-label="Reproducir o pausar">▶</button><button data-a="nxt" aria-label="Siguiente">⏭</button></div>
 <div class="dvol"><button data-a="dmute" id="dmu" aria-label="Silenciar">🔊</button><input type="range" id="dvol" min="0" max="100" aria-label="Volumen"></div>
 <div class="dopt"><button data-a="dloc" id="dlo"></button><button data-a="dauto" id="dau"></button><button data-a="dwl" id="dwl"></button></div>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="fd" webkitdirectory multiple hidden><input type="file" id="ff" accept="audio/*,video/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.mp4,.m4v,.webm,.mkv,.mov" multiple hidden>
<div id="sb"></div>
<div id="prg"><span></span><progress></progress><button data-a="lcancel">Cancelar la carga</button></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=t=>{t=Math.round(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const LOG=[],lg=x=>{LOG.push(new Date().toLocaleTimeString('es-ES')+' '+x);if(LOG.length>150)LOG.shift()};document.addEventListener('visibilitychange',()=>lg('pantalla '+(document.hidden?'oculta':'visible')));
const SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
const TYPES=['canción','concierto','otro'];

/* ---------- Datos: IndexedDB ---------- */
let db;const S={songs:[],playlists:[],ideas:[],genres:[]};
const openDB=()=>new Promise((ok,ko)=>{const r=indexedDB.open('musicaDB',2);
 r.onupgradeneeded=()=>Object.keys(S).forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});
 r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ko(r.error)});
const getAll=n=>new Promise(ok=>{const q=db.transaction(n).objectStore(n).getAll();q.onsuccess=()=>ok(q.result)});
const bk=()=>{try{return JSON.parse(localStorage.getItem('musica.bk'))||{}}catch{return{}}};
const setBk=o=>{try{localStorage.setItem('musica.bk',JSON.stringify(o))}catch{}};
const bump=()=>{const b=bk();b.n=(b.n||0)+1;setBk(b)};
const markBk=()=>setBk({t:Date.now(),n:0});
const put=(n,o,q)=>{db.transaction(n,'readwrite').objectStore(n).put(o);if(!q)bump()};
const del=(n,id)=>{db.transaction(n,'readwrite').objectStore(n).delete(id);bump()};
const clr=n=>db.transaction(n,'readwrite').objectStore(n).clear();
const putMany=(n,a)=>{if(!a.length)return;const st=db.transaction(n,'readwrite').objectStore(n);a.forEach(x=>st.put(x));bump()};
const delMany=(n,ids)=>{if(!ids.length)return;const st=db.transaction(n,'readwrite').objectStore(n);ids.forEach(i=>st.delete(i));bump()};

/* ---------- Estado e interfaz ---------- */
let prefs={sh:false,rep:'off',src:'all',theme:'auto',cp:false};const VERSION='7.2 · Fase 3b-3';try{Object.assign(prefs,JSON.parse(localStorage.getItem('musica.prefs')))}catch{}
const savePrefs=()=>{try{localStorage.setItem('musica.prefs',JSON.stringify(prefs))}catch{}};
const applyTheme=()=>{prefs.theme==='light'||prefs.theme==='dark'?document.documentElement.dataset.theme=prefs.theme:document.documentElement.removeAttribute('data-theme')};applyTheme();
const ui={open:{},draft:'',view:'lib',q:'',g:'',t:'',fav:false,ar:null,l:'',al:'',sort:'title',fp:'',fo:false,lim:60,pl:null,ctx:[],sel:null,o:'',nw:false,sg:false,sa:false,bd:false,qf:0,ql:80,pv:'lib'};
const byId=id=>S.songs.find(s=>s.id===id);
const cmp=(a,b)=>(a||'').localeCompare(b||'','es');
const genres=()=>[...new Set([...S.genres.map(g=>g.id),...S.songs.flatMap(s=>s.genres)])].sort(cmp);
const ini=t=>{const c=(t||'').normalize('NFD').replace(/[^A-Za-z0-9]/g,'')[0];return c&&/[A-Za-z]/.test(c)?c.toUpperCase():'#'};
const opts=(arr,cur)=>arr.map(([v,t])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`).join('');
function toast(t,undo){const e=$('#toast');e.innerHTML=esc(t)+(undo?' <button data-a="undo">Deshacer</button>':'');toast.u=undo;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',undo?8000:2800)}
function destroy(fn,msg){const snap=JSON.stringify(S);fn();toast(msg,()=>{const o=JSON.parse(snap),tx=db.transaction(Object.keys(S),'readwrite');for(const n of Object.keys(S)){const st=tx.objectStore(n);st.clear();S[n]=o[n];o[n].forEach(x=>st.put(x))}bump();render();upd()})}
function dlg(title,body,ok,label='Guardar',init){const d=$('#dlg');d.pk=null;d.classList.remove('wide');
 d.innerHTML=`<h3>${title}</h3>${body}<div class="end"><button data-x="c">Cancelar</button><button class="pri" data-x="o">${label}</button></div>`;
 d.onclick=e=>{const x=e.target.dataset.x;if(x==='c')d.close();else if(x==='o'){if(ok(d)!==false)d.close()}else if(d.pk)d.pk(e)};if(init)init(d);d.showModal()}
$('#dlg').addEventListener('close',()=>$('#dlg').classList.remove('wide'));
const typeSel=v=>`<select id="f-t">${TYPES.map(t=>`<option${t===v?' selected':''}>${t}</option>`).join('')}</select>`;
const aList=()=>`<datalist id="al">${[...new Set(S.songs.map(s=>s.artist).filter(Boolean))].sort(cmp).map(a=>`<option value="${esc(a)}">`).join('')}</datalist>`;
const pickHTML=()=>`<label>Géneros (toca para marcar)</label><div id="gp"></div><div class="bar" style="margin:6px 0 0"><input id="gn" placeholder="Nuevo género"><button data-x="ng" style="flex:none">Crear</button></div>`;
function picker(d,sel){const draw=()=>d.querySelector('#gp').innerHTML=genres().map(g=>`<button class="chip${sel.has(g)?' on':''}" data-gc="${esc(g)}">${esc(g)}</button>`).join('')||'<small>Aún no hay géneros: crea el primero.</small>';draw();
 d.pk=e=>{const gc=e.target.dataset.gc,x=e.target.dataset.x;
  if(gc!==undefined){sel.has(gc)?sel.delete(gc):sel.add(gc);draw()}
  else if(x==='ng'){const i=d.querySelector('#gn'),v=i.value.trim();if(!v)return;const ex=genres().find(g=>g.toLowerCase()===v.toLowerCase())||v;
   if(!genres().includes(ex)){S.genres.push({id:ex});put('genres',{id:ex})}sel.add(ex);i.value='';draw()}}}

const sortFn=k=>k==='recent'?(a,b)=>b.added-a.added:k==='artist'?(a,b)=>cmp(a.artist,b.artist)||cmp(a.title,b.title):(a,b)=>cmp(a.title,b.title);
const row=(s,ctx)=>{const cur=Q[qi]===s.id,pk=!!(ui.sel&&ui.sel.has(s.id)),ck=`<span class="ck" aria-hidden="true">${pk?'☑':'☐'}</span>`;

const stopWd=()=>{clearTimeout(wd);wd=0};
const startWd=()=>{if(wd)return;const bg=document.hidden&&ytWant&&navigator.onLine,ms=!navigator.onLine?2000:bg?10000:fast?8000:20000;

  if(document.hidden&&navigator.onLine&&ytWant&&hw<30){hw++;lg('YT sigue cargando con la pantalla apagada: reintento play ('+hw+')');try{P.playVideo()}catch{}startWd();return}
  fast=false;missed.add(s.id);tries.set(s.id,(tries.get(s.id)||0)+1);if(!navigator.onLine)netBad=true;skip(navigator.onLine?'no responde':'sin conexión')},ms)};
function pick(d,auto){const n=Q.length;
 if(d>0&&prefs.sh&&n>1){const c=Q.map((_,i)=>i).filter(i=>i!==qi&&ok(byId(Q[i])));return c.length?c[Math.random()*c.length|0]:-1}

function load(){const s=cur();if(!s)return;stopWd();armId=null;ytWant=false;lg('carga «'+s.title+'» ('+(isV(s)?'vídeo local':isL(s)?'local':'YT')+', '+document.visibilityState+')');$('#vidbox').classList.toggle('local',isL(s)&&!isV(s));$('#vidbox').classList.toggle('vv',isV(s));upd();refresh();media(s);

  pauseAll();setSrc(VID,FILES.get(s.fk));applyVol();
  VID.play().then(()=>lg('vídeo play() ok')).catch(e=>{lg('vídeo play() rechazado: '+e.name);if(e.name==='NotAllowedError')toast('Toca ⏯ para reproducir');else if(e.name!=='AbortError')skip('no se puede reproducir')})}

  au.play().then(()=>lg('play() ok')).catch(e=>{lg('play() rechazado: '+e.name);if(e.name==='NotAllowedError')toast('Toca ⏯ para reproducir');else if(e.name!=='AbortError')skip('no se puede reproducir')})}
 else{pauseAll();ytWant=true;hw=0;if(ready)P.loadVideoById(s.st?{videoId:s.vid,startSeconds:s.st}:s.vid);else toast(navigator.onLine?'Cargando el reproductor…':'Sin conexión');startWd()}}
AUS.forEach((el,k)=>{

 el.ontimeupdate=()=>gapless(el)});

function gapless(el){if(el!==au||el.src===SIL||prefs.rep==='one')return;const s=cur();if(!isL(s))return;
 const d=el.duration,t=el.currentTime;if(!isFinite(d)||d<=0)return;const left=d-t,other=AUS[1-AUS.indexOf(el)];
 if(left<25&&armId===null){if(missed.size&&navigator.onLine){armId=false;return}
  const i=pick(1,true),n=i>=0&&byId(Q[i]);if(n&&isL(n)&&!isV(n)){armId=n.id;setSrc(other,FILES.get(n.fk));other.load();lg('preparada «'+n.title+'»')}else armId=false}
 else if(left<0.8&&armId){const i=Q.indexOf(armId),n=byId(armId);if(i<0||!n||!FILES.has(n.fk)){armId=false;return}

  $('#vidbox').classList.add('local');upd();refresh();media(n);try{navigator.mediaSession.playbackState='playing'}catch{}

setInterval(()=>{if(seeking)return;const s=cur(),sk=$('#seek');sk.disabled=!s;
 if(!s){sk.value=0;$('#tcur').textContent='0:00';$('#tdur').textContent='–:–';return}
 let t=0;try{t=(isL(s)?lel(s).currentTime:ready?P.getCurrentTime():0)||0}catch{}const d=durNow();
 sk.value=d?Math.round(t/d*10000):0;$('#tcur').textContent=fmt(t);$('#tdur').textContent=d?fmt(d):'–:–';
 if(drvOn()){$('#dprog').value=sk.value;$('#dcur').textContent=fmt(t);$('#ddur').textContent=d?fmt(d):'–:–';let pl=false;try{pl=isL(s)?!lel(s).paused:(ready&&P.getPlayerState()===1)}catch{}$('#dpp').textContent=pl?'⏸':'▶'}},500);

$('#seek').addEventListener('change',e=>{const s=cur(),d=durNow();if(s&&d){const x=e.target.value/10000*d;if(isL(s))lel(s).currentTime=x;else if(ready)P.seekTo(x,true)}seeking=false});

 case'cpt':prefs.cp=!prefs.cp;savePrefs();reset();render();break;
 case'bdclear':{const ss=ui.ctx.map(byId).filter(Boolean);ss.forEach(s=>s.bad='');putMany('songs',ss);toast('Marca de error quitada a '+ss.length);render()}break;
 case'bddel':{const ids=[...ui.ctx];dlg('Eliminar no reproducibles','<p>Se eliminarán <b>'+ids.length+'</b> canciones de la biblioteca y de todas las listas. Podrás deshacerlo justo después.</p>',()=>{removeSongs(ids);render()},'Eliminar')}break;
 case'selon':selOn();break;
 case'selx':selOff();render();break;
 case'selall':ui.ctx.forEach(i=>ui.sel.add(i));selUI();break;
 case'selnone':ui.sel.clear();selUI();break;
 case'bpl':addPlDlg([...ui.sel]);break;
 case'bge':genBulk([...ui.sel]);break;
 case'bfa':{const ss=[...ui.sel].map(byId).filter(Boolean),all=ss.every(s=>s.fav);ss.forEach(s=>s.fav=!all);putMany('songs',ss);toast(all?'Quitadas de favoritas: '+ss.length:'Marcadas como favoritas: '+ss.length);refresh();pruneSel();selUI()}break;
 case'brm':{const n=ui.sel.size;destroy(()=>{cp.songIds=cp.songIds.filter(i=>!ui.sel.has(i));put('playlists',cp)},n+' quitadas de la lista');selOff();render()}break;
 case'bde':{const ids=[...ui.sel];dlg('Eliminar canciones','<p>Se eliminarán <b>'+ids.length+'</b> canciones de la biblioteca y de todas las listas. Podrás deshacerlo justo después.</p>',()=>{removeSongs(ids);selOff();render()},'Eliminar')}break;
 case'queue':if(ui.view==='q'){ui.view=ui.pv||'lib'}else{ui.pv=ui.view;ui.view='q';ui.qf=Math.max(0,qi-2);ui.ql=80}selOff();render();break;
 case'qcur':ui.qf=Math.max(0,qi-2);render();break;
 case'qprev':ui.qf=0;render();break;
 case'qmore':ui.ql+=80;render();break;
 case'qgo':{const s2=byId(Q[qx]);if(!s2)break;if(!ok(s2)){toast('Ahora mismo no se puede reproducir esa canción');break}qi=qx;errs=0;load()}break;
 case'qup':case'qdn':{const j=a==='qup'?qx-1:qx+1;if(j<0||j>=Q.length)break;[Q[qx],Q[j]]=[Q[j],Q[qx]];if(qi===qx)qi=j;else if(qi===j)qi=qx;render()}break;
 case'qnx':{const x=Q.splice(qx,1)[0];if(qx<qi)qi--;Q.splice(qi+1,0,x);render()}break;
 case'qrm':if(qx===qi)break;Q.splice(qx,1);if(qx<qi)qi--;render();break;
 case'qsave':nameDlg('Guardar la cola como lista','Cola '+new Date().toLocaleDateString('es-ES'),v=>{const l={id:uid(),name:v,songIds:Q.filter(byId)};S.playlists.push(l);put('playlists',l);toast('Lista «'+v+'» creada')});break;
 case'lcancel':lcancel=true;break;
 case'exp':exportJSON();toast('Copia descargada');if(ui.view==='set')render();break;
 case'imp':$('#file').click();break;case'imptxt':pasteDlg();break;case'lc':localDlg();break;
 case'bkgo':exportJSON();$('#bk').innerHTML='';toast('Copia descargada');break;
 case'bkno':$('#bk').innerHTML='';break;
 case'vid':{const v=$('#vidbox');v.classList.toggle('hide');b.classList.toggle('on',!v.classList.contains('hide'))}break;
 case'pladd':if(cp)plAddDlg(cp);break;
 case'ideasgo':ui.view='ideas';render();break;
 case'ideaadd':{const t=$('#in').value;if(!t.trim())return;const i={id:uid(),text:t,done:false,date:Date.now()};S.ideas.push(i);put('ideas',i);ui.draft='';render()}break;
 case'ideatog':idea.done=!idea.done;put('ideas',idea);render();break;
 case'ideaedit':ideaDlg(idea);break;
 case'ideadel':destroy(()=>{S.ideas=S.ideas.filter(x=>x!==idea);del('ideas',idea.id)},'Idea borrada');render();break;
 case'fol':selOff();ui.view='fol';render();break;
 case'fsel':ui.fp=b.dataset.p;reset();ui.view='lib';render();break;
 case'fplay':{const i=idsBy(x=>inF(x,b.dataset.p));if(i.length)startQ(i,0)}break;
 case'fdel':{const p0=b.dataset.p,ids=idsBy(x=>inF(x,p0));dlg('Eliminar carpeta','<p>Se quitarán de la biblioteca y de las listas <b>'+ids.length+'</b> canciones de «'+esc(p0)+'». Los archivos del móvil no se tocan. Podrás deshacerlo justo después.</p>',()=>{removeSongs(ids);render()},'Eliminar')}break;
 case'share':shareIds();break;
 case'wipe':wipe1();break;
 case'drive':selOff();$('#drv').classList.add('on');document.body.classList.add('drv');drvUpd();wlSet();break;
 case'dexit':drvExit();break;
 case'dmute':prefs.mute=!prefs.mute;applyVol();savePrefs();drvUpd();break;
 case'dloc':if(prefs.src==='local'){prefs.src=drvPrev||'all';drvPrev=null}else{drvPrev=prefs.src;prefs.src='local'}drvAuto=false;drvUpd();if(prefs.src==='local'&&cur()&&!isL(cur()))toast('Esta canción de YouTube termina y sigo con las locales');break;
 case'dwl':if(!prefs.dwl&&!navigator.wakeLock){toast('Este navegador no permite mantener la pantalla encendida');break}prefs.dwl=!prefs.dwl;savePrefs();wlSet();drvUpd();break;
 case'dauto':prefs.dauto=!prefs.dauto;savePrefs();drvUpd();break;
 case'lgcopy':navigator.clipboard&&navigator.clipboard.writeText(LOG.join('\n')).then(()=>toast('Registro copiado'));break;
 case'pp':toggle();break;
 case'nxt':next(false);break;
 case'prv':prev();break;
 case'shf':prefs.sh=!prefs.sh;savePrefs();upd();break;
 case'rep':prefs.rep={off:'all',all:'one',one:'off'}[prefs.rep];savePrefs();upd();toast({off:'Repetir: no',all:'Repetir: todo',one:'Repetir: una canción'}[prefs.rep]);break;
 }});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;reset();fillList()}else if(e.target.id==='in')ui.draft=e.target.value});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)ui.open[k]=e.target.open},true);
document.addEventListener('change',e=>{const i=e.target.id,v=e.target.value;
 if(i==='p-sh'){prefs.sh=v==='1';savePrefs();upd();return}
 if(i==='p-rep'){prefs.rep=v;savePrefs();upd();return}
 if(i==='p-src'){prefs.src=v;savePrefs();return}
 if(i==='p-th'){prefs.theme=v;savePrefs();applyTheme();return}
 if(i==='p-cp'){prefs.cp=v==='1';savePrefs();reset();return}
 if(i==='g')ui.g=v;else if(i==='t')ui.t=v;else if(i==='so')ui.sort=v;else return;reset();fillList()});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value=''});

(async()=>{try{await openDB();for(const n of Object.keys(S))S[n]=await getAll(n)}catch{toast('No se puede usar el almacenamiento del navegador')}
 render();upd();chkBk()})();
</script>
</body>
</html>
