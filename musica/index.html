<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi música</title>
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#1b2233;--mut:#667086;--acc:#3d4fd1;--acct:#fff;--line:#d9dee7;--bad:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151d;--card:#1b2030;--ink:#e8ebf3;--mut:#9aa3b8;--acc:#8fa2ff;--acct:#12151d;--line:#2d3550;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12151d;--card:#1b2030;--ink:#e8ebf3;--mut:#9aa3b8;--acc:#8fa2ff;--acct:#12151d;--line:#2d3550;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri,button.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px 12px}
.side{position:sticky;top:0;z-index:6;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:8px 10px;margin-bottom:10px;box-shadow:0 2px 8px #0003}
@media(min-width:860px){.wrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px;align-items:start;padding-top:12px}.side{top:12px;border-top:1px solid var(--line);border-radius:14px;padding:12px;margin:0}}
.nowr{display:flex;align-items:center;gap:8px}.nt{flex:1;min-width:0}
#now{font-weight:650;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowa{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.3em}
.src{display:inline-block;font-size:10px;line-height:1;padding:3px 5px;border-radius:5px;margin-right:6px;vertical-align:1px;color:#fff;background:#e62117;flex:none}
.src.lo{background:var(--acc);color:var(--acct)}.nowr .src{font-size:13px;padding:6px 8px;margin:0}
.prog{display:flex;align-items:center;gap:6px;margin-top:6px}.prog input{padding:0;border:0;flex:1;min-width:0;accent-color:var(--acc);background:transparent}.prog small{min-width:40px;text-align:center;font-size:11px}
.ctl{display:flex;gap:5px;margin-top:4px}.ctl button{flex:1;font-size:16px;padding:5px 0}
.vid{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-top:8px;position:relative}
.vid.hide{height:0;aspect-ratio:auto;margin:0}
.vid iframe{width:100%;height:100%}
.vid .lm{position:absolute;inset:0;display:none;place-items:center;color:#fff;background:#111;text-align:center;padding:10px}.vid.local .lm{display:grid}
nav{display:flex;gap:6px;margin-bottom:12px}nav button{flex:1}
h2{font-size:20px;margin:0 0 10px}h3{margin:0 0 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bar input{flex:2 1 160px}.bar select{flex:1 1 120px;width:auto}
.mut{color:var(--mut)}small{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.row.cur{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.row img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;cursor:pointer;flex:none;background:var(--line)}
.inf{flex:1;min-width:0}.inf b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inf span{margin-right:8px}.bad{color:var(--bad)}
.chip{display:inline-block;background:var(--bg);border-radius:20px;padding:0 8px;font-size:12px;margin:2px 4px 0 0}
.btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}.btns button{padding:3px 8px}
@media(max-width:520px){.row{flex-wrap:wrap}.row img{width:80px}.btns{max-width:none;width:100%;justify-content:flex-start}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:16px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
.end{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.idea{white-space:pre-wrap}.done .idea{text-decoration:line-through;color:var(--mut)}

body{padding-bottom:70px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--ink);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--bg);padding:8px 2px;font-size:12px;line-height:1.2}
.tabs button span{display:block;font-size:18px}
.tabs button.on{background:var(--acc);color:var(--acct)}
.fab{position:fixed;right:14px;bottom:84px;width:52px;height:52px;border-radius:50%;font-size:26px;padding:0;z-index:4;box-shadow:0 2px 8px #0005}
@media(min-width:860px){body{padding-bottom:0}.tabs{position:static;flex-direction:column;border-radius:12px;overflow:hidden;margin-top:12px}.tabs button{display:flex;gap:10px;align-items:center;padding:10px 14px;font-size:15px;text-align:left}.tabs button span{display:inline;font-size:16px}.fab{bottom:20px}}
.az{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.az button{padding:2px 9px;flex:none}
.row.c{padding:5px 8px;margin-bottom:4px;flex-wrap:nowrap}.row.c img{width:56px}.row.c .btns{flex-wrap:nowrap;max-width:none;width:auto}
.inf small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.chip{border:1px solid var(--line);cursor:pointer;padding:2px 10px;margin:3px 4px 0 0}
#toast{bottom:76px}#toast button{margin-left:8px;padding:2px 8px}
.ph{width:96px;aspect-ratio:16/9;border-radius:6px;flex:none;background:var(--line);display:grid;place-items:center;font-size:20px;cursor:pointer}.row.c .ph{width:56px}@media(max-width:520px){.row:not(.c) .ph{width:80px}}
.row.top{align-items:flex-start}.inf b.b3{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
details.sec>summary{cursor:pointer;font-weight:650;font-size:16px}details.sec[open]>summary{margin-bottom:8px}
.sec label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
dialog label.pk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:0;padding:5px 0}.pk input{width:auto}
</style>
</head>
<body>
<div class="wrap">
<aside class="side">
 <div class="nowr"><span id="nsrc"></span><div class="nt"><div id="now">Nada en reproducción</div><div id="nowa"></div></div></div>
 <div class="prog"><small id="tcur">0:00</small><input type="range" id="seek" min="0" max="10000" value="0" aria-label="Posición" disabled><small id="tdur">–:–</small></div>
 <div class="ctl">
  <button data-a="prv" title="Anterior" aria-label="Anterior">⏮</button>
  <button data-a="pp" id="bpp" title="Reproducir o pausar" aria-label="Reproducir o pausar">⏯</button>
  <button data-a="nxt" title="Siguiente" aria-label="Siguiente">⏭</button>
  <button data-a="shf" id="bshf" title="Aleatorio" aria-label="Aleatorio">🔀</button>
  <button data-a="rep" id="brep" title="Repetir" aria-label="Repetir">🔁</button>
  <button data-a="vid" id="bvid" title="Mostrar u ocultar el vídeo" aria-label="Mostrar u ocultar el vídeo">📺</button>
 </div>
 <div class="vid hide" id="vidbox"><div id="yt"></div><div class="lm">🎧 Reproduciendo en modo local</div></div>
 <div class="tabs"><button data-a="tab" data-v="lib"><span>🎵</span>Biblioteca</button><button data-a="tab" data-v="art"><span>🎤</span>Artistas</button><button data-a="tab" data-v="gen"><span>🏷️</span>Géneros</button><button data-a="tab" data-v="pls"><span>📋</span>Listas</button><button data-a="tab" data-v="set"><span>⚙️</span>Ajustes</button></div>
</aside>
<main>
 <div id="bk"></div><div id="main"></div>
</main>
</div>
<button class="fab pri" data-a="add" aria-label="Añadir canciones">＋</button>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="fd" webkitdirectory multiple hidden><input type="file" id="ff" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav" multiple hidden>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=t=>{t=Math.round(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const TYPES=['canción','concierto','otro'];

/* ---------- Datos: IndexedDB ---------- */
let db;const S={songs:[],playlists:[],ideas:[],genres:[]};
const openDB=()=>new Promise((ok,ko)=>{const r=indexedDB.open('musicaDB',2);
 r.onupgradeneeded=()=>Object.keys(S).forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});
 r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ko(r.error)});
const getAll=n=>new Promise(ok=>{const q=db.transaction(n).objectStore(n).getAll();q.onsuccess=()=>ok(q.result)});
const bk=()=>{try{return JSON.parse(localStorage.getItem('musica.bk'))||{}}catch{return{}}};
const setBk=o=>{try{localStorage.setItem('musica.bk',JSON.stringify(o))}catch{}};
const bump=()=>{const b=bk();b.n=(b.n||0)+1;setBk(b)};
const markBk=()=>setBk({t:Date.now(),n:0});
const put=(n,o,q)=>{db.transaction(n,'readwrite').objectStore(n).put(o);if(!q)bump()};
const del=(n,id)=>{db.transaction(n,'readwrite').objectStore(n).delete(id);bump()};
const clr=n=>db.transaction(n,'readwrite').objectStore(n).clear();

/* ---------- Estado e interfaz ---------- */
let prefs={sh:false,rep:'off',src:'all',theme:'auto'};const VERSION='4.0 · Fase 1';try{Object.assign(prefs,JSON.parse(localStorage.getItem('musica.prefs')))}catch{}
const savePrefs=()=>{try{localStorage.setItem('musica.prefs',JSON.stringify(prefs))}catch{}};
const applyTheme=()=>{prefs.theme==='light'||prefs.theme==='dark'?document.documentElement.dataset.theme=prefs.theme:document.documentElement.removeAttribute('data-theme')};applyTheme();
const ui={open:{},draft:'',view:'lib',q:'',g:'',t:'',fav:false,ar:null,l:'',al:'',sort:'title',fo:false,lim:60,pl:null,ctx:[]};
const byId=id=>S.songs.find(s=>s.id===id);
const cmp=(a,b)=>(a||'').localeCompare(b||'','es');
const genres=()=>[...new Set([...S.genres.map(g=>g.id),...S.songs.flatMap(s=>s.genres)])].sort(cmp);
const ini=t=>{const c=(t||'').normalize('NFD').replace(/[^A-Za-z0-9]/g,'')[0];return c&&/[A-Za-z]/.test(c)?c.toUpperCase():'#'};
const opts=(arr,cur)=>arr.map(([v,t])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`).join('');
function toast(t,undo){const e=$('#toast');e.innerHTML=esc(t)+(undo?' <button data-a="undo">Deshacer</button>':'');toast.u=undo;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',undo?8000:2800)}
function destroy(fn,msg){const snap=JSON.stringify(S);fn();toast(msg,()=>{const o=JSON.parse(snap);for(const n of Object.keys(S)){clr(n);S[n]=o[n];o[n].forEach(x=>put(n,x,1))}render();upd()})}
function dlg(title,body,ok,label='Guardar',init){const d=$('#dlg');d.pk=null;
 d.innerHTML=`<h3>${title}</h3>${body}<div class="end"><button data-x="c">Cancelar</button><button class="pri" data-x="o">${label}</button></div>`;
 d.onclick=e=>{const x=e.target.dataset.x;if(x==='c')d.close();else if(x==='o'){if(ok(d)!==false)d.close()}else if(d.pk)d.pk(e)};if(init)init(d);d.showModal()}
const typeSel=v=>`<select id="f-t">${TYPES.map(t=>`<option${t===v?' selected':''}>${t}</option>`).join('')}</select>`;
const aList=()=>`<datalist id="al">${[...new Set(S.songs.map(s=>s.artist).filter(Boolean))].sort(cmp).map(a=>`<option value="${esc(a)}">`).join('')}</datalist>`;
const pickHTML=()=>`<label>Géneros (toca para marcar)</label><div id="gp"></div><div class="bar" style="margin:6px 0 0"><input id="gn" placeholder="Nuevo género"><button data-x="ng" style="flex:none">Crear</button></div>`;
function picker(d,sel){const draw=()=>d.querySelector('#gp').innerHTML=genres().map(g=>`<button class="chip${sel.has(g)?' on':''}" data-gc="${esc(g)}">${esc(g)}</button>`).join('')||'<small>Aún no hay géneros: crea el primero.</small>';draw();
 d.pk=e=>{const gc=e.target.dataset.gc,x=e.target.dataset.x;
  if(gc!==undefined){sel.has(gc)?sel.delete(gc):sel.add(gc);draw()}
  else if(x==='ng'){const i=d.querySelector('#gn'),v=i.value.trim();if(!v)return;const ex=genres().find(g=>g.toLowerCase()===v.toLowerCase())||v;
   if(!genres().includes(ex)){S.genres.push({id:ex});put('genres',{id:ex})}sel.add(ex);i.value='';draw()}}}

const row=(s,ctx)=>{const cur=Q[qi]===s.id;
 return `<div class="row c${cur?' cur':''}" data-id="${s.id}">${isL(s)?'<div class="ph" data-a="play">🎧</div>':`<img src="https://i.ytimg.com/vi/${s.vid}/mqdefault.jpg" alt="" loading="lazy" data-a="play">`}
 <div class="inf"><b>${ico(s)}${esc(s.title)}</b><small><span>${esc(s.artist||'Sin artista')}</span>${s.year?`<span>${esc(s.year)}</span>`:''}${s.dur?`<span>${fmt(s.dur)}</span>`:''}${isL(s)&&!FILES.has(s.fk)?'<span class="bad">sin conectar</span>':''}${s.bad?`<span class="bad">${esc(s.bad)}</span>`:''}</small>${s.genres.length?`<small>${esc(s.genres.join(', '))}</small>`:''}</div>
 <div class="btns"><button data-a="play" aria-label="Reproducir">▶</button><button data-a="fav" class="${s.fav?'on':''}" aria-label="Favorito">★</button>
 ${ctx==='pl'?`<button data-a="up" aria-label="Subir">↑</button><button data-a="down" aria-label="Bajar">↓</button><button data-a="rem" aria-label="Quitar de la lista">✕</button>`:`<button data-a="menu" aria-label="Más opciones">⋮</button>`}</div></div>`};
function az(k){const have=new Set(S.songs.map(s=>ini(s.artist)));const L=[...'#ABCDEFGHIJKLMNOPQRSTUVWXYZ'].filter(c=>have.has(c));
 return L.length>1?`<div class="az"><button data-a="az" data-k="${k}" data-l=""${!ui[k]?' class="on"':''}>Todo</button>${L.map(c=>`<button data-a="az" data-k="${k}" data-l="${c}"${ui[k]===c?' class="on"':''}>${c}</button>`).join('')}</div>`:''}

function render(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.view||(ui.view==='ideas'&&b.dataset.v==='set')));
 const m=$('#main');
 if(ui.view==='lib'){
  const fl=[ui.ar!==null&&['ar','Artista: '+(ui.ar||'Sin artista')],ui.g&&['g','Género: '+ui.g]].filter(Boolean);
  m.innerHTML=`<div class="bar"><input id="q" type="search" placeholder="Buscar título, artista o notas" value="${esc(ui.q)}"><button data-a="filt" class="${ui.fo?'on':''}">Filtros</button></div>
  ${ui.fo?`<div class="bar"><select id="g">${opts([['','Todos los géneros'],...genres().map(x=>[x,x])],ui.g)}</select><select id="t">${opts([['','Todos los tipos'],...TYPES.map(x=>[x,x])],ui.t)}</select><select id="so">${opts([['title','Orden: título'],['artist','Orden: artista'],['recent','Orden: recientes']],ui.sort)}</select><button data-a="favf" class="${ui.fav?'on':''}">★ Solo favoritas</button></div>`:''}
  ${fl.length?`<div class="bar">${fl.map(([k,x])=>`<button class="chip on" data-a="clr" data-k="${k}">${esc(x)} ✕</button>`).join('')}</div>`:''}
  ${az('l')}<div id="list"></div>`;
  fillList();
 }else if(ui.view==='art')vArt();else if(ui.view==='gen')vGen();
 else if(ui.view==='pls'){
  if(ui.pl&&S.playlists.find(p=>p.id===ui.pl))vPl();else{ui.pl=null;
   m.innerHTML=`<div class="bar"><h2 style="flex:1;margin:0">Listas</h2><button class="pri" data-a="plnew">Nueva lista</button></div>`+
   ([...S.playlists].sort((a,b)=>cmp(a.name,b.name)).map(p=>`<div class="row c top" data-pl="${p.id}"><div class="inf" data-a="plopen" style="cursor:pointer"><b class="b3">${esc(p.name)}</b><small>${p.songIds.length} canciones</small></div>
   <div class="btns"><button data-a="plplay" aria-label="Reproducir">▶</button><button data-a="plren" aria-label="Renombrar">✎</button><button data-a="pldel" aria-label="Eliminar">🗑</button></div></div>`).join('')||'<p class="mut">Aún no tienes listas. Crea una y añade canciones desde la biblioteca.</p>');}
 }else if(ui.view==='set')vSet();else vIdeas();
}
function fillList(){
 const q=ui.q.toLowerCase();
 const f=S.songs.filter(s=>(!ui.g||s.genres.includes(ui.g))&&(!ui.t||s.type===ui.t)&&(!ui.fav||s.fav)&&(ui.ar===null||(s.artist||'')===ui.ar)&&(!ui.l||ini(s.artist)===ui.l)&&
  (!q||[s.title,s.artist,s.notes,s.genres.join(' ')].join(' ').toLowerCase().includes(q)));
 f.sort(ui.sort==='recent'?(a,b)=>b.added-a.added:ui.sort==='artist'?(a,b)=>cmp(a.artist,b.artist)||cmp(a.title,b.title):(a,b)=>cmp(a.title,b.title));
 ui.ctx=f.map(s=>s.id);const sh=f.slice(0,ui.lim);
 $('#list').innerHTML=`<div class="bar" style="align-items:center"><small style="flex:1">${f.length} de ${S.songs.length} canciones</small><button data-a="lc">🎧 Local</button>${f.length?'<button data-a="playall">Reproducir todo</button>':''}</div>`+
  sh.map(s=>row(s)).join('')+(f.length>sh.length?`<button data-a="more" style="width:100%;margin-top:6px">Mostrar más (${f.length-sh.length} restantes)</button>`:'')+
  (!f.length?`<p class="mut">${S.songs.length?'No hay canciones con estos filtros.':'Biblioteca vacía. Pulsa ＋ y pega enlaces de YouTube, o 🎧 Local para tus MP3.'}</p>`:'')}
const refresh=()=>ui.view==='lib'?fillList():(ui.view==='ideas'||ui.view==='set')?0:render();
function vArt(){
 const mp=new Map();S.songs.forEach(s=>{const a=s.artist||'';mp.set(a,(mp.get(a)||0)+1)});
 const L=[...mp].filter(([a])=>!ui.al||ini(a)===ui.al).sort((x,y)=>cmp(x[0]||'~',y[0]||'~'));
 $('#main').innerHTML=`<h2>Artistas</h2>${az('al')}`+(L.map(([a,n])=>`<div class="row c" data-ar="${esc(a)}"><div class="inf" data-a="arsel" style="cursor:pointer"><b>${esc(a||'Sin artista')}</b><small>${n} canciones</small></div><div class="btns"><button data-a="arplay" aria-label="Reproducir">▶</button></div></div>`).join('')||'<p class="mut">Aún no hay artistas.</p>')}
function vGen(){
 $('#main').innerHTML=`<div class="bar"><h2 style="flex:1;margin:0">Géneros</h2><button class="pri" data-a="gnew">Nuevo género</button></div>`+
 (genres().map(g=>`<div class="row c" data-g="${esc(g)}"><div class="inf" data-a="gsel" style="cursor:pointer"><b>${esc(g)}</b><small>${S.songs.filter(s=>s.genres.includes(g)).length} canciones</small></div><div class="btns"><button data-a="gplay" aria-label="Reproducir">▶</button><button data-a="gren" aria-label="Renombrar">✎</button><button data-a="gdel" aria-label="Quitar">🗑</button></div></div>`).join('')||'<p class="mut">Sin géneros. Crea el primero con «Nuevo género».</p>')}
function vSet(){const b=bk(),d=b.t?new Date(b.t).toLocaleDateString('es-ES'):'nunca';
 const sel=(id,c,o)=>`<select id="${id}">${opts(o,c)}</select>`;
 $('#main').innerHTML=`<h2>Ajustes</h2>`+
 det('rp','Reproducción',`<label>Qué reproducir</label>${sel('p-src',prefs.src,[['all','Local y YouTube'],['local','Solo local (MP3)'],['yt','Solo YouTube']])}<label>Aleatorio</label>${sel('p-sh',prefs.sh?'1':'0',[['0','No'],['1','Sí']])}<label>Repetir</label>${sel('p-rep',prefs.rep,[['off','No'],['all','Toda la cola'],['one','Una canción']])}`,true)+

const au=new Audio(),FILES=new Map();
const isL=s=>!!s&&s.src==='local',AUD=/\.(mp3|m4a|aac|flac|ogg|opus|wav)$/i,fk=f=>f.name+'|'+f.size;
const ok=s=>!!s&&!((prefs.src==='local'&&!isL(s))||(prefs.src==='yt'&&isL(s)))&&(isL(s)?FILES.has(s.fk):navigator.onLine);
const ico=s=>isL(s)?'<span class="src lo" title="Local">♪</span>':'<span class="src" title="YouTube">▶</span>';
const det=(k,t,b,o)=>`<details class="sec" data-k="${k}"${(ui.open[k]??o)?' open':''}><summary>${t}</summary>${b}</details>`;
const ytScript=()=>{if((window.YT&&YT.Player)||$('#ytapi'))return;document.head.append(Object.assign(document.createElement('script'),{id:'ytapi',src:'https://www.youtube.com/iframe_api',onerror(){this.remove()}}))};
ytScript();addEventListener('online',ytScript);
window.onYouTubeIframeAPIReady=()=>{P=new YT.Player('yt',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0},
 events:{onReady:()=>{ready=true;if(Q.length&&qi>=0&&!isL(cur()))load()},
  onStateChange:e=>{if(isL(cur()))return;const t=e.data;if(t===0){stopWd();ended()}else if(t===1){stopWd();onPlay()}else if(t===2)stopWd();else if(t===3||t===-1)startWd()},onError:e=>perr(e.data)}})};
const cur=()=>byId(Q[qi]);
const stopWd=()=>{clearTimeout(wd);wd=0};
const startWd=()=>{if(wd)return;wd=setTimeout(()=>{wd=0;const s=cur();if(s&&!isL(s))skip(navigator.onLine?'no responde':'sin conexión')},navigator.onLine?7000:2000)};
function pick(d,auto){const n=Q.length;
 if(d>0&&prefs.sh&&n>1){const c=Q.map((_,i)=>i).filter(i=>i!==qi&&ok(byId(Q[i])));return c.length?c[Math.random()*c.length|0]:-1}
 for(let k=1;k<=n;k++){let i=qi+d*k;if(i>=n){if(!(prefs.rep==='all'||!auto))return -1;i%=n}if(i<0)return -1;if(ok(byId(Q[i])))return i}
 return -1}
function media(s){const m=navigator.mediaSession;if(!m)return;try{m.metadata=new MediaMetadata({title:s.title,artist:s.artist||''});
 [['play',toggle],['pause',toggle],['previoustrack',prev],['nexttrack',()=>next(false)]].forEach(([a,f])=>m.setActionHandler(a,f))}catch{}}
function toggle(){const s=cur();if(!s){if(ui.ctx.length)startQ(ui.ctx,0);return}

function startQ(ids,i){Q=[...ids];qi=i;errs=0;
 if(!ok(cur())){const j=pick(1,false);if(j<0){Q=[];qi=-1;upd();toast('Ahora mismo no se puede reproducir nada de esta lista (sin conexión o MP3 sin conectar)');return}qi=j}load()}
function load(){const s=cur();if(!s)return;stopWd();$('#vidbox').classList.toggle('local',isL(s));upd();refresh();media(s);
 if(isL(s)){if(ready)try{P.stopVideo()}catch{}
  if(urlL)URL.revokeObjectURL(urlL);urlL=URL.createObjectURL(FILES.get(s.fk));au.src=urlL;
  au.play().catch(e=>{if(e.name==='NotAllowedError')toast('Toca ⏯ para reproducir');else if(e.name!=='AbortError')skip('no se puede reproducir')})}
 else{au.pause();if(ready)P.loadVideoById(s.vid);else toast(navigator.onLine?'Cargando el reproductor…':'Sin conexión');startWd()}}
au.onplaying=()=>{errs=0;stopWd();const s=cur();if(isL(s)&&!s.dur&&isFinite(au.duration)){s.dur=Math.round(au.duration);put('songs',s,1);refresh()}};

function onPlay(){const s=cur();if(!s)return;errs=0;let ch=false;
 const d=Math.round(P.getDuration()||0);if(d>0&&!s.dur){s.dur=d;ch=true}
 const vd=P.getVideoData&&P.getVideoData();if(vd&&vd.title&&/^Vídeo /.test(s.title)){s.title=vd.title;ch=true}
 if(s.bad){s.bad='';ch=true}
 if(ch){put('songs',s,1);upd();refresh()}}
function skip(why,bad){const s=cur();if(!s)return;stopWd();if(bad){s.bad=bad;put('songs',s,1)}toast('«'+s.title+'»: '+why+'. Paso a la siguiente.');

function ended(){if(prefs.rep==='one'){if(isL(cur())){au.currentTime=0;au.play()}else{P.seekTo(0);P.playVideo()}return}next(true)}

let seeking=false;
function durNow(){const s=cur();try{const d=isL(s)?au.duration:(ready?P.getDuration():0);return isFinite(d)?(d||0):0}catch{return 0}}
setInterval(()=>{if(seeking)return;const s=cur(),sk=$('#seek');sk.disabled=!s;
 if(!s){sk.value=0;$('#tcur').textContent='0:00';$('#tdur').textContent='–:–';return}
 let t=0;try{t=(isL(s)?au.currentTime:ready?P.getCurrentTime():0)||0}catch{}const d=durNow();
 sk.value=d?Math.round(t/d*10000):0;$('#tcur').textContent=fmt(t);$('#tdur').textContent=d?fmt(d):'–:–'},500);
$('#seek').addEventListener('input',e=>{seeking=true;$('#tcur').textContent=fmt(e.target.value/10000*durNow())});
$('#seek').addEventListener('change',e=>{const s=cur(),d=durNow();if(s&&d){const x=e.target.value/10000*d;if(isL(s))au.currentTime=x;else if(ready)P.seekTo(x,true)}seeking=false});

async function importJSON(f){

 const rep=confirm('Aceptar: REEMPLAZAR todo lo actual por la copia.\nCancelar: FUSIONAR la copia con lo que ya tienes.');
 if(rep){for(const n of Object.keys(S)){await clr(n);S[n]=[]}}
 const map={};for(const g of j.genres||[])if(!S.genres.some(x=>x.id===g.id)){S.genres.push({id:g.id});put('genres',{id:g.id},1)}
 for(const s of j.songs){const ex=S.songs.find(x=>s.src==='local'?x.fk===s.fk:(x.src!=='local'&&x.vid===s.vid));if(ex){map[s.id]=ex.id;continue}

  map[s.id]=n.id;S.songs.push(n);put('songs',n)}
 for(const p of j.playlists||[]){const n={id:p.id,name:p.name,songIds:(p.songIds||[]).map(i=>map[i]).filter(Boolean)};
  const k=S.playlists.findIndex(x=>x.id===n.id);k>=0?S.playlists[k]=n:S.playlists.push(n);put('playlists',n)}

/* ---------- Música local ---------- */
async function tags(f){try{const b=new Uint8Array(await f.slice(0,65536).arrayBuffer());
 if(b[0]!==73||b[1]!==68||b[2]!==51||b[3]<3)return{};const v=b[3],end=Math.min(b.length,10+(((b[6]&127)<<21)|((b[7]&127)<<14)|((b[8]&127)<<7)|(b[9]&127))),o={};let p=10;
 while(p+10<end){const id=String.fromCharCode(...b.slice(p,p+4));if(!/^[A-Z0-9]{4}$/.test(id))break;
  const n=v===4?((b[p+4]&127)<<21)|((b[p+5]&127)<<14)|((b[p+6]&127)<<7)|(b[p+7]&127):b[p+4]*16777216+b[p+5]*65536+b[p+6]*256+b[p+7];
  if(['TIT2','TPE1','TDRC','TYER'].includes(id)&&n>1){const e=b[p+10];
   o[id]=new TextDecoder(e===1?'utf-16':e===2?'utf-16be':e===3?'utf-8':'iso-8859-1').decode(b.slice(p+11,p+10+n)).replace(/\0/g,'').trim()}
  p+=10+n}
 return o}catch{return{}}}
async function loadLocal(fs){const L=fs.filter(f=>AUD.test(f.name));if(!L.length){toast('No he encontrado archivos de audio');return}
 const have=new Set(S.songs.filter(isL).map(s=>s.fk)),nu=[];
 for(let i=0;i<L.length;i++){const f=L[i],k=fk(f);FILES.set(k,f);
  if(!have.has(k)){have.add(k);const t=await tags(f);
   nu.push({id:uid()+i.toString(36),src:'local',fk:k,fname:f.name,title:t.TIT2||f.name.replace(/\.[^.]+$/,''),artist:t.TPE1||'',type:'canción',genres:['MP3','Nuevas'],year:(t.TDRC||t.TYER||'').slice(0,4),notes:'',fav:false,dur:0,bad:'',added:Date.now()})}
  if(i%25===24){toast(`Leyendo ${i+1} de ${L.length}…`);await new Promise(r=>setTimeout(r))}}
 if(nu.length){const st=db.transaction('songs','readwrite').objectStore('songs');nu.forEach(s=>st.put(s));S.songs.push(...nu);bump();
  ['MP3','Nuevas'].forEach(g=>{if(!S.genres.some(x=>x.id===g)){S.genres.push({id:g});put('genres',{id:g},1)}})}
 toast(`${L.length} conectadas, ${nu.length} nuevas`);render();upd()}
function localDlg(){const d=$('#dlg'),l=S.songs.filter(isL),c=l.filter(s=>FILES.has(s.fk)).length;d.pk=null;
 d.innerHTML=`<h3>Música local</h3><p class="mut">${l.length} canciones locales, ${c} conectadas. Las nuevas se añaden a la biblioteca y las que ya conozco se reconectan. Los MP3 no se copian ni se suben a ningún sitio.</p><div style="display:grid;gap:6px"><button class="pri" data-m="d">📁 Elegir carpeta</button><button data-m="f">🎵 Elegir archivos</button></div><div class="end"><button data-x="c">Cerrar</button></div>`;
 d.onclick=e=>{const m=e.target.dataset.m;if(e.target.dataset.x==='c')d.close();if(m==='d')$('#fd').click();if(m==='f')$('#ff').click()};d.showModal()}
['#fd','#ff'].forEach(i=>$(i).addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';const d=$('#dlg');if(d.open)d.close();loadLocal(f)}));

/* ---------- Eventos ---------- */
const reset=()=>{ui.lim=60};
const idsBy=f=>S.songs.filter(f).sort((a,b)=>cmp(a.title,b.title)).map(s=>s.id);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 const id=b.closest('[data-id]')?.dataset.id,s=id&&byId(id),pid=b.closest('[data-pl]')?.dataset.pl,p=pid&&S.playlists.find(x=>x.id===pid),
  cp=S.playlists.find(x=>x.id===ui.pl),gn=b.closest('[data-g]')?.dataset.g,iid=b.closest('[data-i]')?.dataset.i,idea=iid&&S.ideas.find(x=>x.id===iid),ar=b.closest('[data-ar]')?.dataset.ar;
 switch(a){
 case'undo':{const f=toast.u;$('#toast').style.display='none';if(f)f()}break;
 case'tab':ui.view=b.dataset.v;if(ui.view!=='pls')ui.pl=null;render();break;
 case'play':if(isL(s)&&!FILES.has(s.fk))localDlg();else startQ(ui.ctx,ui.ctx.indexOf(id));break;
 case'playall':if(ui.ctx.length)startQ(ui.ctx,0);break;
 case'fav':s.fav=!s.fav;put('songs',s);refresh();break;
 case'favf':ui.fav=!ui.fav;reset();render();break;
 case'add':addDlg();break;
 case'menu':menuDlg(s);break;
 case'filt':ui.fo=!ui.fo;render();break;
 case'more':ui.lim+=60;fillList();break;
 case'az':ui[b.dataset.k]=b.dataset.l;reset();render();break;
 case'clr':if(b.dataset.k==='ar')ui.ar=null;else ui.g='';reset();render();break;
 case'arsel':ui.ar=ar;ui.l='';reset();ui.view='lib';render();break;
 case'arplay':{const i=idsBy(x=>(x.artist||'')===ar);if(i.length)startQ(i,0)}break;
 case'gsel':ui.g=gn;reset();ui.view='lib';render();break;
 case'gplay':{const i=idsBy(x=>x.genres.includes(gn));if(i.length)startQ(i,0);else toast('No hay canciones en este género')}break;
 case'gnew':nameDlg('Nuevo género','',v=>{if(!genres().some(g=>g.toLowerCase()===v.toLowerCase())){S.genres.push({id:v});put('genres',{id:v})}render()});break;
 case'gren':nameDlg('Renombrar género',gn,v=>{S.songs.forEach(x=>{if(x.genres.includes(gn)){x.genres=[...new Set(x.genres.map(g=>g===gn?v:g))];put('songs',x)}});
  S.genres=S.genres.filter(g=>g.id!==gn);del('genres',gn);if(!S.genres.some(g=>g.id===v)){S.genres.push({id:v});put('genres',{id:v})}if(ui.g===gn)ui.g=v;render()});break;
 case'gdel':destroy(()=>{S.songs.forEach(x=>{if(x.genres.includes(gn)){x.genres=x.genres.filter(g=>g!==gn);put('songs',x)}});S.genres=S.genres.filter(g=>g.id!==gn);del('genres',gn);if(ui.g===gn)ui.g=''},'Género «'+gn+'» eliminado');render();break;
 case'plnew':nameDlg('Nueva lista','',v=>{const l={id:uid(),name:v,songIds:[]};S.playlists.push(l);put('playlists',l);render()});break;
 case'plopen':ui.pl=pid;render();break;
 case'plback':ui.pl=null;render();break;
 case'plplay':{const ids=p.songIds.filter(byId);if(ids.length)startQ(ids,0);else toast('La lista está vacía')}break;
 case'plren':nameDlg('Renombrar lista',p.name,v=>{p.name=v;put('playlists',p);render()});break;
 case'pldel':destroy(()=>{S.playlists=S.playlists.filter(x=>x!==p);del('playlists',p.id)},'Lista «'+p.name+'» eliminada');render();break;
 case'up':case'down':{const i=cp.songIds.indexOf(id),j=a==='up'?i-1:i+1;if(j>=0&&j<cp.songIds.length){[cp.songIds[i],cp.songIds[j]]=[cp.songIds[j],cp.songIds[i]];put('playlists',cp);render()}}break;
 case'rem':destroy(()=>{cp.songIds=cp.songIds.filter(i=>i!==id);put('playlists',cp)},'Quitada de la lista');render();break;
 case'exp':exportJSON();toast('Copia descargada');if(ui.view==='set')render();break;
 case'imp':$('#file').click();break;case'lc':localDlg();break;
 case'bkgo':exportJSON();$('#bk').innerHTML='';toast('Copia descargada');break;
 case'bkno':$('#bk').innerHTML='';break;
 case'vid':{const v=$('#vidbox');v.classList.toggle('hide');b.classList.toggle('on',!v.classList.contains('hide'))}break;
 case'pladd':if(cp)plAddDlg(cp);break;
 case'ideasgo':ui.view='ideas';render();break;
 case'ideaadd':{const t=$('#in').value;if(!t.trim())return;const i={id:uid(),text:t,done:false,date:Date.now()};S.ideas.push(i);put('ideas',i);ui.draft='';render()}break;
 case'ideatog':idea.done=!idea.done;put('ideas',idea);render();break;
 case'ideaedit':ideaDlg(idea);break;
 case'ideadel':destroy(()=>{S.ideas=S.ideas.filter(x=>x!==idea);del('ideas',idea.id)},'Idea borrada');render();break;
 case'pp':toggle();break;
 case'nxt':next(false);break;
 case'prv':prev();break;
 case'shf':prefs.sh=!prefs.sh;savePrefs();upd();break;
 case'rep':prefs.rep={off:'all',all:'one',one:'off'}[prefs.rep];savePrefs();upd();toast({off:'Repetir: no',all:'Repetir: todo',one:'Repetir: una canción'}[prefs.rep]);break;
 }});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;reset();fillList()}else if(e.target.id==='in')ui.draft=e.target.value});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)ui.open[k]=e.target.open},true);
document.addEventListener('change',e=>{const i=e.target.id,v=e.target.value;
 if(i==='p-sh'){prefs.sh=v==='1';savePrefs();upd();return}
 if(i==='p-rep'){prefs.rep=v;savePrefs();upd();return}
 if(i==='p-src'){prefs.src=v;savePrefs();return}
 if(i==='p-th'){prefs.theme=v;savePrefs();applyTheme();return}
 if(i==='g')ui.g=v;else if(i==='t')ui.t=v;else if(i==='so')ui.sort=v;else return;reset();fillList()});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value=''});

(async()=>{try{await openDB();for(const n of Object.keys(S))S[n]=await getAll(n)}catch{toast('No se puede usar el almacenamiento del navegador')}
 render();upd();chkBk()})();
</script>
</body>
</html>
