<body><div class=top><header><span><b>🅿️ Garajes</b> <small id=ver></small></span><span><button id=lkn hidden onclick="lockNow()" title="Bloquear ahora" aria-label="Bloquear ahora">🔐</button><button id=lk onclick="tog()"></button></span></header><div id=upd hidden><span>Hay una versión nueva de la app</span><button>Actualizar</button></div><nav><button id=t0 onclick="go(0)">Panel</button><button id=t1 onclick="go(1)">Inquilinos</button><button id=t2 onclick="go(2)">Pagos</button><button id=t3 onclick="go(3)">Informes</button><button id=t4 onclick="go(4)">Ajustes</button></nav></div><main id=v></main><dialog id=dlg></dialog><div id=lock hidden></div><div id=ts popover=manual hidden></div>
<script>
const VER='8.0.0',APP='Garajes',FN='garajes',APPS=['Garajes'];
const K='garajes_v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const defaults=()=>({plazas:[],contratos:[],pagos:[],ideas:[],ultimaCopia:null,ch:0,cfg:{gracia:15,modo:'dias',orden:'asc',bkDias:30,bkCambios:1,lugares:['Viene a mi casa','Voy a su oficina','Bizum / transferencia'],plantilla:'Hola {nombre}, te recuerdo el pago de la plaza {plaza} ({meses}): {importe}. Gracias.'}});
function norm(d){const x=defaults();x.cfg=Object.assign(x.cfg,d.cfg);const{app,ver,fecha,...r}=d;return Object.assign(x,r,{cfg:x.cfg})}
let S=defaults(),tab=0,flt='act',fi='todos',fpg='todos',F={pl:'',c:'',d:'',h:'',m:'',b:'cobro',p:''},OPEN={};
/* guardado: la app trabaja en memoria y escribe en IndexedDB (cifrado si está activado) en una cola ordenada */
let WQ=Promise.resolve(),BOOTED=false,BAD=false,STALE=false,SAVERR=false,LSM=false,DB=null,DEK=null;
function save(noch){if(!BOOTED||BAD||STALE)return;if(!noch)S.ch=(S.ch||0)+1;const j=JSON.stringify(S);WQ=WQ.then(()=>persist(j)).catch(e=>{if(e=='stale'){if(!STALE){STALE=true;alert('La seguridad de la app se ha cambiado en otra ventana o pestaña. Recarga la app: hasta entonces no se guardará nada aquí.')}}else if(!SAVERR){SAVERR=true;alert('⚠️ No se pudo guardar: '+((e&&e.message)||e))}})}
const flush=()=>WQ;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(+n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ym=d=>d.slice(0,7);
const addM=(m,n)=>{let[y,o]=m.split('-').map(Number);o+=n-1;y+=Math.floor(o/12);o=((o%12)+12)%12;return y+'-'+String(o+1).padStart(2,'0')};
const mlabel=m=>['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m.slice(5)-1]+' '+m.slice(2,4);
const plaza=id=>S.plazas.find(p=>p.id==id),contr=id=>S.contratos.find(c=>c.id==id),pagosC=c=>S.pagos.filter(p=>p.c==c.id);
const fechaC=c=>c.inicio||pagosC(c).map(p=>p.f).sort()[0]||'9999';
const fp=p=>S.contratos.filter(c=>c.pl==p.id).map(fechaC).sort()[0]||'9999-'+p.num;
function migra(){if(S.cfg.ordenPlazas)return;S.plazas.sort((a,b)=>fp(a).localeCompare(fp(b))*(S.cfg.orden=='asc'?1:-1));S.cfg.ordenPlazas=1;save(1)}
const activo=p=>S.contratos.filter(c=>c.pl==p.id&&!(c.fin&&c.fin<today())).sort((a,b)=>fechaC(b).localeCompare(fechaC(a)))[0];
function cubiertos(c){const m={};(c.libres||[]).forEach(x=>m[x]='libre');pagosC(c).forEach(p=>(p.meses||[]).forEach(x=>m[x]=p.id));return m}
const ini=c=>c.inicio?ym(c.inicio):(Object.keys(cubiertos(c)).sort()[0]||ym(today()));
function pend(c){const cov=cubiertos(c),t=ym(today()),e=c.fin&&ym(c.fin)<t?ym(c.fin):t,L=[];let m=ini(c);while(m<=e&&L.length<600){if(!cov[m])L.push(m);m=addM(m,1)}return L}
function estado(c){const P=pend(c);if(!P.length)return{k:'verde',t:'Al día',P};const d=Math.floor((new Date(today())-new Date(P[0]+'-01'))/864e5),g=c.gracia??S.cfg.gracia;return d<=g?{k:'amarillo',t:'Pendiente · gracia ('+d+' d)',P}:{k:'rojo',t:'Reclamar ('+d+' d)',P}}
function dlBlob(bl,name){const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4)}
function dl(txt,name,type){dlBlob(new Blob([txt],{type}),name)}
function modal(h){const d=$('#dlg');d.innerHTML='<div class=mb><button class="x s" aria-label="Cerrar" onclick="cerrar()">✕</button>'+h+'</div>';if(!d.open)d.showModal();d.firstChild.scrollTop=0}
const cerrar=()=>{const d=$('#dlg');d.close();d.innerHTML=''},go=n=>{tab=n;render()};
$('#dlg').addEventListener('close',e=>{if(!e.target.open)e.target.innerHTML=''});
let TT;function toast(m,ms=1800){const e=$('#ts');clearTimeout(TT);const hide=()=>{try{e.hidePopover()}catch{}e.hidden=true};if(!m)return hide();e.textContent=m;e.hidden=false;try{e.hidePopover()}catch{}try{e.showPopover()}catch{}TT=setTimeout(hide,ms)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;(document.querySelector('dialog[open]')||document.body).appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copiado')}
const mb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
let ed=false;
const back=id=>ed?fContrato(id):cerrar();
function tog(){ed=!ed;if(!ed&&(tab==1||tab==4))tab=0;if($('#dlg').open)cerrar();render()}
function render(){if(!BOOTED)return;document.body.classList.toggle('ed',ed);$('#lk').textContent=ed?'🔓 Edición':'🔒 Gestión';$('#lkn').hidden=!lockOn();$('#t1').hidden=$('#t4').hidden=!ed;[0,1,2,3,4].forEach(i=>$('#t'+i).classList.toggle('on',i==tab));$('#v').innerHTML=[vPanel,vInq,vPag,vInf,vCfg][tab]()}
function libreDesde(p){const f=S.contratos.filter(c=>c.pl==p.id&&c.fin).map(c=>c.fin).sort().pop();return f?' desde '+fd(f):''}
function subida(p){const h=(p.hist||[]).map(x=>x.f).sort().pop();if(!h)return '';const m=Math.round((new Date(today())-new Date(h))/2.63e9);return ' · última subida hace '+m+' m'+(m>=12?' ⚠️':'')}
const finC=c=>!!(c.fin&&c.fin<today());
function vInq(){const nV=S.contratos.filter(c=>!finC(c)).length,nF=S.contratos.length-nV,L=S.contratos.filter(c=>fi=='vig'?!finC(c):fi=='fin'?finC(c):true).sort((a,b)=>fechaC(a).localeCompare(fechaC(b))*(S.cfg.orden=='asc'?1:-1));
 return `<div class=bar><button onclick="fContrato('')">+ Nuevo inquilino</button></div><div class=vis><span>👁 Mostrar</span><select onchange="fi=this.value;render()"><option value=vig ${so(fi,'vig')}>Inquilinos vigentes (${nV})</option><option value=fin ${so(fi,'fin')}>Inquilinos finalizados (${nF})</option><option value=todos ${so(fi,'todos')}>Todos (${S.contratos.length})</option></select></div>`+(L.map(c=>{const p=plaza(c.pl),fin=c.fin&&c.fin<today(),e=fin?{k:'',t:'Finalizado'}:estado(c);return `<div class="card pl ${e.k}"><b>${esc(c.nom||'Sin nombre')}</b> · Plaza ${esc(p?p.num:'?')} <span class="bd ${e.k}">${e.t}</span><br><small>${fd(c.inicio)} → ${c.fin?fd(c.fin):'vigente'} · paga cada ${c.per||1} mes(es) · 📍 ${esc(c.lugar||'sin lugar')}${c.tel?' · '+esc(c.tel):''}</small><br><button onclick="fContrato('${c.id}')">Abrir ficha</button><button onclick="fPago('${c.id}')">Cobrar</button>${fin?'':`<button class=s onclick="fMsg('${c.id}')">Mensaje</button>`}</div>`}).join('')||'<p>'+(S.contratos.length?'No hay inquilinos con este filtro.':'Aún no hay inquilinos. Crea una plaza y pulsa «+ Nuevo inquilino».')+'</p>')}
function vPag(){const nm=c=>c.nom||'Sin nombre',cur=S.contratos.filter(c=>!finC(c)).sort((a,b)=>nm(a).localeCompare(nm(b),'es')),
 ok=p=>{const c=contr(p.c);if(fpg=='todos')return true;if(!c)return false;if(fpg=='act')return !finC(c);if(fpg=='ant')return finC(c);return c.id==fpg.slice(2)};
 if(fpg.startsWith('c:')&&!cur.some(c=>c.id==fpg.slice(2)))fpg='todos';
 const L=S.pagos.filter(ok).sort((a,b)=>a.f.localeCompare(b.f)*(S.cfg.orden=='asc'?1:-1));
 return `<div class=bar><button onclick="fElegir()">+ Registrar pago</button></div><div class=vis><span>👁 Mostrar pagos de</span><select onchange="fpg=this.value;render()"><option value=act ${so(fpg,'act')}>Todos los actuales</option>${cur.map(c=>`<option value="c:${c.id}" ${so(fpg,'c:'+c.id)}>${esc(nm(c))} (plaza ${esc(plaza(c.pl)?.num)})</option>`).join('')}<option value=ant ${so(fpg,'ant')}>Todos los antiguos</option><option value=todos ${so(fpg,'todos')}>Todos</option></select></div>`+(L.map(p=>{const c=contr(p.c),pl=c&&plaza(c.pl);return `<div class="card row" onclick="fPago('${p.c}','','${p.id}')"><span>${fd(p.f)} · Plaza ${esc(pl?pl.num:'?')} · ${esc(c?c.nom||'Sin nombre':'?')}<br><small>${esc(p.m)}${(p.meses||[]).length?' · '+p.meses.map(mlabel).join(', '):''}${p.nota?' · '+esc(p.nota):''}</small></span><b>${eur(p.i)}</b></div>`}).join('')||'<p>'+(S.pagos.length?'No hay pagos con este filtro.':'Aún no hay pagos.')+'</p>')}
function fElegir(){if(!S.contratos.length)return alert('Primero añade un inquilino.');modal(`<h3>¿Quién paga?</h3>${S.contratos.slice().sort((a,b)=>fechaC(a).localeCompare(fechaC(b))).map(c=>`<div class=row onclick="fPago('${c.id}')"><span>${esc(c.nom||'Sin nombre')}</span><small>Plaza ${esc(plaza(c.pl)?.num)}${c.fin&&c.fin<today()?' · finalizado':''}</small></div>`).join('')}<button class=s onclick="cerrar()">Cancelar</button>`)}
let visIds=[];
const so=(a,b)=>a==b?'selected':'';
function mv(id,d){const i=visIds.indexOf(id),o=visIds[i+d];if(i<0||!o)return;const p=S.plazas.find(x=>x.id==id);S.plazas=S.plazas.filter(x=>x.id!=id);const k=S.plazas.findIndex(x=>x.id==o);S.plazas.splice(d>0?k+1:k,0,p);save();render();const e=document.querySelector('[data-id="'+id+'"]');if(e)e.scrollIntoView({block:'nearest'})}
function vPanel(){
 const R=S.plazas.map(p=>{const c=activo(p);return{p,c,e:c?estado(c):null}}),A=R.filter(r=>!r.p.inactiva),I=R.filter(r=>r.p.inactiva);
 const mes=S.pagos.filter(p=>ym(p.f)==ym(today())).reduce((s,p)=>s+p.i,0),n=k=>A.filter(r=>r.e&&r.e.k==k).length;
 const V={act:A,alq:A.filter(r=>r.c),pend:A.filter(r=>r.e&&r.e.k!='verde'),inact:I,todas:R}[flt]||A;visIds=V.map(r=>r.p.id);
 const w=bkDue(1),aviso=(BAD?'<div class="warn err">⚠️ Los datos guardados en este móvil no se pudieron leer. No se guardará nada hasta que restaures una copia (modo edición › Ajustes › Copias de seguridad).</div>':'')+(w?`<div class=warn style="cursor:pointer" onclick="bkAsk(1)">💾 ${esc(w)} Toca aquí para hacer una copia.</div>`:'')+(SEG?.vf?'':`<div class=card style="cursor:pointer" onclick="segPw()">🔐 <b>Activa la seguridad</b><br><small>Contraseña maestra, huella, copias cifradas y datos cifrados en el móvil</small></div>`);

/* protocolo: POST (cuerpo JSON, nunca en la URL) con firma HMAC-SHA256; la clave solo firma, no se envía */
const hmac=async(k,m)=>hex(await crypto.subtle.sign('HMAC',await crypto.subtle.importKey('raw',te.encode(k),{name:'HMAC',hash:'SHA-256'},false,['sign']),te.encode(m)));

const BRIDGE="/**\n * PUENTE DRIVE PARA COPIAS CIFRADAS \u00b7 versi\u00f3n 1\n *\n * Qu\u00e9 hace: recibe trozos de archivos YA CIFRADOS por la app y los guarda en\n *   Mi unidad / Apps / Backups / <carpeta de la app> / <copia> / 0001.part, 0002.part\u2026\n * Seguridad:\n *   - Todo va por HTTPS (script.google.com no admite HTTP).\n *   - La clave del puente (SECRET) NO viaja nunca, ni en la URL ni en el cuerpo:\n *     cada petici\u00f3n lleva una firma HMAC-SHA256 que se calcula con ella.\n *   - Hora y n\u00famero de un solo uso (nonce): una petici\u00f3n capturada no se puede repetir.\n *   - El contenido ya llega cifrado de extremo a extremo (AES-GCM con tu contrase\u00f1a maestra):\n *     ni el puente ni Google pueden leerlo.\n * Clave SECRET: Configuraci\u00f3n del proyecto (engranaje) > Propiedades de la secuencia de\n *   comandos > A\u00f1adir propiedad: nombre SECRET, valor = la clave que genera la app (m\u00edn. 16).\n * Implementaci\u00f3n: Implementar > Nueva implementaci\u00f3n > Aplicaci\u00f3n web >\n *   Ejecutar como: Yo \u00b7 Qui\u00e9n tiene acceso: Cualquier usuario.\n */\nconst VERSION = 1;\nconst ROOT = ['Apps', 'Backups'];\nconst SKEW = 600000;       // margen de hora: 10 min\nconst MAXD = 6000000;      // m\u00e1x. caracteres base64 por petici\u00f3n (~4,5 MB)\nconst SUB = '_subiendo_';  // prefijo de copias a medio subir\nconst ID = /^[0-9A-Za-z_-]{6,80}$/;\n\nfunction doGet() { return out_({ ok: 0, e: 'post' }); }\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction hex_(b) {\n  return b.map(function (x) { return ('0' + (x & 255).toString(16)).slice(-2); }).join('');\n}\nfunction sha_(s) {\n  return hex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, s, Utilities.Charset.UTF_8));\n}\nfunction same_(a, b) {\n  if (a.length !== b.length) return false;\n  var r = 0;\n  for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);\n  return r === 0;\n}\nfunction nm_(i) { return ('0000' + i).slice(-4) + '.part'; }\nfunction int_(x, a, b) { return typeof x === 'number' && (x | 0) === x && x >= a && x <= b; }\n\nfunction rootF_() {\n  var f = DriveApp.getRootFolder();\n  ROOT.forEach(function (n) {\n    var it = f.getFoldersByName(n);\n    f = it.hasNext() ? it.next() : f.createFolder(n);\n  });\n  return f;\n}\nfunction appF_(app) {\n  var r = rootF_(), it = r.getFoldersByName(app);\n  return it.hasNext() ? it.next() : r.createFolder(app);\n}\nfunction sub_(af, name, create) {\n  var it = af.getFoldersByName(name);\n  if (it.hasNext()) return it.next();\n  return create ? af.createFolder(name) : null;\n}\nfunction desc_(f) {\n  try { var d = JSON.parse(f.getDescription() || ''); return d && d.t ? d : null; } catch (x) { return null; }\n}\n\nfunction doPost(e) {\n  try {\n    var q;\n    try { q = JSON.parse(e.postData.contents); } catch (x) { return out_({ ok: 0, e: 'bad' }); }\n    if (!q || q.v !== 1 || typeof q.a !== 'string' || typeof q.app !== 'string' || typeof q.ts !== 'number' ||\n        typeof q.n !== 'string' || typeof q.ps !== 'string' || typeof q.s !== 'string') return out_({ ok: 0, e: 'bad' });\n    var sec = PropertiesService.getScriptProperties().getProperty('SECRET');\n    if (!sec || sec.length < 16) return out_({ ok: 0, e: 'nosecret' });\n    var d = typeof q.d === 'string' ? q.d : '';\n    if (d.length > MAXD) return out_({ ok: 0, e: 'big' });\n    // 1) firma (todo lo firmado es ASCII)\n    var msg = ['1', q.a, q.app, q.ts, q.n, q.ps, d ? sha_(d) : ''].join('|');\n    var sig = hex_(Utilities.computeHmacSha256Signature(msg, sec));\n    if (!same_(sig, q.s)) { Utilities.sleep(1500); return out_({ ok: 0, e: 'auth' }); }\n    // 2) hora y repetici\u00f3n\n    if (Math.abs(Date.now() - q.ts) > SKEW) return out_({ ok: 0, e: 'ts' });\n    var cache = CacheService.getScriptCache();\n    if (!/^[0-9a-f]{32}$/.test(q.n) || cache.get('n' + q.n)) return out_({ ok: 0, e: 'rep' });\n    cache.put('n' + q.n, '1', 1500);\n    if (!/^[a-z0-9_-]{2,40}$/.test(q.app)) return out_({ ok: 0, e: 'app' });\n    var p;\n    try { p = JSON.parse(q.ps); } catch (x) { return out_({ ok: 0, e: 'bad' }); }\n    if (!p || typeof p !== 'object') p = {};\n    // 3) acci\u00f3n (de una en una)\n    var lock = LockService.getScriptLock();\n    if (!lock.tryLock(25000)) return out_({ ok: 0, e: 'busy' });\n    try { return act_(q.a, q.app, p, d); } finally { try { lock.releaseLock(); } catch (x) { } }\n  } catch (err) {\n    return out_({ ok: 0, e: 'int', m: String(err && err.message || err).slice(0, 120) });\n  }\n}\n\nfunction act_(a, app, p, d) {\n  var af, sf, it, f, i;\n  switch (a) {\n    case 'ping':\n      appF_(app);\n      return out_({ ok: 1, v: VERSION, folder: ROOT.join('/') + '/' + app });\n\n    case 'put':\n      if (!ID.test(p.id || '') || !int_(p.i, 1, 9999) || !d) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, SUB + p.id, true);\n      it = sf.getFilesByName(nm_(p.i));\n      while (it.hasNext()) it.next().setTrashed(true);\n      f = sf.createFile(Utilities.newBlob(Utilities.base64Decode(d), 'application/octet-stream', nm_(p.i)));\n      if (typeof p.sz === 'number' && f.getSize() !== p.sz) { f.setTrashed(true); return out_({ ok: 0, e: 'sz' }); }\n      return out_({ ok: 1, i: p.i });\n\n    case 'fin': {\n      if (!ID.test(p.id || '') || !int_(p.total, 1, 9999) || typeof p.size !== 'number') return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, SUB + p.id, false);\n      if (!sf) { // \u00bfya estaba terminada? (respuesta perdida en un reintento)\n        var fin = sub_(af, p.id, false), ds = fin && desc_(fin);\n        return ds && ds.t === p.total && ds.s === p.size ? out_({ ok: 1, again: 1 }) : out_({ ok: 0, e: 'nf' });\n      }\n      var n = 0, sum = 0, seen = {};\n      it = sf.getFiles();\n      while (it.hasNext()) {\n        f = it.next();\n        var nm = f.getName();\n        if (/^\\d{4}\\.part$/.test(nm)) { seen[nm] = 1; n++; sum += f.getSize(); }\n      }\n      for (i = 1; i <= p.total; i++) if (!seen[nm_(i)]) return out_({ ok: 0, e: 'miss', m: 'falta ' + nm_(i) });\n      if (n !== p.total || sum !== p.size) return out_({ ok: 0, e: 'miss', m: n + '/' + p.total + ' trozos \u00b7 ' + sum + '/' + p.size + ' bytes' });\n      sf.setDescription(JSON.stringify({ t: p.total, s: p.size, n: String(p.name || '').slice(0, 120), d: new Date().toISOString() }));\n      it = af.getFoldersByName(p.id);\n      while (it.hasNext()) { var old = it.next(); if (desc_(old)) old.setTrashed(true); }\n      sf.setName(p.id);\n      var tr = retain_(af, int_(p.keep, 2, 50) ? p.keep : 10);\n      clean_(af);\n      return out_({ ok: 1, trashed: tr });\n    }\n\n    case 'list': {\n      af = appF_(app);\n      var r = [];\n      it = af.getFolders();\n      while (it.hasNext()) {\n        f = it.next();\n        if (f.getName().indexOf(SUB) === 0) continue;\n        var dd = desc_(f);\n        if (dd) r.push({ id: f.getName(), t: dd.t, s: dd.s, n: dd.n, d: f.getDateCreated().toISOString() });\n      }\n      r.sort(function (x, y) { return x.d < y.d ? 1 : -1; });\n      return out_({ ok: 1, l: r });\n    }\n\n    case 'get':\n      if (!ID.test(p.id || '') || !int_(p.i, 1, 9999)) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, p.id, false);\n      if (!sf || !desc_(sf)) return out_({ ok: 0, e: 'nf' });\n      it = sf.getFilesByName(nm_(p.i));\n      if (!it.hasNext()) return out_({ ok: 0, e: 'nf' });\n      return out_({ ok: 1, i: p.i, d: Utilities.base64Encode(it.next().getBlob().getBytes()) });\n\n    case 'del':\n      if (!ID.test(p.id || '')) return out_({ ok: 0, e: 'bad' });\n      af = appF_(app);\n      sf = sub_(af, p.id, false);\n      if (!sf || !desc_(sf)) return out_({ ok: 0, e: 'nf' });\n      sf.setTrashed(true);\n      return out_({ ok: 1 });\n  }\n  return out_({ ok: 0, e: 'bad' });\n}\n\n// Solo toca copias creadas por este puente (las que llevan descripci\u00f3n propia).\nfunction retain_(af, keep) {\n  var a = [], it = af.getFolders(), f;\n  while (it.hasNext()) { f = it.next(); if (f.getName().indexOf(SUB) !== 0 && desc_(f)) a.push(f); }\n  a.sort(function (x, y) { return y.getDateCreated() - x.getDateCreated(); });\n  var k = 0;\n  for (var i = keep; i < a.length; i++) { a[i].setTrashed(true); k++; }\n  return k;\n}\n// Copias a medio subir de hace m\u00e1s de un d\u00eda: a la papelera.\nfunction clean_(af) {\n  var it = af.getFolders(), f;\n  while (it.hasNext()) {\n    f = it.next();\n    if (f.getName().indexOf(SUB) === 0 && Date.now() - f.getDateCreated().getTime() > 864e5) f.setTrashed(true);\n  }\n}\n";
function drvHelp(){modal(`<h3>Cómo crear el puente (una sola vez para todas las apps)</h3><p><small>Si ya creaste el puente para otra app, no hagas nada de esto: usa la misma dirección y la misma clave. La carpeta <b>${DAPP}</b> se crea sola.</small></p><ol style="padding-left:18px;font-size:14px"><li>Entra en <b>script.google.com</b> con la cuenta de Google que usarás solo para las copias.</li><li><b>Nuevo proyecto</b>. Borra lo que haya y pega el código (botón de abajo).</li><li>Engranaje <b>Configuración del proyecto</b> › <b>Propiedades de la secuencia de comandos</b> › añade <b>SECRET</b> con la clave (en esta app: Conectar con Drive › Generar una clave nueva).</li><li><b>Implementar › Nueva implementación › Aplicación web</b>: ejecutar como <b>Yo</b>, acceso <b>Cualquier usuario</b>. Autoriza los permisos.</li><li>Copia la dirección que termina en <b>/exec</b> y pégala en Conectar con Drive.</li></ol><small>Si cambias el código más adelante: Implementar › Gestionar implementaciones › Editar › Nueva versión (la dirección no cambia). Los nombres exactos de los menús de Google pueden variar un poco.</small><div class=act><button onclick="copy(BRIDGE)">Copiar código del puente</button><button class=s onclick="cerrar()">Cerrar</button></div>`)}
